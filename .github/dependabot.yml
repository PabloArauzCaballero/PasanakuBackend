# H2.S2.M4 (AMB-9, regla 90.4.3): actualizaciones semanales, agrupadas para no
# saturar de PRs individuales — cada uno lo revisa un humano, no se automerge.
# Esquema verificado contra docs.github.com/en/code-security/dependabot/
# dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# el 2026-09-22 (regla 00 §1.3, API de terceros).
version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencias-gradle:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      acciones-github:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
