# TEMPORAL (2026-10-18, PR #139): regenera las referencias golden en Linux, la plataforma
# en la que las compara ci.yml (job `frontend` y `app-goldens`), para las pantallas que
# este PR cambia a propósito (candado, paso del carnet con «Saltar por ahora», invitación,
# billetera en cero). Mismo mecanismo que goldens-macos.yml. Corre SOLO con un push a la
# rama del PR que toque este archivo, verifica las referencias nuevas sin
# `--update-goldens` y las commitea en la misma rama. Se borra antes de fusionar.
# Corrida 3 (2026-10-19): acento naranja de vuelta y pantallas de verificación nuevas.
# Las imágenes de evidencia de docs/ no se tocan.
name: Goldens Linux (regenerar, temporal)

on:
  push:
    branches: [claude/app-kyc-diferido-y-pin-20261018]
    paths: [".github/workflows/goldens-linux-temporal.yml"]

permissions:
  contents: write

jobs:
  regenerar:
    name: Goldens · regenerar y verificar (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: clientes generados (Dart), igual que el job frontend de ci.yml
        run: ./gradlew generateOpenApiClients --no-parallel --no-build-cache -q

      - name: tokens y paquetes Flutter, igual que el job app-goldens de ci.yml
        run: |
          corepack enable
          yarn install --immutable
          yarn workspace @aportaya/tokens build
          yarn workspace @aportaya/diseno-flutter build
          yarn workspace @aportaya/movil build

      - name: regenerar referencias (todas las de la app y del sistema de diseño)
        run: |
          yarn workspace @aportaya/diseno-flutter test:goldens --update-goldens
          cd apps/movil && flutter test --update-goldens --timeout 60s

      - name: verificar las referencias nuevas (sin --update-goldens)
        run: |
          yarn workspace @aportaya/diseno-flutter test:goldens
          cd apps/movil && flutter test --timeout 60s

      - name: commitear las referencias en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.png' ':!docs/**'
          if git diff --cached --quiet; then
            echo "Las referencias ya estaban al dia."
          else
            git diff --cached --stat
            git commit -m "chore(goldens): referencias regeneradas en Linux (runner de GitHub Actions)"
            git push origin HEAD:${{ github.ref_name }}
          fi
