# Los 19 pasos de planes/00 §6, en ese orden y todos bloqueantes.
#
# En la Fase 0 varios corren sobre lo que existe (poco), pero TIENEN que existir en
# el archivo desde ahora: un paso que se agrega "despues" nunca se agrega.
#
# Todo lo que este archivo ejecuta existe tambien como tarea de Gradle: un paso de
# CI que no se puede reproducir en local es un paso que nadie puede arreglar.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # H2.S6.M1: el job e2e-financiero declara `if: ... || github.event_name ==
  # 'workflow_dispatch'`, pero sin este trigger arriba ese `if` nunca puede
  # ser verdad — es la unica forma de correrlo a demanda mientras la rama
  # todavia no es `dev` (el merge esta bloqueado, regla 65). Encontrado
  # revisando por que el job salia SKIPPED incluso corriendo su `if`.
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # OSV-Scanner (reusable workflow) sube resultados a Security > Code Scanning y
  # necesita leer el estado de otras Actions para el resumen. Verificado contra
  # google.github.io/osv-scanner/github-action/ el 2026-09-21.
  security-events: write
  actions: read

env:
  BD_URL_ADMIN: jdbc:postgresql://localhost:5432/pasanaku
  BD_USUARIO_ADMIN: pasanaku
  BD_CLAVE_ADMIN: pasanaku

jobs:
  # ------------------------------------------------------------------ codigo --
  codigo:
    name: Formato, reglas propias y compilacion
    runs-on: ubuntu-latest
    # Con base: `check` y `compileJava` generan las clases de jOOQ introspeccionando la
    # base VIVA, asi que sin PostgreSQL este trabajo fallaba SIEMPRE con «Connection to
    # localhost:5432 refused» — no el dia que alguien rompiera el formato o una regla.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pasanaku
          POSTGRES_USER: pasanaku
          POSTGRES_PASSWORD: pasanaku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pasanaku -d pasanaku"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: 0 · el esquema, que es lo que jOOQ introspecciona
        env:
          PGPASSWORD: pasanaku
        run: cd sql && psql -v ON_ERROR_STOP=1 -h localhost -U pasanaku -d pasanaku -q -f aplicar.sql
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: 1 · toolchain Java 21
        run: ./gradlew --version

      - name: 2 · formato
        run: ./gradlew spotlessCheck

      # Sin `jacocoTestCoverageVerification`: este trabajo excluye `test` a proposito, y
      # verificar cobertura sin haber ejecutado una sola prueba da 0 % y falla siempre.
      # La cobertura se mide donde se corren las pruebas — el trabajo `pruebas`.
      - name: 3 · analisis estatico y las reglas propias
        run: ./gradlew check -x test -x jacocoTestCoverageVerification -x jacocoTestReport

      - name: 3b · testBarrido — las reglas propias sobre cada modulo
        run: ./gradlew testBarrido

      - name: 4 · compileJava (invariante 1)
        run: ./gradlew compileJava

      - name: 4b · erroresCatalogo — constraint_name -> R-XXX-nn desde sql/
        run: ./gradlew erroresCatalogo

  # ------------------------------------------------------------------ boveda --
  boveda:
    name: La boveda y el esquema no divergen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 5 · generar_ddl.py deja diff vacio
        run: |
          python3 scripts/generar_ddl.py
          git diff --exit-code -- sql/

      - name: 6 · verificar_boveda.py
        run: python3 scripts/verificar_boveda.py

      - name: 6b · verificar_seguridad.py
        run: python3 scripts/verificar_seguridad.py

      - name: 6c · verificar_carriles.py
        run: python3 scripts/verificar_carriles.py

      - name: 6g · verificar_maqueta.py — el plan de frontend coincide con la maqueta
        run: python3 scripts/verificar_maqueta.py

      - name: 6d · verificar_criterios.py — cada gherkin con su prueba
        run: python3 scripts/verificar_criterios.py

      # `verificar_pruebas_web.py` lee los contratos con PyYAML, que el runner no trae:
      # el paso moria con ModuleNotFoundError antes de verificar nada. El workflow de la
      # boveda ya lo instalaba; este no.
      - name: 6f · verificar_pruebas_web.py — la capa web cubierta (ADR-043)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/verificar_pruebas_web.py

      - name: 6e · generar_k8s.py — los descriptores cierran contra el pool
        run: python3 scripts/generar_k8s.py

  # -------------------------------------------------------------------- base --
  base:
    name: Base efimera, semillas y permisos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pasanaku
          POSTGRES_USER: pasanaku
          POSTGRES_PASSWORD: pasanaku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pasanaku -d pasanaku"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: pasanaku
      PSQL: psql -v ON_ERROR_STOP=1 -h localhost -U pasanaku -d pasanaku -q
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 7 · sql/aplicar.sql sobre base vacia + prueba de humo
        run: |
          cd sql && $PSQL -f aplicar.sql && cd ..
          $PSQL -f sql/50_verificacion/verificaciones.sql
          $PSQL -f sql/50_verificacion/prueba_humo.sql | tee humo.txt
          grep -q "FALLA" humo.txt && exit 1 || true

      - name: 8 · semillas minimas DOS veces — mismo estado, sin duplicados
        run: |
          python3 scripts/generar_semillas.py
          $PSQL -f sql/60_semillas/sembrar.sql
          $PSQL -f sql/60_semillas/sembrar.sql

      # La marca la lee la GUARDA dentro del SQL, y la guarda mira la base, no el
      # entorno del proceso: con `APORTAYA_ENTORNO` este paso no podia pasar nunca, y el
      # 10 «probaba» un rechazo que habria ocurrido igual sin guarda alguna.
      - name: 9 · semillas de prueba DOS veces (entorno no productivo)
        run: |
          $PSQL -c "ALTER DATABASE pasanaku SET app.entorno = 'dev'"
          $PSQL -f sql/61_dev/sembrar_dev.sql
          $PSQL -f sql/61_dev/sembrar_dev.sql

      - name: 10 · rechazo — las semillas de prueba FALLAN si el entorno es produccion
        run: |
          $PSQL -c "ALTER DATABASE pasanaku SET app.entorno = 'produccion'"
          if $PSQL -f sql/61_dev/sembrar_dev.sql; then
            echo "Las semillas de dev entraron en un entorno de produccion"; exit 1
          fi
          $PSQL -c "ALTER DATABASE pasanaku RESET app.entorno" 

      - name: 11 · permisos — cada svc_* solo ve su esquema (invariante 11)
        run: $PSQL -f sql/50_verificacion/verificaciones.sql

  # --------------------------------------------------------------- contratos --
  contratos:
    name: Contratos y clientes generados
    runs-on: ubuntu-latest
    needs: [codigo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: 12 · generateOpenApiClients — Angular y Dart, sin error y sin salir vacíos
        run: |
          # --no-parallel: el generador Dart no es seguro entre hilos y mezcla servicios (TF).
          ./gradlew generateOpenApiClients --no-parallel --no-build-cache
          test -s clientes/angular/identidad/index.ts   || { echo "El cliente Angular de identidad no se genero"; exit 1; }
          test -s clientes/dart/identidad/pubspec.yaml  || { echo "El cliente Dart de identidad no se genero"; exit 1; }
          grep -q "sdk: '>=3.8.0" clientes/dart/identidad/pubspec.yaml || { echo "El cliente Dart no fija Dart 3.8"; exit 1; }

  # ---------------------------------------------------------------- frontend --
  frontend:
    name: Frontend — Flutter y Angular (ADR-044)
    runs-on: ubuntu-latest
    needs: [codigo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: f0 · clientes generados (Angular y Dart)
        run: ./gradlew generateOpenApiClients --no-parallel --no-build-cache -q

      - name: f0b · el plan coincide con la maqueta
        run: python3 scripts/verificar_maqueta.py

      - name: f0c · yarn install (nunca npm ni pnpm)
        run: |
          corepack enable
          yarn install --immutable

      - name: f0d · tokens, simulado y clientes Dart (build_runner)
        run: |
          yarn workspace @aportaya/tokens build
          yarn workspace @aportaya/simulado build
          yarn workspace @aportaya/diseno-flutter build
          yarn workspace @aportaya/movil build

      - name: f1 · lint y tipos — angular-eslint, flutter analyze y el barrido de reglas propias
        run: |
          yarn lint
          yarn typecheck

      - name: f2 · test:front — vitest (unidad, componente, contrato) + flutter test (unidad, widget, contrato, goldens)
        run: yarn test:front

      - name: f3 · test:a11y — vitest-axe + meetsGuideline
        run: yarn test:a11y

      - name: f4 · las dos apps Angular compilan bajo presupuesto
        run: |
          yarn workspace @aportaya/backoffice build
          yarn workspace @aportaya/web build
          grep -q 'name="robots" content="noindex' apps/backoffice/dist/backoffice/browser/index.html || { echo "El backoffice perdio el noindex"; exit 1; }

      - name: f5 · el catalogo de @aportaya/ui en el navegador — prerenderizado, noindex, area tactil y capturas en los dos temas
        run: |
          yarn workspace @aportaya/web playwright install --with-deps chromium
          yarn workspace @aportaya/web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogo-capturas
          path: apps/web/capturas/*.png

  # ----------------------------------------------------------------- pruebas --
  pruebas:
    name: Los cinco corredores
    runs-on: ubuntu-latest
    needs: [codigo]
    # jOOQ se genera introspeccionando la base VIVA: sin PostgreSQL, `bootJar` y `test`
    # fallan SIEMPRE con «Connection refused», y el rojo no dice nada del codigo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pasanaku
          POSTGRES_USER: pasanaku
          POSTGRES_PASSWORD: pasanaku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pasanaku -d pasanaku"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: 0 · el esquema, que es lo que jOOQ introspecciona
        env:
          PGPASSWORD: pasanaku
        run: cd sql && psql -v ON_ERROR_STOP=1 -h localhost -U pasanaku -d pasanaku -q -f aplicar.sql

      - name: 13 · test
        run: ./gradlew test

      # Antes que integrationTest a proposito: no necesita Docker y tarda segundos,
      # asi que un 403 roto se ve en el primer minuto del pipeline y no en el sexto.
      - name: 13b · webTest — contrato HTTP y guardia (ADR-043)
        run: ./gradlew webTest

      - name: 14 · integrationTest (Testcontainers, PostgreSQL real)
        run: ./gradlew integrationTest

      - name: 15 · contractTest
        run: ./gradlew contractTest

      - name: 16 · sagaTest
        run: ./gradlew sagaTest

  # ---------------------------------------------------------------- imagenes --
  imagenes:
    name: bootJar y docker build, multietapa y sin root
    runs-on: ubuntu-latest
    needs: [codigo]
    # jOOQ se genera introspeccionando la base VIVA: sin PostgreSQL, `bootJar` y `test`
    # fallan SIEMPRE con «Connection refused», y el rojo no dice nada del codigo.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pasanaku
          POSTGRES_USER: pasanaku
          POSTGRES_PASSWORD: pasanaku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pasanaku -d pasanaku"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: 0 · el esquema, que es lo que jOOQ introspecciona
        env:
          PGPASSWORD: pasanaku
        run: cd sql && psql -v ON_ERROR_STOP=1 -h localhost -U pasanaku -d pasanaku -q -f aplicar.sql

      - name: 17 · una imagen de muestra
        run: |
          ./gradlew :servicios:identidad:bootJar
          # --network=host y la URL del runner: el paso RUN del build genera jOOQ contra
          # la base viva, y desde el sandbox del build no existe ningun `postgres`.
          docker build --network=host -f despliegue/Dockerfile \
            --build-arg SERVICIO=identidad \
            --build-arg BD_URL_ADMIN=jdbc:postgresql://localhost:5432/pasanaku \
            --build-arg BD_USUARIO_ADMIN=pasanaku --build-arg BD_CLAVE_ADMIN=pasanaku \
            -t aportaya/identidad:ci .
          test "$(docker image inspect aportaya/identidad:ci --format '{{.Config.User}}')" = "app" \
            || { echo "La imagen corre como root"; exit 1; }

      # 17b · Trivy sobre la imagen (H2.S4.M1). Version pinneada verificada contra
      # aquasecurity/trivy-action el 2026-09-21. HIGH/CRITICAL sin excepcion en
      # .github/.trivyignore (motivo + fecha, misma disciplina que osv-scanner.toml,
      # AMB-9) hacen fallar el job — de proposito: una CVE real no parcheada no es
      # un detalle, es lo que este gate existe para atajar.
      - name: 17b · Trivy — CRITICAL/HIGH sin parche bloquean
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aportaya/identidad:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .github/.trivyignore

      - name: 17c · subir SARIF de Trivy a Security > Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  # ------------------------------------------------------------ e2e-financiero --
  # H2.S6.M1: nucleo-financiero y comun-mensajeria (outbox) son los dos modulos
  # con logica de dinero de verdad; corren en cada push a `dev` (no solo en main,
  # a diferencia del `e2e` de abajo) y tambien a demanda. `apache/kafka` (el que
  # pide el encargo) no es la imagen que corre en este repo: `confluentinc/cp-kafka:7.7.1`
  # en modo KRaft es la que ya esta verificada y funcionando en
  # despliegue/compose/base.yml:169 — se sigue el patron real, no el sugerido sin
  # verificar (regla 00 §1.4). KAFKA_ADVERTISED_LISTENERS usa `localhost`, no
  # `kafka`: a diferencia de compose (red docker con ese hostname), un `services:`
  # de GitHub Actions se alcanza desde los pasos del job por `localhost:<puerto>`.
  # Los tests de nucleo-financiero y comun-mensajeria puede que todavia no existan
  # (los escriben Justin y Leo): los corredores tienen failOnNoDiscoveredTests=false,
  # asi que el job queda cableado y corre lo que haya, sin frenarse por eso.
  e2e-financiero:
    name: Punta a punta financiero — nucleo-financiero y outbox
    runs-on: ubuntu-latest
    needs: [codigo]
    if: github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pasanaku
          POSTGRES_USER: pasanaku
          POSTGRES_PASSWORD: pasanaku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pasanaku -d pasanaku"
          --health-interval 5s --health-timeout 5s --health-retries 20
      kafka:
        image: confluentinc/cp-kafka:7.7.1
        env:
          CLUSTER_ID: aportaya-ci-e2e-financiero
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports: ["9092:9092"]
        options: >-
          --health-cmd "kafka-broker-api-versions --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: 0 · el esquema, que es lo que jOOQ introspecciona
        env:
          PGPASSWORD: pasanaku
        run: cd sql && psql -v ON_ERROR_STOP=1 -h localhost -U pasanaku -d pasanaku -q -f aplicar.sql

      - name: 18b · e2eTest — nucleo-financiero y comun-mensajeria
        run: ./gradlew :servicios:nucleo-financiero:e2eTest :plataforma:comun-mensajeria:e2eTest

  # --------------------------------------------------------------------- e2e --
  e2e:
    name: Punta a punta — solo en main
    runs-on: ubuntu-latest
    needs: [pruebas, base]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4

      - name: 18 · e2eTest
        run: ./gradlew e2eTest

  # -------------------------------------------------------------- seguridad --
  seguridad:
    name: Dependencias, secretos e imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 19a · el catalogo de versiones no cambia en una rama de carril
        if: startsWith(github.head_ref, 'pablo/feature/carril-')
        run: |
          git fetch origin dev --depth=1
          git diff --exit-code origin/dev -- gradle/libs.versions.toml || {
            echo "Una dependencia nueva es un micro-PR al troncal, no un cambio de carril"; exit 1; }

      - name: 19b · escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 19d · SBOM CycloneDX por modulo desplegable (H2.S3)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          set -e
          modulos="$(./gradlew -q projects | grep -oE "servicios:[a-z-]+|plataforma:gateway" | sort -u)"
          for m in $modulos; do ./gradlew ":$m:cyclonedxBom"; done
          echo "SBOM generado en $(echo "$modulos" | wc -w) modulos"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: |
            servicios/*/build/reports/sbom/*-bom.json
            plataforma/gateway/build/reports/sbom/*-bom.json
          if-no-files-found: error

  # 19c · dependencias vulnerables. Job aparte porque el workflow reusable de
  # OSV-Scanner solo se puede invocar con `uses:` a nivel de job, no como step
  # (google.github.io/osv-scanner/github-action/, verificado 2026-09-21). Escanea
  # los `gradle.lockfile` de los 15 modulos desplegables (H2.S2.M1).
  #
  # AMB-9 (HIGH/CRITICAL bloquean, MEDIUM reporta): OSV-Scanner v2.6.0 no tiene
  # umbral de severidad nativo (verificado; no existe --min-severity ni config
  # equivalente). `fail-on-vuln: true` bloquea ante CUALQUIER hallazgo no
  # ignorado en `.github/osv-scanner.toml` — mas estricto que "solo HIGH/CRITICAL",
  # nunca menos. Una excepcion MEDIUM/LOW se agrega ahi, una por una, con motivo y
  # fecha (<= 30 dias).
  dependencias:
    name: Dependencias vulnerables (OSV-Scanner)
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0"
    with:
      scan-args: |-
        --config=.github/osv-scanner.toml
        --recursive
        ./
