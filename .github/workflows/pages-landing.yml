name: Publicar landing en GitHub Pages

# Publica el contenido de landing/ (sitio estático sin build) en GitHub Pages.
#
# El paso `configure-pages` con `enablement: true` activa Pages por su cuenta
# usando el token del workflow, así que no hace falta que nadie con permiso de
# administrador entre a Settings → Pages a hacer el toggle a mano.
#
# Si aun así fallara con un error de permisos, el camino manual es:
#   Settings → Pages → Build and deployment → Source → "GitHub Actions"
#
# landing/README.md documenta qué hay en el sitio y qué placeholders reemplazar
# antes de considerarlo publicable de verdad.

# Solo `main`, y a mano. Escuchaba `dev` tambien —«es la rama activa»— y eso no podia
# funcionar: el entorno `github-pages` tiene una politica de ramas que admite `main` y
# nada mas, asi que cada push a `dev` que tocaba landing/ moria con «Branch 'dev' is not
# allowed to deploy to github-pages». Un rojo garantizado que no medía nada.
#
# Se arregla del lado del workflow y no abriendo la politica a `dev` a proposito: la
# tabla «Reemplazar antes de publicar» de landing/README.md sigue llena de datos de
# ejemplo —un nombre de persona, montos inventados, una casilla de correo que no existe
# y una lista de espera sin confirmar—. Publicar eso en una URL publica es una decision
# de negocio, no un paso de integracion. Cuando esté para publicar: merge a `main`, o
# disparar a mano desde Actions con `main` seleccionada.
on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - ".github/workflows/pages-landing.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Activa Pages en el repo si todavía no lo está, usando el token del
          # propio workflow (permiso `pages: write` de arriba). Evita depender
          # de que alguien con admin entre a Settings → Pages a hacer el toggle
          # a mano. Si ya está activado, este paso no hace nada.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing
      - id: deployment
        uses: actions/deploy-pages@v4
