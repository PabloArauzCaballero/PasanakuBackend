# APK de prueba (Android) contra el entorno TEST.
#
# Para que el equipo pruebe la app en un Android sin pasar por una tienda: compila
# el APK en un runner de GitHub (la máquina de desarrollo no da abasto con Docker,
# el emulador y Gradle a la vez) y lo publica como *prerelease* descargable desde el
# celular. Es el equivalente de Pasanaku a «abrirlo en Expo Go» de Atlas.
#
# Firmado con las claves de depuración (así está `android/app/build.gradle.kts`
# hoy): sirve para instalar a mano, NO para Play Store. Apunta al gateway de TEST y
# nada más (`HOSTS_PERMITIDOS`, `lib/dominio/cliente.dart`).
name: APK de prueba (Android)

on:
  workflow_dispatch: {}
  push:
    branches:
      # `test` siempre: el APK sale del mismo commit que la app web espejo del host
      # (construir-movil-web.sh, que el autodespliegue dispara con las mismas rutas).
      - test
      - justin/fix/alta-fecha-actividad-autocaptura
      - pablo/feature/verificacion-correo-gmail-test
    paths:
      - apps/movil/**
      - packages/diseno_flutter/**
      - packages/tokens/**
      - .github/workflows/apk-de-prueba.yml
      - servicios/*/src/main/resources/openapi/**

concurrency:
  group: apk-de-prueba-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  API_TEST: https://api.aportaya.161.97.85.216.sslip.io/api/v1
  HOST_TEST: api.aportaya.161.97.85.216.sslip.io

jobs:
  apk:
    name: Compilar y publicar el APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      # Los mismos pasos que el job `frontend` de ci.yml (f0, f0c, f0d): sin los
      # clientes generados ni los tokens, la app no compila.
      - name: clientes generados (Dart)
        run: ./gradlew generateOpenApiClients --no-parallel --no-build-cache -q
      - name: yarn install
        run: |
          corepack enable
          yarn install --immutable
      - name: tokens y sistema de diseño
        run: |
          yarn workspace @aportaya/tokens build
          yarn workspace @aportaya/simulado build
          yarn workspace @aportaya/diseno-flutter build
          yarn workspace @aportaya/movil build

      # Siempre la MISMA firma. Cada maquina de Actions generaba su propia clave de
      # depuracion y cada APK salia con otro certificado (apk-prueba-12 a55de554…,
      # apk-prueba-13 b4a20ff6…): Android no deja instalar uno encima del otro.
      # Dejar la keystore en ~/.android/debug.keystore NO alcanzo (apk-prueba-17 salio
      # cc59616a… con la keystore f8f513e5… ya en su lugar), asi que despues de compilar
      # se vuelve a firmar con apksigner y se comprueba la huella. Es una clave de
      # depuracion (alias y claves estandar de Android), no la de la tienda.
      - name: firma de depuracion estable
        env:
          APK_DEBUG_KEYSTORE: ${{ secrets.APK_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$APK_DEBUG_KEYSTORE" ]; then
            echo "::error::Falta el secreto APK_DEBUG_KEYSTORE: el APK saldria con una firma nueva y no se instalaria encima del anterior."
            exit 1
          fi
          echo "$APK_DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/firma-apk.keystore"
          huella=$(keytool -list -v -keystore "$RUNNER_TEMP/firma-apk.keystore" -storepass android \
            | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "HUELLA_APK=$huella" >> "$GITHUB_ENV"
          echo "huella esperada: $huella"

      - name: flutter build apk (release, contra TEST)
        working-directory: apps/movil
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API=${{ env.API_TEST }} \
            --dart-define=HOSTS_PERMITIDOS=${{ env.HOST_TEST }}
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/aportaya-test-${{ github.run_number }}.apk"
          ls -l build/*.apk

      - name: firmar con la clave estable y comprobar la huella
        working-directory: apps/movil
        run: |
          apk="build/aportaya-test-${{ github.run_number }}.apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" sign --ks "$RUNNER_TEMP/firma-apk.keystore" --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android "$apk"
          "$apksigner" verify "$apk"
          firmado=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | sed 's/.*digest: *//')
          echo "huella del APK: $firmado"
          if [ "$firmado" != "$HUELLA_APK" ]; then
            echo "::error::El APK salio firmado con $firmado y no con la clave estable $HUELLA_APK."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/firma-apk.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: aportaya-test-${{ github.run_number }}
          path: apps/movil/build/aportaya-test-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: publicar como prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="apk-prueba-${{ github.run_number }}"
          gh release create "$etiqueta" \
            "apps/movil/build/aportaya-test-${{ github.run_number }}.apk" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "APK de prueba ${{ github.run_number }} (TEST)" \
            --notes "Solo para pruebas internas contra el entorno TEST. Firmado con claves de depuración: se instala a mano (Ajustes → permitir instalar apps de esta fuente). Rama ${{ github.ref_name }}, commit ${{ github.sha }}."
