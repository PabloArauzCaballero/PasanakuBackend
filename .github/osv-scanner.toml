reason = "CVE-2026-47890: corrupcion de streams SSE al renderizar fragmentos de vistas (webmvc y webflux 6.2.0-6.2.19). El backend no usa SSE ni renderiza vistas (barrido SpringSinSuperficieVulnerableBarridoTest). Se quita al migrar a Spring 7."

