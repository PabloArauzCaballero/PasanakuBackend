# El backoffice en un entorno DESPLEGADO (TEST en Contabo), detras de Traefik.
#
# Difiere de nginx.conf en dos cosas, y las dos existen porque sin ellas el portal
# carga y no sirve para nada:
#
#   1 · inyecta <meta name="aportaya-gateway" content="/api/v1">. Sin esa etiqueta
#       `gatewayPorDefecto()` cae a http://localhost:4010 — el Prism de desarrollo —
#       y en el navegador del operador cada peticion muere contra su propia maquina;
#   2 · reenvia /api/ al gateway. La CSP dice `connect-src 'self'`: la API tiene que
#       salir por el MISMO origen que la pagina, o el navegador la bloquea.
#
# El resolver de Docker resuelve `gateway` POR PETICION: si el gateway se recrea,
# nginx no se queda con la IP vieja.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'" always;
  server_tokens off;
  client_max_body_size 10m;

  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ /index.html;
    sub_filter '</head>' '<meta name="aportaya-gateway" content="/api/v1"></head>';
    sub_filter_once on;
  }
}
