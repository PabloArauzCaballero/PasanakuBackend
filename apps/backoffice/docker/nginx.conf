server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # Nunca indexable: detrás de login y con datos de personas. La meta lo repite.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
  # `no-cache` es «pregunta antes de usar», no «no guardes»: con el ETag que nginx ya
  # manda, lo habitual es un 304 de unos cientos de bytes. Va a nivel de servidor para que
  # `location /` lo herede — nginx no hereda `add_header` en un `location` que declare los
  # suyos, y este no declara ninguno.
  #
  # Los nombres de los chunks de Angular SI llevan hash, asi que podrian cachearse para
  # siempre; lo que NO puede cachearse es `index.html`, que es el que los nombra. Sin esto
  # el navegador se queda con un index viejo apuntando a chunks que ya no existen. Si
  # alguna vez importan los bytes, la mejora es un `location` aparte para los archivos con
  # hash — pero entonces hay que repetirle ahi las cuatro cabeceras de seguridad.
  add_header Cache-Control "no-cache" always;
  server_tokens off;
  location / { try_files $uri $uri/ /index.html; }
}
