server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  # Nunca indexable: detrás de login y con datos de personas. La meta lo repite.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
  server_tokens off;
  location / { try_files $uri $uri/ /index.html; }
}
