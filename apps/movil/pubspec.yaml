name: aportaya_movil
description: "App del participante de AportaYa (Flutter). ADR-044."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  dio: ^5.7.0
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.0.0
  # El sistema de diseño (packages/diseno_flutter) y el cliente GENERADO desde el OpenAPI (clientes/dart). No se editan en un carril de pantallas.
  aportaya_diseno:
    path: ../../packages/diseno_flutter
  aportaya_cliente_nucleofinanciero:
    path: ../../clientes/dart/nucleo-financiero

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
