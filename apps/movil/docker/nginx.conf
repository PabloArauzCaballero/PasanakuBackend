# La app móvil servida como web. Dos responsabilidades, y ninguna más:
#
#   1 · reenviar /api/ al gateway, para que la app hable con la API por el MISMO origen
#       (la app se compila con --dart-define=API=/api/v1);
#   2 · no cachear lo que decide qué versión corre: index.html, flutter_bootstrap.js y
#       el service worker. Si se cachean, quien ya abrió la app sigue viendo la vieja
#       después de un despliegue.
#
# El resolver de Docker resuelve `gateway` por petición: si el gateway se recrea, nginx
# no se queda con la IP vieja.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 10m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location /api/ {
    set $gateway http://gateway:8080;
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # `no-cache` para TODO, y no solo para el arranque. No es exceso de celo: un build de
  # Flutter web no le pone hash al nombre de ningun archivo —`main.dart.js` se llama
  # siempre igual, y los assets tambien—, asi que sin esto el navegador se queda con el
  # paquete viejo despues de cada despliegue y la persona sigue usando la version anterior
  # sin saberlo. Paso de verdad: con el arreglo ya desplegado y el contenedor nuevo
  # corriendo, el navegador seguia mostrando la version vieja hasta una recarga forzada.
  #
  # `no-cache` no significa «no guardes»: significa «pregunta antes de usar». Con el ETag
  # que nginx ya manda, la respuesta habitual es un 304 de unos cientos de bytes y no el
  # paquete de 3,4 MB. El costo es una ida y vuelta; el de equivocarse es que nadie vea lo
  # que se desplego.
  #
  # Los `add_header` se repiten aca a proposito: nginx NO los hereda cuando un `location`
  # declara los suyos, asi que omitirlos dejaria estos archivos sin `nosniff` ni `noindex`.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files $uri $uri/ /index.html;
  }
}
