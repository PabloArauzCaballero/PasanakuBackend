# gateway — la unica entrada publica. Las rutas salen de los prefijos reservados de
# cada servicio (scripts/modelo.py -> PREFIJOS): una ruta que no cae en un prefijo
# real no existe.
spring:
  application:
    name: gateway
  # El gateway no tiene usuarios ni autentica: lo hace cada servicio con el JWT. Si Spring
  # Security aparece en el classpath (hoy solo en las pruebas), su autoconfiguracion crearia
  # un usuario `user` con una clave aleatoria e IMPRIMIRIA esa clave en el log de arranque
  # («Using generated security password»). Se excluye en las dos variantes (reactiva y
  # servlet): una clase ausente del classpath se ignora al excluir.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # Las rutas de verdad, generadas desde PREFIJOS por scripts/generar_gateway.py.
  # Hasta que este archivo existio, el gateway levantaba sin una sola ruta: todo lo
  # que entraba por NGINX daba 404, y la app contra el backend real no llegaba a
  # ningun lado.
  config:
    import: classpath:rutas.yml
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 15s
        pool:
          type: ELASTIC
          max-idle-time: 15s
          max-life-time: 60s
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 15s
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin
  # H3.S1: sin host/puerto explicitos — SPRING_DATA_REDIS_HOST/PORT llegan por
  # variable de entorno (despliegue/compose/base.yml y docker-compose.coolify.yml),
  # igual que el resto de la infraestructura compartida.
  data:
    redis:
      timeout: 1s
      connect-timeout: 1s

server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful          # SIGTERM: deja de aceptar, termina lo que esta en curso

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        # Prometheus no se expone mientras no exista un puerto/credencial de scrape
        # aislado. El gateway no carga Spring Security; publicar este endpoint en 8080
        # lo dejaría accesible desde el dominio público de la API.
        include: health,info
