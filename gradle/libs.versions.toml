# Catalogo de versiones — MICRO-PR, nunca una rama de carril.
#
# Una version nueva en la rama de un carril produce conflicto con las otras cuatro
# maquinas del parque (planes/07 §6). Por eso se declara ACA todo lo que las 21
# fases van a necesitar, de una vez, en la Fase 0.
#
# Lo que no lleva `version.ref` lo maneja el BOM de Spring Boot: es la forma de que
# jOOQ, Kafka, Micrometer, JUnit, Testcontainers y el driver de PostgreSQL no puedan
# desincronizarse entre si.

[versions]
spring-boot        = "3.5.16"
spring-dep-mgmt    = "1.1.7"
spring-cloud       = "2025.0.3"
minio              = "8.6.0"
shedlock           = "6.9.0"       # bloqueo de trabajos programados entre replicas
resilience4j       = "2.3.0"       # timeout y cortacircuitos en cada cliente
argon2             = "2.12"        # contrasenas y PIN (nunca un hash rapido)
archunit           = "1.4.0"       # la direccion de dependencia se verifica
jqwik              = "1.9.3"       # propiedades: cuadre de dinero
spotless           = "7.0.4"
openapi-generator  = "7.14.0"
jooq               = "3.20.5"      # generador Y libreria: separarlos genera codigo que no compila
driver-postgresql  = "42.7.12"     # solo para el generador y los contenedores
cyclonedx          = "3.4.1"       # SBOM por modulo desplegable (H2.S3), verificado contra
                                    # github.com/CycloneDX/cyclonedx-gradle-plugin el 2026-09-21
pitest             = "1.19.0"      # mutation testing (H6.S1). Verificado contra
                                    # github.com/szpak/gradle-pitest-plugin el 2026-09-22: la doc
                                    # publicada solo confirma smoke test hasta Gradle 7.4.2 (no hay
                                    # confirmacion oficial de Gradle 9.x); se aplica como convencion
                                    # OPCIONAL (aportaya.mutacion), nunca en el build por omision,
                                    # y se corrio de verdad contra Gradle 9.7.1 antes de este commit
                                    # (ver docs/auditoria-produccion/mutation-testing.md).
pitest-junit5      = "1.2.3"       # pitest-junit5-plugin: version para JUnit Jupiter 5.11+ (Spring
                                    # Boot 3.5.6 BOM), segun la propia doc de gradle-pitest-plugin.

[libraries]
# — Spring Boot (version del BOM) —
spring-boot-web        = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-actuator   = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-jdbc       = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-security   = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-oauth2     = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
# H4.S2.M4 (carril PR2, nucleo-financiero): resilience4j-spring-boot3 declara
# @Retry/@CircuitBreaker pero NO trae Spring AOP por transitividad — sin este
# starter (que si trae spring-aop + aspectjweaver) las anotaciones quedan
# inertes: el metodo se ejecuta derecho, sin aspecto que lo envuelva, y una
# falla real nunca activa un reintento. Version del BOM, mismo criterio que el
# resto de arriba.
spring-boot-aop        = { module = "org.springframework.boot:spring-boot-starter-aop" }
# Redis reactivo para el RequestRateLimiter del gateway (H3.S1, AMB-6). Version
# del BOM, mismo criterio que el resto de arriba; verificado que el artifact
# existe contra la doc de Spring Boot el 2026-09-21.
spring-boot-redis      = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }
spring-boot-test       = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-bom        = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# — Spring Cloud (solo el gateway) —
spring-cloud-bom     = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
# Cliente S3 del servidor de archivos. MinIO habla S3, asi que el dia que el
# almacenamiento se mude a otro proveedor S3 cambia la URL, no el codigo.
minio                = { module = "io.minio:minio", version.ref = "minio" }
# El jar de MinIO referencia anotaciones de SpotBugs que no trae. Sin esto el
# compilador avisa que no las encuentra y `-Werror` tumba el build por un aviso
# sobre codigo que no escribimos nosotros.
spotbugs-anotaciones = { module = "com.github.spotbugs:spotbugs-annotations", version = "4.9.6" }

# — Datos —
jooq       = { module = "org.jooq:jooq", version.ref = "jooq" }
postgresql = { module = "org.postgresql:postgresql" }
snakeyaml  = { module = "org.yaml:snakeyaml" }   # leer los contratos en las pruebas
# jOOQ trae anotaciones JAXB en sus clases de configuracion; sin la API en el
# classpath, javac avisa y -Werror convierte el aviso en error.
jakarta-xml-bind = { module = "jakarta.xml.bind:jakarta.xml.bind-api" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
# Solo para buildSrc: el generador de clases y el driver que necesita para leer la base viva.
codegen-jooq      = { module = "org.jooq:jooq-codegen", version.ref = "jooq" }
driver-postgresql = { module = "org.postgresql:postgresql", version.ref = "driver-postgresql" }

# — Mensajeria y trabajos —
kafka                = { module = "org.springframework.kafka:spring-kafka" }
shedlock             = { module = "net.javacrumbs.shedlock:shedlock-spring", version.ref = "shedlock" }
shedlock-jdbc        = { module = "net.javacrumbs.shedlock:shedlock-provider-jdbc-template", version.ref = "shedlock" }

# — Resiliencia y observabilidad —
resilience4j        = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
micrometer          = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing  = { module = "io.micrometer:micrometer-tracing-bridge-brave" }

# — Cripto —
argon2 = { module = "de.mkammerer:argon2-jvm", version.ref = "argon2" }

# — Pruebas —
junit-jupiter          = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj                = { module = "org.assertj:assertj-core" }
testcontainers         = { module = "org.testcontainers:testcontainers" }
testcontainers-junit   = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgres = { module = "org.testcontainers:postgresql" }
testcontainers-kafka   = { module = "org.testcontainers:kafka" }
archunit               = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
mockito                = { module = "org.mockito:mockito-core" }
# La extension oficial de Mockito para Jupiter: inicializa los dobles y aplica
# stubbing estricto, que es lo que convierte un `when(...)` que sobro en un fallo y
# no en una prueba que ya no prueba lo que dice (ADR-041).
mockito-junit          = { module = "org.mockito:mockito-junit-jupiter" }
# Los postprocesadores de MockMvc que fabrican una sesion sin llamar a identidad.
# Sin esto, probar «autenticado sin permiso -> 403» exige firmar un JWT de verdad,
# y entonces la prueba de la capa web depende del emisor de otro servicio.
spring-security-test   = { module = "org.springframework.security:spring-security-test" }
jqwik                  = { module = "net.jqwik:jqwik", version.ref = "jqwik" }

[bundles]
# Lo que todo servicio necesita para probar. Un servicio que agrega su propia
# dependencia de prueba esta empezando a divergir de los otros trece.
pruebas = [
    "spring-boot-test",
    "junit-jupiter",
    "assertj",
    "testcontainers",
    "testcontainers-junit",
    "testcontainers-postgres",
    "archunit",
    "mockito",
    "mockito-junit",
    "spring-security-test",
]

[plugins]
spring-boot       = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dep-mgmt   = { id = "io.spring.dependency-management", version.ref = "spring-dep-mgmt" }
spotless          = { id = "com.diffplug.spotless", version.ref = "spotless" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
cyclonedx         = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
pitest            = { id = "info.solidsoft.pitest", version.ref = "pitest" }
