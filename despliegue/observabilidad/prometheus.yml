# Prometheus de AportaYa (tableros, D4): lee las metricas que el Collector recibe por OTLP. Una sola fuente: si
# leyera cada servicio, habria que abrir /actuator/prometheus en los quince.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
