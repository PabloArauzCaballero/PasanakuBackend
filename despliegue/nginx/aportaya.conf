# La unica entrada publica del sistema. Detras no hay ningun puerto publicado:
# NGINX -> gateway -> los catorce servicios (ADR-025).
#
# H3.S2: donde termina TLS. Este NGINX escucha 80 sin certificado — verificado
# leyendo este mismo archivo y docker-compose.coolify.yml (sin ninguna
# directiva ssl_*, sin labels de Traefik): el TLS lo termina el Traefik de
# Coolify, delante de este contenedor, en la red `publica` (`coolify`,
# externa — ver scripts/generar_compose.py CABECERA_DESPLEGADO). Por eso NO
# hay `add_header Strict-Transport-Security` aca: agregarlo en un servidor
# que nunca ve HTTPS directamente no protege nada y, peor, si Coolify cambia
# de proxy algun dia, HSTS mal configurado ahi es dificil de revertir para el
# navegador de cada usuario. HSTS es responsabilidad de la config de Coolify/
# Traefik, fuera de este repo — queda anotado, no resuelto (regla 00 §3: no
# se toca lo que no es mio).

# El resolver de Docker: el upstream se resuelve POR PETICION, no al arrancar. Es
# lo que permite levantar el perfil `base` sin que el gateway exista todavia y
# balancea en round-robin a traves de las replicas de gateway resueltas por Docker DNS.
resolver 127.0.0.11 valid=5s ipv6=off;

# Zonas de limitacion de tasa y conexiones concurrentes para proteger el gateway
limit_req_zone $binary_remote_addr zone=api_limite:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=conn_limite:10m;

server {
    listen 80;
    server_name _;

    # Un servidor que anuncia su version le ahorra trabajo a quien lo ataca.
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 12m;

    # Vivo del propio NGINX: no toca el gateway ni la base.
    location = /nginx-vivo {
        access_log off;
        return 200 "ok\n";
    }

    # H3.S3: los endpoints de gestion (prometheus incluido) son para la red
    # interna, no para quien entra por la unica puerta publica.
    location ^~ /actuator {
        return 404;
    }

    location / {
        limit_req zone=api_limite burst=50 nodelay;
        limit_conn conn_limite 50;

        set $arriba http://gateway:8080;
        proxy_pass $arriba;
        proxy_http_version 1.1;

        # Keepalive upstream: evitar que NGINX envie "Connection: close"
        # y sature sockets en estado TIME_WAIT hacia el gateway.
        proxy_set_header Connection "";

        # H3.S2: todo lo que este NGINX proxea es /api/v1/** (el gateway no
        # sirve otra cosa — ADR-025). Una respuesta de dinero o de sesion
        # cacheada por el navegador o un proxy intermedio es exactamente lo
        # que este header existe para evitar.
        add_header Cache-Control "no-store" always;

        # La traza cruza la frontera con la peticion: sin esto, un error en
        # produccion no se puede seguir hasta el caso de uso que lo produjo.
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffers optimizados: evitar escrituras a disco con respuestas o JWTs grandes
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Timeouts de conexion y lectura calibrados
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Conmutacion por error: si una replica del gateway falla o reinicia,
        # reintenta de inmediato en otra antes de fallar al cliente
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
    }
}
