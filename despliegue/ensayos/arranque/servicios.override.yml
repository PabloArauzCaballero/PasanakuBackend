  identidad:
    mem_limit: ${D3_MEM:-320m}
    environment: *jvm
  inversiones:
    mem_limit: ${D3_MEM:-320m}
    environment: *jvm
  notificaciones:
    mem_limit: ${D3_MEM:-320m}
    environment: *jvm
  nucleo-financiero:
    mem_limit: ${D3_MEM:-320m}
    environment: *jvm
  organizador:
