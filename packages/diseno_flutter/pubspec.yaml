name: aportaya_diseno
description: "Sistema de diseño de la app de AportaYa (Flutter): tema desde los tokens generados, átomos, moléculas, organismos y piezas móviles. Lo compone apps/movil; nadie lo edita durante un carril de pantallas."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  qr_flutter: ^4.1.0
  widgetbook: ^3.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Empaquetadas, no por red: una billetera tiene que ser legible sin señal, y una
  # fuente que llega tarde mueve el saldo de sitio delante de quien lo está leyendo.
  # Instancias estáticas (fontTools) de las variables de Google Fonts, para que
  # `fontWeight` funcione igual en las dos plataformas. Licencias OFL en la carpeta.
  fonts:
    - family: Bricolage
      fonts:
        - asset: lib/fuentes/Bricolage-600.ttf
          weight: 600
        - asset: lib/fuentes/Bricolage-700.ttf
          weight: 700
        - asset: lib/fuentes/Bricolage-800.ttf
          weight: 800
    - family: Instrument
      fonts:
        - asset: lib/fuentes/Instrument-400.ttf
          weight: 400
        - asset: lib/fuentes/Instrument-500.ttf
          weight: 500
        - asset: lib/fuentes/Instrument-600.ttf
          weight: 600
