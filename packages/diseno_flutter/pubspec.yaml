name: aportaya_diseno
description: "Sistema de diseño de la app de AportaYa (Flutter): tema desde los tokens generados, átomos, moléculas, organismos y piezas móviles. Lo compone apps/movil; nadie lo edita durante un carril de pantallas."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  qr_flutter: ^4.1.0
  widgetbook: ^3.25.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
