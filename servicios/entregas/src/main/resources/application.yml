# entregas — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
spring:
  application:
    name: entregas
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_entregas
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 5     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}

aportaya:
  esquema: entregas
  outbox:
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
  zona-horaria: America/La_Paz      # plazos habiles
  servicios:
    # A quien se le pregunta. Un servicio no lee la base de otro (invariante 11):
    # pregunta por su contrato, y fuera de la transaccion (invariante 6).
    identidad: ${URL_IDENTIDAD:http://identidad:8080}
    aportes: ${URL_APORTES:http://aportes:8080}        # afirma cuanto del pozo es caja confirmada
    garantia: ${URL_GARANTIA:http://garantia:8080}    # cubre el faltante con la reserva empresarial
  # Fuera de la base a proposito: filtrar la tabla de cuentas no alcanza si la
  # pimienta no esta ahi. Si falta la variable, el proceso NO levanta.
  seguridad:
    pimienta: ${SEGURIDAD_PIMIENTA}
    version-llave: 1
  cuentas:
    # Diez destinos distintos para la misma persona son un patron, no una comodidad.
    maximo-por-usuario: 3
    # Una cuenta recien verificada espera antes de poder recibir: es la ventana en la
    # que el titular real alcanza a darse cuenta si alguien registro una que no es suya.
    enfriamiento: PT24H
  incidencia-fondo:
    # SINTETICO (ambiguedad del carril C): plazo para resolver un faltante extraordinario de caja.
    # Lo fija operaciones; este valor solo permite arrancar y probar.
    sla: PT24H
  mercado:
    # SINTETICOS (ambiguedades del carril C): los fija producto/operaciones, no son una decision tomada.
    vigencia-maxima: PT168H        # cuanto puede durar una oferta publicada
    reserva-maxima: PT10M          # cuanto puede quedar una compra a medias antes de abortarse
  desembolso:
    intentos-maximos: 3
    espera-entre-intentos: PT15M

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso
