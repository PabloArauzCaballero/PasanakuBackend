# entregas — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
spring:
  application:
    name: entregas
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_entregas
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 5     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}

aportaya:
  # Tableros (CU-98): relleno de indicadores al arrancar. 0 = no rellena (produccion); dev y TEST lo piden en el compose
  # para que el tablero tenga serie con la base sembrada. El diario corre siempre (aportaya.indicadores.cron).
  indicadores:
    relleno:
      meses: ${INDICADORES_RELLENO_MESES:0}
      dias: ${INDICADORES_RELLENO_DIAS:0}
  resiliencia:
    # Circuit breaker de los clientes hacia otros servicios (regla 98.2.3). Valores SINTETICOS del plan de
    # resiliencia (evidencia/carril-S2/DEUDA-circuit-breaker-clientes-http.md): no salen de medir trafico real.
    circuito:
      ventana: 10                   # llamadas que se miran, y minimo para juzgar
      umbral-de-fallos: 50          # % de fallos (red, timeout, 5xx, cuerpo ilegible) que lo abre
      espera-abierto: PT30S         # cuanto se deja de llamar antes de probar
      llamadas-de-prueba: 3         # llamadas de prueba en semiabierto
  esquema: entregas
  outbox:
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
  zona-horaria: America/La_Paz      # plazos habiles
  servicios:
    # A quien se le pregunta. Un servicio no lee la base de otro (invariante 11):
    # pregunta por su contrato, y fuera de la transaccion (invariante 6).
    identidad: ${URL_IDENTIDAD:http://identidad:8080}
    aportes: ${URL_APORTES:http://aportes:8080}        # afirma cuanto del pozo es caja confirmada
    # Sin uso desde el retiro de la cesion de turnos (D-L2-1); se quitan con la contraccion, junto al compose generado.
    grupos: ${URL_GRUPOS:http://grupos:8080}
    nucleo-financiero: ${URL_NUCLEO_FINANCIERO:http://nucleo-financiero:8080}
  # Fuera de la base a proposito: filtrar la tabla de cuentas no alcanza si la
  # pimienta no esta ahi. Si falta la variable, el proceso NO levanta.
  seguridad:
    pimienta: ${SEGURIDAD_PIMIENTA}
    version-llave: 1
    # F1.L2.M07 (SEG-007): la llave que cifra el numero de cuenta, distinta de la pimienta del hash. Sin valor por
    # defecto a proposito: si falta, o si es igual a la pimienta, el proceso NO levanta (regla 90.3.4).
    llave-cifrado-cuentas: ${ENTREGAS_LLAVE_CIFRADO_CUENTAS}
  cuentas:
    # Diez destinos distintos para la misma persona son un patron, no una comodidad.
    maximo-por-usuario: 3
    # Una cuenta recien verificada espera antes de poder recibir: es la ventana en la
    # que el titular real alcanza a darse cuenta si alguien registro una que no es suya.
    enfriamiento: PT24H
  incidencia-fondo:
    # SINTETICO (ambiguedad del carril C): plazo para resolver un faltante extraordinario de caja.
    # Lo fija operaciones; este valor solo permite arrancar y probar.
    sla: PT24H
  entregas:
    libro:
      timeout: PT3S
      # Identidad de SERVICIO con que se le paga al vendedor de un turno (nucleo-financiero acepta `pago-a-tercero`
      # solo asi: una sesion de usuario final recibe 403). Dos formas, ambas secretas y por entorno, nunca en el repo:
      #  - cuenta-servicio: cuenta de servicio en identidad con el rol SERVICIO_ENTREGAS; el servicio entra
      #    (POST /sesiones) y renueva el token solo antes de que venza. Es la forma de operar.
      #  - credencial-servicio: un token ya emitido (vive 15 minutos): solo una prueba manual.
      # Sin ninguna, pagarAlVendedor falla cerrado y la compra queda detenida y reanudable. Config a medias = no arranca.
      credencial-servicio: ${ENTREGAS_LIBRO_CREDENCIAL_SERVICIO:}
      cuenta-servicio:
        telefono: ${ENTREGAS_SERVICIO_TELEFONO:}
        clave: ${ENTREGAS_SERVICIO_CLAVE:}
        factor-totp-semilla: ${ENTREGAS_SERVICIO_TOTP_SEMILLA:}
  desembolso:
    intentos-maximos: 3
    espera-entre-intentos: PT15M

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso
