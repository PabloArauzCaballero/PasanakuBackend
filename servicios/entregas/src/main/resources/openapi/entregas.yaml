# Contrato de entregas — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /entregas, /desembolsos, /cuentas-bancarias
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
#
# Codigos de error de los tres casos de uso. Viven aca aunque el caso de uso no tenga
# ruta HTTP propia: scripts/verificar_criterios.py los busca en este archivo.
#
# CU-18 · Registrar y verificar una cuenta bancaria de destino
#   AP-CU18-01  TITULAR_NO_COINCIDE   · la cuenta no es de quien la registra (R-SEG-02)
#   AP-CU18-02  CUENTA_YA_REGISTRADA  · misma cuenta: se devuelve la que ya tiene
#   AP-CU18-03  ENTIDAD_NO_SOPORTADA  · aca: numero demasiado corto para ser uno
#   AP-CU18-04  VERIFICACION_FALLIDA  · la cuenta no existe
#   AP-CU18-05  MONEDA_INCOMPATIBLE   · reservado
#   AP-CU18-06  LIMITE_DE_CUENTAS     · tope de cuentas por usuario
#
# CU-22 · Liquidar y entregar el fondo
#   AP-CU22-01  BOLSA_INCOMPLETA      · se recaudo menos de lo prometido
#   AP-CU22-02  VALIDACION_BLOQUEANTE · hay validaciones previas sin resolver
#   AP-CU22-03  ENTREGA_DUPLICADA     · la entrega no existe o ya no admite el cambio
#   AP-CU22-04  SEGREGACION_INCUMPLIDA · quien ejecuta autorizo (R-SEG-04)
#   AP-CU22-05  NETO_NEGATIVO         · las deducciones superan la bolsa
#
# CU-28 · Emitir la orden de desembolso y ejecutar el intento
#   AP-CU28-01  ENTREGA_NO_AUTORIZADA · la entrega no esta autorizada
#   AP-CU28-02  CUENTA_NO_VERIFICADA  · cuenta sin verificar o en enfriamiento (R-DES-02)
#   AP-CU28-03  SIN_PROVEEDOR_DISPONIBLE · reservado; el enrutamiento es de CU-99
#   AP-CU28-04  SALDO_NO_RETENIDO     · el saldo de la entrega no esta retenido
#   AP-CU28-05  ORDEN_YA_EXISTE       · la orden no existe (el duplicado devuelve la que hay)
#   AP-CU28-06  RECHAZO_DEFINITIVO    · error que no se reintenta
#   AP-CU28-07  FILTRO_DE_LISTADO_INVALIDO · estado desconocido o cursor a medias (backoffice carril A · H8)
#
# CU-22 (pozo completo) · Fondear el pozo: caja confirmada + respaldo empresarial (carril C, H8)
#   AP-CU22-06  RECAUDO_NO_DISPONIBLE  · aportes no responde: no se fondea nada
#   AP-CU22-07  PEDIDO_NO_COINCIDE     · el periodo no es del grupo, o el respaldo cubrio otro importe
#   AP-CU22-08  RESPALDO_NO_DISPONIBLE · garantia no responde: no se sabe si cubrio, se reintenta
#   AP-CU22-09  FONDEO_EN_CONFLICTO    · otro pedido movio el fondeo, o el turno ya se liquido por el camino anterior
#
# Mercado del derecho a cobrar un turno (carril C, H9). NO existe caso de uso en la boveda:
# la numeracion AP-CU130-nn es PROVISIONAL (confirmar con quien gobierna docs/CasosDeUso).
#   AP-CU130-01  TURNO_AJENO           · el turno no es de quien lo ofrece
#   AP-CU130-02  TURNO_NO_VENDIBLE     · cobrado, en entrega, o el derecho ya se cedio
#   AP-CU130-03  OFERTA_INVALIDA       · precio, cargos, moneda o vigencia fuera de regla
#   AP-CU130-04  OFERTA_DUPLICADA      · ya hay una oferta activa, o la clave es de otra oferta
#   AP-CU130-05  OFERTA_NO_DISPONIBLE  · no existe, no es tuya, reservada por otro, cancelada o vencida
#   AP-CU130-06  COMPRADOR_NO_ELEGIBLE · no es miembro activo del grupo, o es el vendedor
#   AP-CU130-07  FONDOS_INSUFICIENTES  · el comprador no tiene saldo para el precio
#   AP-CU130-08  SERVICIO_NO_DISPONIBLE · grupos o nucleo-financiero no responden: se deniega
#   AP-CU130-09  CESION_NO_REANUDABLE  · estado que no admite el paso, o el vendedor ya cobro
openapi: 3.1.0
info:
  title: entregas
  version: 1.0.0
  description: >-
    Servicio entregas. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /cuentas-bancarias:
    post:
      operationId: registrarCuentaDestino       # CU-18
      summary: Registrar una cuenta bancaria de destino
      description: >-
        El numero NUNCA se guarda en claro (R-SEG-01): la fila lleva el cifrado, un
        hash con pimienta para buscar, y una version enmascarada. Y la cuenta esta a
        nombre de quien la registra (R-SEG-02): una cuenta de destino ajena es la forma
        mas simple de sacar plata de un grupo hacia afuera.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRegistroCuenta' }
      responses:
        '201':
          description: Cuenta registrada, en estado PENDIENTE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRegistroCuenta' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /cuentas-bancarias/{cuentaId}/verificacion:
    post:
      operationId: verificarCuentaDestino       # CU-18
      summary: Verificar la titularidad de la cuenta
      description: >-
        Verificada no es utilizable: empieza la ventana de enfriamiento y su fin se
        GUARDA. Si alguien toma una cuenta ajena, lo primero que hace es cambiar el
        destino y retirar; la ventana le da al titular real el tiempo de enterarse.
      parameters:
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [metodo]
              properties:
                metodo: { type: string, maxLength: 20 }
      responses:
        '200':
          description: Cuenta verificada, con su fecha de disponibilidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaVerificacionCuenta' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /cuentas-bancarias/{cuentaId}/disponibilidad:
    get:
      operationId: consultarDisponibilidad      # CU-18
      summary: Si la cuenta puede recibir plata ahora, y si no, cuanto falta
      description: >-
        Se dice CUANTO falta, no solo que no se puede: negar sin explicar convierte una
        medida de seguridad en una falla del sistema.
      parameters:
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Disponibilidad con su motivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Disponibilidad' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /cuentas-bancarias/{cuentaId}/principal:
    post:
      operationId: designarCuentaPrincipal      # CU-18
      summary: Designar la cuenta principal
      description: >-
        Una sola principal por usuario (R-BIL-17). Dos harian que el destino de un
        retiro dependiera del orden en que la base devuelve las filas.
      parameters:
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cuenta designada
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [designada]
                properties:
                  designada: { type: boolean }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas:
    post:
      operationId: liquidarEntrega              # CU-22
      summary: Liquidar la entrega del turno
      description: >-
        Una entrega por turno (R-GRP-01) y el neto NUNCA negativo: que las deducciones
        superen la bolsa significa que el beneficiario terminaria debiendo por cobrar
        su turno. Cada deduccion viaja con su tipo y su origen.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaLiquidacion' }
      responses:
        '201':
          description: Entrega liquidada, en estado PROGRAMADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaLiquidacion' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/{entregaId}/autorizacion:
    post:
      operationId: autorizarEntrega             # CU-22
      summary: Autorizar la entrega
      description: >-
        Una validacion bloqueante sin resolver la frena. Saltearlas para «no demorar la
        entrega» es como se entrega mal.
      parameters:
        - name: entregaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entrega autorizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAutorizacion' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/{entregaId}/ejecucion:
    post:
      operationId: ejecutarEntrega              # CU-22
      summary: Ejecutar la entrega
      description: >-
        Quien autoriza NO ejecuta (R-SEG-04). Una sola persona que hace las dos cosas
        puede sacar el fondo entero de un grupo sin que nadie mas lo vea pasar.
      parameters:
        - name: entregaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [montoEntregado]
              properties:
                montoEntregado: { $ref: '#/components/schemas/Dinero' }
      responses:
        '200':
          description: Entrega ejecutada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEjecucionEntrega' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /desembolsos:
    get:
      operationId: listarDesembolsos            # CU-28 (backoffice carril A · H8)
      summary: Bandeja de desembolsos de Tesoreria, del mas reciente al mas antiguo
      description: >-
        Por omision las excepciones que alguien tiene que mirar: RECHAZADA, DEVUELTA_POR_BANCO y
        EN_PROCESO. Sin cuenta destino, glosa ni referencia del proveedor (respuesta minima). Cursor
        (creadaEn, id) descendente. Exige ENTREGA_EJECUTAR o AUDITORIA_LEER.
      parameters:
        - name: estados
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeDesembolsos' }
        '422':
          # AP-CU28-07
          $ref: '#/components/responses/ReglaDeNegocio'
        '403':
          description: Sin ENTREGA_EJECUTAR ni AUDITORIA_LEER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Sin token valido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: emitirOrdenDesembolso        # CU-28
      summary: Emitir la orden de desembolso
      description: >-
        Una orden VIVA por entrega (R-DES-01) y ninguna a cuenta sin verificar
        (R-DES-02). Dos ordenes de la misma entrega es pagar dos veces, y no se
        descubre hasta que alguien concilia el extracto.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaOrdenDesembolso' }
      responses:
        '201':
          description: Orden emitida, o la que ya existia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaOrdenDesembolso' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /desembolsos/{ordenId}/respuesta:
    post:
      operationId: anotarRespuestaDesembolso    # CU-28
      summary: Registrar lo que contesto el proveedor
      description: >-
        La llamada al proveedor la hace quien orquesta, FUERA de esta transaccion
        (invariante 6). Un error definitivo NO se reintenta: insistir contra una cuenta
        que no existe solo demora el momento en que alguien mira el caso, mientras la
        plata del beneficiario sigue retenida.
      parameters:
        - name: ordenId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRespuestaDesembolso' }
      responses:
        '200':
          description: Resultado del intento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaIntentoDesembolso' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/pozo-completo:
    post:
      operationId: fondearPozo                  # CU-22 pozo completo
      summary: Fondear el pozo completo del turno
      description: >-
        Recibir mesa es recibir el pozo completo. El pedido trae SOLO identificadores:
        el pozo y lo confirmado los afirma `aportes`, y lo que falte lo cubre `garantia`
        con la reserva del ciclo (todo o nada, idempotente por turno). Si el respaldo no
        alcanza, la entrega queda BLOQUEADA conservando el pozo como principal y el
        faltante como deuda pendiente, y se abre una incidencia critica. Reintentar con
        la misma clave completa el mismo fondeo; nunca crea otra entrega.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaFondeoDelPozo' }
      responses:
        '201':
          description: Fondeo registrado (FONDEADO o CON_PENDIENTE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaFondeoDelPozo' }
        '200':
          description: El fondeo ya existia, o el reintento lo completo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaFondeoDelPozo' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/mercado/ofertas:
    post:
      operationId: publicarOferta               # mercado
      summary: Ofrecer el derecho a cobrar un turno
      description: >-
        Lo que se vende es el DERECHO a cobrar el pozo; no cambia quien debe los aportes
        ni la membresia. Solo el titular del turno (confirmado por `grupos`, nunca por el
        cliente) y mientras no haya entrega ni otra oferta activa. Reintentar con la misma
        clave devuelve la misma oferta.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaOferta' }
      responses:
        '201':
          description: Oferta publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaOferta' }
        '200':
          description: La misma clave ya habia publicado esta oferta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaOferta' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
    get:
      operationId: listarOfertas                # mercado
      summary: Ver las ofertas elegibles para mi
      description: >-
        Solo ofertas vigentes y no vendidas de grupos donde quien mira es miembro activo.
        Nunca muestra al vendedor. Paginado, con orden estable (vigencia, id).
      parameters:
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: La pagina de ofertas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeOfertas' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/mercado/ofertas/{ofertaId}:
    get:
      operationId: consultarOfertaParaPago         # mercado · H9.S1.M5 (el productor del hecho que `nucleo-financiero` consume)
      summary: Quien vende una oferta, a que precio y en que estado (hecho para pagar al vendedor)
      description: >-
        [CONTRATO · SOLO SERVICIO] Lo pide `nucleo-financiero` al ejecutar `POST /billetera/retenciones/{id}/pago-a-tercero`:
        el beneficiario y el reparto NO los dicta quien llama, los afirma el dueno de la oferta. Exige la identidad de
        servicio `SERVICIO_ENTREGAS` (la del token que viaja en la llamada entre servicios, porque la operacion de nucleo
        solo la ejecuta `entregas`); un participante, aunque sea el vendedor o el comprador, recibe 403. Respuesta minima:
        id, vendedor, precio, cargos y estado; nunca el grupo, el turno ni el comprador. Reparto (decision adoptada por
        delegacion del dueno, 2026-10-11): el comprador paga el `precio`, el vendedor cobra `precio - cargos` y la plataforma
        ingresa los `cargos`, cada uno con su linea en el asiento; `cargos` va entre 0 y el precio. Una oferta que no existe
        responde 422 `AP-CU130-05` y nucleo no paga (falla cerrado).
      parameters:
        - name: ofertaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La oferta, tal cual la afirma entregas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfertaParaPago' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/mercado/ofertas/{ofertaId}/cancelacion:
    post:
      operationId: cancelarOferta               # mercado
      summary: Cancelar mi oferta mientras nadie la reservo
      parameters:
        - name: ofertaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelada, o ya lo estaba
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCancelacionDeOferta' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/mercado/ofertas/{ofertaId}/compra:
    post:
      operationId: comprarOferta                # mercado
      summary: Comprar el derecho a cobrar un turno
      description: >-
        Una saga: reservar (uno gana), retener el saldo, dar el titulo, pagarle al vendedor.
        200 si quedo LIQUIDADA; 202 si quedo en curso (un servicio no respondio) y se
        reanuda repitiendo el pedido con la MISMA clave: nunca retiene ni paga dos veces.
      parameters:
        - name: ofertaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Compra liquidada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCompra' }
        '202':
          description: Compra en curso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCompra' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/subastas:
    post:
      operationId: abrirSubastaDeCupo           # CU-64 por subasta
      summary: Poner mi cupo en subasta
      description: >-
        El titular del cupo (lo confirma `grupos`, nunca el cliente) lo ofrece con un precio base y un
        plazo de 24, 48 o 72 horas. A todos los usuarios les llega el aviso (`entregas.subasta_abierta`).
        Al cierre gana la puja mas alta: el cupo pasa al ganador y el saliente cobra la puja, sin
        votacion del grupo (decision del dueno, 2026-10-30). Un cupo tiene a lo sumo una subasta viva.
        Reintentar con la misma clave devuelve la misma subasta.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaSubasta' }
      responses:
        '201':
          description: Subasta abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VistaDeSubasta' }
        '200':
          description: La misma clave ya habia abierto esta subasta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VistaDeSubasta' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU136-01 cupo no subastable (motivo en detalle) · AP-CU136-02 ya hay una subasta viva
          # AP-CU136-03 base o plazo invalidos · AP-CU136-08 grupos no respondio
    get:
      operationId: listarSubastasDeCupo         # CU-64 por subasta
      summary: Los cupos en subasta
      description: >-
        Para cualquier usuario: las subastas ABIERTAS, con lo que hace falta para decidir (grupo,
        aporte, periodicidad, base, puja mas alta, cierre). Nunca el saliente ni los postores. Con
        `cupoId` devuelve la ultima subasta de ese cupo en cualquier estado (lo usa la pantalla del
        grupo). Paginado, con orden estable (cierre, id).
      parameters:
        - name: cupoId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: pagina
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
      responses:
        '200':
          description: La pagina de subastas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeSubastas' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /entregas/subastas/{subastaId}:
    get:
      operationId: consultarSubastaDeCupo        # CU-64 por subasta
      summary: Una subasta, con la puja mas alta y la mia
      parameters:
        - name: subastaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La subasta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VistaDeSubasta' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU136-05 no existe

  /entregas/subastas/{subastaId}/pujas:
    post:
      operationId: pujarEnSubasta                # CU-64 por subasta
      summary: Ofrecer un monto por el cupo
      description: >-
        El monto queda RETENIDO de la billetera de quien puja hasta que lo superen (vuelve al
        instante) o gane (se le paga al saliente cuando el cupo ya es suyo). Tiene que ser al menos
        la base y mayor que la puja mas alta. Quien puja tiene que cumplir lo que pide el grupo
        (`grupos` lo confirma) y aceptar su reglamento. El saliente no puja. Dos pujas a la vez por
        el mismo monto: gana la primera en quedar firme, la otra recibe AP-CU136-04 y su saldo vuelve.
        Reintentar con la misma clave no retiene dos veces.
      parameters:
        - name: subastaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaPuja' }
      responses:
        '201':
          description: Tu puja es la mas alta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPuja' }
        '202':
          description: La billetera no respondio; reintenta con la MISMA clave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPuja' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU136-04 alguien ofrecio mas (detalle.montoMasAlto) · AP-CU136-05 subasta cerrada o inexistente
          # AP-CU136-06 no podes pujar (detalle.motivo) · AP-CU136-07 saldo insuficiente
          # AP-CU136-03 monto por debajo de la base · AP-CU136-08 grupos no respondio

  /entregas/subastas/{subastaId}/cancelacion:
    post:
      operationId: cancelarSubastaDeCupo         # CU-64 por subasta
      summary: Retirar mi cupo de la subasta mientras nadie pujo
      parameters:
        - name: subastaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cancelada (o ya lo estaba)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VistaDeSubasta' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU136-05 no es tuya o no existe · AP-CU136-02 ya tiene pujas

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    EntradaOferta:
      type: object
      additionalProperties: false
      required: [turnoId, precio, cargos, vigenteHasta]
      properties:
        turnoId:      { type: string, format: uuid }
        precio:       { $ref: '#/components/schemas/Dinero' }
        cargos:
          $ref: '#/components/schemas/Dinero'
          description: lo cotiza tarifas; el vendedor los absorbe (ambiguedad A9)
        vigenteHasta: { type: string, format: date-time }
    SalidaOferta:
      type: object
      additionalProperties: false
      required: [ofertaId, esNueva]
      properties:
        ofertaId: { type: string, format: uuid }
        esNueva:  { type: boolean }
    EntradaSubasta:
      type: object
      additionalProperties: false
      required: [grupoId, cupoId, montoBase, horas]
      properties:
        grupoId:   { type: string, format: uuid }
        cupoId:    { type: string, format: uuid }
        montoBase: { $ref: '#/components/schemas/Dinero' }
        horas:     { type: integer, enum: [24, 48, 72] }
    VistaDeSubasta:
      type: object
      additionalProperties: false
      required: [subastaId, grupoId, cupoId, nombreDelGrupo, periodicidad, montoAporte, montoBase,
                 montoMinimo, estado, cierraEn, cantidadDePujas, soyElSaliente]
      properties:
        subastaId:       { type: string, format: uuid }
        grupoId:         { type: string, format: uuid }
        cupoId:          { type: string, format: uuid }
        nombreDelGrupo:  { type: string, maxLength: 120 }
        periodicidad:    { type: string, maxLength: 15 }
        montoAporte:     { $ref: '#/components/schemas/Dinero' }
        montoBase:       { $ref: '#/components/schemas/Dinero' }
        montoMasAlto:
          description: la puja vigente mas alta; vacio si nadie pujo
          oneOf:
            - { $ref: '#/components/schemas/Dinero' }
            - { type: 'null' }
        montoMinimo:
          $ref: '#/components/schemas/Dinero'
          description: lo minimo que hoy se acepta (la base, o un centavo mas que la mas alta)
        estado:
          type: string
          enum: [ABIERTA, ADJUDICADA, LIQUIDANDO, VENDIDA, DESIERTA, CANCELADA, FALLIDA]
        cierraEn:        { type: string, format: date-time }
        cantidadDePujas: { type: integer, minimum: 0 }
        soyElSaliente:   { type: boolean }
        miPuja:
          oneOf:
            - { $ref: '#/components/schemas/MiPuja' }
            - { type: 'null' }
    MiPuja:
      type: object
      additionalProperties: false
      required: [monto, estado]
      properties:
        monto:  { $ref: '#/components/schemas/Dinero' }
        estado:
          type: string
          enum: [PENDIENTE, VIGENTE, SUPERADA, LIBERADA, GANADORA, RECHAZADA]
    PaginaDeSubastas:
      type: object
      additionalProperties: false
      required: [subastas, pagina]
      properties:
        pagina: { type: integer }
        subastas:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/VistaDeSubasta' }
    EntradaPuja:
      type: object
      additionalProperties: false
      required: [monto, aceptoReglamento]
      properties:
        monto:            { $ref: '#/components/schemas/Dinero' }
        aceptoReglamento:
          type: boolean
          description: >-
            si gana entra al grupo con sus reglas; tiene que ser true (AP-CU136-06 si no)
    SalidaPuja:
      type: object
      additionalProperties: false
      required: [pujaId, estado]
      properties:
        pujaId: { type: string, format: uuid }
        estado:
          type: string
          enum: [PENDIENTE, VIGENTE, SUPERADA, LIBERADA, GANADORA, RECHAZADA]
    VistaDeOferta:
      type: object
      additionalProperties: false
      required: [ofertaId, grupoId, turnoId, derecho, precio, cargos, vigenteHasta]
      properties:
        ofertaId:     { type: string, format: uuid }
        grupoId:      { type: string, format: uuid }
        turnoId:      { type: string, format: uuid }
        derecho:      { $ref: '#/components/schemas/Dinero' }
        precio:       { $ref: '#/components/schemas/Dinero' }
        cargos:       { $ref: '#/components/schemas/Dinero' }
        vigenteHasta: { type: string, format: date-time }
    OfertaParaPago:
      type: object
      additionalProperties: false
      required: [ofertaId, vendedorUsuarioId, precio, cargos, estado]
      properties:
        ofertaId:          { type: string, format: uuid }
        vendedorUsuarioId: { type: string, format: uuid }
        precio:            { $ref: '#/components/schemas/Dinero' }
        cargos:            { $ref: '#/components/schemas/Dinero' }
        estado:
          type: string
          enum: [PUBLICADA, RESERVADA, LIQUIDANDO, VENDIDA, CANCELADA, VENCIDA]
    PaginaDeOfertas:
      type: object
      additionalProperties: false
      required: [ofertas, pagina]
      properties:
        pagina: { type: integer }
        ofertas:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/VistaDeOferta' }
    SalidaCancelacionDeOferta:
      type: object
      additionalProperties: false
      required: [ofertaId, cancelada]
      properties:
        ofertaId:  { type: string, format: uuid }
        cancelada:
          type: boolean
          description: falso si ya estaba cancelada
    SalidaCompra:
      type: object
      additionalProperties: false
      required: [cesionId, estado, liquidada]
      properties:
        cesionId: { type: string, format: uuid }
        estado:   { type: string, enum: [VALIDADA, FONDOS_RETENIDOS, TITULO_ASIGNADO, LIQUIDADA, FALLIDA] }
        liquidada:
          type: boolean
          description: solo verdadero habilita decir que el derecho es del comprador y que el vendedor cobro
    EntradaFondeoDelPozo:
      type: object
      additionalProperties: false
      required: [grupoId, periodoId, turnoId, cupoId, beneficiarioId, metodoDesembolso, fechaProgramada]
      properties:
        grupoId:        { type: string, format: uuid }
        periodoId:      { type: string, format: uuid }
        turnoId:        { type: string, format: uuid }
        cupoId:         { type: string, format: uuid }
        beneficiarioId: { type: string, format: uuid }
        metodoDesembolso:
          type: string
          enum: [BILLETERA_MOVIL, COMPENSACION_INTERNA, QR_ENVIO, TRANSFERENCIA_BANCARIA]
          description: sin EFECTIVO_ORGANIZADOR a proposito, el organizador no es caja (RN-18)
        fechaProgramada: { type: string, format: date }
    SalidaFondeoDelPozo:
      type: object
      additionalProperties: false
      required: [entregaId, fondeoId, estado, pozo, confirmado, cubiertoMutual, cubiertoEmpresa, pendiente, esNuevo]
      properties:
        entregaId:       { type: string, format: uuid }
        fondeoId:        { type: string, format: uuid }
        estado:          { type: string, enum: [FONDEADO, CON_PENDIENTE] }
        pozo:            { $ref: '#/components/schemas/Dinero' }
        confirmado:      { $ref: '#/components/schemas/Dinero' }
        cubiertoMutual:  { $ref: '#/components/schemas/Dinero' }
        cubiertoEmpresa: { $ref: '#/components/schemas/Dinero' }
        pendiente:
          $ref: '#/components/schemas/Dinero'
          description: la deuda conservada; cero si el pozo esta completo
        esNuevo: { type: boolean }
    EntradaRegistroCuenta:
      type: object
      additionalProperties: false
      required: [tipoCuenta, entidadFinanciera, numeroCuenta, numeroCifrado, titularNombre, titularDocumento, moneda]
      properties:
        tipoCuenta:        { type: string, enum: [AHORRO, CORRIENTE, BILLETERA] }
        entidadFinanciera: { type: string, maxLength: 60 }
        numeroCuenta:
          type: string
          minLength: 6
          maxLength: 34
          description: >-
            El numero en claro, y **nunca se persiste asi** (CU-18, R-SEG-01). Entra
            solo para derivar el enmascarado que se muestra y el hash con el que se
            detecta la cuenta repetida; las dos derivaciones ocurren ANTES de tocar la
            base, asi que el numero no llega a ninguna consulta.
        numeroCifrado:
          type: string
          description: >-
            ya cifrado por el almacen de llaves. **El numero en claro nunca viaja en
            este campo ni se persiste** (R-SEG-01)
        titularNombre:    { type: string, maxLength: 120 }
        titularDocumento: { type: string, maxLength: 30 }
        moneda:           { type: string, enum: [BOB, USD] }
    SalidaRegistroCuenta:
      type: object
      additionalProperties: false
      required: [cuentaId, numeroEnmascarado, estado, esNueva]
      properties:
        cuentaId: { type: string, format: uuid }
        numeroEnmascarado:
          type: string
          description: lo unico que se muestra — los ultimos cuatro digitos
        estado:  { type: string, enum: [PENDIENTE, VERIFICADA, RECHAZADA] }
        esNueva: { type: boolean }
    SalidaVerificacionCuenta:
      type: object
      additionalProperties: false
      required: [cuentaId, estado, esNueva]
      properties:
        cuentaId: { type: string, format: uuid }
        estado:   { type: string }
        disponibleDesde:
          type: [string, 'null']
          format: date-time
          description: el fin de la ventana de enfriamiento; se GUARDA, no se recalcula
        esNueva: { type: boolean }
    Disponibilidad:
      type: object
      additionalProperties: false
      required: [disponible, restanteSegundos, motivo]
      properties:
        disponible:       { type: boolean }
        restanteSegundos: { type: integer, minimum: 0 }
        motivo:
          type: string
          description: en texto; negar sin explicar convierte una medida de seguridad en una falla
    DeduccionEntrega:
      type: object
      additionalProperties: false
      required: [tipo, descripcion, monto, esObligatoria]
      properties:
        tipo:
          type: string
          enum: [AJUSTE_ACORDADO, APORTE_PROPIO_DEL_PERIODO, COMISION_PLATAFORMA,
                 COSTO_TRANSFERENCIA, DEUDA_VENCIDA_PROPIA, RECARGO_MORA_PROPIO,
                 REPOSICION_FONDO_GARANTIA, RETENCION_IMPUESTO]
        descripcion: { type: string, maxLength: 200 }
        monto:       { $ref: '#/components/schemas/Dinero' }
        referenciaOrigenId:
          type: [string, 'null']
          format: uuid
          description: la fila que justifica el descuento. Sin ella la deduccion no se puede auditar
        esObligatoria: { type: boolean }
    EntradaLiquidacion:
      type: object
      additionalProperties: false
      required: [grupoId, periodoId, turnoId, cupoId, beneficiarioId, bruto, recaudado,
                 deducciones, metodoDesembolso, fechaProgramada]
      properties:
        grupoId:        { type: string, format: uuid }
        periodoId:      { type: string, format: uuid }
        turnoId:        { type: string, format: uuid }
        cupoId:         { type: string, format: uuid }
        beneficiarioId: { type: string, format: uuid }
        bruto:     { $ref: '#/components/schemas/Dinero' }
        recaudado: { $ref: '#/components/schemas/Dinero' }
        deducciones:
          type: array
          items: { $ref: '#/components/schemas/DeduccionEntrega' }
        metodoDesembolso:
          type: string
          enum: [BILLETERA_MOVIL, COMPENSACION_INTERNA, EFECTIVO_ORGANIZADOR, QR_ENVIO,
                 TRANSFERENCIA_BANCARIA]
        fechaProgramada: { type: string, format: date }
    SalidaLiquidacion:
      type: object
      additionalProperties: false
      required: [entregaId, bruto, totalDeducciones, neto, estado]
      properties:
        entregaId:        { type: string, format: uuid }
        bruto:            { $ref: '#/components/schemas/Dinero' }
        totalDeducciones: { $ref: '#/components/schemas/Dinero' }
        neto:             { $ref: '#/components/schemas/Dinero' }
        estado:           { type: string }
    SalidaAutorizacion:
      type: object
      additionalProperties: false
      required: [entregaId, estado, autorizadaPor]
      properties:
        entregaId:     { type: string, format: uuid }
        estado:        { type: string, enum: [AUTORIZADA] }
        autorizadaPor: { type: string, format: uuid }
    SalidaEjecucionEntrega:
      type: object
      additionalProperties: false
      required: [entregaId, estado, montoEntregado]
      properties:
        entregaId:      { type: string, format: uuid }
        estado:         { type: string, enum: [ENTREGADA] }
        montoEntregado: { $ref: '#/components/schemas/Dinero' }
    EntradaOrdenDesembolso:
      type: object
      additionalProperties: false
      required: [entregaId, proveedorId, cuentaDestinoId, glosa, saldoRetenido]
      properties:
        entregaId:       { type: string, format: uuid }
        proveedorId:     { type: string, format: uuid }
        cuentaDestinoId: { type: string, format: uuid }
        glosa:           { type: string, maxLength: 140 }
        saldoRetenido:
          type: boolean
          description: >-
            sin el saldo retenido, desembolsar seria pagar con plata que todavia puede
            gastarse en otra cosa
    SalidaOrdenDesembolso:
      type: object
      additionalProperties: false
      required: [ordenId, estado, claveIdempotencia, intentos, esNueva]
      properties:
        ordenId: { type: string, format: uuid }
        estado:
          type: string
          enum: [CREADA, ENVIADA_A_PROVEEDOR, EN_PROCESO, ACREDITADA, RECHAZADA,
                 DEVUELTA_POR_BANCO, CANCELADA]
        claveIdempotencia: { type: string }
        intentos:          { type: integer, minimum: 0 }
        esNueva:           { type: boolean }
    EntradaRespuestaDesembolso:
      type: object
      additionalProperties: false
      required: [iniciado, exitoso]
      properties:
        iniciado: { type: string, format: date-time }
        exitoso:  { type: boolean }
        referenciaProveedor:
          type: [string, 'null']
          description: obligatoria si fue exitoso — es contra lo que cruza el extracto
        codigoError:
          type: [string, 'null']
          description: >-
            CUENTA_INEXISTENTE, CUENTA_CERRADA, TITULAR_NO_COINCIDE y
            MONEDA_INCOMPATIBLE son definitivos: no se reintentan
        mensajeProveedor: { type: [string, 'null'], maxLength: 255 }
    SalidaIntentoDesembolso:
      type: object
      additionalProperties: false
      required: [estado, numeroIntento, esNuevo]
      properties:
        ordenId:       { type: [string, 'null'], format: uuid }
        estado:        { type: string }
        numeroIntento: { type: integer, minimum: 0 }
        reintentableEn:
          type: [string, 'null']
          format: date-time
          description: null cuando el error fue definitivo o se agotaron los intentos
        esNuevo: { type: boolean }
    PaginaDeDesembolsos:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DesembolsoEnLista' }
        proximoAntesDe: { type: string, format: date-time }
        proximoAntesDeId: { type: string, format: uuid }
    DesembolsoEnLista:
      type: object
      additionalProperties: false
      required: [ordenId, entregaId, proveedorId, monto, estado, intentos, creadaEn]
      properties:
        ordenId: { type: string, format: uuid }
        entregaId: { type: string, format: uuid }
        proveedorId: { type: string, format: uuid }
        monto: { $ref: '#/components/schemas/Dinero' }
        estado:
          type: string
          enum: [CREADA, ENVIADA_A_PROVEEDOR, EN_PROCESO, ACREDITADA, RECHAZADA, DEVUELTA_POR_BANCO, CANCELADA]
        intentos: { type: integer }
        ultimoResultado: { type: string, enum: [EXITOSO, FALLIDO, PENDIENTE, TIMEOUT] }
        ultimoCodigoError: { type: string }
        reintentableEn: { type: string, format: date-time }
        creadaEn: { type: string, format: date-time }
        acreditadaEn: { type: string, format: date-time }
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
