# Contrato de erp — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /erp
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
#
# Codigos de error de los siete casos de uso, tal como los nombra la boveda.
# Viven aca aunque el caso de uso no tenga ruta HTTP propia:
# scripts/verificar_criterios.py los busca en este archivo.
#
# CU-100 · Abrir y cerrar el periodo contable
#   AP-CU100-01  PERIODO_YA_CERRADO           · el periodo ya tiene su cierre
#   AP-CU100-02  PERIODO_NO_ES_EL_MAS_ANTIGUO · hay un mes anterior todavia abierto
#   AP-CU100-03  DESCUADRE_DETECTADO          · total_debe != total_haber al cerrar
#   AP-CU100-04  SIN_PERIODO_VIGENTE          · ningun periodo contiene la fecha de hoy (America/La_Paz):
#                                              no hay ejercicio abierto para hoy, y no se inventa uno
#   AP-CU100-05  EJERCICIO_INEXISTENTE        · ese ejercicio fiscal no existe
#
# CU-101 · Presupuestar por centro de costo
#   AP-CU101-01  CENTRO_COSTO_INEXISTENTE     · el centro no existe o esta inactivo
#   AP-CU101-02  PRESUPUESTO_DUPLICADO        · ya hay presupuesto para ese centro y ejercicio
#   AP-CU101-03  PARTIDA_SOBRE_PRESUPUESTO_CERRADO · un presupuesto cerrado no admite partidas
#   AP-CU101-04  FILTRO_DE_LISTADO_INVALIDO   · listado de partidas: cursor a medias o estado desconocido
#
# CU-102 · Dar de alta un tercero comercial y su orden de compra
#   AP-CU102-01  TERCERO_BLOQUEADO            · el tercero existe pero no esta ACTIVO
#   AP-CU102-02  DOCUMENTO_YA_REGISTRADO_A_OTRO_TERCERO · el NIT ya es de otro tercero
#   AP-CU102-03  ORDEN_SIN_APROBACION         · la orden sigue en BORRADOR
#   AP-CU102-04  FILTRO_DE_LISTADO_INVALIDO   · listado de ordenes: cursor a medias o estado desconocido
#
# CU-103 · Registrar y pagar una factura de proveedor
#   AP-CU103-01  PERIODO_CERRADO              · la emision cae en un mes ya cerrado
#   AP-CU103-02  MISMO_APROBADOR_Y_PAGADOR    · R-CTB-05: cuatro ojos sobre el egreso
#   AP-CU103-03  FACTURA_DUPLICADA            · ese proveedor ya tiene ese numero
#   AP-CU103-04  MONTO_PAGO_MAYOR_AL_SALDO    · el pago excede el saldo pendiente
#   AP-CU103-05  CLAVE_DE_IDEMPOTENCIA_REUTILIZADA · R-CTB-11: esa clave ya es de otro pago de la factura
#   AP-CU103-06  FILTRO_DE_LISTADO_INVALIDO   · listado de facturas: cursor a medias o estado desconocido
#
# CU-104 · Cobrar una cuenta por cobrar
#   AP-CU104-01  CUENTA_INEXISTENTE           · el identificador no corresponde a una cuenta
#   AP-CU104-02  MONTO_MAYOR_AL_SALDO         · el cobro excede lo adeudado
#   AP-CU104-03  CUENTA_YA_INCOBRABLE         · una cuenta incobrable no se cobra
#   AP-CU104-04  FILTRO_DE_LISTADO_INVALIDO   · listado de cuentas: cursor a medias o estado desconocido
#
# CU-105 · Depreciar un activo fijo
#   AP-CU105-01  DEPRECIACION_YA_CALCULADA    · ya hay cuota de ese activo en ese mes
#   AP-CU105-02  ACTIVO_YA_AGOTADO            · el valor en libros llego al residual
#   AP-CU105-03  ACTIVO_DADO_DE_BAJA          · el activo no esta ACTIVO
#   AP-CU105-04  FILTRO_DE_LISTADO_INVALIDO   · listado de activos: cursor a medias o estado desconocido
#
# CU-106 · Generar el estado financiero del periodo
#   AP-CU106-01  YA_GENERADO_PARA_ESE_PERIODO · un estado por periodo y tipo (R-CTB-08)
#   AP-CU106-02  CUENTA_PLANTILLA_INVALIDA    · la plantilla apunta a una sumarizadora
#   AP-CU106-03  ESTADO_FINANCIERO_INEXISTENTE · ese estado financiero no existe
#   AP-CU106-04  INTEGRIDAD_DEL_DOCUMENTO     · lo guardado ya no da el hash sellado: no se entrega
#
# NOTA · divergencias declaradas contra la boveda, con su detalle en
# planes/informes/carril-3D-erp.md:
#   · El catalogo no tiene codigo de «referencia inexistente». Las consultas por un
#     identificador que no existe reutilizan, dentro de cada CU, el codigo mas
#     cercano: AP-CU100-01, AP-CU101-01, AP-CU102-03, AP-CU103-03, AP-CU104-01,
#     AP-CU105-03 y AP-CU106-02.
#   · CU-103 devuelve `asientoContableId`; erp no escribe el libro (invariante 12).
#     El campo viaja nulo hasta que nucleo-financiero responde el evento
#     `erp.factura_proveedor_registrada`, y este contrato lo declara nulable.
#   · CU-102 nombra `montoTotal` y una salida con un unico `ordenCompraId`; el alta
#     del tercero y la de la orden son dos operaciones, porque el tercero se reusa
#     entre ordenes.
#   · CU-100 declara `cerradoEn`; la columna es `cerrado_en` y viaja como
#     date-time UTC.
#   · No hay operacion de reapertura de periodo, de anulacion de factura ni de
#     marcado de una cuenta como incobrable: esas tablas son append-only y el estado
#     se decide al insertar.
openapi: 3.1.0
info:
  title: erp
  version: 1.0.0
  description: >-
    Servicio erp. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /erp/ejercicios:
    get:
      operationId: listarEjerciciosFiscales     # CU-100 (backoffice carril A · H4)
      summary: Los ejercicios fiscales con sus periodos, del mas reciente al mas antiguo
      description: >-
        Lo que la pantalla de Contabilidad necesita para elegir un periodo real en vez de un
        identificador de demostracion. Pagina por anio descendente (cursor antesDeAnio). La ve
        cualquiera que pueda abrir la seccion Contabilidad: CONTABILIDAD_ERP_REPORTES o cualquiera
        de los otros permisos ERP. Solo lee: no lleva Idempotency-Key.
      parameters:
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 5 } }
        - { name: antesDeAnio, in: query, required: false, schema: { type: integer, minimum: 2000, maximum: 2999 } }
      responses:
        '200':
          description: Pagina de ejercicios (vacia si todavia no se abrio ninguno)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeEjercicios' }
        '403':
          description: Sin ningun permiso de Contabilidad
        '401':
          description: Sin sesion
    post:
      operationId: abrirEjercicioFiscal
      summary: CU-100 · Abre el ejercicio y sus doce periodos
      description: Exige CONTABILIDAD_ERP_CERRAR.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaEjercicio' }
      responses:
        '201':
          description: Ejercicio abierto, con sus doce periodos en ABIERTO
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEjercicio' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/ejercicios/{ejercicioId}/periodos:
    get:
      operationId: listarPeriodosDelEjercicio   # CU-100 (backoffice carril A · H7)
      summary: Los periodos de un ejercicio, con su cierre si lo tienen
      description: >-
        A lo sumo doce filas (un periodo por mes): no pagina. Los totales debe/haber son los
        SELLADOS en el cierre (cierre_periodo_contable, append-only); un periodo abierto los trae
        en null, porque calcularlos en vivo exigiria leer el libro de nucleo_financiero y esa
        lectura cruzada ya esta acotada al cierre (invariante 11 declarado). Mismos permisos que
        listarEjerciciosFiscales.
      parameters:
        - { name: ejercicioId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: El ejercicio y sus periodos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodosDelEjercicio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU100-05 EJERCICIO_INEXISTENTE
        '403':
          description: Sin ningun permiso de Contabilidad
        '401':
          description: Sin sesion

  /erp/periodos/vigente:
    get:
      operationId: consultarPeriodoVigente      # CU-100 (backoffice carril A · H4)
      summary: El periodo contable que contiene la fecha de hoy (America/La_Paz)
      description: >-
        Donde aterriza la seccion Contabilidad. Es el periodo cuyo rango contiene hoy; puede estar
        CERRADO si se cerro antes de terminar el mes, y se devuelve igual con su estado. Si ningun
        periodo contiene hoy (no hay ejercicio abierto para este anio) responde AP-CU100-04: la
        pantalla lo dice, no elige uno cualquiera. Mismos permisos que listarEjerciciosFiscales.
      responses:
        '200':
          description: El periodo vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodoContable' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU100-04 SIN_PERIODO_VIGENTE
        '403':
          description: Sin ningun permiso de Contabilidad
        '401':
          description: Sin sesion

  /erp/periodos/{periodoId}/cierre:
    post:
      operationId: cerrarPeriodoContable
      summary: CU-100 · Cierra el mes contra su cuadre
      description: Exige CONTABILIDAD_ERP_CERRAR. El cierre es irreversible.
      parameters:
        - $ref: '#/components/parameters/PeriodoId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCierre' }
      responses:
        '201':
          description: Periodo cerrado, con la constancia del cuadre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCierre' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/presupuestos:
    post:
      operationId: crearPresupuesto
      summary: CU-101 · Presupuesta un centro de costo para el ejercicio
      description: Exige CONTABILIDAD_ERP_PRESUPUESTO.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaPresupuesto' }
      responses:
        '201':
          description: Presupuesto en BORRADOR, con sus partidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPresupuesto' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/presupuestos/{presupuestoId}/aprobacion:
    post:
      operationId: aprobarPresupuesto
      summary: CU-101 · Aprueba el presupuesto y lo deja vigente
      description: Exige CONTABILIDAD_ERP_PRESUPUESTO.
      parameters:
        - $ref: '#/components/parameters/PresupuestoId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Presupuesto APROBADO, con su total
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPresupuesto' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/partidas-presupuestarias:
    get:
      operationId: listarPartidasPresupuestarias   # CU-101 (backoffice carril A · A6)
      summary: Las partidas presupuestarias con lo presupuestado y lo ejecutado
      description: >-
        Para medir la desviacion por partida (CU-101 mide, no bloquea). Opcionalmente de un ejercicio y
        por estado del presupuesto. Cursor (inicio del periodo, id) descendente. Importes como cadena con
        su moneda. La cuenta contable viaja como id: su nombre es de nucleo-financiero y erp no cruza
        esquemas. Exige CONTABILIDAD_ERP_PRESUPUESTO o CONTABILIDAD_ERP_REPORTES. Solo lee: no lleva Idempotency-Key. Cursor a medias (antesDe sin antesDeId o al reves) o estado desconocido: 422.
      parameters:
        - { name: ejercicioId, in: query, required: false, schema: { type: string, format: uuid } }
        - name: estados
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [BORRADOR, APROBADO, CERRADO] }
            minItems: 1
            maxItems: 3
          style: form
          explode: false
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDePartidas' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU101-04 FILTRO_DE_LISTADO_INVALIDO
        '400':
          description: Parametro mal formado (fecha, uuid o limite fuera de rango)
        '403':
          description: Sin CONTABILIDAD_ERP_PRESUPUESTO ni CONTABILIDAD_ERP_REPORTES
        '401':
          description: Sin sesion

  /erp/terceros:
    post:
      operationId: darDeAltaTercero
      summary: CU-102 · Da de alta un tercero comercial
      description: >-
        Exige CONTABILIDAD_ERP_COMPRAS. Reintentar con el mismo documento devuelve el
        tercero que ya hay; con otro tipo devuelve AP-CU102-02.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaTercero' }
      responses:
        '201':
          description: Tercero dado de alta, o el que ya existia con ese documento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaTercero' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/ordenes-de-compra:
    get:
      operationId: listarOrdenesDeCompra   # CU-102 (backoffice carril A · A6)
      summary: Las ordenes de compra, de la mas reciente a la mas antigua
      description: >-
        Numero, proveedor (razon social), centro de costo, estado y monto con moneda. No devuelve la
        descripcion libre de la orden ni el documento del tercero (respuesta minima). Cursor (creadaEn, id)
        descendente. Exige CONTABILIDAD_ERP_COMPRAS, CONTABILIDAD_ERP_CUENTAS_POR_PAGAR (factura contra la
        orden) o CONTABILIDAD_ERP_REPORTES. Solo lee: no lleva Idempotency-Key. Cursor a medias (antesDe sin antesDeId o al reves) o estado desconocido: 422.
      parameters:
        - name: estados
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [BORRADOR, APROBADA, RECIBIDA_PARCIAL, RECIBIDA_TOTAL, CANCELADA] }
            minItems: 1
            maxItems: 5
          style: form
          explode: false
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeOrdenes' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU102-04 FILTRO_DE_LISTADO_INVALIDO
        '400':
          description: Parametro mal formado (fecha, uuid o limite fuera de rango)
        '403':
          description: Sin CONTABILIDAD_ERP_COMPRAS, CONTABILIDAD_ERP_CUENTAS_POR_PAGAR ni CONTABILIDAD_ERP_REPORTES
        '401':
          description: Sin sesion
    post:
      operationId: crearOrdenDeCompra
      summary: CU-102 · Crea la orden de compra en BORRADOR
      description: Exige CONTABILIDAD_ERP_COMPRAS.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaOrden' }
      responses:
        '201':
          description: Orden creada en BORRADOR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaOrden' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/ordenes-de-compra/{ordenId}/aprobacion:
    post:
      operationId: aprobarOrdenDeCompra
      summary: CU-102 · Aprueba la orden y habilita facturarla
      description: Exige CONTABILIDAD_ERP_COMPRAS.
      parameters:
        - $ref: '#/components/parameters/OrdenId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Orden APROBADA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaOrden' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/facturas-de-proveedor:
    get:
      operationId: listarFacturasDeProveedor   # CU-103 (backoffice carril A · A6)
      summary: Las cuentas por pagar, de la emision mas reciente a la mas antigua
      description: >-
        Monto, pagado y saldo pendiente con su moneda, vencimiento y estado; lo pagado, el saldo y el
        estado se derivan de los pagos registrados (la factura es append-only). aprobadaPorLaSesion la
        resuelve el servidor contra el sujeto del token (R-CTB-05): el cliente no compara identidades.
        Cursor (fechaEmision, id) descendente. Exige CONTABILIDAD_ERP_CUENTAS_POR_PAGAR,
        CONTABILIDAD_ERP_PAGAR o CONTABILIDAD_ERP_REPORTES. Solo lee: no lleva Idempotency-Key. Cursor a medias (antesDe sin antesDeId o al reves) o estado desconocido: 422.
      parameters:
        - name: estados
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [REGISTRADA, APROBADA, PAGADA_PARCIAL, PAGADA, ANULADA] }
            minItems: 1
            maxItems: 5
          style: form
          explode: false
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeFacturas' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU103-06 FILTRO_DE_LISTADO_INVALIDO
        '400':
          description: Parametro mal formado (fecha, uuid o limite fuera de rango)
        '403':
          description: Sin CONTABILIDAD_ERP_CUENTAS_POR_PAGAR, CONTABILIDAD_ERP_PAGAR ni CONTABILIDAD_ERP_REPORTES
        '401':
          description: Sin sesion
    post:
      operationId: registrarFacturaDeProveedor
      summary: CU-103 · Registra la factura del proveedor
      description: >-
        Exige CONTABILIDAD_ERP_CUENTAS_POR_PAGAR. La aprobacion es un dato del alta:
        `factura_proveedor` es append-only y no admite aprobarse despues. El aprobador
        es el sujeto autenticado (token), no un dato del cuerpo: si el cuerpo trae
        `aprobadaPor`, se rechaza con 400.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaFactura' }
      responses:
        '201':
          description: Factura registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaFactura' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/facturas-de-proveedor/{facturaId}/pagos:
    post:
      operationId: pagarFacturaDeProveedor
      summary: CU-103 · Paga, total o parcialmente, una factura aprobada
      description: >-
        Exige CONTABILIDAD_ERP_PAGAR. Quien autoriza el pago es el sujeto autenticado
        (token), no un dato del cuerpo: el cuerpo no lleva `autorizadoPor` y, si lo
        trae, se rechaza con 400. Quien aprobo la factura no puede autorizar su pago
        (R-CTB-05). Idempotente (R-CTB-11): la misma `Idempotency-Key` sobre la misma
        factura con el mismo pago devuelve la respuesta del original sin registrar otro
        pago; con la misma clave y otro pago responde 422 AP-CU103-05.
      parameters:
        - $ref: '#/components/parameters/FacturaId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaPago' }
      responses:
        '201':
          description: Pago registrado, con el saldo pendiente resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaFactura' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/cuentas-por-cobrar:
    get:
      operationId: listarCuentasPorCobrar   # CU-104 (backoffice carril A · A6)
      summary: Las cuentas por cobrar, del vencimiento mas lejano al mas antiguo
      description: >-
        Origen, tercero (razon social, si tiene), monto, cobrado y saldo con su moneda, vencimiento y
        estado; lo cobrado, el saldo y el estado se derivan de los cobros (la cuenta es append-only). Cursor (fechaVencimiento, id) descendente. Exige CONTABILIDAD_ERP_COBRAR o
        CONTABILIDAD_ERP_REPORTES. Solo lee: no lleva Idempotency-Key. Cursor a medias (antesDe sin antesDeId o al reves) o estado desconocido: 422.
      parameters:
        - name: estados
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [PENDIENTE, COBRADA_PARCIAL, COBRADA, INCOBRABLE] }
            minItems: 1
            maxItems: 4
          style: form
          explode: false
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeCuentasPorCobrar' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU104-04 FILTRO_DE_LISTADO_INVALIDO
        '400':
          description: Parametro mal formado (fecha, uuid o limite fuera de rango)
        '403':
          description: Sin CONTABILIDAD_ERP_COBRAR ni CONTABILIDAD_ERP_REPORTES
        '401':
          description: Sin sesion
    post:
      operationId: abrirCuentaPorCobrar
      summary: CU-104 · Abre la cuenta por cobrar de un tercero
      description: Exige CONTABILIDAD_ERP_COBRAR.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCuentaPorCobrar' }
      responses:
        '201':
          description: Cuenta por cobrar abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCuentaPorCobrar' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/cuentas-por-cobrar/{cuentaId}/cobros:
    post:
      operationId: registrarCobro
      summary: CU-104 · Registra un cobro contra la cuenta
      description: Exige CONTABILIDAD_ERP_COBRAR.
      parameters:
        - $ref: '#/components/parameters/CuentaId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCobro' }
      responses:
        '201':
          description: Cobro registrado, con el saldo pendiente resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCobro' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/activos:
    get:
      operationId: listarActivosFijos   # CU-105 (backoffice carril A · A6)
      summary: El inventario de activos fijos con su valor en libros
      description: >-
        Codigo, descripcion del bien, categoria y vida util, costo, residual, depreciacion acumulada y
        valor en libros (costo menos acumulada, el mismo atomo de CU-105) con su moneda. depreciadoEnElPeriodoVigente
        dice si ya tiene cuota en el periodo que contiene hoy en America/La_Paz. Cursor
        (fechaAdquisicion, id) descendente. Exige CONTABILIDAD_ERP_ACTIVOS_FIJOS o
        CONTABILIDAD_ERP_REPORTES. Solo lee: no lleva Idempotency-Key. Cursor a medias (antesDe sin antesDeId o al reves) o estado desconocido: 422.
      parameters:
        - name: estados
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [ACTIVO, DADO_DE_BAJA, VENDIDO] }
            minItems: 1
            maxItems: 3
          style: form
          explode: false
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeActivos' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU105-04 FILTRO_DE_LISTADO_INVALIDO
        '400':
          description: Parametro mal formado (fecha, uuid o limite fuera de rango)
        '403':
          description: Sin CONTABILIDAD_ERP_ACTIVOS_FIJOS ni CONTABILIDAD_ERP_REPORTES
        '401':
          description: Sin sesion

  /erp/activos/{activoId}/depreciaciones:
    post:
      operationId: depreciarActivo
      summary: CU-105 · Calcula la cuota del activo en el periodo
      description: Exige CONTABILIDAD_ERP_ACTIVOS_FIJOS.
      parameters:
        - $ref: '#/components/parameters/ActivoId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDepreciacion' }
      responses:
        '201':
          description: Cuota calculada, con el valor en libros resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDepreciacion' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/periodos/{periodoId}/depreciaciones:
    post:
      operationId: correrDepreciacionDelPeriodo
      summary: CU-105 · Corre la depreciacion de todos los activos del mes
      description: >-
        Exige CONTABILIDAD_ERP_ACTIVOS_FIJOS. Es idempotente: los activos ya corridos
        se informan en `yaCorridos` y no se vuelven a depreciar.
      parameters:
        - $ref: '#/components/parameters/PeriodoId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Resumen de la corrida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCorrida' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/periodos/{periodoId}/estados-financieros:
    post:
      operationId: generarEstadoFinanciero
      summary: CU-106 · Genera el balance o el estado de resultados del mes
      description: Exige CONTABILIDAD_ERP_REPORTES.
      parameters:
        - $ref: '#/components/parameters/PeriodoId'
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaEstadoFinanciero' }
      responses:
        '201':
          description: Estado financiero generado, con el hash de su contenido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEstadoFinanciero' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /erp/estados-financieros/{estadoFinancieroId}/documento:
    get:
      operationId: descargarEstadoFinanciero    # CU-106 (backoffice carril A · H7)
      summary: El documento sellado del estado financiero, con su hash en X-Hash-Contenido
      description: >-
        El servidor reconstruye el texto canonico desde lo guardado con la MISMA funcion que lo
        sello, recalcula su SHA-256 y solo lo entrega si coincide con el hash guardado; la
        cabecera X-Hash-Contenido repite ese hash. El cliente compara, no recalcula. Si no
        coincide, AP-CU106-04 y no se entrega nada. Exige CONTABILIDAD_ERP_REPORTES.
      parameters:
        - { name: estadoFinancieroId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: El documento sellado (JSON canonico)
          headers:
            X-Hash-Contenido:
              description: SHA-256 del documento entregado, igual al sellado al generarlo
              schema: { type: string }
          content:
            application/json:
              schema: { type: string, format: binary }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU106-03 ESTADO_FINANCIERO_INEXISTENTE · AP-CU106-04 INTEGRIDAD_DEL_DOCUMENTO
        '403':
          description: Sin CONTABILIDAD_ERP_REPORTES
        '401':
          description: Sin sesion

  /erp/plantillas-de-asiento/{plantillaId}/validacion:
    get:
      operationId: validarPlantillaDeAsiento
      summary: CU-106 · Comprueba que la plantilla no apunte a sumarizadoras
      description: >-
        Exige CONTABILIDAD_ERP_REPORTES. Sin efecto, asi que no exige clave.
      parameters:
        - $ref: '#/components/parameters/PlantillaId'
      responses:
        '200':
          description: Plantilla balanceada y contra cuentas de movimiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPlantilla' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
    PeriodoId:
      name: periodoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PresupuestoId:
      name: presupuestoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrdenId:
      name: ordenId
      in: path
      required: true
      schema: { type: string, format: uuid }
    FacturaId:
      name: facturaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CuentaId:
      name: cuentaId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ActivoId:
      name: activoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PlantillaId:
      name: plantillaId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    PeriodosDelEjercicio:
      type: object
      additionalProperties: false
      required: [ejercicioId, anio, estado, periodos]
      properties:
        ejercicioId: { type: string, format: uuid }
        anio: { type: integer }
        estado: { type: string, enum: [ABIERTO, CERRADO] }
        periodos:
          type: array
          maxItems: 12
          items: { $ref: '#/components/schemas/PeriodoConCierre' }
    PeriodoConCierre:
      type: object
      additionalProperties: false
      required: [periodoId, mes, estado, fechaInicio, fechaFin]
      properties:
        periodoId: { type: string, format: uuid }
        mes: { type: integer, minimum: 1, maximum: 12 }
        estado: { type: string, enum: [ABIERTO, CERRADO] }
        fechaInicio: { type: string, format: date }
        fechaFin: { type: string, format: date }
        cerradoEn: { type: [string, 'null'], format: date-time }
        totalDebe:
          description: Sellado en el cierre; null mientras el periodo este abierto.
          oneOf: [ { $ref: '#/components/schemas/Monto' }, { type: 'null' } ]
        totalHaber:
          description: Sellado en el cierre; null mientras el periodo este abierto.
          oneOf: [ { $ref: '#/components/schemas/Monto' }, { type: 'null' } ]
    PaginaDeEjercicios:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EjercicioFiscal' }
        proximoAntesDeAnio: { type: [integer, 'null'] }
    PaginaDePartidas:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/PartidaEnLista' } }
        proximoAntesDe: { type: [string, 'null'], format: date }
        proximoAntesDeId: { type: [string, 'null'], format: uuid }
    PartidaEnLista:
      type: object
      additionalProperties: false
      required: [partidaId, presupuestoId, presupuestoNombre, estado, centroCostoId, centroCostoNombre, cuentaContableId, periodoContableId, anio, mes, fechaInicioPeriodo, montoPresupuestado, montoEjecutado]
      properties:
        partidaId: { type: string, format: uuid }
        presupuestoId: { type: string, format: uuid }
        presupuestoNombre: { type: string }
        estado: { type: string, enum: [BORRADOR, APROBADO, CERRADO] }
        centroCostoId: { type: string, format: uuid }
        centroCostoNombre: { type: string }
        cuentaContableId: { type: string, format: uuid }
        periodoContableId: { type: string, format: uuid }
        anio: { type: integer }
        mes: { type: integer, minimum: 1, maximum: 12 }
        fechaInicioPeriodo: { type: string, format: date }
        montoPresupuestado: { $ref: '#/components/schemas/Dinero' }
        montoEjecutado: { $ref: '#/components/schemas/Dinero' }
    PaginaDeOrdenes:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OrdenEnLista' } }
        proximoAntesDe: { type: [string, 'null'], format: date-time }
        proximoAntesDeId: { type: [string, 'null'], format: uuid }
    OrdenEnLista:
      type: object
      additionalProperties: false
      required: [ordenCompraId, numero, terceroComercialId, terceroRazonSocial, estado, monto, creadaEn]
      properties:
        ordenCompraId: { type: string, format: uuid }
        numero: { type: string }
        terceroComercialId: { type: string, format: uuid }
        terceroRazonSocial: { type: string }
        centroCostoId: { type: [string, 'null'], format: uuid }
        centroCostoNombre: { type: [string, 'null'] }
        estado: { type: string, enum: [BORRADOR, APROBADA, RECIBIDA_PARCIAL, RECIBIDA_TOTAL, CANCELADA] }
        monto: { $ref: '#/components/schemas/Dinero' }
        creadaEn: { type: string, format: date-time }
    PaginaDeFacturas:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FacturaEnLista' } }
        proximoAntesDe: { type: [string, 'null'], format: date }
        proximoAntesDeId: { type: [string, 'null'], format: uuid }
    FacturaEnLista:
      type: object
      additionalProperties: false
      required: [facturaProveedorId, numeroFactura, terceroComercialId, terceroRazonSocial, fechaEmision, fechaVencimiento, estado, monto, montoPagado, saldoPendiente, aprobadaPorLaSesion]
      properties:
        facturaProveedorId: { type: string, format: uuid }
        numeroFactura: { type: string }
        terceroComercialId: { type: string, format: uuid }
        terceroRazonSocial: { type: string }
        ordenCompraId: { type: [string, 'null'], format: uuid }
        fechaEmision: { type: string, format: date }
        fechaVencimiento: { type: string, format: date }
        estado: { type: string, enum: [REGISTRADA, APROBADA, PAGADA_PARCIAL, PAGADA, ANULADA] }
        monto: { $ref: '#/components/schemas/Dinero' }
        montoPagado: { $ref: '#/components/schemas/Dinero' }
        saldoPendiente: { $ref: '#/components/schemas/Dinero' }
        aprobadaPorLaSesion:
          type: boolean
          description: Cierto si el sujeto del token aprobo esta factura (no puede pagarla, R-CTB-05).
        asientoContableId: { type: [string, 'null'], format: uuid }
    PaginaDeCuentasPorCobrar:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CuentaPorCobrarEnLista' } }
        proximoAntesDe: { type: [string, 'null'], format: date }
        proximoAntesDeId: { type: [string, 'null'], format: uuid }
    CuentaPorCobrarEnLista:
      type: object
      additionalProperties: false
      required: [cuentaPorCobrarId, origenTipo, origenId, fechaVencimiento, estado, monto, cobrado, saldoPendiente]
      properties:
        cuentaPorCobrarId: { type: string, format: uuid }
        origenTipo: { type: string, enum: [FACTURA_PUBLICIDAD, OTRO, VENTA_SERVICIO] }
        origenId: { type: string, format: uuid }
        terceroComercialId: { type: [string, 'null'], format: uuid }
        terceroRazonSocial: { type: [string, 'null'] }
        fechaVencimiento: { type: string, format: date }
        estado: { type: string, enum: [PENDIENTE, COBRADA_PARCIAL, COBRADA, INCOBRABLE] }
        monto: { $ref: '#/components/schemas/Dinero' }
        cobrado: { $ref: '#/components/schemas/Dinero' }
        saldoPendiente: { $ref: '#/components/schemas/Dinero' }
    PaginaDeActivos:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActivoEnLista' } }
        proximoAntesDe: { type: [string, 'null'], format: date }
        proximoAntesDeId: { type: [string, 'null'], format: uuid }
    ActivoEnLista:
      type: object
      additionalProperties: false
      required: [activoFijoId, codigo, descripcion, categoriaNombre, vidaUtilMeses, fechaAdquisicion, estado, costoAdquisicion, valorResidual, depreciacionAcumulada, valorEnLibros, depreciadoEnElPeriodoVigente]
      properties:
        activoFijoId: { type: string, format: uuid }
        codigo: { type: string }
        descripcion: { type: string }
        categoriaNombre: { type: string }
        vidaUtilMeses: { type: integer, minimum: 1 }
        fechaAdquisicion: { type: string, format: date }
        estado: { type: string, enum: [ACTIVO, DADO_DE_BAJA, VENDIDO] }
        costoAdquisicion: { $ref: '#/components/schemas/Dinero' }
        valorResidual: { $ref: '#/components/schemas/Dinero' }
        depreciacionAcumulada: { $ref: '#/components/schemas/Dinero' }
        valorEnLibros: { $ref: '#/components/schemas/Dinero' }
        depreciadoEnElPeriodoVigente:
          type: boolean
          description: Ya tiene depreciacion_activo en el periodo que contiene hoy (America/La_Paz).
    EjercicioFiscal:
      type: object
      additionalProperties: false
      required: [ejercicioId, anio, estado, fechaInicio, fechaFin, periodos]
      properties:
        ejercicioId: { type: string, format: uuid }
        anio:        { type: integer }
        estado:      { type: string, enum: [ABIERTO, CERRADO] }
        fechaInicio: { type: string, format: date }
        fechaFin:    { type: string, format: date }
        periodos:
          type: array
          items: { $ref: '#/components/schemas/PeriodoContable' }
    PeriodoContable:
      type: object
      additionalProperties: false
      required: [periodoId, ejercicioId, anio, mes, estado, fechaInicio, fechaFin]
      properties:
        periodoId:   { type: string, format: uuid }
        ejercicioId: { type: string, format: uuid }
        anio:        { type: integer }
        mes:         { type: integer, minimum: 1, maximum: 12 }
        estado:      { type: string, enum: [ABIERTO, CERRADO] }
        fechaInicio: { type: string, format: date }
        fechaFin:    { type: string, format: date }
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Monto:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Importe como CADENA decimal. Un number JSON es un doble.
    EntradaEjercicio:
      type: object
      additionalProperties: false
      required: [anio]
      properties:
        anio: { type: integer, minimum: 2000, maximum: 2999 }
    SalidaEjercicio:
      type: object
      additionalProperties: false
      required: [ejercicioId, anio, periodos]
      properties:
        ejercicioId: { type: string, format: uuid }
        anio: { type: integer }
        periodos: { type: integer, description: Siempre doce, uno por mes }
    EntradaCierre:
      type: object
      additionalProperties: false
      required: [glosa]
      properties:
        glosa: { type: string, maxLength: 300 }
    SalidaCierre:
      type: object
      additionalProperties: false
      required: [cierreId, periodoId, totalDebe, totalHaber, cerradoEn]
      properties:
        cierreId: { type: string, format: uuid }
        periodoId: { type: string, format: uuid }
        totalDebe: { $ref: '#/components/schemas/Monto' }
        totalHaber: { $ref: '#/components/schemas/Monto' }
        cerradoEn: { type: string, format: date-time }
        ejercicioCerrado:
          type: boolean
          description: Cierto si era el ultimo mes del ejercicio
    EntradaPresupuesto:
      type: object
      additionalProperties: false
      required: [centroCostoId, ejercicioFiscalId, nombre, moneda, partidas]
      properties:
        centroCostoId: { type: string, format: uuid }
        ejercicioFiscalId: { type: string, format: uuid }
        nombre: { type: string, maxLength: 100 }
        moneda: { type: string, enum: [BOB, USD] }
        partidas:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [cuentaContableId, periodoContableId, montoPresupuestado]
            properties:
              cuentaContableId: { type: string, format: uuid }
              periodoContableId: { type: string, format: uuid }
              montoPresupuestado: { $ref: '#/components/schemas/Monto' }
    SalidaPresupuesto:
      type: object
      additionalProperties: false
      required: [presupuestoId, estado, total]
      properties:
        presupuestoId: { type: string, format: uuid }
        estado: { type: string, enum: [BORRADOR, APROBADO, CERRADO] }
        total: { $ref: '#/components/schemas/Monto' }
    EntradaTercero:
      type: object
      additionalProperties: false
      required: [tipo, razonSocial, numeroDocumento]
      properties:
        tipo: { type: string, enum: [PROVEEDOR, CLIENTE, AMBOS] }
        razonSocial: { type: string, maxLength: 150 }
        numeroDocumento: { type: string, maxLength: 30 }
        email: { type: string, format: email }
        cuentaContableId: { type: string, format: uuid }
    SalidaTercero:
      type: object
      additionalProperties: false
      required: [terceroComercialId]
      properties:
        terceroComercialId: { type: string, format: uuid }
    EntradaOrden:
      type: object
      additionalProperties: false
      required: [terceroComercialId, numero, descripcion, monto, moneda]
      properties:
        terceroComercialId: { type: string, format: uuid }
        centroCostoId: { type: string, format: uuid }
        numero: { type: string, maxLength: 30 }
        descripcion: { type: string, maxLength: 300 }
        monto: { $ref: '#/components/schemas/Monto' }
        moneda: { type: string, enum: [BOB, USD] }
    SalidaOrden:
      type: object
      additionalProperties: false
      required: [ordenCompraId, estado, monto]
      properties:
        ordenCompraId: { type: string, format: uuid }
        estado: { type: string, enum: [BORRADOR, APROBADA, RECIBIDA, CANCELADA] }
        monto: { $ref: '#/components/schemas/Monto' }
    EntradaFactura:
      type: object
      additionalProperties: false
      required: [terceroComercialId, numeroFactura, fechaEmision, fechaVencimiento, monto, moneda]
      properties:
        terceroComercialId: { type: string, format: uuid }
        ordenCompraId: { type: string, format: uuid }
        centroCostoId: { type: string, format: uuid }
        numeroFactura: { type: string, maxLength: 30 }
        fechaEmision: { type: string, format: date }
        fechaVencimiento: { type: string, format: date }
        monto: { $ref: '#/components/schemas/Monto' }
        moneda: { type: string, enum: [BOB, USD] }
        cuentaGastoId: { type: string, format: uuid }
        aprobar:
          type: boolean
          default: false
          description: >-
            Si quien registra tambien aprueba la factura, en el alta (la tabla es
            append-only: no hay aprobacion posterior). El aprobador es siempre el sujeto
            autenticado (token): el cuerpo NO lleva `aprobadaPor` y, si lo trae, se
            rechaza con 400. Quien aprueba no puede autorizar su pago (R-CTB-05).
    SalidaFactura:
      type: object
      additionalProperties: false
      required: [facturaProveedorId, estado, monto, montoPagado, saldoPendiente]
      properties:
        facturaProveedorId: { type: string, format: uuid }
        estado:
          type: string
          enum: [REGISTRADA, APROBADA, PAGADA_PARCIAL, PAGADA, ANULADA]
        monto: { $ref: '#/components/schemas/Monto' }
        montoPagado: { $ref: '#/components/schemas/Monto' }
        saldoPendiente: { $ref: '#/components/schemas/Monto' }
        asientoContableId:
          type: [string, 'null']
          format: uuid
          description: >-
            Lo escribe nucleo-financiero (invariante 12). Viaja nulo hasta que
            responde el evento.
    EntradaPago:
      type: object
      additionalProperties: false
      required: [monto, moneda, formaPago]
      properties:
        monto: { $ref: '#/components/schemas/Monto' }
        moneda: { type: string, enum: [BOB, USD] }
        formaPago:
          type: string
          description: >-
            Las tres formas que admite `pago_a_proveedor` (ck_pago_a_proveedor_forma_pago,
            docs/entidades/13_contabilidad_erp.puml). QR no esta: no hay decision que lo
            admita, y el cobro por QR es de `cuenta_por_cobrar`, no del pago a proveedor.
          enum: [TRANSFERENCIA, CHEQUE, EFECTIVO]
    EntradaCuentaPorCobrar:
      type: object
      additionalProperties: false
      required: [origenTipo, origenId, terceroComercialId, monto, moneda, fechaVencimiento]
      properties:
        origenTipo: { type: string }
        origenId: { type: string, format: uuid }
        terceroComercialId: { type: string, format: uuid }
        monto: { $ref: '#/components/schemas/Monto' }
        moneda: { type: string, enum: [BOB, USD] }
        fechaVencimiento: { type: string, format: date }
    SalidaCuentaPorCobrar:
      type: object
      additionalProperties: false
      required: [cuentaPorCobrarId]
      properties:
        cuentaPorCobrarId: { type: string, format: uuid }
    EntradaCobro:
      type: object
      additionalProperties: false
      required: [monto, formaCobro]
      properties:
        monto: { $ref: '#/components/schemas/Monto' }
        formaCobro:
          type: string
          enum: [TRANSFERENCIA, QR, TARJETA, EFECTIVO]
    SalidaCobro:
      type: object
      additionalProperties: false
      required: [cobroId, cuentaPorCobrarId, estado, cobrado, saldoPendiente]
      properties:
        cobroId: { type: string, format: uuid }
        cuentaPorCobrarId: { type: string, format: uuid }
        estado:
          type: string
          enum: [PENDIENTE, COBRADA_PARCIAL, COBRADA, INCOBRABLE]
          description: Derivado de la suma de cobros; la columna es append-only
        cobrado: { $ref: '#/components/schemas/Monto' }
        saldoPendiente: { $ref: '#/components/schemas/Monto' }
    EntradaDepreciacion:
      type: object
      additionalProperties: false
      required: [periodoContableId]
      properties:
        periodoContableId: { type: string, format: uuid }
    SalidaDepreciacion:
      type: object
      additionalProperties: false
      required: [activoFijoId, depreciacionId, monto, valorEnLibros, totalmenteDepreciado]
      properties:
        activoFijoId: { type: string, format: uuid }
        depreciacionId: { type: string, format: uuid }
        monto: { $ref: '#/components/schemas/Monto' }
        valorEnLibros: { $ref: '#/components/schemas/Monto' }
        totalmenteDepreciado: { type: boolean }
    SalidaCorrida:
      type: object
      additionalProperties: false
      required: [periodoId, depreciaciones, totalDepreciado, yaCorridos, totalmenteDepreciados]
      properties:
        periodoId: { type: string, format: uuid }
        depreciaciones:
          type: array
          items: { $ref: '#/components/schemas/SalidaDepreciacion' }
        totalDepreciado: { $ref: '#/components/schemas/Monto' }
        yaCorridos: { type: integer }
        totalmenteDepreciados: { type: integer }
    EntradaEstadoFinanciero:
      type: object
      additionalProperties: false
      required: [tipo]
      properties:
        tipo: { type: string, enum: [BALANCE_GENERAL, ESTADO_RESULTADOS] }
    SalidaEstadoFinanciero:
      type: object
      additionalProperties: false
      required: [estadoFinancieroId, tipo, cuadra, hashContenido, generadoEn]
      properties:
        estadoFinancieroId: { type: string, format: uuid }
        tipo: { type: string, enum: [BALANCE_GENERAL, ESTADO_RESULTADOS] }
        cuadra: { type: boolean }
        hashContenido: { type: string }
        generadoEn: { type: string, format: date-time }
    SalidaPlantilla:
      type: object
      additionalProperties: false
      required: [plantillaId, lineas, debes, haberes]
      properties:
        plantillaId: { type: string, format: uuid }
        lineas: { type: integer }
        debes: { type: integer }
        haberes: { type: integer }
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
