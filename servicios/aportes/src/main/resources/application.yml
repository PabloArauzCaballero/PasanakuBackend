# aportes — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
spring:
  application:
    name: aportes
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_aportes
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 20     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}

aportaya:
  resiliencia:
    # Circuit breaker de los clientes hacia otros servicios (regla 98.2.3). Valores SINTETICOS del plan de
    # resiliencia (evidencia/carril-S2/DEUDA-circuit-breaker-clientes-http.md): no salen de medir trafico real.
    circuito:
      ventana: 10                   # llamadas que se miran, y minimo para juzgar
      umbral-de-fallos: 50          # % de fallos (red, timeout, 5xx, cuerpo ilegible) que lo abre
      espera-abierto: PT30S         # cuanto se deja de llamar antes de probar
      llamadas-de-prueba: 3         # llamadas de prueba en semiabierto
  servicios:
    # A quien se le pregunta (invariante 11: por su contrato, nunca por su base).
    grupos: ${URL_GRUPOS:http://grupos:8080}
  esquema: aportes
  outbox:
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
  zona-horaria: America/La_Paz      # plazos habiles
  reembolso:
    # Lo que el titular tiene para disputar un cargo. Es politica comercial, no un
    # numero del codigo (invariante 10).
    plazo-de-disputa: P7D
  proveedores:
    # Por debajo de esta salud observada, el enrutador deja de mandarle cobros a un
    # proveedor. Mas alto castiga a un proveedor que tuvo un mal minuto; mas bajo
    # sigue mandandole cobros a uno que ya no responde.
    umbral-de-salud: 70

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso
