# Contrato de nucleo-financiero — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /billetera /custodia /puntos-atencion /contabilidad
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
#
# BORRADOR DE LA FASE 0 (planes/01 §0.8). El carril dueno lo amplia; NO puede
# romperlo sin avisar, y la prueba de contrato falla en el CI del que rompe.
#
# CU-24 · Registrar el asiento contable de una operacion — NO tiene endpoint (lo
# dispara otro caso de uso, en su misma transaccion). Sus codigos de error viven
# igual en este contrato, porque scripts/verificar_criterios.py los busca aca sin
# importar si hay una ruta HTTP que los use:
#   AP-CU24-01  ASIENTO_DESCUADRADO  · debe y haber no coinciden (R-AUD-05)
#   AP-CU24-02  CUENTA_INEXISTENTE   · el codigo de cuenta no esta en el plan
#   AP-CU24-03  PERIODO_CERRADO      · pendiente: periodo_contable es de M13 (ERP),
#                                      que todavia no existe en este carril
#   AP-CU24-04  MONEDA_INCOHERENTE   · el asiento mezcla monedas, o la partida no es de la
#                                      moneda de su cuenta (R-AUD-12, R-CTB-10)
#   AP-CU24-05  REVERSA_NO_COINCIDE  · las partidas del evento de reversa no son el inverso del original
#   AP-CU24-06  ORIGEN_PENDIENTE     · el asiento que el evento reversa todavia no llego: se reintenta
#   AP-CU24-07  EVENTO_ILEGIBLE      · el asiento propuesto por el evento no se puede leer
#
# CU-11 · el despacho al proveedor y la confirmacion del pago NO tienen ruta HTTP (los
# corre el flujo de retiros y la reconciliacion). Sus codigos viven aca por la misma razon:
#   AP-CU11-08  ORDEN_NO_INSTRUIBLE  · la orden no esta AUTORIZADA (falta la segunda aprobacion
#                                      o otra instruccion la adelanto)
#   AP-CU11-09  PAGO_NO_CONFIRMABLE  · la orden no esta EN_PROCESO, o el proveedor respondio
#                                      algo que no coincide con la orden
openapi: 3.1.0
info:
  title: nucleo-financiero
  version: 1.0.0
  description: >-
    Servicio nucleo-financiero. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /billetera/cuentas/propia:
    get:
      operationId: consultarCuentaPropia
      summary: La billetera operativa de quien pregunta, en una moneda
      description: >-
        [CONTRATO · carril G] Las operaciones con plata piden `cuentaBilleteraId`, y nadie lo sabia: el alta
        responde 202 sin cuenta y ningun otro contrato la entrega. Quien pregunta es SIEMPRE el titular de
        la sesion (el servidor toma el usuario del token; no hay parametro para preguntar por otra persona).
        Lo usa `entregas` para retener el saldo de quien compra un turno, con el token de esa persona.
        422 `AP-CU13-01` si la persona no tiene una billetera activa en esa moneda (o tiene mas de una: no
        se elige por ella).
      parameters:
        - name: moneda
          in: query
          required: true
          schema: { type: string, pattern: '^(BOB|USD)$' }
      responses:
        '200':
          description: La cuenta de la sesion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CuentaDeLaSesion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/{cuentaId}/saldo:
    get:
      operationId: consultarSaldo
      summary: Saldo de una cuenta de billetera
      description: >-
        El saldo NO se guarda: se deriva del libro. Esta operacion existe en el
        borrador porque los trece servicios necesitan saber que la forma del saldo
        es Dinero, no un number.
      parameters:
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Saldo disponible y retenido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaldoBilletera' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/{cuentaId}/movimientos:
    get:
      operationId: listarMovimientosBilletera
      summary: Listar movimientos recientes de una billetera
      description: >-
        Lectura del libro append-only, ordenada del movimiento más reciente al más antiguo.
        `limite` vale 5 por omisión para el resumen de inicio y admite hasta 100 para la
        pantalla de movimientos. Nunca emite ni sella un extracto (CU-15).
      parameters:
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 5 }
      responses:
        '200':
          description: Movimientos recientes y saldos posteriores del libro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaMovimientosBilletera' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU13-01 CUENTA_INEXISTENTE · AP-CU13-02 LIMITE_INVALIDO

  /billetera/cotizaciones:
    post:
      operationId: cotizarOperacion            # CU-30 (consume tarifas)
      summary: Ver el precio de una recarga o un retiro antes de confirmarlo
      description: >-
        [CONTRATO] Que la persona vea el numero final ANTES de aceptar: base, comision, impuesto,
        costo total, neto y hasta cuando vale ese precio. No mueve nada ni compromete a nadie. La
        `Idempotency-Key` que se manda aca es la MISMA que despues lleva la recarga o el retiro, y
        `cotizacionId` es lo que esa operacion cita para confirmar. Pedir otro importe con la misma
        clave produce otra cotizacion: no se puede cobrar el precio de un importe sobre otro.

        El precio lo fija `tarifas`; este servicio no lo calcula. Una operacion sin concepto en el
        tarifario es gratuita (`gratuita=true`, sin `cotizacionId`).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCotizacionOperacion' }
      responses:
        '200':
          description: La cotizacion y su desglose
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCotizacionOperacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU10-05 / AP-CU11-01 no se pudo cotizar (tarifas no respondio)
          # AP-CU10-08 / AP-CU11-12 el costo no puede igualar ni superar el importe
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/recargas:
    post:
      operationId: solicitarRecarga           # CU-10
      summary: Abre una orden de recarga y devuelve cuanto se va a acreditar
      description: >-
        [CONTRATO] Derivada de la implementacion del carril 2A, que llego antes que
        su contrato.

        La orden NO acredita: reserva la intencion y vence. Acreditar es el paso
        siguiente y ocurre cuando el proveedor confirma, porque acreditar contra una
        promesa es acreditar plata que puede no llegar.

        `acreditara` viaja en la respuesta ya calculado: el cliente **no** resta el
        costo del proveedor por su cuenta. Un cliente que recalcula produce un numero
        que no es el del libro contable.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRecarga' }
      responses:
        '201':
          description: Orden abierta, con su vencimiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRecarga' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU10-01 LIMITE_EXCEDIDO           · AP-CU10-02 SALDO_MAXIMO_ALCANZADO
          # AP-CU10-03 INSTRUMENTO_NO_VERIFICADO · AP-CU10-04 CUENTA_NO_OPERATIVA
          # AP-CU10-05 ORDEN_EXPIRADA
          # AP-CU10-06 COTIZACION_REQUERIDA · AP-CU10-07 COTIZACION_VENCIDA
          # AP-CU10-08 COTIZACION_NO_COINCIDE
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/recargas/{ordenId}/acreditacion:
    post:
      operationId: acreditarRecarga           # CU-10
      summary: Acredita una orden que el proveedor confirmo
      description: >-
        [CONTRATO] La confirmacion del proveedor. Es idempotente por la orden: si dos
        confirmaciones llegan juntas, una acredita y la otra encuentra la orden ya
        acreditada — la red duplica, y eso no puede duplicar el saldo.
      parameters:
        - name: ordenId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Acreditada, con el saldo resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAcreditacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU10-05 ORDEN_EXPIRADA
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/recargas/{ordenId}/pago-de-prueba:
    post:
      operationId: pagarRecargaDePrueba       # CU-10 · solo ambientes de prueba
      summary: Da por pagado el QR de prueba de una orden propia y la acredita
      description: >-
        [CONTRATO] Existe SOLO donde el proveedor de recargas es el doble de prueba
        (perfil local/test con `aportaya.recarga.qr.modo=prueba`). En cualquier otro
        ambiente responde 404, igual que una ruta inexistente.

        No es un segundo camino para mover saldo: el doble pasa a decir CONFIRMADO para
        esa orden y la acreditacion es la misma de `acreditarRecarga` (mismo asiento,
        idempotente por orden). Solo el titular, y solo si el QR guardado de la orden es
        de origen PRUEBA. Repetirlo devuelve la misma transaccion.
      parameters:
        - name: ordenId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Acreditada, con el saldo resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAcreditacion' }
        '404':
          description: El ambiente no tiene proveedor de prueba
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU10-05 la orden no tiene QR de prueba, ya vencio o no es del titular
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/retenciones:
    post:
      operationId: retenerSaldo               # CU-13
      summary: Aparta saldo sin sacarlo de la cuenta
      description: >-
        [CONTRATO] Retener no es debitar: el dinero sigue siendo del titular y por eso
        se ve como retenido y no desaparece. Lo que cambia es que deja de estar
        disponible mientras dure el motivo.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRetencion' }
      responses:
        '201':
          description: Retenido, con el saldo disponible y el retenido despues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRetencion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU13-01 SALDO_INSUFICIENTE · AP-CU13-02 VENCIMIENTO_REQUERIDO
          # AP-CU13-03 RETENCION_YA_EJECUTADA
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/retenciones/{retencionId}/cierre:
    post:
      operationId: cerrarRetencion            # CU-13
      summary: Libera o ejecuta una retencion
      description: >-
        [CONTRATO] Una retencion se cierra una sola vez. Si otra operacion la cerro
        primero, la segunda no la vuelve a cerrar: se responde
        `RETENCION_YA_EJECUTADA`, que no es una falla sino concurrencia sana.
      parameters:
        - name: retencionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCierreRetencion' }
      responses:
        '200':
          description: Cerrada, con el saldo resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCierreRetencion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU13-03 RETENCION_YA_EJECUTADA
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/retenciones/{retencionId}/pago-a-tercero:
    post:
      operationId: pagarAlTercero              # CU-13
      summary: Ejecuta una retencion de compra del mercado a favor del vendedor
      description: >-
        [CONTRATO · SOLO SERVICIO] Lo pide `entregas` (identidad de servicio `SERVICIO_ENTREGAS`; una
        sesion de usuario final recibe 403 aunque tenga `BILLETERA_OPERAR`). NO lleva cuerpo: el
        beneficiario y el reparto NO los dicta quien llama. Se derivan en el servidor: la retencion
        `COMPRA_EN_MERCADO` nombra la oferta (`referencia_id`); se le pregunta a `entregas` quien es el
        vendedor, cual es el precio y cuales son los cargos (si no responde o no informa los cargos, no se paga).
        Reparto (decision adoptada por delegacion del dueno, 2026-10-11): el comprador paga el precio, que tiene que ser
        exactamente lo retenido (`AP-CU13-06` si no); el vendedor recibe `precio - cargos` y la plataforma los `cargos`,
        cada uno con su linea en la transaccion (regla 91.3.4); los cargos van entre 0 y el precio (`AP-CU13-06` si no).
        Una retencion se ejecuta una sola vez: la repetida con
        la misma `Idempotency-Key` devuelve el mismo resultado sin otro asiento; pagada o liberada se
        rechaza (R-BIL-24).
      parameters:
        - name: retencionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Pagada (o la misma respuesta si se repite), con el saldo del comprador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEjecucionDeRetencion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU13-03 RETENCION_YA_EJECUTADA · AP-CU13-04 CLAVE_DE_OTRA_OPERACION
          # AP-CU13-05 MOTIVO_INCOMPATIBLE · AP-CU13-06 MONTO_DISTINTO_DE_LO_RETENIDO
          # AP-CU13-07 CUENTA_DE_SISTEMA_NO_CONFIGURADA · AP-CU13-08 DESTINATARIO_INVALIDO
          # AP-CU13-09 SOLO_SERVICIO
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/inversiones/debitos:
    post:
      operationId: debitarInversion            # CU-13
      summary: Convierte la retencion de una inversion en el debito definitivo
      description: >-
        [CONTRATO · SOLO SERVICIO] Lo pide `inversiones` (DR-INV-05) con identidad de servicio
        `SERVICIO_INVERSIONES`; una sesion de usuario final recibe 403. La retencion `INVERSION_VOLUNTARIA` pasa a
        `EJECUTADA` y el importe sale del disponible Y del retenido hacia la custodia de inversion,
        en una sola transaccion que cuadra. El importe tiene que ser el retenido. Idempotente por
        `Idempotency-Key` y por orden: una orden se debita una sola vez (R-BIL-24). Saldo insuficiente
        no aplica aca —la plata ya estaba retenida—; ese rechazo ocurre al retener (AP-CU13-01).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDebitoInversion' }
      responses:
        '200':
          description: Debitada (o la misma respuesta si se repite), con el saldo resultante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEjecucionDeRetencion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU13-03 · AP-CU13-04 · AP-CU13-05 · AP-CU13-06 · AP-CU13-07 · AP-CU13-09 SOLO_SERVICIO
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/inversiones/acreditaciones:
    post:
      operationId: acreditarRescate            # CU-12
      summary: Acredita al titular un rescate de inversion desde la custodia
      description: >-
        [CONTRATO · SOLO SERVICIO] Lo pide `inversiones` (DR-INV-05). Acreditar es confirmar que la plata volvio,
        y eso no lo hace quien la espera (91.3): exige la identidad de servicio `SERVICIO_INVERSIONES`, no la del titular. Mueve el importe
        de la custodia de inversion a la billetera del titular en una transaccion que cuadra; la custodia
        no puede quedar en negativo. Idempotente por `Idempotency-Key` y por rescate (R-BIL-24).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAcreditacionRescate' }
      responses:
        '200':
          description: Acreditado (o la misma respuesta si se repite), con el saldo del titular
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAcreditacionRescate' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU12-01 la custodia no cubre · AP-CU12-02 destino inexistente o de otra moneda
          # AP-CU12-03 destino no operativo · AP-CU12-06 CLAVE_DE_OTRA_OPERACION
          # AP-CU12-07 CUSTODIA_NO_CONFIGURADA · AP-CU12-08 SOLO_SERVICIO
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/NoAutenticado'

  # CU-40 Evaluar limites NO tiene endpoint propio: corre DENTRO de la transaccion
  # de la operacion que evalua. Exponerlo dejaria que alguien consulte el limite,
  # vea que entra, y opere despues contra un acumulado ya cambiado.
  #   AP-CU40-01 SIN_LIMITE_CONFIGURADO · AP-CU40-02 LIMITE_EXCEDIDO
  #   AP-CU40-03 CANTIDAD_EXCEDIDA
  #
  # CU-57 Operar un punto de atencion quedo OBSOLETO con su numero reservado:
  # ADR-039 retiro el efectivo del alcance el 20-08-2026.

  /billetera/retiros:
    get:
      operationId: listarRetirosEnRevision     # CU-11 (ADR-049, backoffice carril A · H2)
      summary: Bandeja de retiros que esperan la segunda aprobacion, del mas antiguo al mas nuevo
      description: >-
        Solo quien puede decidir ve la cola: exige RETIRO_APROBAR, el mismo permiso que
        aprobarRetiro. Paginada por cursor (solicitadaEn, id) — el desempate por id hace
        estable el orden aunque dos ordenes compartan el instante. Cada fila trae lo
        necesario para decidir y nada mas: ni la cuenta de destino ni el nombre de la
        persona viajan aca (respuesta minima); se ven en la ficha de la orden.
        La fila de quien consulta aparece con puedeDecidir=false: la segregacion
        (R-SEG-04) la vuelve a exigir aprobarRetiro, esto solo evita ofrecer un boton muerto.
      parameters:
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: despuesDeFecha, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: despuesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina de la bandeja (vacia si no hay nada en revision)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaRetirosEnRevision' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU11-14 CURSOR_INCOMPLETO · despuesDeFecha y despuesDeId van juntos o ninguno
        '403':
          description: Sin el permiso RETIRO_APROBAR
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      operationId: solicitarRetiro             # CU-11
      summary: Solicitar un retiro hacia una cuenta de destino
      description: >-
        Retencion primero, pago despues, nunca al reves. Si se instruyera el pago
        antes de retener, entre las dos cosas la persona podria gastar el mismo
        saldo en otra operacion y el retiro saldria contra un disponible que ya no
        existe. El proveedor se instruye FUERA de la transaccion (invariante 6).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRetiro' }
      responses:
        '201':
          description: Orden creada y saldo ya retenido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRetiro' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU11-01 SALDO_INSUFICIENTE          · AP-CU11-02 MFA_REQUERIDO
          # AP-CU11-03 INSTRUMENTO_EN_ENFRIAMIENTO · AP-CU11-04 TITULAR_NO_COINCIDE
          # AP-CU11-05 BLOQUEO_DE_AUTORIDAD        · AP-CU11-06 ENCAJE_INCUMPLIDO
          # AP-CU11-07 MFA_INVALIDO (H2: evidencia provista pero no valida)
          # AP-CU11-13 la Idempotency-Key ya identifica otro retiro (otro importe, destino o cotizacion)
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/retiros/{ordenId}/aprobacion:
    post:
      operationId: aprobarRetiro                # CU-11 (H3.S2, ADR-049)
      summary: Aprueba o rechaza un retiro que necesita doble aprobacion
      description: >-
        Solo alguien con RETIRO_APROBAR, DISTINTO de quien solicito el retiro
        (R-SEG-04): la segregacion la exige la aplicacion Y la base
        (ck_retiro_doble_aprobacion), dos capas independientes. Dos aprobadores
        simultaneos producen una sola transicion: el segundo recibe 409, nunca
        un doble efecto.
      parameters:
        - name: ordenId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAprobacionRetiro' }
      responses:
        '200':
          description: Orden autorizada o rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAprobacionRetiro' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU11-10 RETIRO_AUTOAPROBACION_PROHIBIDA
          # AP-CU11-11 RETIRO_YA_RESUELTO · la orden ya no esta EN_REVISION (hoy sale 422, no el 409 de abajo:
          #            la convencion errores-api reserva 409 para lo que rechaza la base — ambiguedad A-5)
          # AP-CU11-13 la Idempotency-Key ya identifica otra decision u otra orden
          # Misma Idempotency-Key + misma decision: 200 con el recibo original, sin otra transicion.
        '404':
          description: Esa orden no existe
        '409':
          description: >-
            La orden ya no esta en revision — otro aprobador la resolvio primero, o
            no requiere doble aprobacion.
        '403':
          description: Sin el permiso RETIRO_APROBAR
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/transferencias:
    post:
      operationId: transferirSaldo             # CU-12
      summary: Transferir saldo entre billeteras
      description: >-
        La unica operacion donde el dinero no entra ni sale del sistema: cambia de
        bolsillo, y el saldo total permanece constante. Las dos cuentas se bloquean
        en orden de identificador — dos transferencias cruzadas que bloqueen cada
        una primero la suya se esperan para siempre.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaTransferencia' }
      responses:
        '201':
          description: Transferencia ejecutada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaTransferencia' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU12-01 SALDO_INSUFICIENTE          · AP-CU12-02 DESTINO_INEXISTENTE
          # AP-CU12-03 CUENTA_DESTINO_NO_OPERATIVA · AP-CU12-04 LIMITE_EXCEDIDO
          # AP-CU12-05 P2P_NO_HABILITADO
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/reversos:
    post:
      operationId: reversarTransaccion         # CU-14
      summary: Reversar una transaccion aplicada
      description: >-
        Reversar es escribir el espejo, no borrar el original. El libro es
        append-only y la transaccion original conserva sus movimientos sin un solo
        cambio: el extracto tiene que poder contar la historia completa —el cobro y
        su devolucion—, no un cobro que se desvanecio.
        Cuatro ojos: quien autoriza no puede ser quien solicita.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaReverso' }
      responses:
        '201':
          description: Reverso ejecutado, o restitucion generada si el saldo no alcanza
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaReverso' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU14-01 TRANSACCION_NO_REVERSABLE · AP-CU14-02 FALTA_AUTORIZACION
          # AP-CU14-03 SALDO_INSUFICIENTE_PARA_REVERSO
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/{cuentaId}/extracto:
    get:
      operationId: emitirExtracto              # CU-15
      summary: Emitir el extracto de un periodo
      description: >-
        Si el extracto no cuadra con el cierre diario, NO se emite: uno con una
        cifra que no coincide es peor que no tenerlo — la persona lo usa para un
        tramite, se lo rechazan, y descubre el error cuando ya le costo algo. El
        descuadre queda registrado igual, que es lo que pide el criterio.
      parameters:
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: hasta
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Extracto emitido, o bloqueado con su motivo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaExtracto' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU15-01 PERIODO_SIN_CIERRES · AP-CU15-02 EXTRACTO_NO_CUADRA
          # AP-CU15-03 SIN_PERMISO_SOBRE_LA_CUENTA
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/cierres:
    post:
      operationId: solicitarCierreBilletera    # CU-16
      summary: Solicitar el cierre de la billetera
      description: >-
        Cerrar NO borra: la cuenta queda CERRADA y sus movimientos siguen
        disponibles todo el plazo de conservacion. Cuatro puertas la frenan, y las
        cuatro protegen a terceros antes que a la empresa — un cierre que deje un
        aporte sin pagar traslada la perdida a los otros del pasanaku.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCierre' }
      responses:
        '201':
          description: Solicitud registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCierreBilletera' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU16-01 OBLIGACIONES_ABIERTAS · AP-CU16-02 GRUPO_ACTIVO
          # AP-CU16-03 RETENCION_VIGENTE     · AP-CU16-04 BLOQUEO_DE_AUTORIDAD
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/bloqueos:
    post:
      operationId: bloquearPorAutoridad        # CU-17
      summary: Registrar un bloqueo por orden de autoridad
      description: >-
        El unico caso en que una retencion no tiene fecha de fin: la levanta la
        misma autoridad que la puso, y ponerle vencimiento propio seria decidir por
        un juez cuando se acaba su orden. El documento de respaldo es obligatorio —
        inmovilizar la plata de alguien sin poder mostrar el papel es indefendible.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaBloqueo' }
      responses:
        '201':
          description: Bloqueo vigente y saldo inmovilizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaBloqueo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU17-01 OFICIO_DUPLICADO · AP-CU17-02 CUENTA_INEXISTENTE
          # AP-CU17-03 SIN_DOCUMENTO_DE_RESPALDO
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/qr:
    post:
      tags: [qr]
      operationId: emitirQr                    # CU-12 · QR interno
      summary: Emitir un QR interno para cobrar
      description: >-
        [CONTRATO] Un QR INTERNO es un cobro que una billetera de Pasanaku publica; se paga
        entre billeteras de Pasanaku. El DINAMICO fija importe y vencimiento y se consume al
        pagarse. El ESTATICO no fija importe, no vence y se puede pagar muchas veces.

        El `contenido` solo lleva un identificador y una firma: alterarlo lo invalida, nunca
        cambia a quien se paga ni cuanto. NO es un QR bancario ni interoperable: ese no se
        procesa (AP-CU12-10).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaQr' }
      responses:
        '201':
          description: QR emitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaQrEmitido' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU12-02 solo el titular · AP-CU12-03 CUENTA_NO_OPERATIVA · AP-CU12-07 QR_NO_VALIDO
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/qr/lecturas:
    post:
      tags: [qr]
      operationId: leerQr                      # CU-12 · QR interno
      summary: Ver a quien y cuanto se va a pagar con un QR, sin pagar
      description: >-
        [CONTRATO] El contenido viaja en el cuerpo, nunca en la URL. Responde para un QR
        interno vigente; un QR vencido, usado o alterado se rechaza con su motivo, y uno de otro
        sistema de pagos se rechaza como NO aceptado (AP-CU12-10): no se afirma interoperabilidad
        sin un proveedor habilitado ni se lo procesa como si fuera interno.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaLecturaQr' }
      responses:
        '200':
          description: El cobro que el QR representa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaQrLeido' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU12-07 QR_NO_VALIDO · AP-CU12-08 QR_VENCIDO · AP-CU12-09 QR_YA_USADO
          # AP-CU12-10 QR_INTEROPERABLE_NO_HABILITADO
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /billetera/qr/pagos:
    post:
      tags: [qr]
      operationId: pagarQr                     # CU-12 · QR interno
      summary: Pagar un QR interno confirmando destinatario e importe
      description: >-
        [CONTRATO] Es una transferencia comun entre billeteras (CU-12), atada al QR en la misma
        transaccion. Un QR dinamico se paga por SU importe, que quien paga tiene que confirmar;
        y una sola vez: el segundo pago, de quien sea, se rechaza. Repetir la misma
        `Idempotency-Key` devuelve el mismo comprobante sin mover plata de nuevo.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaPagoQr' }
      responses:
        '201':
          description: Pagado, con su comprobante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPagoQr' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU12-01 SALDO_INSUFICIENTE · AP-CU12-02 destino o titular · AP-CU12-07..10 del QR
          # AP-CU12-11 IMPORTE_NO_CONFIRMADO
        '401':
          $ref: '#/components/responses/NoAutenticado'

  # CU-50 Conciliar la custodia: el diseno la corria como trabajo de medianoche, pero ese
  # trabajo no existe; Tesoreria la dispara desde el backoffice (carril A · H8). Con el
  # encaje roto no SALE dinero, pero SI entra — dejar entrar plata mejora el encaje.
  #   AP-CU50-01 SIN_CIERRES_DIARIOS · AP-CU50-02 SIN_EXTRACTO_BANCARIO
  #   AP-CU50-03 CONCILIACION_DUPLICADA (otra conciliacion de esa cuenta y dia, con otros saldos)
  #   AP-CU50-04 FILTRO_DE_LISTADO_INVALIDO · AP-CU50-05 MONEDA_DISTINTA_DE_LA_CUSTODIA
  #   AP-CU50-06 CUSTODIA_INEXISTENTE
  /custodia/conciliaciones:
    get:
      operationId: listarConciliaciones             # CU-50 (backoffice carril A · H8)
      summary: Conciliaciones de custodia, de la mas reciente a la mas antigua
      description: >-
        Cifras enfrentadas por corte: saldo emitido, custodia, transito, diferencia y ratio, con los descuadres abiertos de cada una. Cursor (fecha, id) descendente. Exige AUDITORIA_LEER.
      parameters:
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeConciliaciones' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU50-04 FILTRO_DE_LISTADO_INVALIDO
        '403':
          description: Sin AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      operationId: conciliarCustodia            # CU-50 (backoffice carril A · H8)
      summary: Tesoreria concilia la custodia de un dia contra el dinero electronico emitido
      description: >-
        El saldo emitido lo CALCULA el servidor (suma de saldo_total de las billeteras USUARIO,
        GRUPO y FONDO_GARANTIA en la moneda de la custodia, CU-50 paso 1): el cliente no lo
        manda. Tesoreria informa el saldo segun el extracto bancario y el transito. Exige el
        rol TESORERIA (mismo patron que acreditarRecarga). Reintentar con los mismos saldos
        devuelve la misma conciliacion; otros saldos para el mismo dia es AP-CU50-03.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaConciliacionCustodia' }
      responses:
        '201':
          description: Conciliacion registrada (o la misma, si es un reintento identico)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaConciliacionCustodia' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU50-01 · AP-CU50-03 · AP-CU50-05 · AP-CU50-06
        '403':
          description: Sin el rol TESORERIA
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /contabilidad/cierres-diarios:
    get:
      operationId: listarCierresDiarios             # CU-51 (backoffice carril A · H8)
      summary: Cierres diarios, del mas reciente al mas antiguo
      description: >-
        Recaudado, conciliado, excepciones y si el dia cerro cuadrado. Los importes son cadena SIN moneda: cierre_diario no la modela (ambiguedad A-7). Cursor (fecha, id) descendente. Exige AUDITORIA_LEER.
      parameters:
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeCierresDiarios' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU51-05 FILTRO_DE_LISTADO_INVALIDO
        '403':
          description: Sin AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      operationId: ejecutarCierreDiario              # CU-51 (backoffice carril A · H8)
      summary: Cerrar un dia operativo con el recaudo que informa aportes
      description: >-
        Contabilidad pide la fecha; las cifras NO las manda el cliente: el recaudo, lo conciliado y las
        excepciones los informa aportes (GET /aportes/recaudo-diario, con el token de quien cierra, fuera de la
        transaccion) y si la custodia cuadro sale de las conciliaciones del dia (CU-50; sin conciliacion no
        cuadra). Idempotente por fecha: el dia ya cerrado devuelve el cierre que hay (200). Exige el rol
        CONTABILIDAD.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCierreDiario' }
      responses:
        '201':
          description: Dia cerrado (cuadrado o con observaciones)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCierreDiario' }
        '200':
          description: El dia ya estaba cerrado; se devuelve ese cierre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCierreDiario' }
        '422':
          # AP-CU51-03 · AP-CU51-06 · AP-CU51-07 · AP-CU51-08
          $ref: '#/components/responses/ReglaDeNegocio'
        '403':
          description: Sin el rol CONTABILIDAD
        '401':
          $ref: '#/components/responses/NoAutenticado'
  /contabilidad/reversos:
    get:
      operationId: listarReversos             # CU-14 (backoffice carril A · H8)
      summary: Reversos de transacciones, del mas reciente al mas antiguo
      description: >-
        Para Tesoreria y Auditoria: tipo, estado, quien autorizo y monto (cadena SIN moneda: reverso_transaccion no la modela, A-7). Sin estados devuelve todos. Cursor (solicitadaEn, id) descendente. Exige AUDITORIA_LEER.
      parameters:
        - name: estados
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [SOLICITADO, AUTORIZADO, EJECUTADO, RECHAZADO] }
            minItems: 1
            maxItems: 4
          style: form
          explode: false
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeReversos' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU14-04 FILTRO_DE_LISTADO_INVALIDO
        '403':
          description: Sin AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'


  # CU-51 Ejecutar el cierre diario tampoco tiene endpoint: lo dispara el trabajo de
  # medianoche. Sus codigos viven aca —y no en openapi/aportes.yaml, como dice la
  # cabecera del caso de uso— porque `cierre_diario`, `asiento_contable` y
  # `saldo_diario_billetera` son tablas de este esquema, y ponerlo en aportes obligaria
  # a escribir un esquema ajeno (invariante 11). La divergencia esta declarada en
  # planes/informes/carril-3A.md.
  #   AP-CU51-01 EXCEPCIONES_ABIERTAS   · el dia no cierra con excepciones vivas
  #   AP-CU51-02 CUSTODIA_DESCUADRADA   · el encaje no da; cerrar seria firmarlo igual
  #   AP-CU51-03 ASIENTOS_SIN_CONFIRMAR · queda un asiento en BORRADOR con esa fecha
  #   AP-CU51-05 FILTRO_DE_LISTADO_INVALIDO · cursor a medias en el listado de cierres
  #   AP-CU51-06 DIA_NO_TERMINADO       · se pide cerrar hoy o un dia futuro (zona America/La_Paz)
  #   AP-CU51-07 MONEDAS_MEZCLADAS      · el recaudo del dia trae mas de una moneda; cierre_diario no la modela
  #   AP-CU51-08 RECAUDO_NO_DISPONIBLE  · aportes no informo el recaudo: no se cierra a ciegas
  #   AP-CU51-04 DIA_YA_CERRADO         · reintento sobre un dia ya cerrado

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    SalidaExtracto:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, desde, hasta, saldoFinal, emitido]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        desde: { type: string, format: date }
        hasta: { type: string, format: date }
        saldoFinal: { $ref: '#/components/schemas/Dinero' }
        cantidadMovimientos: { type: integer }
        hashArchivo: { type: string, minLength: 64, maxLength: 64, nullable: true }
        emitido: { type: boolean }
        motivoDelBloqueo: { type: string, nullable: true }
    EntradaCierre:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, motivo, destinoSaldo]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        motivo: { type: string, maxLength: 200 }
        destinoSaldo: { type: string, enum: [RETIRO, TRANSFERENCIA] }
    SalidaCierreBilletera:
      type: object
      additionalProperties: false
      required: [solicitudId, estado, saldoAlSolicitar]
      properties:
        solicitudId: { type: string, format: uuid }
        estado: { type: string, enum: [SOLICITADA, EN_VALIDACION, APROBADA, EJECUTADA, RECHAZADA] }
        saldoAlSolicitar: { $ref: '#/components/schemas/Dinero' }
    EntradaBloqueo:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, autoridad, tipoOrden, numeroOficio, alcance, documentoUrl, hashDocumento]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        autoridad: { type: string, enum: [ASFI, BCB, FISCALIA, JUZGADO, UIF, INTERNO] }
        tipoOrden: { type: string, enum: [CONGELAMIENTO, EMBARGO, INFORMATIVO, INMOVILIZACION, RETENCION] }
        numeroOficio: { type: string, maxLength: 60 }
        montoBloqueado: { $ref: '#/components/schemas/Dinero' }
        alcance: { type: string, enum: [PARCIAL, TOTAL] }
        documentoUrl: { type: string, format: uri }
        hashDocumento: { type: string, minLength: 64, maxLength: 64 }
    SalidaBloqueo:
      type: object
      additionalProperties: false
      required: [bloqueoId, retencionId, montoBloqueado, saldoDisponible]
      properties:
        bloqueoId: { type: string, format: uuid }
        retencionId: { type: string, format: uuid }
        montoBloqueado: { $ref: '#/components/schemas/Dinero' }
        saldoDisponible: { $ref: '#/components/schemas/Dinero' }
    EntradaReverso:
      type: object
      additionalProperties: false
      required: [transaccionOriginalId, tipo, motivo, autorizadaPor]
      properties:
        transaccionOriginalId: { type: string, format: uuid }
        tipo:   { type: string, enum: [ANULACION, CONTRACARGO, ERROR_OPERATIVO, ORDEN_AUTORIDAD] }
        motivo: { type: string, minLength: 20, maxLength: 300 }
        autorizadaPor: { type: string, format: uuid }
    SalidaReverso:
      type: object
      additionalProperties: false
      required: [reversoId, generaObligacionDeRestitucion]
      properties:
        reversoId:            { type: string, format: uuid }
        transaccionReversoId: { type: string, format: uuid, nullable: true }
        generaObligacionDeRestitucion: { type: boolean }
    EntradaTransferencia:
      type: object
      additionalProperties: false
      required: [cuentaOrigenId, destino, monto, concepto]
      properties:
        cuentaOrigenId: { type: string, format: uuid }
        destino:
          type: object
          additionalProperties: false
          required: [tipo, valor]
          properties:
            tipo:  { type: string, enum: [ALIAS, GRUPO] }
            valor: { type: string }
        monto:        { $ref: '#/components/schemas/Dinero' }
        concepto:     { type: string, maxLength: 140 }
        obligacionId: { type: string, format: uuid }
    SalidaTransferencia:
      type: object
      additionalProperties: false
      required: [transaccionId, saldoDespues, obligacionSaldada]
      properties:
        transaccionId: { type: string, format: uuid }
        saldoDespues:  { $ref: '#/components/schemas/Dinero' }
        destinatarioId: { type: string, format: uuid }
        obligacionSaldada: { type: boolean }
    EntradaRetiro:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, monto, instrumentoDestinoId]
      properties:
        cuentaBilleteraId:    { type: string, format: uuid }
        monto:                { $ref: '#/components/schemas/Dinero' }
        instrumentoDestinoId: { type: string, format: uuid }
        # H2.S2.M5: evidenciaMfa reemplaza a factorMfa (JWT de evidencia step-up de
        # `identidad`, no un OTP corto). factorMfa se acepta hasta 2026-12-31 por
        # compatibilidad — ninguno de los dos es "required" a nivel de esquema
        # porque el rechazo por ausencia (MFA_REQUERIDO) lo decide el caso de uso,
        # no el contrato: es el mismo AP-CU11-02 tanto si falta el campo como si
        # llega vacio.
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096 }
        factorMfa:    { type: string, minLength: 6, maxLength: 8, deprecated: true }
        cotizacionId:
          type: string
          format: uuid
          description: >-
            La cotizacion que la persona vio y acepto (POST /billetera/cotizaciones, con la MISMA
            Idempotency-Key). Obligatoria mientras `aportaya.cotizacion.exigir-previa` este activa.
    EntradaCotizacionOperacion:
      type: object
      additionalProperties: false
      required: [operacion, cuentaBilleteraId, monto]
      properties:
        operacion: { type: string, enum: [RECARGA, RETIRO] }
        cuentaBilleteraId: { type: string, format: uuid }
        monto: { $ref: '#/components/schemas/Dinero' }
    SalidaCotizacionOperacion:
      type: object
      additionalProperties: false
      required: [base, comision, impuesto, costoTotal, neto, gratuita]
      properties:
        cotizacionId:
          type: string
          format: uuid
          description: la version del precio que se acepta; ausente cuando la operacion es gratuita
        base: { $ref: '#/components/schemas/Dinero' }
        comision: { $ref: '#/components/schemas/Dinero' }
        impuesto: { $ref: '#/components/schemas/Dinero' }
        costoTotal: { $ref: '#/components/schemas/Dinero' }
        neto:
          $ref: '#/components/schemas/Dinero'
        validaHasta: { type: string, format: date-time }
        gratuita: { type: boolean }
    SalidaRetiro:
      type: object
      additionalProperties: false
      required: [ordenRetiroId, estado, costoRetiro, montoNeto, retencionId]
      properties:
        ordenRetiroId: { type: string, format: uuid }
        estado:        { type: string, enum: [PENDIENTE, EN_REVISION, AUTORIZADA, PAGADA, RECHAZADA] }
        costoRetiro:   { $ref: '#/components/schemas/Dinero' }
        montoNeto:     { $ref: '#/components/schemas/Dinero' }
        retencionId:   { type: string, format: uuid }
    EntradaAprobacionRetiro:
      type: object
      additionalProperties: false
      required: [desenlace]
      properties:
        desenlace:
          type: string
          enum: [AUTORIZADA, RECHAZADA]
          description: >-
            AUTORIZADA mueve la orden hacia el proveedor; RECHAZADA libera la
            retencion sin pagar. Son los dos unicos finales de una revision.
        motivo: { type: string, maxLength: 500 }
    SalidaAprobacionRetiro:
      type: object
      additionalProperties: false
      required: [ordenRetiroId, estado, aprobadaPor]
      properties:
        ordenRetiroId: { type: string, format: uuid }
        estado:        { type: string, enum: [AUTORIZADA, RECHAZADA] }
        aprobadaPor:   { type: string, format: uuid }
    PaginaDeConciliaciones:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ConciliacionEnLista' } }
        proximoAntesDe: { type: [string, 'null'], format: date }
        proximoAntesDeId: { type: [string, 'null'], format: uuid }
    ConciliacionEnLista:
      type: object
      additionalProperties: false
      required: [conciliacionId, cuentaCustodiaId, fecha, saldoEmitido, saldoCustodia, saldoEnTransito, diferencia, ratioCobertura, cumpleEncaje, estado, ejecutadaEn, descuadresAbiertos]
      properties:
        conciliacionId: { type: string, format: uuid }
        cuentaCustodiaId: { type: string, format: uuid }
        fecha: { type: string, format: date }
        saldoEmitido: { $ref: '#/components/schemas/Dinero' }
        saldoCustodia: { $ref: '#/components/schemas/Dinero' }
        saldoEnTransito: { $ref: '#/components/schemas/Dinero' }
        diferencia: { $ref: '#/components/schemas/Dinero' }
        ratioCobertura: { type: string, pattern: '^\d+\.\d{6}$' }
        cumpleEncaje: { type: boolean }
        estado: { type: string, enum: [CUADRADA, DESCUADRADA, EN_ANALISIS] }
        ejecutadaPor: { type: [string, 'null'], format: uuid }
        ejecutadaEn: { type: string, format: date-time }
        descuadresAbiertos: { type: integer, minimum: 0 }
    EntradaConciliacionCustodia:
      type: object
      additionalProperties: false
      required: [cuentaCustodiaId, fecha, saldoCustodia, saldoEnTransito]
      properties:
        cuentaCustodiaId: { type: string, format: uuid }
        fecha: { type: string, format: date }
        saldoCustodia:
          description: El saldo segun el extracto bancario de ese dia.
          allOf: [ { $ref: '#/components/schemas/Dinero' } ]
        saldoEnTransito:
          description: Movimientos ordenados y aun no impactados en el banco.
          allOf: [ { $ref: '#/components/schemas/Dinero' } ]
    SalidaConciliacionCustodia:
      type: object
      additionalProperties: false
      required: [conciliacionId, saldoEmitido, ratioCobertura, cumpleEncaje, diferencia, estado]
      properties:
        conciliacionId: { type: string, format: uuid }
        saldoEmitido: { $ref: '#/components/schemas/Dinero' }
        ratioCobertura: { type: string }
        cumpleEncaje: { type: boolean }
        diferencia: { $ref: '#/components/schemas/Dinero' }
        estado: { type: string, enum: [CUADRADA, DESCUADRADA] }
    EntradaCierreDiario:
      type: object
      additionalProperties: false
      required: [fecha]
      properties:
        fecha: { type: string, format: date }
    SalidaCierreDiario:
      type: object
      additionalProperties: false
      required: [cierreId, fecha, cuadrado, excepcionesAbiertas, yaExistia]
      properties:
        cierreId: { type: string, format: uuid }
        fecha: { type: string, format: date }
        cuadrado: { type: boolean }
        excepcionesAbiertas: { type: integer, minimum: 0 }
        yaExistia: { type: boolean }
        motivoDelDescuadre: { type: string }
    PaginaDeCierresDiarios:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CierreDiarioEnLista' } }
        proximoAntesDe: { type: [string, 'null'], format: date }
        proximoAntesDeId: { type: [string, 'null'], format: uuid }
    CierreDiarioEnLista:
      type: object
      additionalProperties: false
      required: [cierreId, fecha, totalRecaudado, totalConciliado, totalExcepciones, cantidadPagos, cuadrado, cerradoPor, cerradoEn]
      properties:
        cierreId: { type: string, format: uuid }
        fecha: { type: string, format: date }
        totalRecaudado: { type: string, pattern: '^-?\d+\.\d{2}$', description: Sin moneda (A-7). }
        totalConciliado: { type: string, pattern: '^-?\d+\.\d{2}$' }
        totalExcepciones: { type: string, pattern: '^-?\d+\.\d{2}$' }
        cantidadPagos: { type: integer }
        cuadrado: { type: boolean }
        cerradoPor: { type: string, format: uuid }
        cerradoEn: { type: string, format: date-time }
        reabiertoEn: { type: [string, 'null'], format: date-time }
    PaginaDeReversos:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReversoEnLista' } }
        proximoAntesDe: { type: [string, 'null'], format: date-time }
        proximoAntesDeId: { type: [string, 'null'], format: uuid }
    ReversoEnLista:
      type: object
      additionalProperties: false
      required: [reversoId, transaccionOriginalId, autorizadaPor, tipo, motivo, montoReversado, estado, solicitadaEn]
      properties:
        reversoId: { type: string, format: uuid }
        transaccionOriginalId: { type: string, format: uuid }
        transaccionReversoId: { type: [string, 'null'], format: uuid }
        autorizadaPor: { type: string, format: uuid }
        tipo: { type: string, enum: [ANULACION, CONTRACARGO, ERROR_OPERATIVO, ORDEN_AUTORIDAD] }
        motivo: { type: string }
        montoReversado: { type: string, pattern: '^-?\d+\.\d{2}$', description: Sin moneda (A-7). }
        estado: { type: string, enum: [SOLICITADO, AUTORIZADO, EJECUTADO, RECHAZADO] }
        solicitadaEn: { type: string, format: date-time }
        ejecutadaEn: { type: [string, 'null'], format: date-time }
    PaginaRetirosEnRevision:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RetiroEnRevision' }
        proximoFecha: { type: [string, 'null'], format: date-time }
        proximoId:    { type: [string, 'null'], format: uuid }
    RetiroEnRevision:
      type: object
      additionalProperties: false
      required: [ordenRetiroId, cuentaBilleteraId, solicitadaPor, solicitado, costo, neto, mfaVerificado, solicitadaEn, puedeDecidir]
      properties:
        ordenRetiroId:     { type: string, format: uuid }
        cuentaBilleteraId: { type: string, format: uuid }
        solicitadaPor:     { type: string, format: uuid }
        solicitado:        { $ref: '#/components/schemas/Dinero' }
        costo:             { $ref: '#/components/schemas/Dinero' }
        neto:              { $ref: '#/components/schemas/Dinero' }
        mfaVerificado:     { type: boolean }
        solicitadaEn:      { type: string, format: date-time }
        ventanaEnfriamientoHasta: { type: [string, 'null'], format: date-time }
        puedeDecidir:
          type: boolean
          description: false cuando quien consulta es quien solicito (R-SEG-04)
    EntradaRecarga:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, monto, medio]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        monto: { $ref: '#/components/schemas/Dinero' }
        costoProveedor: { $ref: '#/components/schemas/Dinero' }
        medio: { type: string, maxLength: 30 }
        instrumentoFondeoId: { type: string, format: uuid }
        cotizacionId:
          type: string
          format: uuid
          description: >-
            La cotizacion que la persona vio y acepto (POST /billetera/cotizaciones, con la MISMA
            Idempotency-Key). Obligatoria mientras `aportaya.cotizacion.exigir-previa` este activa.
    SalidaRecarga:
      type: object
      additionalProperties: false
      required: [ordenRecargaId, estado, expiraEn, acreditara]
      properties:
        ordenRecargaId: { type: string, format: uuid }
        estado: { type: string, maxLength: 20 }
        expiraEn: { type: string, format: date-time }
        acreditara:
          $ref: '#/components/schemas/Dinero'
        cobroQr:
          $ref: '#/components/schemas/CobroQrRecarga'
    CobroQrRecarga:
      type: object
      additionalProperties: false
      description: >-
        El QR dinamico que paga ESTA orden, tal como lo emitio el proveedor. Ausente si el
        proveedor no emite QR. `origen` PRUEBA es un QR de ambiente de prueba que ningun
        banco puede pagar: la app lo muestra con un sello y ofrece «Simular pago».
      required: [contenido, origen]
      properties:
        contenido: { type: string, minLength: 1, maxLength: 512 }
        origen:    { type: string, enum: [PRUEBA, BANCO] }
    SalidaAcreditacion:
      type: object
      additionalProperties: false
      required: [ordenRecargaId, transaccionId, saldoDespues]
      properties:
        ordenRecargaId: { type: string, format: uuid }
        transaccionId:  { type: string, format: uuid }
        saldoDespues:   { $ref: '#/components/schemas/Dinero' }

    EntradaRetencion:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, monto, motivo]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        monto:  { $ref: '#/components/schemas/Dinero' }
        motivo: { type: string, maxLength: 40 }
        transaccionOrigenId: { type: string, format: uuid }
        referenciaTipo: { type: string, maxLength: 30 }
        referenciaId:   { type: string, format: uuid }
        expiraEn:       { type: string, format: date-time }
    SalidaRetencion:
      type: object
      additionalProperties: false
      required: [retencionId, saldoDisponible, saldoRetenido]
      properties:
        retencionId:     { type: string, format: uuid }
        saldoDisponible: { $ref: '#/components/schemas/Dinero' }
        saldoRetenido:   { $ref: '#/components/schemas/Dinero' }
        expiraEn:        { type: string, format: date-time }
    EntradaCierreRetencion:
      type: object
      additionalProperties: false
      required: [desenlace]
      properties:
        desenlace:
          type: string
          enum: [LIBERADA, EJECUTADA]
          description: >-
            Liberar devuelve el saldo a disponible; ejecutar lo convierte en un
            movimiento del libro. Son dos finales distintos y el llamador dice cual.
    SalidaCierreRetencion:
      type: object
      additionalProperties: false
      required: [retencionId, estado, saldoDisponible, saldoRetenido]
      properties:
        retencionId:     { type: string, format: uuid }
        estado:          { type: string, maxLength: 20 }
        saldoDisponible: { $ref: '#/components/schemas/Dinero' }
        saldoRetenido:   { $ref: '#/components/schemas/Dinero' }
    EntradaDebitoInversion:
      type: object
      additionalProperties: false
      required: [retencionId, monto]
      properties:
        retencionId: { type: string, format: uuid }
        monto:       { $ref: '#/components/schemas/Dinero' }
        # titularId: opcional. Si el servicio llamador ya valido a la persona y la informa, el libro
        # verifica que sea la dueña de la billetera retenida; si difiere, no se mueve nada.
        titularId:   { type: string, format: uuid }
    SalidaEjecucionDeRetencion:
      type: object
      additionalProperties: false
      required: [transaccionId, saldoDisponible, saldoRetenido]
      properties:
        transaccionId:   { type: string, format: uuid }
        saldoDisponible: { $ref: '#/components/schemas/Dinero' }
        saldoRetenido:   { $ref: '#/components/schemas/Dinero' }
    EntradaAcreditacionRescate:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, monto, referenciaId]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        monto:             { $ref: '#/components/schemas/Dinero' }
        referenciaId:      { type: string, format: uuid }
    SalidaAcreditacionRescate:
      type: object
      additionalProperties: false
      required: [transaccionId, saldoDespues]
      properties:
        transaccionId: { type: string, format: uuid }
        saldoDespues:  { $ref: '#/components/schemas/Dinero' }
    EntradaQr:
      type: object
      additionalProperties: false
      required: [cuentaBilleteraId, modalidad]
      properties:
        cuentaBilleteraId: { type: string, format: uuid }
        modalidad: { type: string, enum: [DINAMICO, ESTATICO] }
        monto: { $ref: '#/components/schemas/Dinero' }
        concepto: { type: string, maxLength: 140 }
    SalidaQrEmitido:
      type: object
      additionalProperties: false
      required: [qrId, contenido, modalidad]
      properties:
        qrId: { type: string, format: uuid }
        contenido: { type: string, maxLength: 80 }
        modalidad: { type: string, enum: [DINAMICO, ESTATICO] }
        monto: { $ref: '#/components/schemas/Dinero' }
        expiraEn: { type: string, format: date-time }
    EntradaLecturaQr:
      type: object
      additionalProperties: false
      required: [contenido]
      properties:
        contenido: { type: string, maxLength: 2048 }
    SalidaQrLeido:
      type: object
      additionalProperties: false
      required: [qrId, clase, modalidad, destinatario]
      properties:
        qrId: { type: string, format: uuid }
        clase: { type: string, enum: [INTERNO], description: 'solo se responde por QR internos; los demas se rechazan' }
        modalidad: { type: string, enum: [DINAMICO, ESTATICO] }
        monto: { $ref: '#/components/schemas/Dinero' }
        destinatario: { type: string, maxLength: 20, description: 'numero de cuenta enmascarado' }
        concepto: { type: string, maxLength: 140 }
        expiraEn: { type: string, format: date-time }
    EntradaPagoQr:
      type: object
      additionalProperties: false
      required: [contenido, cuentaOrigenId]
      properties:
        contenido: { type: string, maxLength: 2048 }
        cuentaOrigenId: { type: string, format: uuid }
        monto:
          $ref: '#/components/schemas/Dinero'
    SalidaPagoQr:
      type: object
      additionalProperties: false
      required: [transaccionId, qrId, monto, destinatario, saldoDespues]
      properties:
        transaccionId: { type: string, format: uuid }
        qrId: { type: string, format: uuid }
        monto: { $ref: '#/components/schemas/Dinero' }
        destinatario: { type: string, maxLength: 20 }
        concepto: { type: string, maxLength: 140 }
        saldoDespues: { $ref: '#/components/schemas/Dinero' }
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
    CuentaDeLaSesion:
      type: object
      additionalProperties: false
      required: [cuentaId, moneda, estado]
      properties:
        cuentaId: { type: string, format: uuid }
        moneda:   { type: string, enum: [BOB, USD] }
        estado:   { type: string, maxLength: 20 }
    SaldoBilletera:
      type: object
      additionalProperties: false
      required: [cuentaId, disponible, retenido, alCorteDe]
      properties:
        cuentaId:   { type: string, format: uuid }
        disponible: { $ref: '#/components/schemas/Dinero' }
        retenido:   { $ref: '#/components/schemas/Dinero' }
        alCorteDe:  { type: string, format: date-time }
        titularId:
          type: string
          format: uuid
          description: >-
            La persona dueña de la cuenta; ausente si es de un grupo o del sistema. Lo pide
            `inversiones` para compararla con la sesion y no confiar en el id que mando el cliente.
        # comprometidoEnPozos: la parte del disponible afectada a aportes y pozos (deuda vigente
        # mas lo por aportar, segun aportes). AUSENTE cuando aportes no informa: el consumidor falla cerrado.
        comprometidoEnPozos: { $ref: '#/components/schemas/Dinero' }
    ListaMovimientosBilletera:
      type: object
      additionalProperties: false
      required: [cuentaId, movimientos]
      properties:
        cuentaId: { type: string, format: uuid }
        movimientos:
          type: array
          items: { $ref: '#/components/schemas/MovimientoBilletera' }
    MovimientoBilletera:
      type: object
      additionalProperties: false
      required: [id, sentido, monto, saldoDisponiblePosterior, saldoRetenidoPosterior, glosa, registradoEn]
      properties:
        id: { type: string, format: uuid }
        sentido: { type: string, enum: [DEBITO, CREDITO] }
        monto: { $ref: '#/components/schemas/Dinero' }
        saldoDisponiblePosterior: { $ref: '#/components/schemas/Dinero' }
        saldoRetenidoPosterior: { $ref: '#/components/schemas/Dinero' }
        glosa: { type: string, maxLength: 160 }
        registradoEn: { type: string, format: date-time }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesion valida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
