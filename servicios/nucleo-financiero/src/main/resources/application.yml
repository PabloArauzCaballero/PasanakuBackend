# nucleo-financiero — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
spring:
  application:
    name: nucleo-financiero
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_nucleo_financiero
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 20     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}
    consumer:
      # Un grupo nuevo lee desde el principio: perderse los primeros eventos es perder asientos.
      auto-offset-reset: earliest
  jackson:
    deserialization:
      # El contrato declara additionalProperties: false. Un campo que no esta en el contrato (por
      # ejemplo un costo propuesto por el cliente) se rechaza con 400 en vez de ignorarse en silencio.
      fail-on-unknown-properties: true

aportaya:
  # H2.S1: aportaya.mfa.doble-local vive SOLO en application-{local,test}.yml —
  # declararla aca (comun a todo perfil) la haria "tener efecto" en produccion si
  # alguien la copia sin pensar. Fuera de local/test no hay SegundoFactorLocal que
  # la lea (@Profile), asi que ni siquiera hace falta declararla ausente.
  esquema: nucleo_financiero
  outbox:
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
  zona-horaria: America/La_Paz      # plazos habiles
  recarga:
    # Lo que vive una orden de recarga antes de expirar. Corta a proposito: una orden
    # vieja acreditada tarde es plata que entra contra un precio que ya cambio.
    vigencia-de-la-orden: PT30M
  servicios:
    # A quien se le pregunta. Un servicio no lee la base de otro (invariante 11):
    # pregunta por su contrato, y fuera de la transaccion (invariante 6).
    tarifas: ${URL_TARIFAS:http://tarifas:8080}
    aportes: ${URL_APORTES:http://aportes:8080}
    grupos: ${URL_GRUPOS:http://grupos:8080}
    entregas: ${URL_ENTREGAS:http://entregas:8080}
  tarifas:
    codigo-tarifario: GENERAL
  retiro:
    # Por encima de este monto, un retiro necesita dos firmas. Es politica de riesgo:
    # el numero se mueve sin desplegar.
    doble-aprobacion-desde: 5000.00
  qr:
    # Clave con que se firman los QR internos (>= 32 bytes). Es un secreto del entorno: sin ella
    # el proceso NO levanta, y no hay valor por omision que alguien pueda adivinar.
    clave: ${QR_INTERNO_CLAVE}
    vigencia-del-dinamico: PT15M    # lo que vive un QR dinamico antes de vencer
  custodia:
    # La cuenta espejo de la custodia. Es un identificador del entorno, no del codigo:
    # en cada despliegue es otra fila, y equivocarla mueve dinero al lugar equivocado.
    cuenta-puente: ${CUENTA_PUENTE_CUSTODIA}

  billetera:
    apertura:
      # Carril Q: quien abre las billeteras. identidad.usuario_registrado -> la de la persona (BOB, SIMPLIFICADA);
      # grupos.grupo_creado -> la del grupo (BOB, titular el GRUPO, R-GRP-04). ENCENDIDOS: sin ellos nadie tiene billetera.
      usuarios:
        habilitado: ${APERTURA_USUARIOS_HABILITADO:true}
      grupos:
        habilitado: ${APERTURA_GRUPOS_HABILITADO:true}
      # ACTIVA (por omision) o EN_APERTURA. Supuesto delegado por el dueno, a confirmar con Cumplimiento: quien impide
      # operar a una persona sin verificar es identidad (no inicia sesion hasta que su KYC se aprueba). EN_APERTURA deja la
      # cuenta cerrada a toda operacion hasta que exista una senal de activacion, que hoy NO existe.
      estado-inicial-usuario: ${APERTURA_ESTADO_INICIAL_USUARIO:ACTIVA}

  contabilidad:
    consumo-de-asientos:
      # D5: registrar en el mayor los asientos que garantia propone en sus eventos. Se enciende por entorno;
      # sin mapeo de cuentas logicas cada evento se rechaza (no se inventa un plan de cuentas).
      habilitado: ${CONSUMO_DE_ASIENTOS_HABILITADO:false}
    consumo-de-aportes:
      # Carril I: aportes.aporte_cobrado mueve el dinero (debita al participante, acredita al grupo, asienta en el mayor).
      # ENCENDIDO por omision: es el camino normal del aporte, no una funcion opcional (sin el, el aporte queda PAGADO en
      # `aportes` y no se refleja en la billetera ni en el mayor). Independiente de `consumo-de-asientos` (que espera el mapeo A5).
      habilitado: ${CONSUMO_DE_APORTES_HABILITADO:true}
    # Cuenta logica -> codigo del plan, por moneda (ambiguedad A5, decision de contabilidad). Vacio = sin mapeo.
    # El entorno TEST trae un mapeo SINTETICO (arbol 9 de seeders/minimos/22-cuentas-de-sistema.json) con
    # apto-produccion=false: con el perfil `production` y el consumo encendido, el arranque se NIEGA salvo que
    # contabilidad entregue el mapeo real y alguien ponga CUENTAS_LOGICAS_APTO_PRODUCCION=true.
    cuentas-logicas:
      apto-produccion: ${CUENTAS_LOGICAS_APTO_PRODUCCION:false}
      CAJA_EMPRESA:
        BOB: ${CUENTA_LOGICA_CAJA_EMPRESA_BOB:}
        USD: ${CUENTA_LOGICA_CAJA_EMPRESA_USD:}
      RESERVA_RESPALDO:
        BOB: ${CUENTA_LOGICA_RESERVA_RESPALDO_BOB:}
        USD: ${CUENTA_LOGICA_RESERVA_RESPALDO_USD:}
      POZO_GRUPO:
        BOB: ${CUENTA_LOGICA_POZO_GRUPO_BOB:}
        USD: ${CUENTA_LOGICA_POZO_GRUPO_USD:}
      # entregas.desembolso_acreditado: la contrapartida del pozo cuando el proveedor CONFIRMA que salio hacia el beneficiario.
      DESEMBOLSO_CONFIRMADO:
        BOB: ${CUENTA_LOGICA_DESEMBOLSO_BOB:}
        USD: ${CUENTA_LOGICA_DESEMBOLSO_USD:}
      # aportes.aporte_cobrado: el saldo de los usuarios y el de los grupos son pasivo exigible, 2.1.01 y 2.1.02 del plan MINIMO
      # (seeders/minimos/01-plan-de-cuentas.json, no del arbol sintetico 9). El plan solo tiene cuentas en BOB: en USD no hay
      # mapeo y un aporte en dolares se rechaza (AP-CU24-02) en vez de inventar una cuenta. Contabilidad confirma estos codigos.
      SALDO_USUARIOS:
        BOB: ${CUENTA_LOGICA_SALDO_USUARIOS_BOB:2.1.01}
        USD: ${CUENTA_LOGICA_SALDO_USUARIOS_USD:}
      SALDO_GRUPOS:
        BOB: ${CUENTA_LOGICA_SALDO_GRUPOS_BOB:2.1.02}
        USD: ${CUENTA_LOGICA_SALDO_GRUPOS_USD:}

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso

# H4.S2.M4 · resilience4j: el cliente que le pregunta a `tarifas` (docs/operacion/provider-timeout.md).
resilience4j:
  retry:
    instances:
      cotizador:
        max-attempts: 3              # el intento original + 2 reintentos, no mas: un
                                      # retiro esperando la comision no puede colgarse
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      cotizador:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50   # `tarifas` caido a medias no distingue de caido
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
