# Contrato de auditoria — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /auditoria, /reportes, /indicadores
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
openapi: 3.1.0
info:
  title: auditoria
  version: 1.0.0
  description: >-
    Servicio auditoria. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

# Plantilla para los casos de uso que faltan de este servicio:
  # Una operacion por caso de uso. Plantilla:
  #
  #   /auditoria/…:
  #     post:
  #       operationId: <verboObjeto>          # CU-NN
  #       parameters:
  #         - name: Idempotency-Key
  #           in: header
  #           required: true                   # toda operacion con efecto
  #           schema: { type: string, format: uuid }
  #       responses:
  #         '200': …
  #         '422': { $ref: '#/components/responses/ReglaDeNegocio' }

paths:
  /auditoria/derechos:
    post:
      operationId: ejercerDerechos            # CU-07
      summary: Atiende un derecho del titular sobre sus datos personales
      description: >-
        Acceso, rectificacion, oposicion, portabilidad y cancelacion. El plazo legal
        se calcula al abrir y SE GUARDA: recalcularlo al consultar lo haria moverse
        solo, y basta que alguien declare un feriado despues para que el vencimiento
        cambie sin que nadie lo decida.

        La cancelacion NO elige entre el derecho y la obligacion de conservar: reparte.
        Borra lo que ya vencio, seudonimiza lo que la ley obliga a guardar, y devuelve
        la lista de lo que quedo con su base legal. Responder «no se puede borrar
        nada» seria mentirle al titular; borrar todo seria un incumplimiento.

        Por eso el estado puede ser PARCIAL: decir ATENDIDA sobre una solicitud que no
        se cumplio entera es la forma mas rapida de que el reclamo vuelva con la razon
        del otro lado.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDerechos' }
      responses:
        '201':
          description: Solicitud abierta, con su plazo y su desenlace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDerechos' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU07-01 IDENTIDAD_NO_VERIFICADA · AP-CU07-02 RELACION_VIGENTE
          # AP-CU07-03 RETENCION_LEGAL_VIGENTE · AP-CU07-04 REQUERIMIENTO_ABIERTO
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /auditoria/bitacora:
    get:
      operationId: consultarBitacora
      tags: [bitacora]
      summary: Consulta el registro inmutable del sistema (bitacora de auditoria)
      description: >-
        Registro de auditoria inmutable de comun.bitacora_evento paginado por cursor descendente.
        Permite filtrar por entidad, accion, actorUsuarioId, y rango de fechaHora. Exige AUDITORIA_LEER.
      parameters:
        - name: entidad
          in: query
          required: false
          schema: { type: string, maxLength: 50 }
        - name: accion
          in: query
          required: false
          schema: { type: string, maxLength: 30 }
        - name: actorUsuarioId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: desde
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: hasta
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: antesDe
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: antesDeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Pagina de eventos de bitacora
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeBitacora' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Sin permiso AUDITORIA_LEER

  /auditoria/bitacora/{id}:
    get:
      operationId: consultarEventoBitacora
      tags: [bitacora]
      summary: Obtiene el detalle completo de un evento de bitacora por ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Evento de bitacora
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventoBitacora' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Sin permiso AUDITORIA_LEER
        '404':
          description: Evento de bitacora no encontrado

  /auditoria/catalogos:
    get:
      operationId: listarCatalogosOperativos
      tags: [catalogosOperativos]
      summary: Consulta la lista de catálogos operativos del sistema
      description: >-
        Catálogos operativos de AportaYa con su versión vigente, dueño, conteo de elementos y estado.
        Exige AUDITORIA_LEER o CATALOGO_EDITAR.
      responses:
        '200':
          description: Lista de catálogos operativos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CatalogoOperativoResumen' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Sin permiso AUDITORIA_LEER

  /auditoria/catalogos/{codigo}:
    get:
      operationId: consultarCatalogoOperativo
      tags: [catalogosOperativos]
      summary: Obtiene la cabecera y metadatos de un catálogo operativo por su código
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string, maxLength: 50 }
      responses:
        '200':
          description: Detalle del catálogo operativo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoOperativoDetalle' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Sin permiso AUDITORIA_LEER
        '404':
          description: Catálogo operativo desconocido

  /auditoria/catalogos/{codigo}/elementos:
    get:
      operationId: listarElementosCatalogo
      tags: [catalogosOperativos]
      summary: Lista los elementos de un catálogo operativo
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string, maxLength: 50 }
        - name: activo
          in: query
          required: false
          schema: { type: boolean }
        - name: termino
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
      responses:
        '200':
          description: Lista de elementos del catálogo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ElementoCatalogoOperativo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Sin permiso AUDITORIA_LEER
        '404':
          description: Catálogo no encontrado

  /auditoria/catalogos/{codigo}/elementos/{id}:
    patch:
      operationId: actualizarEstadoElementoCatalogo
      tags: [catalogosOperativos]
      summary: Activa o desactiva un elemento del catálogo operativo con registro inmutable en bitácora
      parameters:
        - name: codigo
          in: path
          required: true
          schema: { type: string, maxLength: 50 }
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaActualizarElementoCatalogo' }
      responses:
        '200':
          description: Elemento de catálogo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ElementoCatalogoOperativo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          description: Sin permiso CATALOGO_EDITAR o AUDITORIA_GESTIONAR
        '404':
          description: Elemento no encontrado
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'

  /reportes:
    get:
      operationId: listarDefinicionesDeReporte   # CU-58 (backoffice carril A · A6)
      summary: Catalogo de reportes activos, por nombre
      description: >-
        Lo que el backoffice ofrece para ejecutar: tipo, nombre, descripcion, el permiso que cada uno exige y si
        contiene datos sensibles (pide justificacion). Sin la consulta base. El permiso de cada reporte lo
        verifica la ejecucion, no este listado. Cursor (nombre, id) ascendente. Exige AUDITORIA_LEER.
      parameters:
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: despuesDe, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: despuesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeDefinicionesDeReporte' }
        '422':
          # AP-CU58-07 FILTRO_DE_LISTADO_INVALIDO
          $ref: '#/components/responses/ReglaDeNegocio'
        '403':
          description: Sin AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /reportes/ejecuciones:
    get:
      operationId: listarEjecucionesDeReporte    # CU-58 (backoffice carril A · A6)
      summary: Historial de ejecuciones, de la mas reciente a la mas antigua
      description: >-
        Quien pidio que reporte, cuando, en que estado termino, cuantas filas y con que hash. Sin parametros ni
        mensaje de error (pueden llevar datos de una persona). Cursor (iniciadaEn, id) descendente. Exige
        AUDITORIA_LEER.
      parameters:
        - name: estados
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina (vacia si no hay nada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeEjecucionesDeReporte' }
        '422':
          # AP-CU58-07 FILTRO_DE_LISTADO_INVALIDO
          $ref: '#/components/responses/ReglaDeNegocio'
        '403':
          description: Sin AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /reportes/{definicionId}/ejecuciones:
    post:
      operationId: ejecutarReporte            # CU-58
      summary: Ejecuta un reporte definido, deja huella y opcionalmente lo exporta
      description: >-
        Que sacar informacion del sistema sea una operacion con permiso, huella y
        vencimiento, y no una consulta suelta que alguien corre contra produccion y
        manda por correo.

        Los parametros van por LISTA BLANCA contra `parametros_esperados`: lo que no
        esta declarado no entra, y el valor viaja como ligadura — nunca concatenado en
        la consulta. La alternativa, aceptar lo que venga y filtrar lo peligroso, es
        como se escriben las inyecciones: siempre falta un caso.

        El `hashResultado` es la huella canonica del resultado. Dos ejecuciones con los
        mismos parametros y los mismos datos dan el mismo hash, y eso permite probar
        que un reporte entregado no fue alterado despues.

        Un reporte sin filas se entrega igual, con cero: «no hubo» es una respuesta, y
        para los regulatorios es la obligatoria (`R-UIF-06`).

        El estado terminal exitoso es COMPLETADA, que es lo que admite
        `ck_ejecucion_reporte_estado`. Donde el texto del caso de uso dice LISTA y la
        tabla dice COMPLETADA, manda la tabla: es la que rechaza.
      parameters:
        - name: definicionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaReporte' }
      responses:
        '201':
          description: Ejecucion registrada, con su huella y su exportacion si se pidio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaReporte' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU58-01 SIN_PERMISO             · AP-CU58-02 PARAMETRO_INVALIDO
          # AP-CU58-03 JUSTIFICACION_REQUERIDA · AP-CU58-04 TIEMPO_EXCEDIDO
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /reportes/exportaciones/{exportacionId}/descargas:
    post:
      operationId: descargarExportacion       # CU-58
      summary: Cuenta una descarga del archivo y dice si todavia se puede entregar
      description: >-
        No devuelve el archivo: lo autoriza. La descarga se cuenta ANTES de entregar
        porque contar despues significa no contar la vez que fallo a mitad, y el tope
        deja de ser un tope.

        Un enlace que se descarga indefinidamente deja de ser una entrega y pasa a ser
        una copia publicada. Agotado el tope, hay que volver a pedir el reporte, con
        justificacion nueva — que es exactamente el rastro que una auditoria busca.
      parameters:
        - name: exportacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '204':
          description: Descarga autorizada y contada
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU58-05 EXPORTACION_VENCIDA · AP-CU58-06 TOPE_DESCARGAS
          # AP-CU58-07 FILTRO_DE_LISTADO_INVALIDO (listados del backoffice, carril A · A6)
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores:
    get:
      operationId: publicarTablero           # CU-98
      summary: Los indicadores del periodo, con su meta, su variacion y su serie
      description: >-
        [CONTRATO] Que la direccion mire siempre los mismos numeros, calculados de la
        misma forma: un indicador es una DEFINICION, no una consulta, y si dos lugares
        lo recalculan ya hay dos indicadores.

        Se lee de `auditoria.indicador_kpi`, que es donde el calculo los deja. Esta
        operacion NO calcula: publica.

        La `dimension` es la del modelo —GLOBAL, POR_GRUPO, POR_ORGANIZADOR— y no la
        que enumera el texto de CU-98. Donde el caso de uso y la tabla no coinciden,
        manda la tabla: es la que rechaza.
      parameters:
        - name: periodo
          in: query
          required: true
          description: Formato AAAA, AAAA-MM o AAAA-MM-DD, segun la granularidad
          schema: { type: string, maxLength: 10, minLength: 4 }
        - name: dimension
          in: query
          required: true
          schema: { type: string, enum: [GLOBAL, POR_GRUPO, POR_ORGANIZADOR] }
        - name: dimensionId
          in: query
          description: Obligatorio salvo en GLOBAL, donde no corresponde
          schema: { type: string, format: uuid }
        - name: periodosDeSerie
          in: query
          description: >-
            Cuantos periodos anteriores traer para el grafico. Cero trae solo el
            actual.
          schema: { type: integer, minimum: 0, maximum: 24, default: 6 }
      responses:
        '200':
          description: El tablero del periodo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaTablero' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU98-01 PERIODO_NO_CERRADO   · AP-CU98-02 SIN_DEFINICION
          # AP-CU98-03 SIN_META_DEL_PERIODO · AP-CU98-04 MUESTRA_INSUFICIENTE
          # AP-CU98-05 INDICADOR_DUPLICADO
        '403':
          description: >-
            Sin AUDITORIA_LEER ni ningun permiso de tablero. Con un permiso de tablero solo
            vuelven sus familias (TABLERO_FINANCIERO_VER: FINANZAS y RIESGO;
            TABLERO_COMERCIAL_VER: NEGOCIO; TABLERO_SISTEMAS_VER: OPERACION): el filtro es del servidor.
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores/operacion/endpoints:
    get:
      operationId: listarEndpointsDelDia      # tableros por rol · sistemas (D4)
      summary: Los endpoints tocados hoy, con solicitudes, errores y p95
      description: >-
        Vista en VIVO (desde la medianoche de La Paz hasta ahora) del trafico HTTP que el Collector OpenTelemetry
        entrega a Prometheus. No es un indicador del catalogo de CU-98: es el desglose que acompaña al tablero de
        sistemas. La ruta es la PLANTILLA (/grupos/{id}), nunca la URL con identificadores. Orden determinista:
        solicitudes descendente, despues servicio, metodo y ruta. `fuenteDisponible: false` significa que
        Prometheus no respondio (no se sabe), distinto de una lista vacia (nadie llamo). Exige TABLERO_SISTEMAS_VER
        o AUDITORIA_LEER.
      parameters:
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: El desglose del dia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEndpointsDelDia' }
        '403':
          description: Sin TABLERO_SISTEMAS_VER ni AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores/operacion/servicios:
    get:
      operationId: consultarSaludDeServicios      # operacion/estado: la salud REAL, no una constante
      summary: La salud de cada servicio, consultada ahora
      description: >-
        auditoria pregunta el readiness (/actuator/health/readiness) de cada servicio por la red interna, en paralelo
        y con timeout de 2 s, y devuelve lo que contesto cada uno: ARRIBA (200), DEGRADADO (respondio con otro estado,
        tipicamente 503 OUT_OF_SERVICE) o CAIDO (no respondio a tiempo o rechazo la conexion). El resultado se reusa
        10 s: abrir la pantalla muchas veces no multiplica las consultas. Ademas, auditoria mide el readiness una vez
        por minuto y devuelve por servicio la disponibilidad de los ultimos 30 dias, el presupuesto de error restante
        contra objetivoSlo y la ultima interrupcion. Exige TABLERO_SISTEMAS_VER o AUDITORIA_LEER.
      responses:
        '200':
          description: La salud consultada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaSaludDeServicios' }
        '403':
          description: Sin TABLERO_SISTEMAS_VER ni AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores/catalogo-de-datos:
    get:
      operationId: obtenerCatalogoDeDatos      # tableros por rol · H7 catalogo de datos (D14)
      summary: El catalogo de datos de toda la plataforma (deprecado)
      deprecated: true
      description: >-
        DEPRECADO desde 2026-10-21: descarga el catalogo entero (~2 MB) en una sola respuesta. Usar
        obtenerResumenDelCatalogo, listarTablasDelCatalogo y obtenerTablaDelCatalogo. Se mantiene sin cambios de
        forma hasta que ningun cliente lo pida (regla 96.4.1). Retiro (regla 98.1.3): el backoffice se despliega
        aparte de auditoria, asi que se quita recien cuando el backoffice que usa las tres operaciones este en TEST
        y en PROD; la fecha la confirman Marcelo/Pablo y se escribe aca.
        Cada esquema, tabla y columna con su explicacion de negocio (las fichas de docs/entidades) y de sistema
        (derivada del modelo: servicio dueño, append-only, claves, reglas nombradas), las relaciones y la
        sensibilidad de cada columna. Lo genera scripts/catalogo_de_datos.py; no se calcula en la peticion. Vive bajo /indicadores, junto al
        desglose de sistemas, porque es parte del tablero de sistemas y el gateway ya enruta ese prefijo a auditoria.
        Describe el esquema completo de la base, por eso NO es un archivo estatico del backoffice: exige
        TABLERO_SISTEMAS_VER o AUDITORIA_LEER. No contiene datos de personas, solo la estructura.
      responses:
        '200':
          description: El catalogo vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogoDeDatos' }
        '403':
          description: Sin TABLERO_SISTEMAS_VER ni AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores/catalogo-de-datos/resumen:
    get:
      operationId: obtenerResumenDelCatalogo     # catalogo de datos 2026-10-21 · H2
      summary: Las cifras del catalogo, sus esquemas y lo que se puede filtrar
      description: >-
        Lo que la pantalla muestra antes de la primera tabla: cuantas tablas, columnas y relaciones hay, cada
        esquema con su servicio dueño y sus cifras, cuantas tablas hay por estado y por revision de su ficha
        (CU-130), los modulos del modelo y las politicas de retencion que se pueden asignar. Sin columnas ni
        narrativa: pesa unos pocos KB. Exige TABLERO_SISTEMAS_VER o AUDITORIA_LEER.
      responses:
        '200':
          description: El resumen vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenDelCatalogo' }
        '403':
          description: Sin TABLERO_SISTEMAS_VER ni AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores/catalogo-de-datos/tablas:
    get:
      operationId: listarTablasDelCatalogo       # catalogo de datos 2026-10-21 · H2
      summary: Las tablas del catalogo, filtradas y paginadas en el servidor
      description: >-
        Una fila por tabla, sin columnas ni narrativa larga: nombre, esquema, servicio, modulo, que es, cifras,
        clasificacion por sensibilidad y su ficha de gobierno. Orden fijo esquema y tabla. Paginacion por numero
        de pagina y no por cursor a proposito: el catalogo es un recurso estatico del servicio (cambia con el
        despliegue, no con los datos), asi que una pagina no se corre entre dos pedidos. `q` busca sin acentos ni
        mayusculas en el nombre de la tabla, sus columnas, el esquema y lo que la ficha dice que es. Exige
        TABLERO_SISTEMAS_VER o AUDITORIA_LEER.
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 80 } }
        - { name: esquema, in: query, required: false, schema: { type: string, maxLength: 63, pattern: '^[a-z_][a-z0-9_]*$' } }
        - { name: modulo, in: query, required: false, schema: { type: string, maxLength: 2, pattern: '^[0-9]{2}$' } }
        - { name: tipo, in: query, required: false, schema: { $ref: '#/components/schemas/TipoDeTabla' } }
        - { name: estado, in: query, required: false, schema: { $ref: '#/components/schemas/EstadoDeTabla' } }
        - { name: revision, in: query, required: false, schema: { $ref: '#/components/schemas/EstadoDeRevision' } }
        - { name: sensibilidad, in: query, required: false, schema: { $ref: '#/components/schemas/SensibilidadDeTabla' } }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: La pagina pedida (vacia si nada coincide o si la pagina pasa del final)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeTablasDelCatalogo' }
        '400':
          description: Un filtro fuera de su dominio (AP-VAL, lo responde el manejador comun)
        '403':
          description: Sin TABLERO_SISTEMAS_VER ni AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores/catalogo-de-datos/tablas/{esquema}/{tabla}:
    get:
      operationId: obtenerTablaDelCatalogo       # catalogo de datos 2026-10-21 · H2
      summary: La ficha completa de una tabla del catalogo
      description: >-
        La tabla con sus columnas (y la revision de cada una, CU-131), sus relaciones salientes y entrantes con
        cardinalidad, restriccion y accion al borrar tal como las aplica la base, su narrativa de negocio y de
        sistema, y su ficha de gobierno (CU-130). Exige TABLERO_SISTEMAS_VER o AUDITORIA_LEER.
      parameters:
        - { name: esquema, in: path, required: true, schema: { type: string, maxLength: 63, pattern: '^[a-z_][a-z0-9_]*$' } }
        - { name: tabla, in: path, required: true, schema: { type: string, maxLength: 63, pattern: '^[a-z_][a-z0-9_]*$' } }
      responses:
        '200':
          description: La ficha de la tabla
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TablaDelCatalogo' }
        '404':
          description: La tabla no esta en el catalogo
        '403':
          description: Sin TABLERO_SISTEMAS_VER ni AUDITORIA_LEER
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores/catalogo-de-datos/{esquema}/{tabla}/gobierno:
    put:
      operationId: guardarFichaDeGobierno      # CU-130
      summary: Guarda la ficha de gobierno de una tabla del catalogo de datos
      description: >-
        Estado (en uso o no), revision, responsable, retencion y si es critica para auditoria.
        Se manda la `version` leida; si otra persona guardo antes, responde 422 AP-CU130-01 y
        la ficha no cambia. La sensibilidad no se edita: se deriva de las columnas del modelo.
        Deja un evento CAMBIO_CONFIGURACION en la bitacora.
      parameters:
        - { name: esquema, in: path, required: true, schema: { type: string, maxLength: 63, pattern: '^[a-z_][a-z0-9_]*$' } }
        - { name: tabla, in: path, required: true, schema: { type: string, maxLength: 63, pattern: '^[a-z_][a-z0-9_]*$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaFichaDeGobierno' }
      responses:
        '200':
          description: La ficha guardada, con su version nueva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaDeGobierno' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU130-01 VERSION_VIEJA · AP-CU130-02 TABLA_DESCONOCIDA · AP-CU130-03 RETENCION_DESCONOCIDA
        '403':
          description: Sin CATALOGO_DATOS_EDITAR
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /indicadores/catalogo-de-datos/{esquema}/{tabla}/columnas/{columna}/revision:
    put:
      operationId: revisarColumna                # CU-131
      summary: Guarda la revision de una columna del catalogo de datos
      description: >-
        El veredicto de una persona sobre lo que el catalogo dice de la columna: aprobada,
        rechazada (con motivo obligatorio) o pendiente, con que confianza. Se manda la `version`
        leida; si otra persona guardo antes, 422 AP-CU131-03. Deja CAMBIO_CONFIGURACION en la bitacora.
      parameters:
        - { name: esquema, in: path, required: true, schema: { type: string, maxLength: 63, pattern: '^[a-z_][a-z0-9_]*$' } }
        - { name: tabla, in: path, required: true, schema: { type: string, maxLength: 63, pattern: '^[a-z_][a-z0-9_]*$' } }
        - { name: columna, in: path, required: true, schema: { type: string, maxLength: 63, pattern: '^[a-z_][a-z0-9_]*$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRevisionDeColumna' }
      responses:
        '200':
          description: La revision guardada, con su version nueva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionDeColumna' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU131-01 COLUMNA_DESCONOCIDA · AP-CU131-02 RECHAZO_SIN_MOTIVO · AP-CU131-03 VERSION_VIEJA
        '403':
          description: Sin CATALOGO_DATOS_EDITAR
        '401':
          $ref: '#/components/responses/NoAutenticado'

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    CatalogoDeDatos:
      type: object
      additionalProperties: false
      required: [esquemas, tablas]
      properties:
        esquemas: { type: array, items: { type: string } }
        detalleDeEsquemas: { type: array, items: { $ref: '#/components/schemas/EsquemaDelCatalogo' } }
        tablas: { type: array, items: { $ref: '#/components/schemas/TablaDelCatalogo' } }
        politicasDeRetencion:
          type: array
          description: CU-130 · las politicas de retencion que se pueden asignar a una tabla
          items: { $ref: '#/components/schemas/OpcionDeRetencion' }
    TablaDelCatalogo:
      type: object
      additionalProperties: false
      required: [tabla, esquema, modulo, nombreModulo, appendOnly, negocio, reglas, columnas, relaciones, sistema, operaciones]
      properties:
        tabla: { type: string }
        esquema: { type: string }
        tipo: { $ref: '#/components/schemas/TipoDeTabla' }
        modulo: { type: string, description: 'Modulo del modelo (01..15); 00 en la infraestructura de mensajeria' }
        nombreModulo: { type: string }
        servicio: { type: string, description: 'Servicio dueño; ausente en los esquemas compartidos catalogo y comun' }
        appendOnly: { type: boolean }
        clasificacion: { $ref: '#/components/schemas/ClasificacionDeTabla' }
        negocio: { $ref: '#/components/schemas/NegocioDeTabla' }
        notaDeSistema: { type: string, description: 'El parrafo «A nivel de sistema» de la ficha, si lo tiene' }
        reglas: { type: array, items: { type: string }, description: 'Reglas nombradas de docs/Restricciones.md' }
        columnas: { type: array, items: { $ref: '#/components/schemas/ColumnaDelCatalogo' } }
        relaciones: { $ref: '#/components/schemas/RelacionesDeTabla' }
        sistema: { type: string, description: 'Narrativa de sistema derivada del modelo' }
        operaciones:
          type: array
          description: >-
            Los casos de uso que nombran esta tabla (el [[tabla]] de docs/CasosDeUso/CU-*.md) y los endpoints que
            los ejecutan (la columna CU de docs/catalogo-de-flujos/matriz.md). No dice que esos endpoints escriban
            la tabla: dice que el caso de uso la involucra. Vacio en la infraestructura y en las tablas que ningun
            caso de uso nombra.
          items: { $ref: '#/components/schemas/OperacionDeLaTabla' }
        gobierno: { $ref: '#/components/schemas/FichaDeGobierno' }
    OperacionDeLaTabla:
      type: object
      additionalProperties: false
      required: [casoDeUso, titulo, endpoints]
      properties:
        casoDeUso: { type: string, pattern: '^CU-\d+$', example: CU-21 }
        titulo: { type: string, example: Cobrar el aporte del periodo }
        endpoints:
          type: array
          description: Vacio si el caso de uso todavia no tiene endpoint propio.
          items: { $ref: '#/components/schemas/EndpointDeLaOperacion' }
    EndpointDeLaOperacion:
      type: object
      additionalProperties: false
      required: [servicio, metodo, ruta, operationId]
      properties:
        servicio: { type: string }
        metodo: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        ruta: { type: string, example: '/aportes/obligaciones/{obligacionId}/pagos' }
        operationId: { type: string }
    EstadoDeTabla:
      type: string
      enum: [ACTIVA, PLANIFICADA, CANDIDATA_A_RETIRO, RETIRADA, DESHABILITADA]
    EstadoDeRevision:
      type: string
      enum: [DETECTADA, NECESITA_REVISION, APROBADA, RECHAZADA]
    FichaDeGobierno:
      type: object
      additionalProperties: false
      description: >-
        CU-130 · la ficha de gobierno de la tabla. Sin ficha guardada vale ACTIVA, DETECTADA,
        version 0.
      required: [estado, estadoRevision, criticaParaAuditoria, version]
      properties:
        estado: { $ref: '#/components/schemas/EstadoDeTabla' }
        estadoRevision: { $ref: '#/components/schemas/EstadoDeRevision' }
        responsable: { type: string, maxLength: 80 }
        politicaRetencionId: { type: string, format: uuid }
        criticaParaAuditoria: { type: boolean }
        notaRevision: { type: string, maxLength: 500 }
        revisadoPor: { type: string, format: uuid }
        actualizadoEn: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    EntradaFichaDeGobierno:
      type: object
      additionalProperties: false
      required: [estado, estadoRevision, criticaParaAuditoria, version]
      example:
        estado: CANDIDATA_A_RETIRO
        estadoRevision: APROBADA
        responsable: Sistemas
        criticaParaAuditoria: false
        version: 0
      properties:
        estado: { $ref: '#/components/schemas/EstadoDeTabla' }
        estadoRevision: { $ref: '#/components/schemas/EstadoDeRevision' }
        responsable: { type: string, minLength: 1, maxLength: 80 }
        politicaRetencionId: { type: string, format: uuid }
        criticaParaAuditoria: { type: boolean }
        notaRevision: { type: string, minLength: 1, maxLength: 500 }
        version: { type: integer, minimum: 0, description: 'La version leida; 0 si la tabla no tenia ficha' }
    OpcionDeRetencion:
      type: object
      additionalProperties: false
      required: [id, entidad, mesesRetencionActiva, accionAlVencer]
      properties:
        id: { type: string, format: uuid }
        entidad: { type: string }
        mesesRetencionActiva: { type: integer }
        accionAlVencer: { type: string }
    NegocioDeTabla:
      type: object
      additionalProperties: false
      properties:
        queEs: { type: string }
        negocio: { type: string }
        porQue: { type: string }
    ColumnaDelCatalogo:
      type: object
      additionalProperties: false
      required: [nombre, tipo, nulable, pk, sistema, sensibilidad]
      properties:
        nombre: { type: string }
        tipo: { type: string }
        nulable: { type: boolean }
        pk: { type: boolean }
        referencia: { type: string, description: 'Tabla a la que apunta la clave foranea' }
        esquemaReferencia: { type: string, description: 'Esquema de la tabla referenciada' }
        unica: { type: boolean, description: 'Tiene un indice UNIQUE propio: la FK que vive aca es 1:1' }
        negocio: { type: string }
        origenNegocio: { type: string, enum: [ficha, convencion] }
        sistema: { type: string }
        sensibilidad: { type: string, enum: [NINGUNA, PERSONAL, FINANCIERO, SECRETO, DERIVADO] }
        revision: { $ref: '#/components/schemas/RevisionDeColumna' }
    DecisionDeRevision:
      type: string
      enum: [APROBADA, RECHAZADA, NECESITA_REVISION]
    ConfianzaDeRevision:
      type: string
      enum: [BAJA, MEDIA, ALTA]
    RevisionDeColumna:
      type: object
      additionalProperties: false
      description: CU-131 · el veredicto guardado sobre una columna. Ausente, la columna no se reviso.
      required: [decision, version]
      properties:
        decision: { $ref: '#/components/schemas/DecisionDeRevision' }
        confianza: { $ref: '#/components/schemas/ConfianzaDeRevision' }
        motivo: { type: string, maxLength: 500 }
        revisadoPor: { type: string, format: uuid }
        revisadoEn: { type: string, format: date-time }
        version: { type: integer, minimum: 0 }
    EntradaRevisionDeColumna:
      type: object
      additionalProperties: false
      required: [decision, version]
      example:
        decision: APROBADA
        confianza: ALTA
        version: 0
      properties:
        decision: { $ref: '#/components/schemas/DecisionDeRevision' }
        confianza: { $ref: '#/components/schemas/ConfianzaDeRevision' }
        motivo: { type: string, minLength: 1, maxLength: 500 }
        version: { type: integer, minimum: 0, description: 'La version leida; 0 si la columna no tenia revision' }
    RelacionesDeTabla:
      type: object
      additionalProperties: false
      required: [salientes, entrantes]
      properties:
        salientes: { type: array, items: { $ref: '#/components/schemas/RelacionDelCatalogo' } }
        entrantes: { type: array, items: { $ref: '#/components/schemas/RelacionDelCatalogo' } }
    RelacionDelCatalogo:
      type: object
      additionalProperties: false
      description: >-
        Una clave foranea vista desde la tabla de la ficha. `tabla`/`esquema` son el otro extremo; `columna` es la
        columna que lleva la FK (en las salientes es de esta tabla, en las entrantes de la otra). Restriccion y
        accion al borrar son las del DDL que se aplica (sql/20_claves).
      required: [columna, tabla, esquema]
      properties:
        columna: { type: string }
        tabla: { type: string }
        esquema: { type: string }
        columnaDestino: { type: string, description: 'Columna referenciada (siempre la clave primaria id)' }
        restriccion: { type: string, description: 'Nombre de la restriccion FOREIGN KEY en la base' }
        alBorrar: { type: string, enum: [RESTRICT, SET NULL, CASCADE, NO ACTION] }
        cardinalidad: { type: string, enum: ['N:1', '1:1'], description: '1:1 cuando la columna de la FK es UNIQUE' }
        obligatoria: { type: boolean, description: 'La columna de la FK es NOT NULL' }
    TipoDeTabla:
      type: string
      description: NEGOCIO sale del modelo; INFRAESTRUCTURA es la mensajeria que el generador agrega a cada esquema
      enum: [NEGOCIO, INFRAESTRUCTURA]
    SensibilidadDeTabla:
      type: string
      description: Filtro de tablas con al menos una columna de esa sensibilidad
      enum: [PERSONAL, FINANCIERO, SECRETO]
    ClasificacionDeTabla:
      type: object
      additionalProperties: false
      description: Cuantas columnas de cada sensibilidad tiene la tabla (derivado de los nombres de columna)
      required: [personales, financieros, secretos, derivados]
      properties:
        personales: { type: integer, minimum: 0 }
        financieros: { type: integer, minimum: 0 }
        secretos: { type: integer, minimum: 0 }
        derivados: { type: integer, minimum: 0 }
    EsquemaDelCatalogo:
      type: object
      additionalProperties: false
      required: [nombre, descripcion, tablas, tablasDeNegocio, columnas, relaciones, appendOnly, conDatosPersonales]
      properties:
        nombre: { type: string }
        servicio: { type: string, description: 'Ausente en los esquemas compartidos catalogo y comun' }
        descripcion: { type: string }
        tablas: { type: integer, minimum: 0 }
        tablasDeNegocio: { type: integer, minimum: 0 }
        columnas: { type: integer, minimum: 0 }
        relaciones: { type: integer, minimum: 0, description: 'Claves foraneas que salen de sus tablas' }
        appendOnly: { type: integer, minimum: 0 }
        conDatosPersonales: { type: integer, minimum: 0 }
    ModuloDelCatalogo:
      type: object
      additionalProperties: false
      required: [codigo, nombre, tablas]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        tablas: { type: integer, minimum: 0 }
    ConteoPorEstadoDeTabla:
      type: object
      additionalProperties: false
      required: [ACTIVA, PLANIFICADA, CANDIDATA_A_RETIRO, RETIRADA, DESHABILITADA]
      properties:
        ACTIVA: { type: integer, minimum: 0 }
        PLANIFICADA: { type: integer, minimum: 0 }
        CANDIDATA_A_RETIRO: { type: integer, minimum: 0 }
        RETIRADA: { type: integer, minimum: 0 }
        DESHABILITADA: { type: integer, minimum: 0 }
    ConteoPorEstadoDeRevision:
      type: object
      additionalProperties: false
      required: [DETECTADA, NECESITA_REVISION, APROBADA, RECHAZADA]
      properties:
        DETECTADA: { type: integer, minimum: 0 }
        NECESITA_REVISION: { type: integer, minimum: 0 }
        APROBADA: { type: integer, minimum: 0 }
        RECHAZADA: { type: integer, minimum: 0 }
    ResumenDelCatalogo:
      type: object
      additionalProperties: false
      required: [tablas, tablasDeNegocio, tablasDeInfraestructura, columnas, columnasRevisadas, relaciones,
                 conDatosPersonales, conDatosFinancieros, criticasParaAuditoria, sinResponsable,
                 porEstado, porRevision, esquemas, modulos, politicasDeRetencion]
      properties:
        tablas: { type: integer, minimum: 0 }
        tablasDeNegocio: { type: integer, minimum: 0 }
        tablasDeInfraestructura: { type: integer, minimum: 0 }
        columnas: { type: integer, minimum: 0 }
        columnasRevisadas: { type: integer, minimum: 0, description: 'Columnas con una revision guardada (CU-131)' }
        relaciones: { type: integer, minimum: 0 }
        conDatosPersonales: { type: integer, minimum: 0 }
        conDatosFinancieros: { type: integer, minimum: 0 }
        criticasParaAuditoria: { type: integer, minimum: 0 }
        sinResponsable: { type: integer, minimum: 0 }
        porEstado: { $ref: '#/components/schemas/ConteoPorEstadoDeTabla' }
        porRevision: { $ref: '#/components/schemas/ConteoPorEstadoDeRevision' }
        esquemas: { type: array, items: { $ref: '#/components/schemas/EsquemaDelCatalogo' } }
        modulos: { type: array, items: { $ref: '#/components/schemas/ModuloDelCatalogo' } }
        politicasDeRetencion: { type: array, items: { $ref: '#/components/schemas/OpcionDeRetencion' } }
    FilaDelCatalogo:
      type: object
      additionalProperties: false
      description: Una tabla en la lista, sin columnas ni narrativa larga
      required: [tabla, esquema, tipo, modulo, nombreModulo, appendOnly, columnas, columnasRevisadas,
                 relacionesSalientes, relacionesEntrantes, clasificacion, gobierno]
      properties:
        tabla: { type: string }
        esquema: { type: string }
        tipo: { $ref: '#/components/schemas/TipoDeTabla' }
        modulo: { type: string }
        nombreModulo: { type: string }
        servicio: { type: string }
        queEs: { type: string }
        appendOnly: { type: boolean }
        columnas: { type: integer, minimum: 0 }
        columnasRevisadas: { type: integer, minimum: 0 }
        relacionesSalientes: { type: integer, minimum: 0 }
        relacionesEntrantes: { type: integer, minimum: 0 }
        clasificacion: { $ref: '#/components/schemas/ClasificacionDeTabla' }
        gobierno: { $ref: '#/components/schemas/FichaDeGobierno' }
    PaginaDeTablasDelCatalogo:
      type: object
      additionalProperties: false
      required: [items, pagina, limite, total, totalPaginas]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FilaDelCatalogo' } }
        pagina: { type: integer, minimum: 1 }
        limite: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        totalPaginas: { type: integer, minimum: 0 }
    SalidaEndpointsDelDia:
      type: object
      additionalProperties: false
      required: [desde, hasta, fuenteDisponible, endpoints]
      properties:
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        fuenteDisponible: { type: boolean }
        endpoints:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/EndpointDelDia' }
    SalidaSaludDeServicios:
      type: object
      additionalProperties: false
      required: [consultadoEn, servicios]
      properties:
        consultadoEn: { type: string, format: date-time }
        servicios:
          type: array
          maxItems: 40
          items: { $ref: '#/components/schemas/SaludDeServicio' }
        objetivoSlo:
          type: string
          description: 'El SLO de disponibilidad en porcentaje, cadena decimal (por ejemplo 99.5); el mismo para todos'
    SaludDeServicio:
      type: object
      additionalProperties: false
      required: [servicio, estado]
      properties:
        servicio: { type: string, maxLength: 60 }
        estado: { type: string, enum: [ARRIBA, DEGRADADO, CAIDO] }
        latenciaMs: { type: integer, format: int64, description: 'Cuanto tardo en contestar; ausente si no contesto' }
        disponibilidad30d:
          type: string
          description: >-
            Porcentaje de minutos que contesto 200 sobre los minutos medidos en los ultimos 30 dias UTC, cadena
            decimal truncada a dos decimales. Ausente si todavia no hay nada medido.
        presupuestoErrorRestante:
          type: string
          description: >-
            Cuanto queda del presupuesto de error contra objetivoSlo, en porcentaje con un decimal: 100 sin caidas,
            0 agotado, negativo si el SLO ya no se cumple. Ausente si todavia no hay nada medido.
        minutosMedidos30d:
          type: integer
          format: int64
          description: 'Minutos medidos en la ventana; los minutos sin medicion no cuentan ni a favor ni en contra'
        ultimaInterrupcion:
          type: string
          format: date-time
          description: 'El ultimo minuto medido en que no contesto 200 (DEGRADADO o CAIDO); ausente si nunca'
    EndpointDelDia:
      type: object
      additionalProperties: false
      required: [servicio, metodo, ruta, solicitudes, errores4xx, errores5xx]
      properties:
        servicio: { type: string, maxLength: 60 }
        metodo: { type: string, maxLength: 10 }
        ruta: { type: string, maxLength: 200, description: 'Plantilla de la ruta, sin identificadores' }
        solicitudes: { type: integer, format: int64 }
        errores4xx: { type: integer, format: int64 }
        errores5xx: { type: integer, format: int64 }
        p95Ms: { type: string, description: 'Percentil 95 en milisegundos, cadena decimal; ausente si no hay histograma' }
    PaginaDeDefinicionesDeReporte:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DefinicionDeReporteEnLista' }
        proximoDespuesDe: { type: string }
        proximoDespuesDeId: { type: string, format: uuid }
    DefinicionDeReporteEnLista:
      type: object
      additionalProperties: false
      required: [definicionId, tipo, nombre, descripcion, permisoRequerido, contieneDatosSensibles]
      properties:
        definicionId: { type: string, format: uuid }
        tipo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        permisoRequerido: { type: string }
        contieneDatosSensibles: { type: boolean }
    PaginaDeEjecucionesDeReporte:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EjecucionDeReporteEnLista' }
        proximoAntesDe: { type: string, format: date-time }
        proximoAntesDeId: { type: string, format: uuid }
    EjecucionDeReporteEnLista:
      type: object
      additionalProperties: false
      required: [ejecucionId, definicionId, solicitadoPor, estado, filasGeneradas, duracionMs, iniciadaEn]
      properties:
        ejecucionId: { type: string, format: uuid }
        definicionId: { type: string, format: uuid }
        solicitadoPor: { type: string, format: uuid }
        estado: { type: string, enum: [EN_COLA, EJECUTANDO, COMPLETADA, FALLIDA, EXPIRADA] }
        filasGeneradas: { type: integer }
        duracionMs: { type: integer }
        hashResultado: { type: string }
        iniciadaEn: { type: string, format: date-time }
        finalizadaEn: { type: string, format: date-time }
    EntradaDerechos:
      type: object
      additionalProperties: false
      required: [usuarioId, tipo, descripcion, ultimaActividad]
      properties:
        usuarioId: { type: string, format: uuid }
        tipo:
          type: string
          enum: [ACCESO, RECTIFICACION, OPOSICION, PORTABILIDAD, CANCELACION]
          description: >-
            Los cinco que admite la tabla. CU-07 llama «supresion» a CANCELACION y el
            servicio acepta las dos palabras; el modelo guarda CANCELACION.
        descripcion: { type: string, minLength: 10, maxLength: 400 }
        ultimaActividad:
          type: string
          format: date
          description: >-
            Desde cuando corre la retencion. Lo aporta quien atiende porque la ultima
            operacion del titular vive en `nucleo-financiero` y este servicio no la
            puede consultar. Hueco declarado: deja de ser parametro cuando el contrato
            de la billetera exponga la fecha.
    SalidaDerechos:
      type: object
      additionalProperties: false
      required: [solicitudId, fechaLimiteLegal, estado, datosRetenidosPorLey]
      properties:
        solicitudId:      { type: string, format: uuid }
        fechaLimiteLegal: { type: string, format: date-time }
        estado:
          type: string
          enum: [RECIBIDA, EN_PROCESO, ATENDIDA, PARCIAL, RECHAZADA]
        datosRetenidosPorLey:
          type: array
          description: Que quedo conservado y con que base legal. Se le dice al titular.
          items: { type: string }
        procesoAnonimizacionId: { type: string, format: uuid }
        estrategia:
          type: string
          enum: [BORRADO_TOTAL, BORRADO_PARCIAL, SEUDONIMIZACION]
    EntradaReporte:
      type: object
      additionalProperties: false
      required: [parametros]
      properties:
        parametros:
          type: object
          additionalProperties: { type: string }
          description: >-
            Se validan contra `parametros_esperados` de la definicion. Viajan como
            cadena a proposito: el tipo lo declara el reporte, no el llamador, y asi
            no hay dos opiniones sobre si «2026-01» es una fecha o un texto.
        formato:
          type: string
          enum: [CSV, JSON, PDF, XLSX]
          description: >-
            Ausente para ejecutar sin exportar. Los cuatro que admite
            `ck_exportacion_reporte_formato`.
        justificacion:
          type: string
          minLength: 10
          maxLength: 300
          description: >-
            Obligatoria cuando la definicion tiene `contiene_datos_sensibles`. El
            minimo de diez no es capricho: lo exige `ck_acceso_justificacion`, porque
            una justificacion de tres letras no se puede leer dentro de un ano.
    SalidaReporte:
      type: object
      additionalProperties: false
      required: [ejecucionId, estado, filasGeneradas, hashResultado]
      properties:
        ejecucionId: { type: string, format: uuid }
        estado:
          type: string
          enum: [COMPLETADA, EJECUTANDO, EN_COLA, EXPIRADA, FALLIDA]
        filasGeneradas:
          type: integer
          description: Cero es un resultado valido, no un error.
        hashResultado:
          type: string
          minLength: 64
          maxLength: 64
          description: >-
            SHA-256 de la forma canonica del resultado. Es lo que permite probar que
            el archivo que alguien presenta es el que salio de aca.
        exportacionId:
          type: string
          format: uuid
          description: >-
            Presente solo si se pidio formato. El archivo se cifra y caduca cuando la
            definicion tiene datos sensibles; no lo elige quien exporta.
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
    SalidaTablero:
      type: object
      additionalProperties: false
      required: [periodo, dimension, provisorio, indicadores]
      properties:
        periodo: { type: string }
        provisorio:
          type: boolean
          description: >-
            Verdadero si algun indicador del periodo se calculo sin que los cierres
            cuadraran. Es del tablero entero y no de cada tarjeta: si uno solo es
            provisorio, la lectura de todos queda condicionada.
        dimension: { type: string, enum: [GLOBAL, POR_GRUPO, POR_ORGANIZADOR] }
        dimensionId: { type: string, format: uuid }
        indicadores:
          type: array
          items: { $ref: '#/components/schemas/Indicador' }
    Indicador:
      type: object
      additionalProperties: false
      required:
        [codigo, nombre, unidad, familia, duenoFamilia, definicionVersion, suprimidoPorPrivacidad, calculadoEn]
      properties:
        codigo: { type: string, maxLength: 40 }
        nombre: { type: string, maxLength: 80 }
        valor:
          type: string
          description: >-
            Cadena decimal, con la escala que guardo el calculo. No se redondea al
            publicar: el numero del tablero tiene que ser el numero de la tabla.

            AUSENTE cuando se suprimio por privacidad. La serie tambien viene vacia en
            ese caso: publicarla seria dar el numero por la puerta de atras.
        unidad: { type: string, maxLength: 15 }
        meta:
          type: string
          description: >-
            Ausente cuando no hay meta fijada para el periodo. Sin meta no hay
            semaforo, y ponerla despues de ver el resultado no es medir.
        cumpleMeta:
          type: boolean
          description: Ausente cuando no hay meta.
        variacionPeriodoAnterior:
          type: string
          description: >-
            Ausente en un indicador sin historia. Sin periodo anterior no hay
            comparacion, y un cero fingido afirmaria que se mantuvo igual.
        serie:
          type: array
          description: Los periodos anteriores, del mas viejo al mas nuevo.
          items:
            type: object
            additionalProperties: false
            required: [periodo, valor]
            properties:
              periodo: { type: string }
              valor: { type: string }
        familia:
          type: string
          enum: [NEGOCIO, RIESGO, CUMPLIMIENTO, OPERACION, FINANZAS]
          description: >-
            Sale del catalogo de definiciones del servicio, no de la tabla:
            `indicador_kpi` no tiene columna de familia (hueco declarado).
        duenoFamilia:
          type: string
          maxLength: 80
          description: Quien responde cuando el indicador esta en rojo.
        definicionVersion:
          type: string
          maxLength: 20
          description: >-
            Con que version de la definicion se calculo. Es lo que permite que un
            numero de hace un ano vuelva a salir igual.
        suprimidoPorPrivacidad:
          type: boolean
          description: >-
            Verdadero cuando la muestra no alcanza el minimo de la definicion. Un
            promedio de tres personas identifica a las tres (R-SEG-03).
        casos:
          type: integer
          description: Tamano de la muestra, para poder explicar la supresion.
        minimoCasos:
          type: integer
          description: El piso que fija la definicion del indicador.
        calculadoEn: { type: string, format: date-time }

    PaginaDeBitacora:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EventoBitacora' }
        proximoAntesDe: { type: string, format: date-time }
        proximoAntesDeId: { type: string, format: uuid }
        totalAproximado: { type: integer }

    EventoBitacora:
      type: object
      additionalProperties: false
      required: [id, secuencia, entidad, entidadId, accion, origen, correlationId, hashRegistro, fechaHora]
      properties:
        id: { type: string, format: uuid }
        secuencia: { type: integer, format: int64 }
        entidad: { type: string }
        entidadId: { type: string, format: uuid }
        accion: { type: string }
        actorUsuarioId: { type: string, format: uuid }
        actorRol: { type: string }
        origen: { type: string }
        ipOrigen: { type: string }
        agenteUsuario: { type: string }
        correlationId: { type: string, format: uuid }
        valorAnterior: { type: object }
        valorNuevo: { type: object }
        camposModificados: { type: string }
        motivo: { type: string }
        hashRegistro: { type: string }
        hashAnterior: { type: string }
        fechaHora: { type: string, format: date-time }

    CatalogoOperativoResumen:
      type: object
      additionalProperties: false
      required: [codigo, nombre, dueno, version, totalElementos, elementosActivos, vigenteDesde, estado, descripcion]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        dueno: { type: string }
        version: { type: string }
        totalElementos: { type: integer }
        elementosActivos: { type: integer }
        vigenteDesde: { type: string, format: date-time }
        estado:
          type: string
          enum: [VIGENTE, EN_REVISION, OBSOLETO]
        descripcion: { type: string }

    CatalogoOperativoDetalle:
      type: object
      additionalProperties: false
      required: [codigo, nombre, dueno, version, totalElementos, elementosActivos, vigenteDesde, estado, descripcion, tablaFisica, baseNormativa]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        dueno: { type: string }
        version: { type: string }
        totalElementos: { type: integer }
        elementosActivos: { type: integer }
        vigenteDesde: { type: string, format: date-time }
        estado:
          type: string
          enum: [VIGENTE, EN_REVISION, OBSOLETO]
        descripcion: { type: string }
        tablaFisica: { type: string }
        baseNormativa: { type: string }

    ElementoCatalogoOperativo:
      type: object
      additionalProperties: false
      required: [id, catalogoCodigo, codigo, nombre, descripcion, activo, orden, actualizadoEn]
      properties:
        id: { type: string }
        catalogoCodigo: { type: string }
        codigo: { type: string }
        nombre: { type: string }
        descripcion: { type: string }
        activo: { type: boolean }
        atributos:
          type: object
          additionalProperties: true
        orden: { type: integer }
        vigenteDesde: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
        actualizadoPor: { type: string }

    EntradaActualizarElementoCatalogo:
      type: object
      additionalProperties: false
      required: [activo, motivo]
      properties:
        activo: { type: boolean }
        motivo: { type: string, minLength: 5, maxLength: 500 }

  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesion valida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
