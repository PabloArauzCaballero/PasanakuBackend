# Contrato de inversiones — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020).
#
# Prefijos reservados de este servicio: /inversiones
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
#
# Inversion VOLUNTARIA del titular con un aliado (DPF o cuotas de un fondo abierto).
# No promete rentabilidad: el rendimiento de un fondo puede ser negativo, el de un DPF
# es el que fija su contrato, y todo dato SINTETICO se declara `origenDatos: SINTETICO`
# y `aptoProduccion: false`. Con dinero de grupos, esta funcion esta DESACTIVADA.
#
# Codigos de error (AP-CU<NN>-<nn>), para scripts/verificar_criterios.py:
#   CU-120 · catalogo        AP-CU120-01 PRODUCTO_INEXISTENTE · AP-CU120-02 ALIADO_NO_DISPONIBLE
#                            AP-CU120-03 RESPUESTA_DEL_ALIADO_NO_VERIFICABLE
#   CU-121 · ordenar         AP-CU121-01 PRODUCTO_NO_DISPONIBLE · AP-CU121-02 CONDICIONES_DESACTUALIZADAS
#                            AP-CU121-03 MONTO_BAJO_EL_MINIMO · AP-CU121-04 SALDO_INSUFICIENTE
#                            AP-CU121-05 SALDO_AFECTADO_A_POZO · AP-CU121-06 IDEMPOTENCIA_CONTENIDO_DISTINTO
#                            AP-CU121-07 NO_SE_PUDO_VERIFICAR_SALDO · AP-CU121-08 MONEDA_NO_SOPORTADA
#   CU-122 · confirmar       AP-CU122-01 ORDEN_INEXISTENTE · AP-CU122-02 CONFIRMACION_NO_COINCIDE
#   CU-123 · devengo y valor AP-CU123-01 POSICION_INEXISTENTE · AP-CU123-02 VALOR_CUOTA_NO_DISPONIBLE
#   CU-124 · rescatar        AP-CU124-01 RESCATE_ANTICIPADO_NO_PERMITIDO · AP-CU124-02 DOBLE_DISPONIBILIDAD
#                            AP-CU124-03 POSICION_NO_ABIERTA · AP-CU124-04 CUOTAS_INVALIDAS
#                            AP-CU124-05 IDEMPOTENCIA_CONTENIDO_DISTINTO · AP-CU124-06 POSICION_INEXISTENTE
#                            AP-CU124-07 RESCATE_INEXISTENTE
#   CU-125 · liquidar        AP-CU125-01 DISCREPANCIA_CON_EL_EMISOR · AP-CU125-02 LIQUIDACION_NO_COINCIDE_CON_EL_VALOR
#   CU-127 · comision exito  AP-CU127-01 COMISION_NO_CONFIGURADA
openapi: 3.1.0
info:
  title: inversiones
  version: 1.0.0
  description: >-
    Servicio inversiones. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /inversiones/productos:
    get:
      operationId: listarProductosDeInversion       # CU-120
      summary: Productos y condiciones vigentes, con fecha de cotizacion y fuente
      responses:
        '200':
          description: Productos con la version de condiciones que se aceptaria hoy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaDeProductos' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/productos/sincronizacion:
    post:
      operationId: sincronizarCatalogoDeInversion   # CU-120
      summary: Trae del aliado el catalogo y crea una version nueva si cambio
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Resultado de la sincronizacion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaSincronizacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/valores-cuota/sincronizacion:
    post:
      operationId: sincronizarValoresDeCuota        # CU-123
      summary: Trae del aliado el ultimo valor publicado de cada fondo (append-only)
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: Resultado de la sincronizacion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaSincronizacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/ordenes:
    post:
      operationId: crearOrdenDeInversion            # CU-121
      summary: Acepta las condiciones y ordena; el saldo queda retenido
      description: >-
        El consentimiento se guarda contra la version exacta de las condiciones y su
        hash. El saldo se RETIENE antes de enviar la orden al aliado; la orden puede
        quedar en un estado intermedio (RETENIDA, ENVIADA, INCIERTA) y eso se muestra,
        no se esconde. Un saldo afectado a un pozo no se invierte.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaOrden' }
      responses:
        '201':
          description: Orden registrada, en el estado en que quedo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaOrden' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/ordenes/{ordenId}:
    get:
      operationId: verOrdenDeInversion              # CU-122
      summary: Estado de una orden propia
      parameters:
        - { name: ordenId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: La orden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaOrden' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/ordenes/{ordenId}/sincronizacion:
    post:
      operationId: sincronizarOrdenDeInversion      # CU-122
      summary: Consulta al aliado por la referencia de la orden y avanza lo que corresponda
      description: >-
        Es la forma de resolver una orden INCIERTA o ENVIADA: se consulta, no se
        reenvia a ciegas y no se libera el saldo mientras no se sepa que paso.
      parameters:
        - { name: ordenId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: La orden despues de consultar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaOrden' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/posiciones:
    get:
      operationId: listarPosicionesDeInversion      # CU-123
      summary: Posiciones del titular
      responses:
        '200':
          description: Posiciones propias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaDePosiciones' }
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/posiciones/{posicionId}:
    get:
      operationId: verPosicionDeInversion           # CU-123
      summary: Posicion con devengo (DPF) o valoracion (fondo), sin promesa de rentabilidad
      parameters:
        - { name: posicionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: La posicion valorada, con la fecha del dato y si esta desactualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPosicion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/posiciones/{posicionId}/comprobantes:
    get:
      operationId: listarComprobantesDeInversion    # CU-128
      summary: Comprobantes con principal, interes, impuesto y comision por separado
      parameters:
        - { name: posicionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Comprobantes de la posicion
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaDeComprobantes' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/posiciones/{posicionId}/rescates:
    post:
      operationId: solicitarRescateDeInversion      # CU-124
      summary: Solicita un rescate; queda pendiente hasta que el aliado confirme los fondos
      description: >-
        Informa el corte aplicable. Un DPF que no admite cancelacion anticipada no se
        rescata antes de su vencimiento. Las cuotas ya comprometidas en otro rescate no
        vuelven a ofrecerse (doble disponibilidad).
      parameters:
        - { name: posicionId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRescate' }
      responses:
        '201':
          description: Rescate registrado, en el estado en que quedo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRescate' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/rescates/{rescateId}/sincronizacion:
    post:
      operationId: sincronizarRescateDeInversion    # CU-125
      summary: Consulta al aliado y, si confirmo, liquida y acredita
      parameters:
        - { name: rescateId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: El rescate despues de consultar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRescate' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /inversiones/devengos:
    post:
      operationId: correrDevengoDeDpf               # CU-123
      summary: Devengo diario de los DPF abiertos (idempotente por posicion y fecha)
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDevengo' }
      responses:
        '200':
          description: Resultado de la corrida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDevengo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '401':
          $ref: '#/components/responses/NoAutenticado'

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
    Condiciones:
      type: object
      additionalProperties: false
      required: [versionId, numero, texto, textoHash, fuente, fechaCotizacion, origenDatos, aptoProduccion, montoMinimo, advertencia]
      properties:
        versionId:       { type: string, format: uuid }
        numero:          { type: integer }
        plazoDias:       { type: integer }
        baseDias:        { type: integer }
        tasaNominalAnual: { type: string, pattern: '^\d+\.\d{6}$' }
        permiteRescateAnticipado: { type: boolean }
        penalizacionAnticipo: { type: string, pattern: '^\d+\.\d{6}$' }
        diasRescate:     { type: integer }
        horaCorte:       { type: string, pattern: '^\d{2}:\d{2}$' }
        montoMinimo:     { $ref: '#/components/schemas/Dinero' }
        tasaRetencion:   { type: string, pattern: '^\d+\.\d{6}$' }
        tasaComisionExito: { type: string, pattern: '^\d+\.\d{6}$' }
        costos:          { type: string }
        texto:           { type: string }
        textoHash:       { type: string, pattern: '^[0-9a-f]{64}$' }
        fuente:          { type: string }
        fechaCotizacion: { type: string, format: date-time }
        origenDatos:     { type: string, enum: [SINTETICO, VERIFICADO] }
        aptoProduccion:  { type: boolean }
        advertencia:     { type: string }
    ProductoInversion:
      type: object
      additionalProperties: false
      required: [codigo, tipo, nombre, emisor, moneda, nivelRiesgo, titularidad, condiciones]
      properties:
        codigo:      { type: string }
        tipo:        { type: string, enum: [DPF, FONDO] }
        nombre:      { type: string }
        emisor:      { type: string }
        moneda:      { type: string, enum: [BOB, USD] }
        nivelRiesgo: { type: string, enum: [BAJO, MEDIO, ALTO] }
        titularidad: { type: string }
        condiciones: { $ref: '#/components/schemas/Condiciones' }
    ListaDeProductos:
      type: object
      additionalProperties: false
      required: [productos]
      properties:
        productos:
          type: array
          items: { $ref: '#/components/schemas/ProductoInversion' }
    SalidaSincronizacion:
      type: object
      additionalProperties: false
      required: [productos, nuevos]
      properties:
        productos: { type: integer }
        nuevos:    { type: integer, description: Versiones de condiciones o valores de cuota que no existian }
    EntradaOrden:
      type: object
      additionalProperties: false
      required: [productoCodigo, versionCondicionesId, textoHash, cuentaBilleteraId, monto]
      properties:
        productoCodigo:       { type: string, maxLength: 40 }
        versionCondicionesId: { type: string, format: uuid }
        textoHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: El hash del texto que la persona vio y acepto; si no coincide con la version, se rechaza.
        cuentaBilleteraId:    { type: string, format: uuid }
        monto:                { $ref: '#/components/schemas/Dinero' }
    SalidaOrden:
      type: object
      additionalProperties: false
      required: [ordenId, estado, productoCodigo, monto, versionCondicionesId, consentimientoId, mensaje]
      properties:
        ordenId:              { type: string, format: uuid }
        estado:
          type: string
          enum: [CREADA, RETENIDA, ENVIADA, INCIERTA, CONFIRMADA, RECHAZADA, CANCELADA]
        productoCodigo:       { type: string }
        monto:                { $ref: '#/components/schemas/Dinero' }
        versionCondicionesId: { type: string, format: uuid }
        consentimientoId:     { type: string, format: uuid }
        posicionId:           { type: string, format: uuid }
        fechaValor:           { type: string, format: date }
        motivoRechazo:        { type: string }
        mensaje:              { type: string }
    Valoracion:
      type: object
      additionalProperties: false
      required: [cuotas, valorCuota, fechaValor, antiguedadDias, desactualizado, valorBruto, variacion, comisionDeExitoDevengada, valorNetoEstimado, origenDatos, advertencia]
      properties:
        cuotas:         { type: string, pattern: '^\d+\.\d{6}$' }
        valorCuota:     { type: string, pattern: '^\d+\.\d{6}$' }
        fechaValor:     { type: string, format: date }
        antiguedadDias: { type: integer }
        desactualizado: { type: boolean }
        valorBruto:     { $ref: '#/components/schemas/Dinero' }
        variacion:      { $ref: '#/components/schemas/Dinero' }
        comisionDeExitoDevengada: { $ref: '#/components/schemas/Dinero' }
        valorNetoEstimado: { $ref: '#/components/schemas/Dinero' }
        origenDatos:    { type: string, enum: [SINTETICO, VERIFICADO] }
        advertencia:    { type: string }
    DetalleDpf:
      type: object
      additionalProperties: false
      required: [tasaNominalAnual, baseDias, diasDevengados, interesDevengado, interesPagado, impuestoEstimado, impuestoPagado, vencimiento]
      properties:
        tasaNominalAnual: { type: string, pattern: '^\d+\.\d{6}$' }
        baseDias:         { type: integer }
        diasDevengados:   { type: integer }
        interesDevengado: { $ref: '#/components/schemas/Dinero' }
        interesPagado:    { $ref: '#/components/schemas/Dinero' }
        impuestoEstimado: { $ref: '#/components/schemas/Dinero' }
        impuestoPagado:   { $ref: '#/components/schemas/Dinero' }
        vencimiento:      { type: string, format: date }
    SalidaPosicion:
      type: object
      additionalProperties: false
      required: [posicionId, tipo, productoCodigo, estado, principal, costoBaseVigente, fechaConstitucion, origenDatos, advertencia]
      properties:
        posicionId:     { type: string, format: uuid }
        tipo:           { type: string, enum: [DPF, FONDO] }
        productoCodigo: { type: string }
        estado:         { type: string, enum: [ABIERTA, CERRADA] }
        principal:      { $ref: '#/components/schemas/Dinero' }
        costoBaseVigente:
          $ref: '#/components/schemas/Dinero'
        fechaConstitucion: { type: string, format: date }
        fechaVencimiento:  { type: string, format: date }
        valoracion:     { $ref: '#/components/schemas/Valoracion' }
        dpf:            { $ref: '#/components/schemas/DetalleDpf' }
        origenDatos:    { type: string, enum: [SINTETICO, VERIFICADO] }
        advertencia:    { type: string }
    ListaDePosiciones:
      type: object
      additionalProperties: false
      required: [posiciones]
      properties:
        posiciones:
          type: array
          items: { $ref: '#/components/schemas/SalidaPosicion' }
    EntradaRescate:
      type: object
      additionalProperties: false
      properties:
        cuotas:
          type: string
          pattern: '^\d+\.\d{6}$'
          description: Solo fondos. Sin cuotas se rescata todo lo que este libre.
    Corte:
      type: object
      additionalProperties: false
      properties:
        fechaValor: { type: string, format: date }
        liquidaEn:  { type: string, format: date-time }
    SalidaRescate:
      type: object
      additionalProperties: false
      required: [rescateId, posicionId, tipo, estado, mensaje]
      properties:
        rescateId:  { type: string, format: uuid }
        posicionId: { type: string, format: uuid }
        tipo:       { type: string, enum: [PARCIAL, TOTAL, VENCIMIENTO, ANTICIPADO] }
        estado:
          type: string
          enum: [SOLICITADO, PENDIENTE, INCIERTO, POR_ACREDITAR, LIQUIDADO, RECHAZADO]
        cuotas:     { type: string, pattern: '^\d+\.\d{6}$' }
        corte:      { $ref: '#/components/schemas/Corte' }
        netoAcreditar: { $ref: '#/components/schemas/Dinero' }
        motivoRechazo: { type: string }
        mensaje:    { type: string }
    Comprobante:
      type: object
      additionalProperties: false
      required: [comprobanteId, tipo, sentidoTitular, principal, interes, impuesto, comision, perdidaRealizada, neto, origenDatos, emitidoEn]
      properties:
        comprobanteId:    { type: string, format: uuid }
        tipo:             { type: string, enum: [SUSCRIPCION, LIQUIDACION] }
        sentidoTitular:   { type: string, enum: [DEBITO, CREDITO] }
        principal:        { $ref: '#/components/schemas/Dinero' }
        interes:          { $ref: '#/components/schemas/Dinero' }
        impuesto:         { $ref: '#/components/schemas/Dinero' }
        comision:         { $ref: '#/components/schemas/Dinero' }
        perdidaRealizada: { $ref: '#/components/schemas/Dinero' }
        neto:             { $ref: '#/components/schemas/Dinero' }
        origenDatos:      { type: string, enum: [SINTETICO, VERIFICADO] }
        emitidoEn:        { type: string, format: date-time }
    ListaDeComprobantes:
      type: object
      additionalProperties: false
      required: [comprobantes]
      properties:
        comprobantes:
          type: array
          items: { $ref: '#/components/schemas/Comprobante' }
    EntradaDevengo:
      type: object
      additionalProperties: false
      required: [fecha]
      properties:
        fecha: { type: string, format: date }
    SalidaDevengo:
      type: object
      additionalProperties: false
      required: [fecha, devengadas, yaDevengadas, total]
      properties:
        fecha:        { type: string, format: date }
        devengadas:   { type: integer }
        yaDevengadas: { type: integer }
        total:        { $ref: '#/components/schemas/Dinero' }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesion valida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
