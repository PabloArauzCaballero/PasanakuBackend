        tasaNominalAnual: { type: string, pattern: '^\d+\.\d{6}$' }
        baseDias:         { type: integer }
        diasDevengados:   { type: integer }
        interesDevengado: { $ref: '#/components/schemas/Dinero' }
        interesPagado:    { $ref: '#/components/schemas/Dinero' }
        impuestoEstimado: { $ref: '#/components/schemas/Dinero' }
