        fechaConstitucion: { type: string, format: date }
        fechaVencimiento:  { type: string, format: date }
        valoracion:     { $ref: '#/components/schemas/Valoracion' }
        dpf:            { $ref: '#/components/schemas/DetalleDpf' }
        origenDatos:    { type: string, enum: [SINTETICO, VERIFICADO] }
        advertencia:    { type: string }
    ListaDePosiciones:
      type: object
      additionalProperties: false
      required: [posiciones]
      properties:
        posiciones:
          type: array
          items: { $ref: '#/components/schemas/SalidaPosicion' }
    EntradaRescate:
      type: object
      additionalProperties: false
      properties:
        cuotas:
          type: string
          pattern: '^\d+\.\d{6}$'
          description: Solo fondos. Sin cuotas se rescata todo lo que este libre.
    Corte:
      type: object
      additionalProperties: false
      properties:
        fechaValor: { type: string, format: date }
        liquidaEn:  { type: string, format: date-time }
    SalidaRescate:
      type: object
      additionalProperties: false
      required: [rescateId, posicionId, tipo, estado, mensaje]
      properties:
        rescateId:  { type: string, format: uuid }
        posicionId: { type: string, format: uuid }
        tipo:       { type: string, enum: [PARCIAL, TOTAL, VENCIMIENTO, ANTICIPADO] }
        estado:
          type: string
          enum: [SOLICITADO, PENDIENTE, INCIERTO, POR_ACREDITAR, LIQUIDADO, RECHAZADO]
        cuotas:     { type: string, pattern: '^\d+\.\d{6}$' }
        corte:      { $ref: '#/components/schemas/Corte' }
        netoAcreditar: { $ref: '#/components/schemas/Dinero' }
        motivoRechazo: { type: string }
        mensaje:    { type: string }
    Comprobante:
      type: object
      additionalProperties: false
      required: [comprobanteId, tipo, sentidoTitular, principal, interes, impuesto, comision, perdidaRealizada, neto, origenDatos, emitidoEn]
      properties:
        comprobanteId:    { type: string, format: uuid }
        tipo:             { type: string, enum: [SUSCRIPCION, LIQUIDACION] }
        sentidoTitular:   { type: string, enum: [DEBITO, CREDITO] }
        principal:        { $ref: '#/components/schemas/Dinero' }
        interes:          { $ref: '#/components/schemas/Dinero' }
        impuesto:         { $ref: '#/components/schemas/Dinero' }
        comision:         { $ref: '#/components/schemas/Dinero' }
        perdidaRealizada: { $ref: '#/components/schemas/Dinero' }
        neto:             { $ref: '#/components/schemas/Dinero' }
        origenDatos:      { type: string, enum: [SINTETICO, VERIFICADO] }
        emitidoEn:        { type: string, format: date-time }
    ListaDeComprobantes:
      type: object
      additionalProperties: false
      required: [comprobantes]
      properties:
        comprobantes:
          type: array
          items: { $ref: '#/components/schemas/Comprobante' }
    EntradaDevengo:
      type: object
      additionalProperties: false
      required: [fecha]
      properties:
        fecha: { type: string, format: date }
    SalidaDevengo:
      type: object
      additionalProperties: false
      required: [fecha, devengadas, yaDevengadas, total]
      properties:
        fecha:        { type: string, format: date }
        devengadas:   { type: integer }
        yaDevengadas: { type: integer }
        total:        { $ref: '#/components/schemas/Dinero' }
    Distribucion:
      type: object
      additionalProperties: false
      required: [distribucionId, rescateId, periodoDesde, periodoHasta, interesDevengado, penalizacion, interesEsperado, interesPagado, retencion, interesNeto, estado, distribuidaEn]
      properties:
        distribucionId:   { type: string, format: uuid }
        rescateId:        { type: string, format: uuid }
        periodoDesde:     { type: string, format: date }
        periodoHasta:     { type: string, format: date }
        interesDevengado: { $ref: '#/components/schemas/Dinero' }
        penalizacion:     { $ref: '#/components/schemas/Dinero' }
        interesEsperado:  { $ref: '#/components/schemas/Dinero' }
        interesPagado:    { $ref: '#/components/schemas/Dinero' }
        retencion:        { $ref: '#/components/schemas/Dinero' }
        interesNeto:      { $ref: '#/components/schemas/Dinero' }
        estado:           { type: string, enum: [CONCILIADA, DISCREPANCIA] }
        motivoDiscrepancia: { type: string }
        distribuidaEn:    { type: string, format: date-time }
    ListaDeDistribuciones:
      type: object
      additionalProperties: false
      required: [distribuciones]
      properties:
        distribuciones:
          type: array
          items: { $ref: '#/components/schemas/Distribucion' }
    SalidaComision:
      type: object
      additionalProperties: false
      required: [posicionId, cuotas, valorCuota, fechaValor, marcaMaximaPrevia, tasa, baseElegible, comisionEstimada, cuotaNetaEstimada, marcaMaximaNueva, comisionCobradaAntes, origenDatos, advertencia]
      properties:
        posicionId:           { type: string, format: uuid }
        cuotas:               { type: string, pattern: '^\d+\.\d{6}$' }
        valorCuota:           { type: string, pattern: '^\d+\.\d{6}$' }
        fechaValor:           { type: string, format: date }
        marcaMaximaPrevia:    { type: string, pattern: '^\d+\.\d{6}$' }
        tasa:                 { type: string, pattern: '^\d+\.\d{6}$' }
        baseElegible:         { $ref: '#/components/schemas/Dinero' }
        comisionEstimada:     { $ref: '#/components/schemas/Dinero' }
        cuotaNetaEstimada:    { type: string, pattern: '^\d+\.\d{6}$' }
        marcaMaximaNueva:     { type: string, pattern: '^\d+\.\d{6}$' }
        comisionCobradaAntes: { $ref: '#/components/schemas/Dinero' }
        origenDatos:          { type: string, enum: [SINTETICO, VERIFICADO] }
        advertencia:          { type: string }
    LineaFiscal:
      type: object
      additionalProperties: false
      required: [comprobanteId, posicionId, productoCodigo, tipo, fecha, principal, interes, impuesto, comision, perdidaRealizada, neto, origenDatos, estadoEnLibro]
      properties:
        comprobanteId:    { type: string, format: uuid }
        posicionId:       { type: string, format: uuid }
        productoCodigo:   { type: string }
        tipo:             { type: string, enum: [SUSCRIPCION, LIQUIDACION] }
        fecha:            { type: string, format: date }
        principal:        { $ref: '#/components/schemas/Dinero' }
        interes:          { $ref: '#/components/schemas/Dinero' }
        impuesto:         { $ref: '#/components/schemas/Dinero' }
        comision:         { $ref: '#/components/schemas/Dinero' }
        perdidaRealizada: { $ref: '#/components/schemas/Dinero' }
        neto:             { $ref: '#/components/schemas/Dinero' }
        origenDatos:      { type: string, enum: [SINTETICO, VERIFICADO] }
        estadoEnLibro:    { type: string, enum: [CONCILIADA, PENDIENTE_EN_LIBRO, DIFERENCIA, SIN_INSTRUCCION] }
    TotalesFiscales:
      type: object
      additionalProperties: false
      required: [principalSuscrito, principalDevuelto, interes, impuesto, comision, perdidaRealizada, netoAcreditado]
      properties:
        principalSuscrito: { $ref: '#/components/schemas/Dinero' }
        principalDevuelto: { $ref: '#/components/schemas/Dinero' }
        interes:           { $ref: '#/components/schemas/Dinero' }
        impuesto:          { $ref: '#/components/schemas/Dinero' }
        comision:          { $ref: '#/components/schemas/Dinero' }
        perdidaRealizada:  { $ref: '#/components/schemas/Dinero' }
        netoAcreditado:    { $ref: '#/components/schemas/Dinero' }
    ConciliacionConElLibro:
      type: object
      additionalProperties: false
      required: [debitadoSegunComprobantes, debitadoEnLibro, acreditadoSegunComprobantes, acreditadoEnLibro, lineasPendientesEnLibro, lineasConDiferencia, distribucionesConDiscrepancia, cuadra]
      properties:
        debitadoSegunComprobantes:    { $ref: '#/components/schemas/Dinero' }
        debitadoEnLibro:              { $ref: '#/components/schemas/Dinero' }
        acreditadoSegunComprobantes:  { $ref: '#/components/schemas/Dinero' }
        acreditadoEnLibro:            { $ref: '#/components/schemas/Dinero' }
        lineasPendientesEnLibro:      { type: integer }
        lineasConDiferencia:          { type: integer }
        distribucionesConDiscrepancia: { type: integer }
        cuadra:                       { type: boolean }
    ReporteFiscal:
      type: object
      additionalProperties: false
      required: [desde, hasta, lineas, totales, conciliacion, origenDatos, aptoProduccion, notaFiscal]
      properties:
        desde:         { type: string, format: date }
        hasta:         { type: string, format: date }
        lineas:
          type: array
          items: { $ref: '#/components/schemas/LineaFiscal' }
        totales:       { $ref: '#/components/schemas/TotalesFiscales' }
        conciliacion:  { $ref: '#/components/schemas/ConciliacionConElLibro' }
        origenDatos:   { type: string, enum: [SINTETICO, VERIFICADO] }
        aptoProduccion: { type: boolean }
        notaFiscal:    { type: string }
    EntradaSimulacion:
      type: object
      additionalProperties: false
      required: [monto, horizonteDias]
      properties:
        monto:         { $ref: '#/components/schemas/Dinero' }
        horizonteDias: { type: integer, minimum: 1, maximum: 3650 }
        productos:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 40 }
          description: Codigos a comparar; vacio compara todos los vigentes.
        variacionesDeFondo:
          type: array
          maxItems: 9
          items: { type: string, pattern: '^-?\d{1,2}\.\d{2}$', maxLength: 8 }
          description: Hipotesis de variacion del valor de cuota (0.10 = +10 %); por omision -0.10, 0.00 y 0.10.
    Alternativa:
      type: object
      additionalProperties: false
      required: [tipo, descripcion, diasParaDisponer, disponibleEnElHorizonte, interes, retencion, comision, netoCuandoDisponible, diferenciaContraBilletera, origenDatos]
      properties:
        tipo:           { type: string, enum: [BILLETERA, DPF_AL_VENCIMIENTO, DPF_ANTICIPADO, DPF_NO_DISPONIBLE, FONDO_ESCENARIO] }
        productoCodigo: { type: string }
        descripcion:    { type: string }
        diasParaDisponer: { type: integer }
        disponibleEnElHorizonte: { type: boolean }
        interes:        { $ref: '#/components/schemas/Dinero' }
        retencion:      { $ref: '#/components/schemas/Dinero' }
        comision:       { $ref: '#/components/schemas/Dinero' }
        netoCuandoDisponible: { $ref: '#/components/schemas/Dinero' }
        diferenciaContraBilletera: { $ref: '#/components/schemas/Dinero' }
        origenDatos:    { type: string, enum: [SINTETICO, VERIFICADO] }
    SalidaSimulacion:
      type: object
      additionalProperties: false
      required: [monto, horizonteDias, alternativas, usaSaldoReal, advertencia]
      properties:
        monto:         { $ref: '#/components/schemas/Dinero' }
        horizonteDias: { type: integer }
        alternativas:
          type: array
          items: { $ref: '#/components/schemas/Alternativa' }
        usaSaldoReal:  { type: boolean, description: Siempre falso; la simulacion no lee ni mueve ningun saldo. }
        advertencia:   { type: string }
    EntradaReintento:
      type: object
      additionalProperties: false
      properties:
        limite: { type: integer, minimum: 1, maximum: 500, default: 200 }
    SalidaReintento:
      type: object
      additionalProperties: false
      required: [aplicadas, rechazadas, siguenPendientes, esperando, atascadas, cortada]
      properties:
        aplicadas:        { type: integer }
        rechazadas:       { type: integer }
        siguenPendientes: { type: integer }
        esperando:        { type: integer }
        atascadas:        { type: integer }
        cortada:          { type: boolean, description: El barrido paso su plazo maximo y el resto queda para la proxima vuelta. }
    Corrida:
      type: object
      additionalProperties: false
      required: [corridaId, operacion, clave, origen, estado, iniciadaEn]
      properties:
        corridaId: { type: string, format: uuid }
        operacion: { type: string, enum: [SINCRONIZAR_CATALOGO, SINCRONIZAR_VALORES, DEVENGAR, REINTENTAR_INSTRUCCIONES] }
        clave:     { type: string }
        origen:    { type: string, enum: [API, PROGRAMADO] }
        estado:    { type: string, enum: [EN_CURSO, OK, PARCIAL, FALLIDA] }
        resultado: { type: object, additionalProperties: { type: string } }
        error:     { type: string }
        iniciadaEn:  { type: string, format: date-time }
        terminadaEn: { type: string, format: date-time }
    ListaDeCorridas:
      type: object
      additionalProperties: false
      required: [corridas]
      properties:
        corridas:
          type: array
          items: { $ref: '#/components/schemas/Corrida' }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesion valida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
