# inversiones — generado por scripts/nuevo_servicio.py
# Si falta una clave, el proceso NO levanta y dice cual.
# Config comun a todo perfil. Lo que varia por entorno (aportaya.entorno.productivo,
# aportaya.cors.origenes) vive en application-{local,test,staging,production}.yml
# (H3.S3.M1) — nunca acá, para que un service.yml no pueda "olvidarse" de activar
# la guarda de produccion.
spring:
  application:
    name: inversiones
  threads:
    virtual:
      enabled: true                 # ADR-015: la carga es de E/S, no reactiva
  datasource:
    url: ${BD_URL}                  # por PgBouncer, modo transaccion
    username: svc_inversiones
    password: ${BD_CLAVE}
    hikari:
      maximum-pool-size: 5     # la SUMA de los catorce no supera max_connections
      data-source-properties:
        prepareThreshold: 0         # PgBouncer en modo transaccion
  kafka:
    bootstrap-servers: ${KAFKA_URL}

aportaya:
  # Tableros (CU-98): relleno de indicadores al arrancar. 0 = no rellena (produccion); dev y TEST lo piden en el compose
  # para que el tablero tenga serie con la base sembrada. El diario corre siempre (aportaya.indicadores.cron).
  indicadores:
    relleno:
      meses: ${INDICADORES_RELLENO_MESES:0}
      dias: ${INDICADORES_RELLENO_DIAS:0}
  esquema: inversiones
  outbox:                           # Q-02 (encargo PR3 §5): decidido, no literal en codigo
    habilitado: true
    intervalo: PT1S                 # relevo: lee el outbox y publica DESPUES del commit
    intentos-maximos: 10
    backoff-base: PT1S
    backoff-tope: PT5M
    timeout-publicacion: PT10S
  jwt:
    jwks-uri: ${JWKS_URI}           # ADR-024: cada servicio valida la firma el mismo
    emisor: aportaya-identidad      # Q-05: iss unico
    audiencia: aportaya             # Q-05: aud del token de acceso (global)
    tolerancia: PT60S               # skew aceptado por JwtTimestampValidator
  zona-horaria: America/La_Paz      # plazos habiles
  servicios:
    nucleo-financiero: ${NUCLEO_FINANCIERO_URL:http://nucleo-financiero:8080}   # el libro, SOLO por contrato
    identidad: ${URL_IDENTIDAD:http://identidad:8080}   # emisor de la credencial de servicio (ADR-024)
  inversiones:
    # SINTETICO: el aliado es un simulador. `deshabilitado` es el unico modo que arranca en un
    # entorno productivo (GuardiaDeProduccion); `simulado` exige loopback y claves de 32 bytes.
    aliado:
      modo: ${INVERSIONES_ALIADO_MODO:deshabilitado}
      url: ${INVERSIONES_ALIADO_URL:http://127.0.0.1:4030}
      api-key: ${INVERSIONES_ALIADO_API_KEY:}
      firma-secreto: ${INVERSIONES_ALIADO_FIRMA_SECRETO:}
      timeout: PT5S
    libro:
      timeout: PT3S
      # Identidad de SERVICIO con que se debita la inversion y se acredita el rescate (nucleo-financiero las
      # acepta solo asi). Dos formas, ambas secretas y por variable de entorno, nunca en el repo:
      #  - cuenta-servicio: cuenta de servicio en identidad con el rol SERVICIO_INVERSIONES; el servicio entra
      #    (POST /sesiones) y renueva el token solo antes de que venza. Es la forma de operar.
      #  - credencial-servicio: un token ya emitido (vive 15 minutos): solo una prueba manual.
      # Sin ninguna, esas dos operaciones fallan cerradas y quedan pendientes. Config a medias = no arranca.
      credencial-servicio: ${INVERSIONES_LIBRO_CREDENCIAL_SERVICIO:}
      cuenta-servicio:
        telefono: ${INVERSIONES_SERVICIO_TELEFONO:}
        clave: ${INVERSIONES_SERVICIO_CLAVE:}
        factor-totp-semilla: ${INVERSIONES_SERVICIO_TOTP_SEMILLA:}
        factor-fijo: ${INVERSIONES_SERVICIO_FACTOR_FIJO:}   # SOLO TEST: el codigo fijo del perfil local de identidad
    valor-cuota:
      tolerancia-dias: 3            # tecnico, no comercial: cuantos dias de antiguedad tolera la pantalla sin avisar
    # Instrucciones pendientes al libro: espera exponencial desde que nacieron y un maximo de intentos.
    # Pasado el maximo NO se descartan: quedan pendientes, contadas como atascadas y a la vista.
    # Tecnico, no comercial.
    instrucciones:
      reintento:
        base: PT30S
        tope: PT1H
        max-intentos: 12
        por-vuelta: 200             # cuantas se intentan como mucho en cada vuelta del reloj
        lectura: 500                # cuantas pendientes se leen para elegir entre ellas
    # Trabajos programados (devengo, sincronizaciones, reintento). `habilitados: false` los apaga
    # sin tocar la API; el plazo maximo corta un barrido largo entero (queda PARCIAL) y una corrida
    # en curso mas vieja que `en-curso-caduca` se da por caida y se retoma con la misma clave.
    # Simulacion de caja (CU-129): variaciones del valor de cuota que se muestran si quien simula no pone las suyas.
    # Hipotesis, no prediccion.
    simulacion:
      escenarios-por-omision: -0.10,0.00,0.10
    trabajos:
      habilitados: true
      plazo-maximo: PT45S
      en-curso-caduca: PT10M

management:
  endpoint:
    health:
      probes:
        enabled: true               # readiness mira base y Kafka; liveness solo el proceso
