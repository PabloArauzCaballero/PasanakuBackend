# Contrato de grupos — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /grupos, /turnos, /acuerdos
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
openapi: 3.1.0
info:
  title: grupos
  version: 1.0.0
  description: >-
    Servicio grupos. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /grupos/{grupoId}/invitaciones/{invitacionId}/canje:
    post:
      operationId: canjearInvitacion
      summary: Canjear invitación y solicitar ingreso sin activar membresía
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invitacionId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanjeInvitacion' }
      responses:
        '200':
          description: Solicitud pendiente de resolución humana
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaCanjeInvitacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-17 GRUPO_YA_INICIADO · AP-CU68-03 REPUTACION_INSUFICIENTE (detalle.etapaMinima)
          # AP-CU69-18 DESBLOQUEO_DE_ETAPA_EXCEDIDO (detalle.cuposMax, detalle.aporteMax, detalle.moneda)
  /grupos/{grupoId}/invitaciones/{invitacionId}/revocacion:
    post:
      operationId: revocarInvitacionDelGrupo     # CU-69
      summary: El emisor revoca su invitación; el enlace deja de servir
      description: >-
        Revoca primero el enlace en `identidad` y después la invitación local. Es idempotente
        para el emisor. Una invitación ya aceptada, o de otra persona, responde 422 sin contar
        más. Después de revocar se puede emitir otra al mismo número: la anterior NO se
        reemplaza sola (regla explícita de reemisión).
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: invitacionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invitación revocada }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
  /grupos/solicitudes:
    get:
      operationId: listarBandejaDeAdmisiones   # CU-68 · bandeja general del backoffice (H4.B.M1)
      summary: Solicitudes de ingreso de TODOS los grupos, para el backoffice
      description: >-
        La bandeja de «Admisiones»: las solicitudes de cualquier grupo, las mas nuevas primero, con
        el codigo del grupo y el nombre con que se presento quien pide entrar. Distinta de
        `/grupos/{grupoId}/solicitudes`, que es la cola PENDIENTE de un solo grupo para su organizador.
        Sin telefono ni correo de nadie. `estado` usa los nombres de la pantalla: `ACEPTADA` es lo que la
        base guarda como `APROBADA`. Acotada a `limite` filas (maximo 200); la pantalla filtra y pagina
        sobre ese arreglo.
      parameters:
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [PENDIENTE, ACEPTADA, RECHAZADA, EXPIRADA] }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        '200':
          description: Solicitudes, la mas nueva primero
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/SolicitudDeAdmision' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
  /grupos/backoffice:
    get:
      operationId: listarGruposDeBackoffice   # Backoffice · consulta de grupos (2026-10-29)
      summary: Todos los grupos, para el backoffice
      description: >-
        Solo lectura. Para quien opera la plataforma (ADMIN_PLATAFORMA) o la audita (AUDITORIA_LEER). Datos del
        grupo, nunca de una persona: sin organizador, telefono ni correo. Acotada a `limite` filas (maximo 200).
        Orden: primero los que aun no tienen fecha de inicio (se estan armando), despues por fecha de inicio de la
        mas reciente a la mas vieja, y el codigo como desempate estable (la tabla no guarda fecha de creacion).
      parameters:
        - name: estado
          in: query
          required: false
          schema: { type: string, maxLength: 30 }
        - name: limite
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 200 }
      responses:
        '200':
          description: Grupos, el mas nuevo primero
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/GrupoDeBackoffice' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'

  /grupos/backoffice/{grupoId}:
    get:
      operationId: consultarGrupoDeBackoffice   # Backoffice · consulta de grupos (2026-10-29)
      summary: Un grupo con sus cupos y quien ocupa cada uno, para el backoffice
      description: >-
        Solo lectura, mismos permisos que el listado. Por cupo: numero, estado, el alias con que la persona se
        presento al grupo y si es quien lo organiza. Sin importes atribuibles a una persona ni datos de contacto.
        AP-CU64-01 el grupo no existe.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El grupo y sus cupos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleDeGrupoDeBackoffice' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'

  /grupos/solicitudes/{solicitudId}/propuestas:
    post:
      operationId: proponerAdmision
      summary: El administrador propone aceptar o rechazar; no activa la membresía
      parameters:
        - { name: solicitudId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDecisionIngreso' }
      responses:
        '200':
          description: Propuesta registrada o respuesta original del reintento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionIngreso' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # Al proponer ACEPTAR: AP-CU69-17 GRUPO_YA_INICIADO
          # AP-CU68-03 REPUTACION_INSUFICIENTE (detalle.etapaMinima) · AP-CU69-18 DESBLOQUEO_DE_ETAPA_EXCEDIDO
  /grupos/solicitudes/{solicitudId}/resoluciones:
    post:
      operationId: resolverAdmision
      summary: Backoffice resuelve la propuesta vigente con motivo y separación de responsables
      parameters:
        - { name: solicitudId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDecisionIngreso' }
      responses:
        '200':
          description: Resolución humana persistida; aprobar reserva cupos y requiere firma
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionIngreso' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # Al aprobar (reserva cupos, es un ingreso): AP-CU69-17 GRUPO_YA_INICIADO
          # AP-CU68-03 REPUTACION_INSUFICIENTE (detalle.etapaMinima) · AP-CU69-18 DESBLOQUEO_DE_ETAPA_EXCEDIDO
  /grupos/{grupoId}/administrador/sustitucion:
    post:
      operationId: sustituirAdministrador
      summary: Backoffice cambia al administrador del grupo; el saliente conserva sus cupos y obligaciones
      description: >-
        Continuidad tras una revocación o suspensión de la habilitación. El entrante tiene que ser
        participante activo del grupo y organizador habilitado. El saliente sigue siendo participante con sus
        cupos y deudas, identificados en el registro; retirarlo es otro acto. Idempotente por clave.
        AP-CU68-08 rol · 09 clave de otra sustitución · 10 grupo sin un administrador vigente ·
        11 entrante no es participante activo · 12 ya es el administrador · 13 conflicto de interés ·
        14 entrante no habilitado.
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaSustitucionAdministrador' }
      responses:
        '200':
          description: Sustitución registrada o la original si es un reintento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SustitucionAdministrador' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
  /grupos/solicitudes/{solicitudId}/decisiones:
    get:
      operationId: historialAdmision
      summary: Historial inmutable accesible al administrador del grupo y al backoffice
      parameters:
        - { name: solicitudId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Decisiones en orden de revisión
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/DecisionIngreso' } }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
  /grupos/calendario/calcular:
    get:
      operationId: calcularPlazoHabil          # CU-59
      summary: Fecha límite en días hábiles, con los días que se saltearon
      description: >-
        El resultado se GUARDA donde se use y no se recalcula: si despues se declara
        un feriado, ese plazo no se mueve. Devuelve tambien que dias se saltearon,
        porque un plazo que no se puede explicar no se puede defender.

        Nota de ruta: el caso de uso dice `/calendario`, que no esta entre los
        prefijos reservados de `grupos` (/grupos, /turnos, /acuerdos). Va bajo
        /grupos/calendario para no invadir un prefijo sin dueno.
      parameters:
        - name: desde
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dias
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: alcance
          in: query
          required: true
          schema: { type: string, enum: [NACIONAL, DEPARTAMENTAL, PLATAFORMA, GRUPO] }
        - name: referenciaId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Fecha límite y los días no hábiles que se saltearon
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPlazoHabil' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU59-01 FECHA_DUPLICADA    · AP-CU59-02 ALCANCE_INCOMPLETO
          # AP-CU59-03 FECHA_EN_EL_PASADO · AP-CU59-04 SIN_FUENTE
          # AP-CU59-05 CALENDARIO_VACIO
  /grupos/calendario/vencimiento:
    get:
      operationId: calcularVencimientoLocal    # CU-59 · H7.S1.M3
      summary: Fecha UTC, fecha contractual y fecha de liquidación de un vencimiento, explícitas
      description: >-
        Un instante en UTC puede caer en otro día que el que vive la persona (22:00 del 1 de mayo
        en La Paz son las 02:00 del 2 de mayo en UTC). La fecha CONTRACTUAL es el día calendario
        en la zona del contrato (por omisión America/La_Paz); la de LIQUIDACIÓN es el primer día
        hábil desde la contractual, nunca anterior. Se devuelven las dos y la fecha UTC, y los
        días que se saltearon con su motivo, para que ninguna se confunda con otra.

        Un día no hábil es un feriado del calendario sembrado (`catalogo.dia_no_habil`, con
        procedencia en su descripción), un sábado o un domingo. Sin calendario cargado para el año
        no se calcula (AP-CU59-05): no se cuenta corrido por omisión.
      parameters:
        - name: instante
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: alcance
          in: query
          required: true
          schema: { type: string, enum: [NACIONAL, DEPARTAMENTAL, PLATAFORMA, GRUPO] }
        - name: referenciaId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: zona
          in: query
          required: false
          description: Identificador IANA de la zona del contrato; sin él, America/La_Paz.
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: Las tres fechas y los días que no contaron
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaVencimientoLocal' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU59-02 ALCANCE_INCOMPLETO · AP-CU59-05 CALENDARIO_VACIO · AP-CU59-06 ZONA_INVALIDA
  # Una operacion por caso de uso. Plantilla:
  #
  #   /grupos/…:
  #     post:
  #       operationId: <verboObjeto>          # CU-NN
  #       parameters:
  #         - name: Idempotency-Key
  #           in: header
  #           required: true                   # toda operacion con efecto
  #           schema: { type: string, format: uuid }
  #       responses:
  #         '200': …
  #         '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /grupos/{grupoId}/inicio:
    post:
      operationId: iniciarGrupo                # CU-69 · inicio al 75 % (2026-10-30)
      summary: El organizador inicia el grupo con al menos el 75 % de los cupos ocupados
      description: >-
        Transicion ABIERTO_A_INSCRIPCION → CONFORMADO pedida por quien organiza el grupo, con su
        renglon en el historial de estados. Se puede iniciar con ceil(0,75 × cuposTotales) cupos
        OCUPADO (reglamento firmado) o mas; antes responde 422 `AP-CU69-16` con el conteo. La
        precondicion va en la escritura: el UPDATE exige el estado ABIERTO_A_INSCRIPCION y el
        conteo, asi dos inicios a la vez no achican dos veces.

        Al iniciar, el grupo SE ACHICA: los cupos LIBRE dejan de existir para el ciclo y
        `cuposTotales` y `numPeriodos` pasan a ser los ocupados (nunca menos de 3). Desde ese
        momento no entra nadie mas por ningun camino (`AP-CU69-17`). Con cupos RESERVADO
        (alguien aceptado que todavia no firmo) no se inicia (`AP-CU69-19`): achicar le quitaria
        el lugar a quien ya fue aceptado.

        Reglamento al achicar (decision del dueño 2026-10-30): en la misma transaccion se publica
        una version NUEVA del reglamento (`version` + 1 en `reglamento_grupo`, con su hash) con los
        numeros reales del grupo achicado. Nadie la tiene aceptada al nacer: cada integrante la
        acepta con `POST /grupos/{grupoId}/reglamento/firma` antes del sorteo, y el detalle le dice
        a cada uno si le falta (`reglamentoPendienteDeAceptar`).

        Idempotente por clave: repetir con la misma `Idempotency-Key` devuelve el resultado
        original; una clave nueva sobre un grupo ya iniciado responde `AP-CU69-17`.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      responses:
        '200':
          description: El grupo iniciado, ya achicado a sus cupos ocupados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GrupoIniciado' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-16 UMBRAL_DE_INICIO_NO_ALCANZADO (detalle.ocupados, detalle.minimoRequerido, detalle.cuposTotales)
          # AP-CU69-17 GRUPO_YA_INICIADO        · AP-CU69-19 FIRMAS_PENDIENTES (detalle.reservados)
          # AP-CU69-07 EMISOR_NO_HABILITADO (no organiza el grupo) · AP-CU69-12 GRUPO_TODAVIA_NO_ABIERTO

  /grupos/{grupoId}/sorteo:
    post:
      operationId: comprometerSorteo           # CU-60 fase 1
      summary: Publicar el compromiso del sorteo
      description: >-
        Publica SOLO el hash de la semilla. Sin esa separacion, quien ejecuta el
        sorteo podria probar semillas hasta que salga el orden que le conviene: el
        compromiso es lo que convierte «confia en nosotros» en «verificalo vos».
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCompromiso' }
      responses:
        '201':
          description: Compromiso publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompromisoDeSorteo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU60-01 GRUPO_NO_CONFORMADO · AP-CU60-02 SORTEO_YA_EXISTE
          # AP-CU60-05 REGLAMENTO_SIN_FIRMAR

  /grupos/{grupoId}/sorteo/revelacion:
    post:
      operationId: revelarSorteo               # CU-60 fase 2
      summary: Revelar la semilla y crear los turnos
      description: >-
        Verifica que SHA256(semilla || entropias || snapshot) sea el hash publicado y recien
        entonces crea los turnos, todo en una transaccion: o hay turnos completos o
        no hay ninguno. Hay UN solo resultado vigente: revelar de nuevo devuelve el original
        y no sortea otra vez. Si el plantel o el calendario cambiaron desde el compromiso no
        se sortea sobre otra cosa (AP-CU60-06). Exige ser administrador del grupo de la ruta.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRevelacion' }
      responses:
        '200':
          description: Turnos creados, con el orden y la semilla publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevelacionDeSorteo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU60-03 FECHA_DE_REVELADO_FUTURA · AP-CU60-04 HASH_NO_VERIFICA
          # AP-CU60-06 PLANTEL_O_CALENDARIO_CAMBIO · AP-CU60-07 YA_REVELADO (el reintento HTTP devuelve el original)
          # AP-CU60-08 SORTEO_ANULADO · AP-CU60-09 CALENDARIO_AUSENTE · AP-CU60-10 NO_ADMINISTRA_EL_GRUPO

  /acuerdos:
    get:
      operationId: listarAcuerdos              # CU-63
      summary: Los acuerdos de un grupo, filtrados
      description: >-
        Para que quien pidio un traspaso (CU-64) encuentre la votacion de SU cupo y,
        aprobada, la adjunte. Solo para participantes del grupo. Los mas nuevos
        primero, hasta 50.
      parameters:
        - name: grupoId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: tipo
          in: query
          required: false
          schema: { type: string, enum: [CONDONACION, EXPULSION, PERMUTA, TRASPASO_CUPO, CAMBIO_REGLAMENTO, DISOLUCION, REPETIR_SORTEO] }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [ABIERTO, APROBADO, EJECUTADO, EXPIRADO, RECHAZADO] }
        - name: referenciaAfectadaId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Acuerdos del grupo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AcuerdoDelGrupo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU63-01 NO_PARTICIPA_DEL_GRUPO
    post:
      operationId: proponerAcuerdo             # CU-63
      summary: Proponer un acuerdo y abrir su votación
      description: >-
        Ningun efecto colectivo se ejecuta sin acuerdo aprobado, y el efecto va en la
        MISMA transaccion que la aprobacion: si el efecto falla, el acuerdo no queda
        aprobado sin su efecto — que seria un grupo convencido de que decidio algo
        que no ocurrio.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAcuerdo' }
      responses:
        '201':
          description: Acuerdo abierto a votación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAcuerdo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU63-01 PROPONENTE_NO_HABILITADO · AP-CU63-02 ACUERDO_DUPLICADO
          # AP-CU63-06 TRASPASO_SIN_ENTRANTE (TRASPASO_CUPO sin cupo, sin quien entra, o quien entra no participa)

  /acuerdos/{acuerdoId}/votos:
    post:
      operationId: votarAcuerdo                # CU-63
      summary: Emitir el voto, con el peso de los cupos
      description: >-
        El afectado por el acuerdo vota y su voto QUEDA REGISTRADO, como abstencion
        con peso cero. Impedirle votar lo dejaria sin constancia de que se presento;
        dejarlo ponderar convertiria el quorum en una formalidad en los dos casos
        donde mas importa.
      parameters:
        - name: acuerdoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaVoto' }
      responses:
        '201':
          description: Voto emitido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAcuerdo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU63-03 VOTO_YA_EMITIDO · AP-CU63-04 VOTACION_CERRADA
          # AP-CU63-05 PARTE_INTERESADA

  /turnos/permutas:
    post:
      operationId: solicitarPermuta            # CU-62
      summary: Solicitar la permuta de dos turnos
      description: >-
        Sin aceptacion de la contraparte no hay nada: la solicitud nace PENDIENTE.
        Si alguna parte tiene deuda no se permuta — adelantar el cobro de un moroso
        lo paga el grupo entero.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaPermuta' }
      responses:
        '201':
          description: Solicitud creada, a la espera de la contraparte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPermuta' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU62-01 TURNO_NO_PERMUTABLE  · AP-CU62-02 SOLICITANTE_EN_MORA
          # AP-CU62-03 CONTRAPARTE_EN_MORA  · AP-CU62-04 REGLAMENTO_NO_PERMITE
          # AP-CU62-05 ACUERDO_SIN_QUORUM

  /grupos/{grupoId}/retiros:
    post:
      operationId: solicitarRetiro             # CU-65
      summary: Solicitar el retiro y ver la posición exacta antes de confirmar
      description: >-
        El numero se calcula y se MUESTRA ANTES de confirmar, con su desglose. Un
        retiro donde el monto aparece despues es un retiro que alguien va a discutir,
        y con razon.

        Acreedora sin reemplazo se liquida AL CIERRE DEL CICLO, no antes: sacar plata
        de la bolsa a mitad de camino perjudica a los que faltan cobrar.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRetiro' }
      responses:
        '201':
          description: Solicitud creada, con la posición y el momento de liquidación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRetiro' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU65-01 PARTICIPANTE_NO_ACTIVO · AP-CU65-02 POSICION_DEUDORA_SIN_PLAN
          # AP-CU65-03 RETIRO_RECHAZADO_POR_GRUPO

  /grupos/{grupoId}/cupos/{cupoId}/traspasos:
    post:
      operationId: traspasarCupo               # CU-64
      summary: Traspasar un cupo a otro participante
      description: >-
        Lo ejecuta quien tiene el cupo, con la votacion del grupo APROBADA sobre ese
        cupo (acuerdo TRASPASO_CUPO con referenciaAfectadaId = cupoId; siempre se
        exige, decision 2026-10-30). El acuerdo se usa una sola vez.

        El TURNO no se toca: la posicion en el calendario es del cupo, no de la
        persona. Si se moviera, traspasar seria una forma de adelantar el propio
        turno y el sorteo dejaria de significar nada.

        Y la deuda no viaja con el cupo: las obligaciones vencidas se quedan con
        quien las genero. Sin eso, un cupo seria una forma de venderle a alguien la
        deuda de otro.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaTraspaso' }
      responses:
        '201':
          description: Cupo traspasado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaTraspaso' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU64-01 CUPO_NO_TRASPASABLE     · AP-CU64-02 SALIENTE_CON_DEUDA
          # AP-CU64-03 ENTRANTE_SIN_KYC        · AP-CU64-04 ENTRANTE_SIN_REPUTACION
          # AP-CU64-05 ACUERDO_REQUERIDO       · AP-CU64-06 NO_ES_TITULAR
          # Etapa minima (2026-10-30): quien entra por debajo de la etapa minima del grupo es
          # AP-CU64-04 ENTRANTE_SIN_REPUTACION (detalle.etapaMinima): el codigo de este caso de uso
          # para ese mismo motivo, no AP-CU68-03. Su desbloqueo excedido: AP-CU69-18.
          # La etapa del entrante es de OTRA persona: grupos la lee con su identidad de servicio
          # (`GET /reputacion/etapas/de-personas` de transparencia), nunca con el puntaje exacto.
          # El traspaso NO es un ingreso nuevo: AP-CU69-17 no aplica (el cupo ya existe y sigue ocupado).

  /grupos/{grupoId}/invitaciones:
    post:
      operationId: invitarAlGrupo              # CU-69
      summary: Invitar a un contacto, con token de un solo uso
      description: >-
        Si el destinatario esta suprimido NO se envia nada y se responde como si
        hubiera salido bien: decir «esa persona pidio no recibir mensajes» ya cuenta
        algo de ella a quien no tiene por que saberlo.

        El mensaje dice quien invita y a que grupo, con el monto y la periodicidad —
        nadie deberia aceptar un compromiso de dinero sin saber cual— y no revela
        datos de los otros integrantes.

        El token lo emite `identidad`: aca se recibe su identificador.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaInvitacion' }
      responses:
        '201':
          description: Invitación enviada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaInvitacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-01 SIN_CUPOS_LIBLES  · AP-CU69-02 DESTINATARIO_SUPRIMIDO
          # AP-CU69-03 YA_ES_PARTICIPANTE · AP-CU69-04 TOPE_REENVIOS
          # AP-CU69-05 TOKEN_INVALIDO     · AP-CU69-06 REFERENCIA_DUPLICADA
          # AP-CU69-07 EMISOR_NO_HABILITADO
          # AP-CU69-08 LIMITE_DIARIO_DE_INVITACIONES (emitido por identidad)
          # AP-CU69-09 INVITACION_VIGENTE_EXISTENTE (revocarla antes de emitir otra)
          # AP-CU69-17 GRUPO_YA_INICIADO (2026-10-30)
          # La etapa minima y el desbloqueo (AP-CU68-03 · AP-CU69-18) NO se informan al emitir: decirle a
          # quien invita que el invitado no llega a la etapa es contarle la reputacion de otra persona
          # (regla 90.2.8). Se aplican cuando el invitado canjea o acepta, en su propia sesion.

  /grupos/{grupoId}/enlace-del-grupo:
    post:
      operationId: generarEnlaceDelGrupo       # CU-69 · enlace del grupo
      summary: El organizador genera el enlace (y QR) del grupo; anula el anterior
      description: >-
        Un enlace para CUALQUIER persona: no da entrada, cada pedido es una solicitud que el
        organizador aprueba (CU-68). Vence a los 7 dias. Un grupo tiene un solo enlace
        activo: generar otro anula el anterior. El codigo viaja solo en esta respuesta; la
        base guarda su hash.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Enlace generado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEnlaceDelGrupo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-07 EMISOR_NO_HABILITADO · AP-CU69-01 SIN_CUPOS_LIBRES · AP-CU69-12 GRUPO_TODAVIA_NO_ABIERTO

  /grupos/{grupoId}/enlace-del-grupo/anulacion:
    post:
      operationId: anularEnlaceDelGrupo
      summary: El organizador anula el enlace activo del grupo; deja de servir
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Anulado (o no habia enlace activo)
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-07 EMISOR_NO_HABILITADO

  /grupos/enlace-del-grupo/consultar:
    post:
      operationId: consultarEnlaceDelGrupo
      summary: Ver el grupo de un enlace vigente, sin datos de sus integrantes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaCodigoDeEnlace' }
      responses:
        '200':
          description: Lo necesario para decidir si pedir unirse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleEnlaceDelGrupo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-11 ENLACE_INVALIDO

  /grupos/enlace-del-grupo/solicitudes:
    post:
      operationId: solicitarIngresoPorEnlace
      summary: Pedir unirse al grupo con su enlace; queda PENDIENTE de que el organizador apruebe
      description: >-
        Mismas precondiciones que postular (CU-68): KYC, restricciones, reputacion, cupos.
        Repetir devuelve la misma solicitud pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaSolicitudPorEnlace' }
      responses:
        '201':
          description: Solicitud pendiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaSolicitudPorEnlace' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-11 ENLACE_INVALIDO · AP-CU69-03 YA_ES_PARTICIPANTE
          # AP-CU68-02 KYC_INSUFICIENTE · AP-CU68-04 SIN_CUPOS_LIBRES · AP-CU68-01 RESTRICCION_VIGENTE
          # AP-CU69-17 GRUPO_YA_INICIADO · AP-CU68-03 REPUTACION_INSUFICIENTE (detalle.etapaMinima)
          # AP-CU69-18 DESBLOQUEO_DE_ETAPA_EXCEDIDO (detalle.cuposMax, detalle.aporteMax, detalle.moneda)

  /grupos/invitaciones/enlace/consultar:
    post:
      operationId: consultarInvitacionPorEnlace
      summary: Ver grupo y reglamento de una invitación válida para mi teléfono
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaEnlaceInvitacion' }
      responses:
        '200':
          description: Datos necesarios para decidir si aceptar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleEnlaceInvitacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'

  /grupos/invitaciones/enlace/aceptar:
    post:
      operationId: aceptarInvitacionPorEnlace
      summary: Firmar el reglamento y ocupar un cupo usando el enlace una sola vez
      description: >-
        INTERRUPTOR `aportaya.grupos.admision.humana-obligatoria` (decision pendiente de negocio y cumplimiento): encendido
        (valor de produccion) esta puerta, que crea al participante ACTIVO sin expediente humano, se cierra con 422
        `AP-CU69-10`; el camino es el canje de la invitacion (`canjearInvitacion`), que deja una solicitud pendiente de
        backoffice. Apagado conserva el comportamiento de TEST.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAceptacionInvitacion' }
      responses:
        '201':
          description: Participación y cupo creados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAceptacionInvitacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-10 ADMISION_HUMANA_OBLIGATORIA · AP-CU69-17 GRUPO_YA_INICIADO
          # AP-CU68-03 REPUTACION_INSUFICIENTE (detalle.etapaMinima)
          # AP-CU69-18 DESBLOQUEO_DE_ETAPA_EXCEDIDO (detalle.cuposMax, detalle.aporteMax, detalle.moneda)

  /grupos/obligaciones/admisibilidad:
    get:
      operationId: consultarAdmisibilidadDePago   # CU-21
      summary: Si quien pregunta puede pagar esa obligacion, y si el periodo sigue abierto
      description: >-
        Lo pregunta `aportes` ANTES de registrar un pago (B15/B5). `esDelUsuario` es si el
        participante es la persona de la sesion: pagar la obligacion de otro no es un favor, es
        un registro falso. `periodoAbierto` es falso para un periodo CERRADO, LIQUIDADO o
        CANCELADO; PROGRAMADO y EN_GRACIA siguen admitiendo el pago.
      parameters:
        - name: participanteId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: periodoId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: La admisibilidad, sin datos de nadie mas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdmisibilidadDePago' }

  /grupos/periodos/{periodoId}/calendario-de-aportes:
    get:
      operationId: consultarCalendarioDeAportes   # CU-21 · H8.S1.M1 (el productor del hecho que `aportes` consume)
      summary: Quien aporta, cuanto y hasta cuando en un periodo (hecho de grupos para generar obligaciones)
      description: >-
        [CONTRATO · LO PIDE `aportes`] Para generar las obligaciones de un periodo `aportes` no cree nada que
        afirme el cliente: pregunta aqui quien es titular de cada cupo OCUPADO, el turno (numero de periodo),
        cuanto aporta cada cupo y las fechas del reglamento. El importe de un cupo es el aporte del grupo por
        la fraccion del cupo (redondeo half-even a 2 decimales; las fracciones distintas de 1 son una
        ambiguedad abierta, ver docs/trabajo/2026-10-08-endurecimiento-integral/evidencia/carril-B3/). Exige
        `ADMIN_PLATAFORMA`: es el permiso de quien dispara la generacion y su token viaja en la llamada entre
        servicios; un participante recibe 403 aunque sea titular de un cupo del periodo, porque el calendario
        enumera a TODOS los titulares. Se lee con rol de sistema (la politica de fila no deja ver cupos ajenos)
        y la autorizacion ya la hizo el permiso. Un periodo que no existe responde 422 `AP-CU21-08`.
      parameters:
        - name: periodoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El calendario de aportes del periodo, tal cual lo afirma grupos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarioDeAportes' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'

  /grupos/mis-limites:
    get:
      operationId: consultarMisLimites          # CU-69
      summary: Cuantos grupos organizo y en cuantos participo, contra su tope
      description: >-
        Para que la app muestre los contadores y no ofrezca lo que el servidor va a rechazar. Los topes se
        aplican al crear (AP-CU20-06) y al entrar a un grupo (AP-CU69-15); esto solo los informa.
        `limiteDeOrganizar` es nulo si la persona no esta habilitada como organizadora.
      responses:
        '200':
          description: Mis contadores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisLimites' }

  /grupos/participaciones:
    get:
      operationId: listarMisParticipaciones      # CU-68
      summary: Los grupos en los que participo
      description: >-
        Lo que la app necesita para abrir sus pantallas (estado de aporte, retiro): el
        identificador de MI participacion en cada grupo. Solo lo propio, nunca el de otros.
      responses:
        '200':
          description: Mis participaciones vigentes, la mas reciente primero
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/Participacion' }

  /grupos/{grupoId}/solicitudes:
    get:
      operationId: listarSolicitudesDeIngreso   # CU-68
      summary: Solicitudes de ingreso PENDIENTES de un grupo
      description: >-
        La cola del organizador: quien pidio entrar, con el puntaje y el motivo que
        escribio. Solo las PENDIENTES; las resueltas quedan en el historial.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Solicitudes pendientes, la mas antigua primero
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items: { $ref: '#/components/schemas/SolicitudDeIngreso' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'

  /grupos/{grupoId}/detalle:
    get:
      operationId: consultarDetalleDelGrupo     # CU-69
      summary: El grupo visto por uno de sus integrantes
      description: >-
        Resumen del grupo y una fila por cupo: quien lo ocupa (nombre visible), si ya firmo el
        reglamento y su turno cuando hubo sorteo. Solo para integrantes del grupo. No lleva telefono
        ni correo de nadie (decision del dueño 2026-10-20). Dice ademas si quien consulta tiene que
        firmar y si puede iniciar el sorteo.

        Etapa de cada ocupante (decision del dueño 2026-10-30): solo la etapa (codigo y nombre),
        nunca el puntaje, y solo a quien integra el grupo (la misma barrera de `AP-CU69-14`). Grupos
        la lee de `transparencia` con su identidad de servicio `SERVICIO_GRUPOS`
        (`GET /reputacion/etapas/de-personas`); ya no usa `GET /reputacion/{usuarioId}/puntaje` para
        otra persona, que ahora responde 403. Si transparencia no contesta, el detalle sale igual
        sin `etapa` en cada integrante (la etapa aca es informativa; para decidir un ingreso
        se falla cerrado).
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El grupo y sus cupos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetalleDelGrupo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-14 NO_ES_INTEGRANTE

  /grupos/{grupoId}/integrantes/{usuarioId}/comparte:
    get:
      operationId: consultarSiCompartenGrupo    # perfil del integrante (2026-10-21)
      summary: Si quien pregunta y otra persona son integrantes del mismo grupo
      description: >-
        Lo preguntan `identidad` (el telefono) y `transparencia` (la reputacion) antes de mostrarle a
        alguien el perfil de un integrante: el dueño decidio el 2026-10-21 que esos datos los ve solo
        quien esta en el mismo grupo, y la pertenencia es de este servicio. Quien pregunta sale del
        token, nunca de la peticion. Integrante es quien esta en el grupo y no se fue (ni RETIRADO,
        EXPULSADO, REEMPLAZADO, POSTULANTE o INVITADO), igual que en `/detalle`. No dice nada mas:
        ni el estado ni el cupo del otro.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Si los dos son integrantes del grupo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PertenenciaCompartida' }

  /grupos/{grupoId}/reglamento/firma:
    post:
      operationId: firmarReglamentoDelGrupo     # CU-69
      summary: Firmar el reglamento y ocupar el cupo reservado
      description: >-
        Quien fue aceptado (o el organizador) firma el texto EXACTO del reglamento, identificado por
        su hash: queda ACTIVO y su cupo pasa de RESERVADO a OCUPADO. Con la ultima firma, si todos los
        cupos estan ocupados, el grupo pasa a CONFORMADO y se arma su calendario de periodos, que es lo
        que el sorteo necesita. Firmar otra vez no repite nada.

        Version nueva (2026-10-30): la misma operacion acepta la version vigente cuando quien ya es
        integrante ACTIVO no la tiene aceptada (la que publica `iniciarGrupo` al achicar). Manda el
        hash de esa version (`DetalleDelGrupo.reglamento.hash`): se registra su aceptacion para esa
        version y el cupo no cambia. Un hash que no es el de la version vigente responde
        `AP-CU69-05`. Con la version vigente ya aceptada es un reintento: devuelve lo mismo, sin
        otra aceptacion. `AP-CU69-13` queda para quien no integra el grupo, o lo integra y no tiene
        nada que firmar ni aceptar.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaFirmaDeReglamento' }
      responses:
        '200':
          description: La firma y el estado del grupo despues de ella
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaFirmaDeReglamento' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU69-05 REGLAMENTO_CAMBIO · AP-CU69-13 SIN_FIRMA_PENDIENTE · AP-CU69-01 SIN_CUPOS_LIBRES

  /grupos/solicitudes/{solicitudId}/decision:
    post:
      operationId: decidirSolicitudDeIngreso    # CU-68
      summary: Aceptar o rechazar una solicitud de ingreso
      description: >-
        Quien decide es el organizador del grupo o backoffice (ADMIN_PLATAFORMA): sin propuesta del organizador
        no hay expediente que backoffice pueda resolver, y la solicitud quedaba sin nadie que la decidiera.
        Nadie decide su propia solicitud. Aceptada, EN LA MISMA TRANSACCION:
        se reserva un cupo libre, nace el participante pendiente de firmar el
        reglamento y se emite el evento. Rechazada, queda el motivo en el evento.

        INTERRUPTOR `aportaya.grupos.admision.humana-obligatoria` (decision pendiente de negocio y cumplimiento): encendido
        (valor de produccion) esta puerta se cierra con 422 `AP-CU68-15` y la decision del organizador pasa por
        `proponerAdmision`, que resuelve backoffice; apagado conserva el comportamiento de TEST.
      parameters:
        - name: solicitudId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDecisionDeIngreso' }
      responses:
        '200':
          description: La solicitud resuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDecisionDeIngreso' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU68-04 SIN_CUPOS_LIBRES · AP-CU68-08 SOLICITUD_NO_ENCONTRADA
          # AP-CU68-09 SOLICITUD_YA_RESUELTA · AP-CU68-10 MOTIVO_REQUERIDO
          # Al ACEPTAR: AP-CU69-17 GRUPO_YA_INICIADO · AP-CU68-03 REPUTACION_INSUFICIENTE (detalle.etapaMinima)
          # AP-CU69-18 DESBLOQUEO_DE_ETAPA_EXCEDIDO (el puntaje pudo bajar desde que se pidio)

  /grupos/{grupoId}/postulaciones:
    post:
      operationId: postularAlGrupo             # CU-68
      summary: Postular a un grupo, con el motivo legible del puntaje
      description: >-
        El postulante ve POR QUE se le propuso ese grupo —monto compatible, gente de
        su zona, riesgo parecido— y nunca los datos de los demas. Un puntaje sin
        explicacion es un numero que nadie puede discutir, y un emparejamiento que
        nadie puede discutir es uno que se acepta por resignacion.

        Los pesos del criterio son datos CON VIGENCIA, no constantes: hay que poder
        explicar con que pesos se armo un grupo de hace seis meses.
      parameters:
        - name: grupoId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaPostulacion' }
      responses:
        '201':
          description: Postulación registrada, con puntaje y motivos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaPostulacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU68-01 RESTRICCION_VIGENTE     · AP-CU68-02 KYC_INSUFICIENTE
          # AP-CU68-03 REPUTACION_INSUFICIENTE · AP-CU68-04 SIN_CUPOS_LIBRES
          # AP-CU68-05 CONCENTRACION_DE_RIESGO · AP-CU68-06 SOLICITUD_DUPLICADA
          # AP-CU68-07 PROPUESTA_EXPIRADA
          # AP-CU69-17 GRUPO_YA_INICIADO · AP-CU68-03 tambien por etapa minima (detalle.etapaMinima)
          # AP-CU69-18 DESBLOQUEO_DE_ETAPA_EXCEDIDO (detalle.cuposMax, detalle.aporteMax, detalle.moneda)

  /grupos:
    post:
      operationId: crearGrupo                  # CU-20
      summary: Crear el grupo y disparar el congelamiento del tarifario
      description: >-
        El grupo nace BORRADOR y emite `grupos.grupo_creado`; `tarifas` congela el
        precio al consumirlo y responde `tarifas.tarifa_congelada`, y el grupo pasa a
        ABIERTO_A_INSCRIPCION al consumir esa respuesta. `nucleo-financiero` abre la
        cuenta del grupo al consumir `grupo_creado`; la apertura de inscripciones no
        la espera (supuesto A1, a confirmar con producto y con ese servicio).

        Que nazca en borrador no es un rodeo: un grupo sin precio congelado no puede
        recibir a nadie, porque el precio es justamente lo que cada participante
        acepta al firmar el reglamento. Dejarlo abierto antes seria pedirle a alguien
        que se comprometa a un costo que todavia no existe.

        La cuenta del grupo tiene por titular al GRUPO y nunca al organizador
        (R-GRP-04): si fuera del organizador, la plata del grupo estaria a nombre de
        una persona.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaGrupo' }
      responses:
        '202':
          description: Grupo creado en borrador, a la espera del precio congelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaGrupo' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU20-01 SIN_TARIFARIO_VIGENTE     · AP-CU20-02 ORGANIZADOR_NO_HABILITADO
          # AP-CU20-03 TARIFA_YA_CONGELADA       · AP-CU20-04 SERVICIO_NO_AUTORIZADO
          # AP-CU20-05 KYC_INSUFICIENTE_DEL_CREADOR · AP-CU20-06 LIMITE_DE_GRUPOS_ALCANZADO
          # AP-CU20-07 DESBLOQUEO_DE_ETAPA_EXCEDIDO (cupos o aporte por encima de lo que desbloquea la etapa del
          #            organizador; solo cuentan los desbloqueos VIGENTE · detalle.cuposMax, detalle.aporteMax, detalle.moneda)
          # AP-CU20-08 ETAPA_MINIMA_INVALIDA (no esta en el catalogo, o esta por encima de la etapa del organizador)

  /grupos/participantes/alias/{alias}:
    get:
      operationId: resolverAlias
      summary: A que persona apunta un alias
      description: >-
        La pregunta `nucleo-financiero` para transferir a un alias (CU-12). El alias
        vive en `grupos.participante` y ese esquema no se lee desde afuera
        (invariante 11).

        Devuelve el identificador de la persona y nada mas — ni el nombre, ni el
        telefono, ni la cuenta. La cuenta la resuelve quien la posee: `grupos` no
        conoce `nucleo_financiero.cuenta_billetera`, y esta ruta no es un directorio.
      parameters:
        - name: alias
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: La cuenta del alias, si existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AliasResuelto' }

  /grupos/participantes/{usuarioId}/actividad:
    get:
      operationId: consultarActividad
      summary: Si la persona participa hoy de algun grupo activo
      description: >-
        La pregunta `nucleo-financiero` antes de cerrar una billetera (CU-16): cerrar
        la cuenta de alguien que todavia debe aportar a un pasanaku deja al grupo sin
        de donde cobrarle.
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Cuantos grupos activos tiene
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActividadEnGrupos' }

  /grupos/sorteos/{sorteoId}/paquete:
    get:
      operationId: consultarPaqueteDelSorteo
      summary: El paquete publicado de un sorteo, para poder recomputarlo
      description: >-
        La pregunta `transparencia` para CU-61. Trae lo que hace falta para rehacer el
        sorteo desde afuera: el hash comprometido, la semilla revelada, las entropias,
        el metodo y el orden publicado.

        Antes del revelado la semilla viaja nula, y ese es el punto: comprometer y
        revelar existen para que nadie —nosotros incluidos— pueda elegir el resultado
        despues de conocerlo.
      parameters:
        - name: sorteoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: El paquete del sorteo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaqueteDelSorteo' }

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    EntradaDecisionIngreso:
      type: object
      additionalProperties: false
      required: [decision, motivo, revisionEsperada]
      properties:
        decision: { type: string, enum: [ACEPTAR, RECHAZAR] }
        motivo: { type: string, minLength: 1, maxLength: 1000 }
        revisionEsperada: { type: integer, minimum: 0 }
        propuestaId: { type: string, format: uuid, description: Obligatoria para resolver; debe ser la propuesta vigente }
    EntradaSustitucionAdministrador:
      type: object
      additionalProperties: false
      required: [nuevoAdministradorId, motivo]
      properties:
        nuevoAdministradorId: { type: string, format: uuid, description: Usuario que pasa a administrar }
        motivo: { type: string, minLength: 1, maxLength: 1000 }
    SustitucionAdministrador:
      type: object
      additionalProperties: false
      required: [id, grupoId, salienteParticipanteId, entranteParticipanteId, motivo, obligacionesConservadas, ocurridaEn]
      properties:
        id: { type: string, format: uuid }
        grupoId: { type: string, format: uuid }
        salienteParticipanteId: { type: string, format: uuid }
        entranteParticipanteId: { type: string, format: uuid }
        motivo: { type: string }
        obligacionesConservadas: { type: string }
        ocurridaEn: { type: string, format: date-time }
    DecisionIngreso:
      type: object
      required: [id, solicitudId, fase, decision, actorId, motivo, revision, evidenciaAlgoritmo, ocurridaEn, correlacionId]
      properties:
        id: { type: string, format: uuid }
        solicitudId: { type: string, format: uuid }
        fase: { type: string }
        decision: { type: string }
        actorId: { type: string, format: uuid }
        motivo: { type: string }
        propuestaId: { type: string, format: uuid }
        participanteId: { type: string, format: uuid }
        revision: { type: integer }
        evidenciaAlgoritmo: { type: string }
        versionMotor: { type: string, description: Version (id del criterio) del motor que recomendo }
        recomendacionAlgoritmo: { type: string, enum: [ACEPTAR, REVISION_HUMANA], description: El motor nunca recomienda rechazar por su cuenta }
        apartamiento: { type: boolean, description: La persona decidio en contra de la lectura del motor }
        ocurridaEn: { type: string, format: date-time }
        correlacionId: { type: string, format: uuid }
    EntradaGrupo:
      type: object
      additionalProperties: false
      required: [nombre, montoAporte, periodicidad, cupos, diaCobro, modalidadTurnos, fechaDeInicio]
      properties:
        nombre:       { type: string, minLength: 3, maxLength: 80 }
        montoAporte:  { $ref: '#/components/schemas/Dinero' }
        periodicidad: { type: string, enum: [SEMANAL, QUINCENAL, MENSUAL, BIMENSUAL] }
        cupos:        { type: integer, minimum: 3, maximum: 40 }
        diaCobro:     { type: integer, minimum: 1, maximum: 28 }
        modalidadTurnos:
          type: string
          enum: [SORTEO_ALEATORIO, ORDEN_DE_INGRESO, ACUERDO_MANUAL]
        fechaDeInicio: { type: string, format: date }
        organizadorId:
          type: [string, 'null']
          format: uuid
          description: >-
            Quien lo administra, cuando lo administra alguien. Un grupo sin
            organizador lo lleva la plataforma, y entonces nadie cobra por administrarlo
            (RN-18).
        permitePermutaDeTurnos: { type: boolean, default: false }
        etapaMinima:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z_]{1,29}$'
          description: >-
            Codigo de la etapa minima para entrar (catalogo `GET /reputacion/etapas` de
            `transparencia`). Entra quien tiene un puntaje mayor o igual al `desde` de esa etapa.
            Omitida o nula: la etapa actual del organizador; sin organizador, sin etapa minima.
            No puede estar por encima de la etapa del organizador (AP-CU20-08).
    SalidaGrupo:
      type: object
      additionalProperties: false
      required: [grupoId, fondoPorPeriodo]
      properties:
        grupoId:         { type: string, format: uuid }
        fondoPorPeriodo: { type: string, pattern: '^-?\d+\.\d{2}$' }
    EntradaCompromiso:
      type: object
      additionalProperties: false
      properties:
        entropias:
          type: array
          items: { type: string, maxLength: 120 }
          description: >-
            Lo que aportan los participantes al azar del sorteo. Cuantas mas manos
            distintas, menos posible es que una sola elija el resultado.
    EntradaRevelacion:
      type: object
      additionalProperties: false
      required: [sorteoId]
      properties:
        sorteoId: { type: string, format: uuid }
        semilla:
          type: string
          description: >-
            Obsoleta: ya no se usa y se ignora: la semilla queda sellada en el servidor junto con el
            snapshot del plantel, el calendario y las reglas, y se publica al revelar. Ningun
            cliente la conoce, asi que nadie puede probar semillas hasta que salga el orden
            que le conviene.
        entropias:
          type: array
          items: { type: string, maxLength: 120 }
    EntradaAcuerdo:
      type: object
      additionalProperties: false
      required: [grupoId, tipo, descripcion]
      properties:
        grupoId: { type: string, format: uuid }
        tipo:
          type: string
          enum: [CONDONACION, EXPULSION, PERMUTA, TRASPASO_CUPO, CAMBIO_REGLAMENTO, DISOLUCION, REPETIR_SORTEO]
        descripcion:          { type: string, minLength: 20, maxLength: 1000 }
        referenciaAfectadaId: { type: [string, 'null'], format: uuid }
        usuarioEntranteId:
          type: [string, 'null']
          format: uuid
          description: >-
            Solo en TRASPASO_CUPO, y ahi obligatorio: quien entra al cupo. El grupo vota el traspaso
            a ESA persona, y CU-64 solo acepta el acuerdo para ella.
        diasVotacion:         { type: integer, minimum: 1, maximum: 15, default: 5 }
    EntradaVoto:
      type: object
      additionalProperties: false
      required: [voto]
      properties:
        voto: { type: string, enum: [A_FAVOR, EN_CONTRA, ABSTENCION] }
    AcuerdoDelGrupo:
      type: object
      additionalProperties: false
      required: [acuerdoId, tipo, estado, descripcion, cierraEn]
      properties:
        acuerdoId:            { type: string, format: uuid }
        tipo:                 { type: string, description: Tipo del contrato (TRASPASO_CUPO, PERMUTA, ...) }
        estado:               { type: string, enum: [ABIERTO, APROBADO, EJECUTADO, EXPIRADO, RECHAZADO] }
        descripcion:          { type: string }
        referenciaAfectadaId: { type: [string, 'null'], format: uuid }
        usuarioEntranteId:    { type: [string, 'null'], format: uuid, description: En un traspaso, quien entra al cupo }
        cierraEn:             { type: string, format: date-time }
    SalidaAcuerdo:
      type: object
      additionalProperties: false
      required: [acuerdoId, estado]
      properties:
        acuerdoId: { type: string, format: uuid }
        estado:    { type: string }
    EntradaPermuta:
      type: object
      additionalProperties: false
      required: [turnoOrigenId, turnoDestinoId, contraparteId, motivo]
      properties:
        turnoOrigenId:  { type: string, format: uuid }
        turnoDestinoId: { type: string, format: uuid }
        contraparteId:  { type: string, format: uuid }
        motivo:         { type: string, minLength: 10, maxLength: 300 }
    SalidaPermuta:
      type: object
      additionalProperties: false
      required: [solicitudId, estado]
      properties:
        solicitudId: { type: string, format: uuid }
        estado:      { type: string, enum: [PENDIENTE, ACEPTADA, RECHAZADA, EJECUTADA] }
    EntradaRetiro:
      type: object
      additionalProperties: false
      required: [participanteId, motivo]
      properties:
        participanteId:   { type: string, format: uuid }
        motivo:           { type: string, minLength: 10, maxLength: 400 }
        aceptaPlanDePago: { type: boolean, default: false }
    SalidaRetiro:
      type: object
      additionalProperties: false
      required: [solicitudId, posicion]
      properties:
        solicitudId: { type: string, format: uuid }
        posicion:    { type: string, enum: [ACREEDORA, DEUDORA, NEUTRA] }
    EntradaTraspaso:
      type: object
      additionalProperties: false
      required: [usuarioEntranteId, motivo]
      properties:
        usuarioEntranteId: { type: string, format: uuid }
        motivo:            { type: string, minLength: 10, maxLength: 300 }
        acuerdoId:         { type: [string, 'null'], format: uuid }
    SalidaTraspaso:
      type: object
      additionalProperties: false
      required: [traspasoId]
      properties:
        traspasoId: { type: string, format: uuid }
    EntradaInvitacion:
      type: object
      additionalProperties: false
      required: [telefonoInvitado, canal]
      properties:
        telefonoInvitado: { type: string, pattern: '^\+591\d{8}$' }
        nombreSugerido:   { type: [string, 'null'], maxLength: 80 }
        canal:            { type: string, enum: [ENLACE, SMS, WHATSAPP] }
    SalidaInvitacion:
      type: object
      additionalProperties: false
      required: [mensaje]
      properties:
        invitacionId: { type: [string, 'null'], format: uuid }
        mensaje:      { type: string }
        enlace:       { type: [string, 'null'], description: Enlace para compartir por el canal elegido }
        token: { type: string, description: Secreto para compartir; no registrar ni incluir en URL de consulta }
        expiraEn: { type: string, format: date-time }
    SalidaEnlaceDelGrupo:
      type: object
      additionalProperties: false
      required: [enlaceId, codigo, expiraEn]
      properties:
        enlaceId: { type: string, format: uuid }
        codigo:
          type: string
          pattern: '^[0-9a-f-]{36}\.[0-9a-f]{64}$'
          description: Secreto para compartir (en el enlace y el QR); no registrar
        expiraEn: { type: string, format: date-time }
    EntradaCodigoDeEnlace:
      type: object
      additionalProperties: false
      required: [codigo]
      properties:
        codigo: { type: string, pattern: '^[0-9a-f-]{36}\.[0-9a-f]{64}$' }
    DetalleEnlaceDelGrupo:
      type: object
      additionalProperties: false
      required: [grupoId, nombre, montoAporte, moneda, periodicidad, cuposLibres, expiraEn]
      properties:
        grupoId: { type: string, format: uuid }
        nombre: { type: string }
        montoAporte: { type: string }
        moneda: { type: string }
        periodicidad: { type: string }
        cuposLibres: { type: integer, minimum: 0 }
        expiraEn: { type: string, format: date-time }
    EntradaSolicitudPorEnlace:
      type: object
      additionalProperties: false
      required: [codigo]
      properties:
        codigo: { type: string, pattern: '^[0-9a-f-]{36}\.[0-9a-f]{64}$' }
        mensaje: { type: [string, 'null'], maxLength: 300 }
    SalidaSolicitudPorEnlace:
      type: object
      additionalProperties: false
      required: [solicitudId, grupoId, estado]
      properties:
        solicitudId: { type: string, format: uuid }
        grupoId: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE] }
    EntradaEnlaceInvitacion:
      type: object
      additionalProperties: false
      required: [tokenId, token]
      properties:
        tokenId: { type: string, format: uuid }
        token: { type: string, pattern: '^[0-9a-f]{64}$' }
    EntradaAceptacionInvitacion:
      type: object
      additionalProperties: false
      required: [tokenId, token, hashReglamento, aceptaReglamento]
      properties:
        tokenId: { type: string, format: uuid }
        token: { type: string, pattern: '^[0-9a-f]{64}$' }
        hashReglamento: { type: string, pattern: '^[0-9a-f]{64}$' }
        aceptaReglamento: { type: boolean }
    DetalleEnlaceInvitacion:
      type: object
      additionalProperties: false
      required: [grupoId, nombre, montoAporte, moneda, periodicidad, reglamento, hashReglamento]
      properties:
        grupoId: { type: string, format: uuid }
        nombre: { type: string }
        montoAporte: { type: string }
        moneda: { type: string }
        periodicidad: { type: string }
        reglamento: { type: string }
        hashReglamento: { type: string }
    SalidaAceptacionInvitacion:
      type: object
      additionalProperties: false
      required: [grupoId, participanteId]
      properties:
        grupoId: { type: string, format: uuid }
        participanteId: { type: string, format: uuid }
    CanjeInvitacion:
      type: object
      additionalProperties: false
      required: [token, cuposSolicitados]
      properties:
        token: { type: string, pattern: '^[0-9a-f]{64}$', writeOnly: true }
        cuposSolicitados: { type: integer, minimum: 1, maximum: 3 }
        mensaje: { type: string, maxLength: 300 }
    SalidaCanjeInvitacion:
      type: object
      required: [solicitudId, estado]
      properties:
        solicitudId: { type: string, format: uuid }
        estado: { type: string, enum: [PENDIENTE_BACKOFFICE] }
    EntradaPostulacion:
      type: object
      additionalProperties: false
      required: [cuposSolicitados]
      properties:
        cuposSolicitados: { type: integer, minimum: 1, maximum: 3 }
        mensaje:          { type: [string, 'null'], maxLength: 300 }
    AdmisibilidadDePago:
      type: object
      additionalProperties: false
      required: [esDelUsuario, periodoAbierto]
      properties:
        esDelUsuario:  { type: boolean }
        periodoAbierto: { type: boolean }
    CupoDelCalendario:
      type: object
      additionalProperties: false
      required: [cupoId, participanteId, montoEsperado]
      properties:
        cupoId:         { type: string, format: uuid }
        participanteId: { type: string, format: uuid }
        montoEsperado:  { $ref: '#/components/schemas/Dinero' }
    CalendarioDeAportes:
      type: object
      additionalProperties: false
      required: [periodoId, grupoId, numero, estado, fechaLimitePago, fechaFinGracia, fechaEntregaPrevista, cupos]
      properties:
        periodoId:            { type: string, format: uuid }
        grupoId:              { type: string, format: uuid }
        numero:               { type: integer, minimum: 1, description: el turno del ciclo (un turno por periodo) }
        estado:
          type: string
          enum: [PROGRAMADO, ABIERTO, EN_GRACIA, CERRADO, LIQUIDADO, CANCELADO]
        fechaLimitePago:      { type: string, format: date }
        fechaFinGracia:       { type: string, format: date }
        fechaEntregaPrevista: { type: string, format: date }
        cupos:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/CupoDelCalendario' }
    Participacion:
      type: object
      additionalProperties: false
      required: [grupoId, participanteId, estado]
      properties:
        grupoId:        { type: string, format: uuid }
        participanteId: { type: string, format: uuid }
        estado:         { type: string, maxLength: 40 }
        nombreDelGrupo: { type: [string, 'null'], maxLength: 120, description: Para que la app muestre cada grupo por su nombre }
        montoAporte:    { type: [string, 'null'], description: Aporte por periodo, cadena decimal }
        moneda:         { type: [string, 'null'], maxLength: 3 }
        esOrganizador:  { type: boolean, description: Si quien pregunta administra ese grupo }
    SolicitudDeIngreso:
      type: object
      additionalProperties: false
      required: [solicitudId, usuarioId, cuposSolicitados, estado, fechaSolicitud]
      properties:
        solicitudId:      { type: string, format: uuid }
        usuarioId:        { type: string, format: uuid }
        cuposSolicitados: { type: integer, minimum: 1 }
        mensaje:          { type: [string, 'null'], maxLength: 500 }
        puntaje:          { type: [string, 'null'] }
        nombreVisible:    { type: [string, 'null'], maxLength: 60, description: 'Nombre completo de quien pide entrar por el enlace del grupo (sin telefono ni correo)' }
        porEnlace:        { type: boolean, description: 'La pidio con el enlace del grupo' }
        estado:           { type: string, enum: [PENDIENTE, APROBADA, RECHAZADA, EXPIRADA] }
        fechaSolicitud:   { type: string, format: date-time }
    SolicitudDeAdmision:
      type: object
      additionalProperties: false
      description: Una fila de la bandeja de admisiones del backoffice; no lleva telefono ni correo.
      required: [solicitudId, usuarioId, postulante, grupoId, grupoCodigo, cuposSolicitados, estado, fechaSolicitud]
      properties:
        solicitudId:      { type: string, format: uuid }
        usuarioId:        { type: string, format: uuid }
        postulante:       { type: string, maxLength: 80, description: 'Nombre con que se presento por el enlace del grupo; si no hay, "Usuario" y los primeros 8 caracteres del id' }
        grupoId:          { type: string, format: uuid }
        grupoCodigo:      { type: string, maxLength: 40, description: 'Codigo publico del grupo' }
        cuposSolicitados: { type: integer, minimum: 1 }
        mensaje:          { type: [string, 'null'], maxLength: 500 }
        puntaje:          { type: [string, 'null'] }
        porEnlace:        { type: boolean, description: 'La pidio con el enlace del grupo' }
        estado:           { type: string, enum: [PENDIENTE, ACEPTADA, RECHAZADA, EXPIRADA] }
        fechaSolicitud:   { type: string, format: date-time }
    MisLimites:
      type: object
      additionalProperties: false
      required: [organizados, participaciones, limiteDeParticipar]
      properties:
        organizados:        { type: integer, minimum: 0 }
        limiteDeOrganizar:  { type: [integer, 'null'], minimum: 0 }
        participaciones:    { type: integer, minimum: 0 }
        limiteDeParticipar: { type: integer, minimum: 0 }
    DetalleDelGrupo:
      type: object
      additionalProperties: false
      required: [grupoId, nombre, estado, montoAporte, moneda, periodicidad, cuposTotales, cuposOcupados,
                 soyOrganizador, debeFirmar, puedeSortear, integrantes]
      properties:
        grupoId:        { type: string, format: uuid }
        nombre:         { type: string, maxLength: 120 }
        estado:         { type: string }
        montoAporte:    { type: string, pattern: '^\d+\.\d{2}$' }
        moneda:         { type: string, minLength: 3, maxLength: 3 }
        periodicidad:   { type: string }
        cuposTotales:   { type: integer, minimum: 1 }
        cuposOcupados:  { type: integer, minimum: 0 }
        soyOrganizador: { type: boolean }
        debeFirmar:
          type: boolean
          description: Quien consulta fue aceptado y todavia no firmo el reglamento
        puedeSortear:
          type: boolean
          description: >-
            Quien consulta organiza el grupo, todos firmaron, todos aceptaron la version vigente del
            reglamento y todavia no hubo sorteo
        reglamentoPendienteDeAceptar:
          type: boolean
          default: false
          description: >-
            Quien consulta ya es integrante ACTIVO y no acepto la version vigente del reglamento (la
            nueva que publica `iniciarGrupo` al achicar). La acepta con `firmarReglamentoDelGrupo`
            enviando `reglamento.hash`. Distinto de `debeFirmar`, que es la primera firma de quien
            fue aceptado y todavia tiene el cupo RESERVADO.
        etapaMinima:
          type: [string, 'null']
          pattern: '^[A-Z][A-Z_]{1,29}$'
          description: Codigo de la etapa minima para entrar; nula si el grupo no la pide
        minimoParaIniciar:
          type: integer
          minimum: 1
          description: >-
            Cupos OCUPADO que hacen falta para iniciar: ceil(0,75 × cuposTotales). Solo tiene
            sentido en ABIERTO_A_INSCRIPCION; «faltan N» es minimoParaIniciar − cuposOcupados.
        puedoIniciar:
          type: boolean
          description: >-
            Quien consulta organiza el grupo, el grupo esta en ABIERTO_A_INSCRIPCION, alcanza
            minimoParaIniciar y no hay cupos RESERVADO. Lo que decide es el servidor al iniciar.
        reglamento:
          $ref: '#/components/schemas/ReglamentoParaFirmar'
          description: La version vigente; viene cuando debeFirmar o reglamentoPendienteDeAceptar
        sorteo:     { $ref: '#/components/schemas/SorteoDelDetalle' }
        integrantes:
          type: array
          maxItems: 60
          items: { $ref: '#/components/schemas/IntegranteDelGrupo' }
    GrupoIniciado:
      type: object
      additionalProperties: false
      required: [grupoId, estado, cuposTotales, numPeriodos]
      properties:
        grupoId:      { type: string, format: uuid }
        estado:       { type: string, enum: [CONFORMADO] }
        cuposTotales: { type: integer, minimum: 3, description: Los cupos ocupados al iniciar; los libres dejaron de existir }
        numPeriodos:  { type: integer, minimum: 3, description: Igual a cuposTotales despues del achique }
    ReglamentoParaFirmar:
      type: object
      additionalProperties: false
      required: [texto, hash]
      properties:
        texto:   { type: string }
        hash:    { type: string, pattern: '^[0-9a-f]{64}$' }
        version: { type: integer, minimum: 0, description: La version vigente en `reglamento_grupo` }
    SorteoDelDetalle:
      type: object
      additionalProperties: false
      required: [sorteoId, estado]
      properties:
        sorteoId: { type: string, format: uuid }
        estado:   { type: string, enum: [COMPROMETIDO, REVELADO] }
    PertenenciaCompartida:
      type: object
      additionalProperties: false
      required: [comparten]
      properties:
        comparten: { type: boolean }
    IntegranteDelGrupo:
      type: object
      additionalProperties: false
      required: [numero, estado, esOrganizador, soyYo]
      properties:
        numero:        { type: integer, minimum: 1 }
        cupoId:        { type: string, format: uuid }
        usuarioId:     { type: [string, 'null'], format: uuid }
        nombre:        { type: [string, 'null'], maxLength: 60 }
        estado:        { type: string, enum: [LIBRE, PENDIENTE_FIRMA, FIRMADO] }
        esOrganizador: { type: boolean }
        soyYo:         { type: boolean }
        turno:         { type: [integer, 'null'], minimum: 1 }
        etapa:
          $ref: '#/components/schemas/EtapaDelIntegrante'
          description: >-
            La etapa de reputacion de quien ocupa el cupo (codigo y nombre, nunca el puntaje).
            Ausente en un cupo LIBRE o si transparencia no contesto.
    EtapaDelIntegrante:
      type: object
      additionalProperties: false
      required: [codigo, nombre]
      properties:
        codigo: { type: string, pattern: '^[A-Z][A-Z_]{1,29}$' }
        nombre: { type: string, maxLength: 40 }
    EntradaFirmaDeReglamento:
      type: object
      additionalProperties: false
      required: [hashReglamento, aceptaReglamento]
      properties:
        hashReglamento:   { type: string, pattern: '^[0-9a-f]{64}$' }
        aceptaReglamento: { type: boolean }
    SalidaFirmaDeReglamento:
      type: object
      additionalProperties: false
      required: [participanteId, estadoDelGrupo, grupoConformado]
      properties:
        participanteId:  { type: string, format: uuid }
        estadoDelGrupo:  { type: string }
        grupoConformado: { type: boolean }
    EntradaDecisionDeIngreso:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [ACEPTAR, RECHAZAR] }
        motivo:   { type: [string, 'null'], minLength: 5, maxLength: 300 }
    GrupoDeBackoffice:
      type: object
      additionalProperties: false
      required: [grupoId, codigo, nombre, estado, montoAporte, moneda, periodicidad, cuposTotales, cuposOcupados]
      properties:
        grupoId:       { type: string, format: uuid }
        codigo:        { type: string }
        nombre:        { type: string }
        estado:        { type: string }
        montoAporte:   { type: string, pattern: '^\d+\.\d{2}$', description: Decimal exacto en texto, nunca float }
        moneda:        { type: string, minLength: 3, maxLength: 3 }
        periodicidad:  { type: string }
        cuposTotales:  { type: integer }
        cuposOcupados: { type: integer }
        fechaInicio:   { type: [string, 'null'], format: date }
    CupoDeBackoffice:
      type: object
      additionalProperties: false
      required: [numero, estado, esOrganizador]
      properties:
        numero:        { type: integer }
        estado:        { type: string }
        alias:         { type: [string, 'null'], description: El nombre con que la persona se presento al grupo; null si el cupo esta libre }
        estadoParticipante: { type: [string, 'null'] }
        esOrganizador: { type: boolean }
    DetalleDeGrupoDeBackoffice:
      type: object
      additionalProperties: false
      required: [grupo, cupos]
      properties:
        grupo: { $ref: '#/components/schemas/GrupoDeBackoffice' }
        cupos:
          type: array
          items: { $ref: '#/components/schemas/CupoDeBackoffice' }
    SalidaDecisionDeIngreso:
      type: object
      additionalProperties: false
      required: [solicitudId, estado]
      properties:
        solicitudId:    { type: string, format: uuid }
        estado:         { type: string, enum: [APROBADA, RECHAZADA] }
        participanteId: { type: [string, 'null'], format: uuid }
        cupoId:         { type: [string, 'null'], format: uuid }
    SalidaPostulacion:
      type: object
      additionalProperties: false
      required: [solicitudId, puntaje, motivos]
      properties:
        solicitudId: { type: string, format: uuid }
        puntaje:     { type: string }
        motivos:
          type: array
          items: { type: string }
    AliasResuelto:
      type: object
      additionalProperties: false
      required: [existe]
      properties:
        existe:      { type: boolean }
        usuarioId:   { type: [string, 'null'], format: uuid }
    ActividadEnGrupos:
      type: object
      additionalProperties: false
      required: [gruposActivos]
      properties:
        gruposActivos: { type: integer }
    PaqueteDelSorteo:
      type: object
      additionalProperties: false
      required: [sorteoId, hashComprometido, metodo, cuposEnOrdenOriginal, ordenPublicado]
      properties:
        sorteoId:         { type: string, format: uuid }
        hashComprometido: { type: string }
        semillaRevelada:  { type: [string, 'null'] }
        entropias:
          type: array
          items: { type: string }
        metodo: { type: string }
        cuposEnOrdenOriginal:
          type: array
          items: { type: integer }
        ordenPublicado:
          type: array
          items: { type: integer }
    CompromisoDeSorteo:
      type: object
      additionalProperties: false
      description: >-
        Se publica SOLO el hash. La semilla queda sellada en el servidor, junto al snapshot del
        plantel, el calendario y las reglas, hasta que se revela: devolverla aqui dejaria a quien
        dispara el sorteo precalcular el orden y abandonar o reintentar si no le conviene.
      required: [sorteoId, hashSemilla, algoritmo]
      properties:
        sorteoId:    { type: string, format: uuid }
        hashSemilla: { type: string, minLength: 64, maxLength: 64 }
        algoritmo:   { type: string, enum: [FISHER_YATES_SHA256] }
    RevelacionDeSorteo:
      type: object
      additionalProperties: false
      required: [sorteoId, verificado, cuposEnOrden]
      properties:
        sorteoId:   { type: string, format: uuid }
        verificado: { type: boolean }
        semilla:    { type: string }
        cuposEnOrden:
          type: array
          items: { type: string, format: uuid }
    DiaSalteado:
      type: object
      additionalProperties: false
      required: [fecha, descripcion]
      properties:
        fecha:       { type: string, format: date }
        descripcion: { type: string }
    SalidaPlazoHabil:
      type: object
      additionalProperties: false
      required: [fechaLimite, diasSalteados]
      properties:
        fechaLimite:   { type: string, format: date }
        diasSalteados:
          type: array
          items: { $ref: '#/components/schemas/DiaSalteado' }
    SalidaVencimientoLocal:
      type: object
      additionalProperties: false
      required: [instanteUtc, zonaHoraria, fechaEnUtc, fechaContractual, fechaDeLiquidacion, corridaPorNoHabil, diasSalteados]
      properties:
        instanteUtc:        { type: string, format: date-time }
        zonaHoraria:        { type: string }
        fechaEnUtc:         { type: string, format: date }
        fechaContractual:   { type: string, format: date }
        fechaDeLiquidacion: { type: string, format: date }
        corridaPorNoHabil:  { type: boolean }
        diasSalteados:
          type: array
          items: { $ref: '#/components/schemas/DiaSalteado' }
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
