        nombre: { type: string, description: Nombres y apellidos del operador; nunca correo ni telefono }
        estadoCuenta: { type: string }
        rolCodigo: { type: string }
        ambito: { type: string, enum: [GLOBAL, GRUPO, ORGANIZACION] }
