# Contrato de identidad — OpenAPI 3.1
# SE ESCRIBE PRIMERO, antes que la implementacion (ADR-020). Es lo que permite que
# otro carril genere el cliente y programe contra vos sin esperar a que termines.
#
# Prefijos reservados de este servicio: /identidad /usuarios /sesion /sesiones /roles
#   Una ruta fuera de ellos es un rechazo automatico, no una discusion de diseno.
#   Toda ruta exige sesion: 401 sin token, 403 con rol insuficiente.
#
# BORRADOR DE LA FASE 0 (planes/01 §0.8). El carril dueno lo amplia; NO puede
# romperlo sin avisar, y la prueba de contrato falla en el CI del que rompe.
openapi: 3.1.0
info:
  title: identidad
  version: 1.0.0
  description: >-
    Servicio identidad. Un caso de uso = una operacion, con el codigo CU en el
    operationId. Los importes viajan como CADENA decimal, nunca como number.

servers:
  - url: /api/v1

paths:
  /usuarios/verificaciones/correo:
    post:
      operationId: solicitarVerificacionCorreo
      summary: Enviar el codigo que confirma el correo del alta
      description: >-
        Genera un OTP de seis digitos, guarda solamente su hash y lo envia al correo.
        La respuesta nunca incluye el codigo. Ruta publica porque ocurre antes de que
        exista la cuenta.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudVerificacionCorreo' }
      responses:
        '202':
          description: Codigo aceptado para envio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificacionCorreoSolicitada' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU01-03 CUENTA_YA_EXISTE (detalle.campo = correo): ese correo ya tiene
          # cuenta; se corta aca y no al final del alta · AP-CU01-07 envio fallido

  /usuarios/verificaciones/correo/{verificacionId}/confirmacion:
    post:
      operationId: confirmarVerificacionCorreo
      summary: Confirmar el codigo recibido por correo
      description: >-
        Consume el codigo si coincide, sigue vigente y conserva intentos. Un codigo
        incorrecto nunca confirma el correo y suma un intento fallido.
      parameters:
        - name: verificacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmacionVerificacionCorreo' }
      responses:
        '200':
          description: Correo confirmado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificacionCorreoConfirmada' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /usuarios/verificaciones/correo/{verificacionId}/borrador:
    put:
      operationId: guardarBorradorOnboarding
      summary: Guardar avance del onboarding incompleto
      description: >-
        Permite persistir los datos ingresados en el formulario de alta para que la
        persona pueda retomar su proceso tras validar nuevamente su correo.
      parameters:
        - name: verificacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BorradorOnboarding' }
      responses:
        '200':
          description: Borrador guardado exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BorradorOnboarding' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /usuarios:
    post:
      operationId: registrarUsuario          # CU-01
      summary: Registro y apertura de billetera
      description: >-
        Una transaccion: usuario, KYC, debida diligencia, calificacion de riesgo,
        expediente y cuenta de billetera. Ruta publica: es el unico momento en que
        todavia no hay sesion.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRegistro' }
      responses:
        '202':
          description: >-
            Alta aceptada. Sin `documento`, la cuenta queda INCOMPLETO_KYC: puede
            ingresar y conocer la app, y envia su documento despues con
            `POST /usuarios/{usuarioId}/verificacion`, cuando quiere operar (2026-10-17).

            Con `documento`, el usuario queda PENDIENTE_VERIFICACION y NO opera
            todavia: la debida diligencia la hace `cumplimiento` y la billetera la
            abre `nucleo-financiero` al consumir `identidad.usuario_registrado`.

            Es 202 y no 201 a proposito. El caso de uso describe la salida con
            `cuentaBilleteraId` y `nivelDiligencia`, pero esa cuenta todavia no
            existe cuando esta operacion responde: prometerla seria decirle al
            cliente que ya tiene algo que nadie abrio. Los dos campos viajan cuando
            estan, no antes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRegistro' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU01-01 KYC_RECHAZADO · AP-CU01-02 COINCIDENCIA_EN_LISTA
          # AP-CU01-03 CUENTA_YA_EXISTE (R-BIL-04) · AP-CU01-04 CONTRATO_NO_ACEPTADO
          # AP-CU01-05 SERVICIO_NO_AUTORIZADO (R-LIC-01)
          # AP-CU01-06 CLAVE_RECHAZADA: corta, o derivada del telefono o del documento
          # AP-CU01-07 DOCUMENTO_VENCIDO: la fecha de vencimiento ya paso
          # AP-CU01-12 VERIFICACION_YA_INICIADA (solo en POST /usuarios/{id}/verificacion)
          # AP-CU01-03 lleva detalle.campo = telefono | documento | correo: el dato
          # que ya tiene cuenta, para que el cliente diga CUAL (2026-10-15).
          # Si dos altas con el mismo dato se cruzan, la segunda rebota en el indice
          # unico y sale 409 AP-BD-01 (ver skill errores-api), nunca 500.

  /sesiones:
    post:
      operationId: autenticar                 # CU-04
      summary: Autenticar con MFA y registrar dispositivo
      description: >-
        Ruta publica: es el momento en que todavia no hay sesion. NO lleva
        Idempotency-Key a proposito — cada intento es un hecho distinto y queda
        registrado en intento_autenticacion, incluidos los fallidos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAutenticacion' }
      responses:
        '200':
          description: Sesion abierta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAutenticacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU04-01 CREDENCIAL_INVALIDA · AP-CU04-02 CUENTA_BLOQUEADA
          # AP-CU04-03 FACTOR_REQUERIDO   · AP-CU04-04 TOKEN_VENCIDO
          # AP-CU04-05 DEMASIADOS_INTENTOS · AP-CU04-06 FACTOR_NO_ENROLADO
          # AP-CU04-07 FACTOR_NO_ADMISIBLE (R-SEG-10)
          # AP-CU04-02 tambien para cuenta no habilitada (SUSPENDIDO, BLOQUEADO_SEGURIDAD, BAJA_VOLUNTARIA, BAJA_LABORAL, ELIMINADO)
          # AP-CU04-10 FACTOR_ENVIADO_POR_CORREO: el codigo ya salio al correo verificado (vence en 10 minutos)
      # Con `plataforma: WEB` la respuesta 200 trae ademas `Set-Cookie: aportaya_refresco`
      # (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/sesion), el refresh de ADR-010.
      # Android/iOS reciben el refresh rotatorio en tokenRefresco (cuerpo); WEB lo recibe
      # solo en cookie. El valor en claro no se registra y en la base se guarda su SHA-256.

  /sesion/refrescar:
    post:
      operationId: renovarSesion              # CU-04 · ADR-010
      summary: Renovar el acceso con cookie web o refresh del cuerpo móvil
      description: >-
        Pública por token de acceso. WEB usa la cookie `aportaya_refresco`
        (HttpOnly, Secure, SameSite=Strict); Android/iOS envían `refresco` en el cuerpo
        JSON y reciben el siguiente token en el cuerpo. Si llegan ambas credenciales,
        se prefiere la cookie. Cada uso rota el refresh. Reusar uno ya rotado
        revoca la familia y la sesion (R-SEG-09); dos usos casi simultaneos del mismo
        refresh (ventana de gracia corta) responden 401 sin revocar. Sin credencial,
        vencida, revocada o reusada -> 401.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRenovacion' }
      responses:
        '200':
          description: Acceso renovado; el refresh rotado vuelve por el mismo canal de entrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRenovacion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
          # AP-SES-01 sin refresh valido (ausente, vencido, revocado o reusado)
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU04-08 POLITICA_FALTANTE: no hay fila REFRESCO_SESION en politica_token

  /sesion:
    delete:
      operationId: cerrarSesion
      summary: Cerrar la sesión autenticada actual
      description: >-
        Revoca de forma idempotente la sesión identificada por el reclamo `sesion_id`
        del JWT bearer y todos sus refresh de la familia. No acepta un identificador
        de sesión del cliente, por lo que no puede cerrar una sesión ajena.
      security:
        - bearerAuth: []
      responses:
        '204': { description: Sesión revocada o ya revocada }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /sesion/factores/totp:
    post:
      operationId: iniciarEnrolamientoTotp     # CU-04 (F1.S3.M2)
      summary: Iniciar el enrolamiento del segundo factor TOTP del titular de la sesion
      description: >-
        El titular sale del token (`sub`), nunca del cuerpo: no hay cuerpo. Genera una
        semilla, la guarda cifrada (AES-256-GCM, con version de llave) y la devuelve UNA
        sola vez para que la app de autenticacion la lea. El factor queda inactivo hasta
        confirmarlo con un codigo. Repetir antes de confirmar reemplaza el pendiente. Si el
        titular ya tiene un TOTP confirmado, se rechaza: cambiarlo no se hace por aca.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Enrolamiento pendiente de confirmacion
          headers:
            Cache-Control:
              description: La respuesta lleva la semilla; no se guarda en ningun cache.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaInicioEnrolamientoTotp' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU04-09 FACTOR_YA_ENROLADO

  /sesion/factores/totp/{factorId}/confirmacion:
    post:
      operationId: confirmarEnrolamientoTotp   # CU-04 (F1.S3.M2)
      summary: Confirmar el TOTP con un codigo calculado por la app
      description: >-
        Activa el factor solo si el codigo de seis digitos corresponde a la semilla, en una
        ventana de un paso de 30 s. El factor tiene que ser del titular del token.
      security:
        - bearerAuth: []
      parameters:
        - name: factorId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaConfirmacionTotp' }
      responses:
        '200':
          description: Factor confirmado y activo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaConfirmacionTotp' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU04-04 CODIGO_INVALIDO · AP-CU04-08 ENROLAMIENTO_INEXISTENTE_AJENO_O_CONFIRMADO

  /sesiones/desafios:
    post:
      operationId: abrirDesafioDeStepUp       # CU-04 (step-up)
      summary: Abrir un desafio de segundo factor para una operacion sensible
      description: >-
        Paso 1 del step-up (docs/auditoria-produccion/contratos/step-up-jwt.md). Lleva
        sesion: el desafio es de quien lo abre y de nadie mas.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDesafioDeStepUp' }
      responses:
        '201':
          description: Desafio abierto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDesafioDeStepUp' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU04-06 FACTOR_NO_ENROLADO

  /sesiones/desafios/{desafioId}/verificacion:
    post:
      operationId: verificarDesafioDeStepUp   # CU-04 (step-up)
      summary: Presentar el factor y recibir la evidencia firmada
      description: >-
        Paso 2. El desafio queda consumido, acierte o no el codigo: reintentar sobre el
        mismo es lo que la fuerza bruta necesita. La evidencia dura minutos y sirve para
        UNA operacion del proposito pedido.
      parameters:
        - name: desafioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaVerificacionDeStepUp' }
      responses:
        '200':
          description: Evidencia step-up (JWT)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaEvidenciaDeStepUp' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU04-04 CODIGO_INVALIDO · AP-CU04-08 DESAFIO_CONSUMIDO_O_INEXISTENTE

  /identidad/verificaciones:
    get:
      operationId: listarVerificaciones
      summary: La cola de expedientes esperando una decision humana
      description: >-
        El portal de riesgo. Devuelve quien espera, desde cuando y que fotos tiene
        cargadas — nunca las fotos en si, que se piden una por una y quedan en la
        bitacora como cualquier lectura de dato personal.
      parameters:
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [PENDIENTE, EN_REVISION, APROBADA, RECHAZADA] }
      responses:
        '200':
          description: Los expedientes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExpedienteEnRevision' }

  /identidad/verificaciones/{verificacionId}/fotos/{cara}:
    get:
      operationId: verFotoDelExpediente
      summary: Un enlace de vigencia corta para mirar una foto del expediente
      description: >-
        Devuelve una URL temporal, no el binario: asi el servidor no proxea megabytes
        y el enlace muere solo. Cada llamada es una lectura de dato personal y queda
        registrada.
      parameters:
        - name: verificacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cara
          in: path
          required: true
          schema: { type: string, enum: [ANVERSO, REVERSO, SELFIE, PERFIL_IZQUIERDO, PERFIL_DERECHO] }
      responses:
        '200':
          description: El enlace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnlaceDeFoto' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /identidad/verificaciones/{verificacionId}/fotos/{cara}/contenido:
    get:
      operationId: verContenidoDeFoto
      summary: Los bytes de una foto del expediente, servidos por el servicio dueno
      description: >-
        El binario, no un enlace. `verFotoDelExpediente` devuelve una URL prefirmada
        contra el almacen, y el almacen NO es publico: vive en la red interna, sin
        puerto publicado ni dominio, que es como lo quiere el ADR-034 —«el binario no
        se sirve nunca directo»—. Esa URL sirve entre servicios y es inservible en un
        navegador, que no resuelve `minio:9000`.

        Aca lo entrega el servicio dueno de la tabla, que valida sesion y permiso
        antes de leer un solo byte, y la lectura queda en la bitacora como cualquier
        otra lectura de dato personal. Son fotos de cedula de a una, no megabytes de
        video: proxearlas cuesta menos que abrir el almacen al mundo.
      parameters:
        - name: verificacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cara
          in: path
          required: true
          schema: { type: string, enum: [ANVERSO, REVERSO, SELFIE, PERFIL_IZQUIERDO, PERFIL_DERECHO] }
      responses:
        '200':
          description: La foto
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /identidad/verificaciones/{verificacionId}/decision:
    post:
      operationId: resolverVerificacion
      summary: Aprobar o rechazar la verificacion, a mano
      description: >-
        La decision es de una persona y queda con su nombre: `revisada_por` guarda
        quien decidio y `motivo_rechazo` por que. Rechazar sin motivo no se admite —
        a quien le rechazan la cuenta tiene derecho a saber por que.
      parameters:
        - name: verificacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionDeVerificacion' }
      responses:
        '200':
          description: Resuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteEnRevision' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # Se valida en el servidor, no solo en la pantalla (la UI no es barrera):
          # AP-CU01-08 EXPEDIENTE_YA_RESUELTO · AP-CU01-09 FOTOS_INCOMPLETAS (APROBAR)
          # AP-CU01-10 DOCUMENTO_SIN_VENCIMIENTO (APROBAR) · AP-CU01-11 DOCUMENTO_VENCIDO (APROBAR)
          # (CU-01 flujo 4b, revision manual del expediente: no AP-CU02-*, que es de cumplimiento)

  /usuarios/{usuarioId}/documentos:
    post:
      operationId: subirDocumento
      summary: Sube una foto del documento o la prueba de vida
      description: >-
        La foto NO se guarda en el disco del servicio: va al servidor de archivos y en
        la fila queda una clave de objeto (ADR-034). El tipo se decide leyendo los
        primeros bytes, no por la extension ni por el Content-Type que manda el
        cliente. Devuelve la clave y el SHA-256 para que el expediente quede trazable.

        Quien sube tiene que ser la persona: o presenta el `tokenDeAlta` que devolvio SU alta
        (cabecera `Token-De-Alta`), o es su propia sesion. Cualquier otro caso —token de otro
        usuario, vencido, mal formado, ausente, o un UUID que no existe— responde el MISMO 403,
        sin decir si el usuario existe.
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: Token-De-Alta
          in: header
          required: false
          description: El `tokenDeAlta` de la respuesta del alta. Opcional solo si hay sesion propia.
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cara, archivo]
              properties:
                cara:
                  type: string
                  enum: [ANVERSO, REVERSO, SELFIE, PERFIL_IZQUIERDO, PERFIL_DERECHO]
                  description: Que parte del expediente es esta foto.
                archivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Guardada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArchivoDelExpediente' }
        '403':
          description: No es la persona ni presenta el token de su alta (idéntico exista o no el usuario)
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /usuarios/{usuarioId}/documento/fecha-expiracion:
    put:
      operationId: actualizarFechaExpiracionDocumento
      summary: Completa la fecha de vencimiento del documento propio
      description: >-
        Solo el titular autenticado puede completar o corregir la fecha de su documento.
        Se admite mientras el expediente siga PENDIENTE o EN_REVISION; la persona revisora
        valida la fecha contra el documento fotografiado y esta operacion no aprueba el KYC.
        El usuarioId de la ruta debe coincidir con el sujeto de la sesion.
      security:
        - bearerAuth: []
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FechaExpiracionDocumento' }
      responses:
        '204':
          description: Fecha guardada; la aprobacion sigue siendo manual
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: La sesión pertenece a otra persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
  /usuarios/{usuarioId}/verificacion:
    get:
      operationId: consultarEstadoDeVerificacion
      summary: El estado de la verificacion de quien acaba de registrarse
      description: >-
        Ruta sin sesion obligatoria, igual que `subirDocumento`: el alta no abre sesion, y
        quien recien se registro necesita saber si su cuenta quedo verificada sin tener
        que ingresar primero.

        Pero el `usuarioId` de la URL NO autoriza nada: lo consulta solo la persona. O
        presenta el `tokenDeAlta` que devolvio SU alta (cabecera `Token-De-Alta`), o es su
        propia sesion. Cualquier otro caso —token de otro usuario, vencido, mal formado,
        ausente, sesion de otra persona, o un UUID que no existe— responde el MISMO 403,
        sin decir si el usuario existe, y se decide antes de leer el expediente. La
        respuesta es minima — ni nombre ni documento — y el motivo del rechazo solo viaja
        cuando el estado es RECHAZADA (la persona tiene derecho a saber por que).
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Token-De-Alta
          in: header
          required: false
          description: El `tokenDeAlta` de la respuesta del alta. Opcional solo si hay sesion propia.
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: El estado del expediente, sin datos personales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeVerificacion' }
        '403':
          description: No es la persona ni presenta el token de su alta (idéntico exista o no el usuario)
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU02-xx NO_HAY_EXPEDIENTE
    post:
      operationId: iniciarVerificacion
      summary: La persona ya registrada envia su documento y abre su verificacion
      description: >-
        Para la cuenta que se abrio sin documento (INCOMPLETO_KYC): la verificacion de
        identidad se pide recien cuando la persona quiere operar con dinero (crear o
        unirse a un grupo, mover su billetera), no al crear la cuenta (2026-10-17).

        Solo el titular con su propia sesion; el `usuarioId` de la ruta debe coincidir con
        el sujeto de la sesion (el mismo 403 en cualquier otro caso). Guarda el documento,
        abre la verificacion BASICO y pasa la cuenta a PENDIENTE_VERIFICACION en la misma
        transaccion. Despues, las fotos se suben con `POST /usuarios/{usuarioId}/documentos`
        y la aprobacion sigue siendo de una persona revisora.
      security:
        - bearerAuth: []
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Documento' }
      responses:
        '202':
          description: Verificacion abierta, sin fotos todavia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoDeVerificacion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: La sesión pertenece a otra persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU01-03 CUENTA_YA_EXISTE (detalle.campo = documento)
          # AP-CU01-07 DOCUMENTO_VENCIDO · AP-CU01-10 sin fecha de vencimiento
          # AP-CU01-12 VERIFICACION_YA_INICIADA: la cuenta ya tiene su verificacion

  /usuarios/{usuarioId}/titularidad/verificacion:
    post:
      operationId: verificarTitularidad
      summary: Si el nombre y el documento declarados son los del titular
      description: >-
        Contesta si coinciden; NO dice cuales son. Devolver el nombre y el documento
        guardados convertiria esta ruta en un directorio de clientes para cualquier
        servicio comprometido. El documento ademas se guarda como hash con pimienta:
        lo que se comparan son dos hashes, nunca dos numeros.

        La usa `entregas` antes de registrar una cuenta bancaria — R-SEG-02 exige que
        la cuenta sea de quien la registra, y ese dato vive aca.
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaTitularidad' }
      responses:
        '200':
          description: Si coincide o no
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaTitularidad' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
        '429':
          description: Demasiadas verificaciones de este actor en el ultimo minuto (el si/no repetido es un oraculo)
          headers:
            Retry-After:
              description: Segundos hasta poder volver a preguntar
              schema: { type: integer }

  /usuarios/tokens/invitacion:
    post:
      operationId: emitirTokenDeInvitacion
      summary: El enlace de un solo uso con el que se invita a alguien a un grupo
      description: >-
        `token_verificacion` es de identidad y su politica —vigencia, canales, cuantos
        reenvios— esta sembrada bajo el proposito INVITACION_GRUPO. `grupos` no puede
        escribir esa tabla (invariante 11): pide el token y guarda su identificador.

        Se guarda el hash, nunca el token: quien tenga la base no puede reconstruir los
        enlaces vivos sin la clave secreta. Reintentos id?nticos del emisor recuperan el mismo enlace.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaTokenDeInvitacion' }
      responses:
        '201':
          description: El token emitido, con su valor en claro por unica vez
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaTokenDeInvitacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'

  /usuarios/tokens/invitacion/validar:
    post:
      operationId: validarTokenDeInvitacion
      summary: Verificar un enlace para el titular de la sesión
      description: >-
        Responde solo si el token emitido sigue vigente y el teléfono indicado
        pertenece al usuario autenticado. No consume el token: el canje de un solo
        uso es `consumirInvitacion`, que decide identidad en su propia transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaValidacionInvitacion' }
      responses:
        '200':
          description: Resultado sin datos personales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaValidacionInvitacion' }
  /usuarios/tokens/invitacion/{tokenId}/consumos:
    post:
      operationId: consumirInvitacion
      tags: [Invitaciones]
      parameters:
        - { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CanjeInvitacion' }
      responses:
        '200':
          description: Recibo recuperable solo con el mismo usuario, secreto y clave
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsumoInvitacion' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
  /usuarios/tokens/invitacion/{tokenId}/revocacion:
    post:
      operationId: revocarInvitacion
      tags: [Invitaciones]
      parameters:
        - { name: tokenId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Invitación revocada por su emisor }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'

  /usuarios/busquedas/por-telefono:
    post:
      operationId: buscarUsuarioPorTelefono
      summary: Si ese telefono ya tiene cuenta (el telefono viaja en el cuerpo)
      description: >-
        Lo mismo que `GET /usuarios/por-telefono`, sin el telefono en la URL: una URL queda en
        historiales, proxies y logs de acceso del gateway y de cada salto (regla 90.2.2).
        Es el que tienen que usar los consumidores; el GET queda deprecado hasta que `grupos`
        migre (`HechosPorHttp`) y se retira despues.

        Mismo permiso y misma respuesta: el identificador y nada mas. Lee, no escribe: por eso
        no lleva `Idempotency-Key`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaBusquedaPorTelefono' }
      responses:
        '200':
          description: Si existe, con su identificador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioEncontrado' }

  /usuarios/por-telefono:
    get:
      operationId: buscarPorTelefono
      deprecated: true
      summary: Si ese telefono ya tiene cuenta (DEPRECADO - usar la busqueda por cuerpo)
      description: >-
        DEPRECADO: el telefono viaja en la query. Reemplazo: `POST /usuarios/busquedas/por-telefono`.

        La pregunta `grupos` antes de invitar (CU-69): invitar a quien ya es
        participante es ruido, y para saberlo hay que poder ir del telefono al usuario.

        Devuelve el identificador y nada mas —ni nombre, ni estado, ni cuando entro—.
        Exige permiso: una ruta que dice si un telefono tiene cuenta es, sin permiso,
        una forma de enumerar clientes.
      parameters:
        - name: telefono
          in: query
          required: true
          schema: { type: string, pattern: '^\+591\d{8}$' }
      responses:
        '200':
          description: Si existe, con su identificador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioEncontrado' }

  /usuarios/{usuarioId}/roles/organizador:
    post:
      operationId: activarRolOrganizador
      summary: Firmar el contrato de organizador Aprendiz y conceder el rol ORGANIZADOR
      description: >-
        Solo para uno mismo. Registra la firma como token FIRMA_CONTRATO, pide a
        organizador que firme el contrato aceptado y, si queda habilitado, concede el rol.
        Idempotente. AP-CU90-12 si el usuario no es quien llama, AP-CU90-13 si la firma
        no se pudo completar, AP-CU90-14 si el KYC todavia no esta aprobado.
      parameters:
        - name: usuarioId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRolOrganizador' }
      responses:
        '200':
          description: El rol queda activo (nuevo o ya existente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RolOrganizadorActivado' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
  /usuarios/yo/perfil:
    get:
      operationId: consultarMiPerfil          # CU-07
      summary: Los datos de contacto de la cuenta de la sesion
      description: >-
        Lo que la pantalla de perfil muestra: el correo de la propia cuenta. Se resuelve con
        la sesion, nunca con un id del cliente, asi que nadie lee el de otra persona.
      responses:
        '200':
          description: El perfil de quien pregunta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiPerfil' }
  /usuarios/yo/foto-de-perfil:
    put:
      operationId: cambiarMiFotoDePerfil      # CU-07 (2026-10-28)
      summary: Sube la foto de perfil de la cuenta de la sesion y la deja vigente
      description: >-
        La foto va al servidor de archivos y en `usuario.url_avatar` queda la clave del
        objeto, nunca una URL publica (ADR-034). El tipo se decide por los primeros bytes:
        JPEG o PNG, hasta 5 MB. Es un reemplazo: repetir la subida deja vigente la ultima
        foto, por eso no pide `Idempotency-Key`. Sin id en la ruta: sale de la sesion.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '204':
          description: Guardada; la foto vigente es la recien subida
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
    get:
      operationId: verMiFotoDePerfil          # CU-07 (2026-10-28)
      summary: Los bytes de la foto de perfil de la cuenta de la sesion
      description: >-
        El binario y no un enlace: el almacen vive en la red interna (ADR-034), igual que
        `verContenidoDeFoto`. 404 si la cuenta todavia no tiene foto; la app muestra las
        iniciales. `Cache-Control: private, no-store`.
      responses:
        '200':
          description: La foto
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404':
          description: La cuenta todavia no tiene foto de perfil (sin cuerpo)
  /identidad/contactos/grupos/{grupoId}/integrantes/{usuarioId}:
    get:
      operationId: consultarContactoEnGrupo     # perfil del integrante (2026-10-21)
      summary: El telefono de un integrante, para otro integrante del mismo grupo
      description: >-
        El dueño decidio el 2026-10-21 que el telefono de un integrante lo ve solo quien esta en
        el mismo grupo. La pertenencia es de `grupos`: se le pregunta con el token de quien llama
        (`GET /grupos/{grupoId}/integrantes/{usuarioId}/comparte`) y, si no responde o responde
        que no, es el mismo 403 que para quien no comparte el grupo. Quien pregunta sale del token.
        Devuelve el telefono y nada mas: ni correo, ni documento, ni estado de la cuenta.
      parameters:
        - { name: grupoId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: El telefono del integrante
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactoEnGrupo' }
        '403':
          description: Quien pregunta no comparte el grupo con esa persona, o no se pudo comprobar
  /usuarios/{usuarioId}/kyc:
    get:
      operationId: consultarNivelKyc
      summary: El nivel de verificacion (KYC) vigente de una persona
      description: >-
        Lo pregunta `grupos` (CU-20, CU-68) para exigir el nivel minimo del grupo sin leer
        este esquema (invariante 11). Cada quien lee el suyo; solo backoffice o un proceso
        del sistema leen el de otra persona. Devuelve el nivel y nada mas.
      parameters:
        - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: El nivel vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NivelKyc' }
        '403':
          description: Quien pregunta no es la persona ni un rol que pueda leer el de otra

  /usuarios-internos:
    get:
      operationId: listarUsuariosInternos
      summary: Lista de usuarios internos con sus roles y estado
      description: >-
        Permite filtrar por estado, codigo de rol vigente y busqueda libre. Paginada por cursor (GU-17):
        orden creadoEn descendente y, a igual fecha, id descendente; como mucho `limite` filas (50 si no
        se pide). La pagina siguiente se pide con `antesDe` = creadoEn y `antesDeId` = id de la ultima fila
        recibida; una pagina con menos filas que `limite` es la ultima. El cursor va en los dos parametros
        o en ninguno: a medias, 422 AP-CU08-12. El cursor no lleva datos de la persona (fecha e id).
      parameters:
        - name: estado
          in: query
          required: false
          schema: { type: string }
        - name: rol
          in: query
          required: false
          schema: { type: string }
        - name: busqueda
          in: query
          required: false
          schema: { type: string }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: antesDe, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: antesDeId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Pagina de usuarios internos (vacia si no hay mas)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UsuarioInternoResumen' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU08-12 FILTRO_DE_LISTADO_INVALIDO
    post:
      operationId: crearUsuarioInterno
      summary: Alta de usuario interno con contrasena provisional
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAltaUsuarioInterno' }
      responses:
        '201':
          description: Usuario interno creado exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInternoDetalle' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /usuarios-internos/{id}:
    get:
      operationId: consultarUsuarioInterno
      summary: Ficha completa de un usuario interno
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Detalle del usuario interno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInternoDetalle' }
        '404': { $ref: '#/components/responses/ReglaDeNegocio' }
    patch:
      operationId: actualizarUsuarioInterno
      summary: Actualizar departamento, cargo o suspender con motivo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaActualizarUsuarioInterno' }
      responses:
        '200':
          description: Usuario interno actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInternoDetalle' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /usuarios-internos/{id}/roles:
    put:
      operationId: asignarRolesUsuarioInterno
      summary: Actualizar roles de un usuario interno con motivo (CU-08) — DEPRECADO
      deprecated: true
      description: >-
        DEPRECADO desde 2026-11-24 (GU-05): reemplazado por asignarRolDeOperador y revocarAsignacionDeRol,
        que llevan ambito, vigencia, justificacion y step-up. Se mantiene compatible mientras el backoffice
        migra (lote D); se retira cuando ningun cliente lo llame. Desde GU-06 aplica la DIFERENCIA: los roles
        que siguen conservan quien y cuando los otorgo, solo se revocan los que salen (con el motivo) y solo
        se asignan como GLOBAL los que entran; las sesiones se cierran solo si se quito algun rol. Nadie
        cambia sus propios roles y nunca deja la plataforma sin administrador de accesos.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAsignarRolesUsuarioInterno' }
      responses:
        '200':
          description: Roles actualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInternoDetalle' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU08-08 ROL_NO_ASIGNABLE: rol de participante, de grupo, de anunciante o de servicio (GU-13)

  /usuarios-internos/{id}/desbloquear:
    post:
      operationId: desbloquearUsuarioInterno
      summary: Desbloquear usuario interno con motivo
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDesbloqueoUsuarioInterno' }
      responses:
        '200':
          description: Usuario desbloqueado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsuarioInternoDetalle' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /usuarios-internos/{id}/asignaciones:
    post:
      operationId: asignarRolDeOperador          # CU-08 por asignacion (GU-05, 2026-11-24)
      tags: [Accesos]
      summary: Asignar UN rol a un operador, con ambito, vigencia opcional y justificacion
      description: >-
        CU-08 por asignacion (decision P-2a). Agrega una asignacion sin tocar las demas: quien y cuando
        otorgo los roles que no cambian se conservan (GU-06) y agregar un rol NO cierra sesiones. Exige
        step-up (evidenciaMfa con proposito ADMIN de quien actua, un solo uso) y nadie se asigna nada a si
        mismo. Idempotente por contenido: si ya hay una asignacion viva igual (usuario, rol, ambito,
        ambitoId) responde 200 con la misma asignacionId y yaExistia=true, sin escribir ni emitir nada.
        requiereMfa=true avisa que el destinatario no tiene TOTP confirmado y no podra entrar (R-SEG-10).
        Cada asignacion deja un evento de bitacora y un pedido de aviso (CU-08 § Eventos).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: id
          in: path
          required: true
          description: usuarioId del destinatario (o el id de su perfil interno)
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaAsignacionDeRol' }
      responses:
        '201':
          description: Asignacion creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAsignacionDeRol' }
        '200':
          description: Ya existia una asignacion viva igual; se devuelve sin cambios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaAsignacionDeRol' }
        '400':
          description: El cuerpo no cumple el contrato (campo no declarado, justificacion corta)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ACCESOS_ADMINISTRAR ni USUARIOS_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU08-01 ROL_INEXISTENTE · AP-CU08-02 AMBITO_INCOMPLETO · AP-CU08-03 INCOMPATIBILIDAD_DE_FUNCIONES
          # AP-CU08-04 AUTOASIGNACION · AP-CU08-09 STEP_UP_REQUERIDO · AP-CU08-10 DESTINATARIO_NO_HABILITADO

  /usuarios-internos/asignaciones/{asignacionId}/revocacion:
    post:
      operationId: revocarAsignacionDeRol         # CU-08 por asignacion (GU-05, 2026-11-24)
      tags: [Accesos]
      summary: Revocar UNA asignacion con motivo, cerrando o no las sesiones del titular
      description: >-
        Escribe revocada_en y motivo_revocacion; la fila no se borra (R-AUD-01). cerrarSesiones (true por
        omision) invalida las sesiones del titular en la misma transaccion. Exige step-up; nadie revoca
        sus propias asignaciones; nunca deja la plataforma sin un titular vigente y ACTIVO de
        ACCESOS_ADMINISTRAR (AP-CU08-06). Idempotente: revocar una asignacion ya revocada responde 200 con
        yaEstabaRevocada=true y no escribe ni emite nada. Es POST y no DELETE porque lleva cuerpo (motivo).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: asignacionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRevocacionDeRol' }
      responses:
        '200':
          description: Asignacion revocada (o ya lo estaba)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaRevocacionDeRol' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ACCESOS_ADMINISTRAR ni USUARIOS_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU08-01 (asignacion inexistente) · AP-CU08-04 · AP-CU08-06 ULTIMO_ADMINISTRADOR · AP-CU08-09

  /usuarios-internos/{id}/baja:
    post:
      operationId: darDeBajaUsuarioInterno       # CU-08 flujo alternativo «Baja del empleado» (GU-14)
      tags: [Accesos]
      summary: Baja del empleado — revoca todas sus asignaciones, cierra sus sesiones y conserva el historico
      description: >-
        En un acto: revoca todas las asignaciones vivas con el motivo, cierra todas las sesiones y deja la
        cuenta en BAJA_LABORAL (estado propio de la baja del personal interno; no se borra ni se anonimiza: el historico de quien otorgo que queda).
        Exige step-up, nadie se da de baja a si mismo por aca y nunca deja la plataforma sin
        administrador de accesos. Idempotente: una cuenta ya dada de baja responde 200 con
        yaEstabaDeBaja=true.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaBajaUsuarioInterno' }
      responses:
        '200':
          description: Baja registrada (o ya lo estaba)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaBajaUsuarioInterno' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ACCESOS_ADMINISTRAR ni USUARIOS_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }
          # AP-CU08-04 · AP-CU08-06 · AP-CU08-09 · AP-CU08-10

  /usuarios-internos/accesos/informe:
    get:
      operationId: informeDeAccesos               # CU-08 informe de accesos (GU-08, decision P-6)
      tags: [Accesos]
      summary: Informe de accesos — vivos, por vencer en 7 dias y operadores sin TOTP confirmado
      description: >-
        Una fila por asignacion viva (ni revocada ni vencida). seccion=VIVOS las lista todas,
        POR_VENCER solo las que vencen dentro del horizonte (7 dias por omision) y SIN_TOTP las de rol
        GLOBAL cuyo titular no tiene un TOTP activo y confirmado. Orden determinista: VIVOS y SIN_TOTP por
        apellidos, nombres, rol y asignacionId; POR_VENCER por vigenteHasta y asignacionId. Paginado por
        numero de pagina. Devuelve el nombre del operador, nunca su correo ni su telefono.
      parameters:
        - name: seccion
          in: query
          required: true
          schema: { type: string, enum: [VIVOS, POR_VENCER, SIN_TOTP] }
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 1 } }
        - { name: limite, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: La pagina pedida (vacia si no hay nada o si la pagina pasa del final)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeAccesos' }
        '400':
          description: seccion ausente o fuera de su dominio, pagina o limite fuera de rango
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ACCESOS_ADMINISTRAR ni USUARIOS_INTERNOS_LEER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /usuarios-internos/nombres:
    post:
      operationId: resolverNombresDeUsuariosInternos   # CU-132 (pantalla de parametros, 2026-11-24)
      summary: Nombre de cada operador interno de un lote, para mostrar quien firmo
      description: >-
        El backoffice guarda quien propuso y quien aprobo como identificador (CU-132, CU-08) y necesita
        mostrar un nombre. Devuelve SOLO usuarioId y nombre (nombres y apellidos) de usuarios internos
        ACTIVOS: nada de correo, telefono, documento ni roles. Un id que no es un usuario interno activo
        —un cliente, uno suspendido o uno inexistente— se omite sin decir por que, para no revelar si
        existe. Es una lectura: no lleva Idempotency-Key. Va por POST para que los identificadores no
        viajen en la URL (regla 90.2.2). Mas de 50 ids es 400 por contrato; ids repetidos, 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaNombresDeUsuariosInternos' }
      responses:
        '200':
          description: Los nombres de los ids que son usuarios internos activos, en el orden pedido
          content:
            application/json:
              schema:
                type: array
                maxItems: 50
                items: { $ref: '#/components/schemas/NombreDeUsuarioInterno' }
        '400':
          description: El cuerpo no cumple el contrato (campo no declarado, mas de 50 ids, id no UUID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Quien pregunta no tiene un permiso de backoffice que lo habilite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: AP-CU08-07 — la lista repite un identificador
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /roles:
    get:
      operationId: listarRoles
      summary: Catalogo de roles con departamento, descripcion y permisos
      description: >-
        Sin parametros devuelve el catalogo completo. Con `asignablesAPersonalInterno=true` (GU-13) deja
        afuera los roles que no se otorgan a un humano interno: los de participante (`PARTICIPANTE`,
        `ORGANIZADOR` y todo rol de ambito GRUPO), `ANUNCIANTE` y las identidades de servicio (`SERVICIO_*`).
      parameters:
        - { name: asignablesAPersonalInterno, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Catalogo de roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RolCatalogo' }

    post:
      operationId: crearRol
      tags: [Roles]
      summary: Crear un rol personalizado
      description: >-
        GU-16 (decision P-9). El rol nace GLOBAL, nunca `es_sistema`, con al menos un permiso del catalogo y sin
        un par incompatible (R-SEG-04, AP-CU135-05). El codigo no puede ser SERVICIO_* ni de participante
        (AP-CU135-01). Exige step-up y motivo. Si incluye algun permiso de riesgo ALTO o CRITICO no se crea:
        responde 202 con la solicitud que otra persona debe aprobar. Deja `identidad.rol_creado` o
        `identidad.rol_solicitado` en la bitacora.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDeCreacionDeRol' }
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRol' }
        '202':
          description: Pendiente de aprobacion de otra persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRol' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ROLES_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  # CU-135 (GU-16): AP-CU135-01 CODIGO_INVALIDO · AP-CU135-02 CODIGO_EN_USO · AP-CU135-03 SIN_PERMISOS
  # AP-CU135-04 PERMISO_INEXISTENTE · AP-CU135-05 PAR_INCOMPATIBLE · AP-CU135-06 ROL_DE_SISTEMA
  # AP-CU135-07 ROL_INEXISTENTE · AP-CU135-08 MOTIVO_REQUERIDO · AP-CU135-09 STEP_UP_REQUERIDO
  # AP-CU135-10 CON_ASIGNACIONES_VIGENTES · AP-CU135-11 SOLICITUD_INEXISTENTE · AP-CU135-12 APROBADOR_ES_EL_PROPONENTE
  # AP-CU135-13 ASIGNADO_QUEDARIA_EN_CONFLICTO · AP-CU135-14 SOLICITUD_YA_RESUELTA

  /roles/solicitudes:
    get:
      operationId: listarSolicitudesDeRol
      tags: [Roles]
      summary: Solicitudes de cambio de rol pendientes de la segunda persona (cuatro ojos)
      description: >-
        GU-16. Las propuestas de crear o editar un rol que agrega permisos de riesgo ALTO o CRITICO esperan aca
        a que otra persona las apruebe o las rechace. Lectura: alcanza ROLES_INTERNOS_LEER.
      responses:
        '200':
          description: Solicitudes pendientes, la mas antigua primero (hasta 100)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SolicitudDeRol' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ROLES_INTERNOS_LEER ni ROLES_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /roles/solicitudes/{solicitudId}/aprobacion:
    post:
      operationId: aprobarSolicitudDeRol
      tags: [Roles]
      summary: Aprobar la solicitud de otra persona y aplicar el cambio
      description: >-
        Exige step-up y motivo. La persona que propuso no puede resolver su propia solicitud (AP-CU135-12, y la
        base lo impide). Al aprobar se vuelven a comprobar todas las reglas del rol.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: solicitudId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDeResolucionDeRol' }
      responses:
        '200':
          description: Cambio aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRol' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ROLES_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /roles/solicitudes/{solicitudId}/rechazo:
    post:
      operationId: rechazarSolicitudDeRol
      tags: [Roles]
      summary: Rechazar la solicitud de otra persona, con motivo
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: solicitudId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDeResolucionDeRol' }
      responses:
        '200':
          description: Solicitud rechazada; no se cambio ningun rol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRol' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ROLES_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /roles/{rolId}:
    patch:
      operationId: editarRol
      tags: [Roles]
      summary: Editar un rol personalizado (nombre, descripcion y permisos)
      description: >-
        GU-16. Solo roles personalizados: uno `es_sistema` responde AP-CU135-06. Exige step-up y motivo; el
        conjunto de permisos no puede reunir un par incompatible (AP-CU135-05) ni dejar a un titular vigente en
        conflicto (AP-CU135-13). Si agrega permisos de riesgo ALTO o CRITICO no se aplica: responde 202 con la
        solicitud a cuatro ojos. El codigo no se cambia.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: rolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDeEdicionDeRol' }
      responses:
        '200':
          description: Cambio aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRol' }
        '202':
          description: Pendiente de aprobacion de otra persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRol' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ROLES_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /roles/{rolId}/retiro:
    post:
      operationId: retirarRol
      tags: [Roles]
      summary: Retirar un rol personalizado sin asignaciones vigentes
      description: >-
        El rol queda con retirado_en y no se asigna mas; la fila no se borra. Exige step-up y motivo. Un rol
        con titulares vigentes responde AP-CU135-10. Es POST y no DELETE porque lleva cuerpo (motivo).
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: rolId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDeRetiroDeRol' }
      responses:
        '200':
          description: Rol retirado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRol' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ROLES_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  # CU-136 (GU-18): AP-CU136-01 NOMBRE_INVALIDO · AP-CU136-02 MOTIVO_REQUERIDO · AP-CU136-03 VENCIMIENTO_INVALIDO
  # AP-CU136-04 STEP_UP_REQUERIDO · AP-CU136-05 SIN_ROL_DE_SERVICIO · AP-CU136-06 YA_REGISTRADA
  # AP-CU136-07 CUENTA_INEXISTENTE · AP-CU136-08 CUENTA_REVOCADA · AP-CU136-09 NADIE_SE_GOBIERNA_A_SI_MISMO
  # AP-CU136-10 SIN_CREDENCIAL
  /cuentas-servicio:
    get:
      operationId: listarCuentasDeServicio
      tags: [CuentasDeServicio]
      summary: Cuentas de servicio registradas, con su vencimiento y la ultima rotacion de su clave
      description: >-
        GU-18. Nunca devuelve una credencial ni su hash: solo cuando vence y cuando se roto por ultima vez.
      responses:
        '200':
          description: Cuentas registradas, la mas reciente primero (hasta 200)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CuentaDeServicio' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ACCESOS_ADMINISTRAR ni USUARIOS_INTERNOS_LEER
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: registrarCuentaDeServicio
      tags: [CuentasDeServicio]
      summary: Registrar una cuenta de servicio ya aprovisionada, con nombre y vencimiento
      description: >-
        GU-18 (decision P-10). El usuario ya existe y porta un rol SERVICIO_* vigente (se aprovisiona fuera del
        repositorio); registrarla le pone nombre, vencimiento y dueño, y la deja bajo gobierno. Los permisos son los del
        rol SERVICIO_*: no se agregan permisos sueltos. Exige step-up y motivo; nadie gobierna su propia cuenta.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDeAltaDeCuentaDeServicio' }
      responses:
        '201':
          description: Cuenta registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeAltaDeCuentaDeServicio' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ACCESOS_ADMINISTRAR ni USUARIOS_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /cuentas-servicio/{cuentaId}/rotacion:
    post:
      operationId: rotarCredencialDeCuentaDeServicio
      tags: [CuentasDeServicio]
      summary: Rotar la clave de la cuenta; la credencial nueva se entrega UNA sola vez
      description: >-
        Genera una credencial aleatoria, guarda solo su hash (la anterior pasa al historial), cierra las sesiones vigentes
        de la cuenta y devuelve el valor en esta respuesta, que no se vuelve a poder pedir ni aparece en logs, eventos ni
        lecturas. La respuesta lleva Cache-Control no-store. El servicio que la usa tiene que recibir la nueva clave antes
        de su proxima autenticacion. Exige step-up y motivo.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDeRotacionDeCuentaDeServicio' }
      responses:
        '200':
          description: Credencial rotada; el valor viene solo en esta respuesta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRotacionDeCuentaDeServicio' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ACCESOS_ADMINISTRAR ni USUARIOS_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /cuentas-servicio/{cuentaId}/revocacion:
    post:
      operationId: revocarCuentaDeServicio
      tags: [CuentasDeServicio]
      summary: Revocar la cuenta — pierde su rol, su clave vence y sus sesiones se cierran
      description: >-
        Deja la cuenta REVOCADA (no vuelve a ACTIVA: se registra otra), revoca sus asignaciones de rol, vence la
        credencial, suspende al usuario y cierra sus sesiones, todo en una transaccion. Exige step-up y motivo.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - name: cuentaId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDeRevocacionDeCuentaDeServicio' }
      responses:
        '200':
          description: Cuenta revocada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalidaDeRevocacionDeCuentaDeServicio' }
        '400':
          description: El cuerpo no cumple el contrato
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403':
          description: Sin ACCESOS_ADMINISTRAR ni USUARIOS_INTERNOS_GESTIONAR
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ReglaDeNegocio' }

  /permisos:
    get:
      operationId: listarPermisos
      summary: Catalogo de permisos
      responses:
        '200':
          description: Catalogo de permisos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PermisoCatalogo' }

  # ---------------------------------------------------------------------------------
  # CU-134 · Directorio y ficha del participante, y suspension o bloqueo de su cuenta
  # por seguridad con debido proceso. Errores AP-CU134-01..11:
  #   AP-CU134-01 JUSTIFICACION_INSUFICIENTE · AP-CU134-02 ACTUA_SOBRE_SI_MISMO
  #   AP-CU134-03 SEGUNDO_FACTOR_REQUERIDO   · AP-CU134-04 CAUSAL_FUERA_DE_CATALOGO
  #   AP-CU134-05 CAUTELAR_NO_ADMITIDA       · AP-CU134-06 EXPEDIENTE_ABIERTO
  #   AP-CU134-07 PLAZO_DESCARGO_ABIERTO     · AP-CU134-08 MISMA_PERSONA
  #   AP-CU134-09 APELACION_DUPLICADA        · AP-CU134-10 EXPEDIENTE_PRESCRITO
  #   AP-CU134-11 RECLAMO_EN_CURSO
  # El termino buscado y la justificacion viajan en el cuerpo, nunca en la URL (regla 90.2.2).
  # ---------------------------------------------------------------------------------
  /identidad/participantes/busquedas:
    post:
      tags: [Participantes]
      operationId: buscarParticipantes
      summary: Directorio de participantes, paginado, con rastro de la busqueda (CU-134)
      description: >-
        Devuelve por fila solo codigo publico, nombre abreviado, estado, nivel KYC, fecha de
        registro y marcas. Cada busqueda escribe registro_acceso_datos (BUSQUEDA) con la
        justificacion. Orden fechaRegistro descendente y, a igual fecha, id descendente; la pagina
        siguiente se pide con el cursor de la ultima fila.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaBusquedaParticipantes' }
      responses:
        '200':
          description: Pagina de participantes (vacia si no hay coincidencias)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeParticipantes' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-01 JUSTIFICACION_INSUFICIENTE

  /identidad/participantes/{usuarioId}/ficha:
    post:
      tags: [Participantes]
      operationId: abrirFichaDeParticipante
      summary: Ficha enmascarada del participante, con registro de la lectura (CU-134)
      description: >-
        Contacto enmascarado, participacion sin importes y medidas vigentes. No devuelve saldo,
        movimientos, cuentas ni casos de cumplimiento. Si no se puede registrar la lectura, no
        se muestra.
      parameters:
        - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaJustificacionDeLectura' }
      responses:
        '200':
          description: Ficha enmascarada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FichaDeParticipante' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '404': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-01 JUSTIFICACION_INSUFICIENTE · AP-CU134-02 ACTUA_SOBRE_SI_MISMO

  /identidad/participantes/{usuarioId}/revelaciones:
    post:
      tags: [Participantes]
      operationId: revelarDatoDeParticipante
      summary: Revela un campo de contacto, con segundo factor y rastro (CU-134)
      parameters:
        - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaRevelacion' }
      responses:
        '200':
          description: El valor del campo pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DatoRevelado' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '404': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-01 · AP-CU134-02 · AP-CU134-03 SEGUNDO_FACTOR_REQUERIDO

  /identidad/participantes/{usuarioId}/medidas:
    post:
      tags: [Participantes]
      operationId: proponerMedidaDeCuenta
      summary: Abre el expediente de una suspension o un bloqueo cautelar (CU-134)
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaMedidaDeCuenta' }
      responses:
        '201':
          description: Expediente abierto (o el mismo, si se reintenta con la misma clave)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteDeMedida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-02 · AP-CU134-04 CAUSAL_FUERA_DE_CATALOGO · AP-CU134-05 CAUTELAR_NO_ADMITIDA · AP-CU134-06 EXPEDIENTE_ABIERTO

  /identidad/medidas-cuenta/{expedienteId}:
    get:
      tags: [Participantes]
      operationId: consultarExpedienteDeMedida
      summary: Expediente con su linea de tiempo y sus plazos (operador o titular) (CU-134)
      parameters:
        - { name: expedienteId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: El expediente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteDeMedida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '404': { $ref: '#/components/responses/ReglaDeNegocio' }

  /identidad/medidas-cuenta/{expedienteId}/notificacion:
    post:
      tags: [Participantes]
      operationId: registrarNotificacionDeMedida
      summary: Acredita la entrega del aviso y hace correr el plazo de descargo (CU-134)
      description: >-
        La invoca el servicio de notificaciones con el acuse de entrega. El plazo de descargo se
        calcula aca, en dias habiles, y se guarda; un segundo acuse no lo mueve.
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - { name: expedienteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaNotificacionDeMedida' }
      responses:
        '200':
          description: Expediente con el plazo guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteDeMedida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-10 EXPEDIENTE_PRESCRITO

  /identidad/medidas-cuenta/{expedienteId}/descargo:
    post:
      tags: [Participantes]
      operationId: presentarDescargoDeMedida
      summary: El titular presenta su descargo con evidencias (CU-134)
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - { name: expedienteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDescargoDeMedida' }
      responses:
        '200':
          description: Descargo agregado al expediente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteDeMedida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-10 EXPEDIENTE_PRESCRITO

  /identidad/medidas-cuenta/{expedienteId}/decision:
    post:
      tags: [Participantes]
      operationId: decidirMedidaDeCuenta
      summary: Decision motivada por una persona distinta de quien propuso (CU-134)
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - { name: expedienteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDecisionDeMedida' }
      responses:
        '200':
          description: Expediente decidido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteDeMedida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-03 · AP-CU134-07 PLAZO_DESCARGO_ABIERTO · AP-CU134-08 MISMA_PERSONA · AP-CU134-10 · AP-CU134-11 RECLAMO_EN_CURSO

  /identidad/medidas-cuenta/{expedienteId}/apelacion:
    post:
      tags: [Participantes]
      operationId: apelarMedidaDeCuenta
      summary: Una sola apelacion por expediente (CU-134)
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - { name: expedienteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaDescargoDeMedida' }
      responses:
        '201':
          description: Apelacion presentada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteDeMedida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-09 APELACION_DUPLICADA

  /identidad/medidas-cuenta/{expedienteId}/apelacion/resolucion:
    post:
      tags: [Participantes]
      operationId: resolverApelacionDeMedida
      summary: Resuelve la apelacion una tercera persona (CU-134)
      parameters:
        - $ref: '#/components/parameters/ClaveIdempotencia'
        - { name: expedienteId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaResolucionDeApelacion' }
      responses:
        '200':
          description: Apelacion resuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteDeMedida' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }
        '422':
          $ref: '#/components/responses/ReglaDeNegocio'
          # AP-CU134-03 · AP-CU134-08 MISMA_PERSONA

  /identidad/participantes/{usuarioId}/medida-vigente:
    get:
      tags: [Participantes]
      operationId: consultarMedidaVigente
      summary: Si el participante tiene una medida vigente que retiene su entrega (servicio a servicio) (CU-134)
      description: >-
        La consulta `entregas` antes de acreditar una entrega (D-11). Devuelve identificadores y
        un booleano, nunca la causal ni la evidencia. Permiso propio `PARTICIPANTES_MEDIDA_VIGENTE_LEER`, que solo
        tiene la credencial de `entregas`: no abre el directorio ni la ficha.
      parameters:
        - { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Estado de la medida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedidaVigente' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/ReglaDeNegocio' }

components:
  parameters:
    ClaveIdempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Toda operacion con efecto la exige. La red duplica; reintentar tiene que ser
        seguro, y la clave se valida ANTES de escribir (invariante 7).
      schema: { type: string, format: uuid }
  schemas:
    EntradaRolOrganizador:
      type: object
      additionalProperties: false
      required: [contratoId, contenidoHash]
      properties:
        contratoId: { type: string, format: uuid }
        contenidoHash: { type: string, maxLength: 64 }
    RolOrganizadorActivado:
      type: object
      additionalProperties: false
      required: [activo, esNuevo]
      properties:
        activo: { type: boolean }
        esNuevo: { type: boolean }
    SolicitudVerificacionCorreo:
      type: object
      additionalProperties: false
      required: [correo]
      properties:
        correo: { type: string, format: email, maxLength: 150 }
    VerificacionCorreoSolicitada:
      type: object
      additionalProperties: false
      required: [verificacionId, destinoEnmascarado, expiraEn]
      properties:
        verificacionId: { type: string, format: uuid }
        destinoEnmascarado: { type: string }
        expiraEn: { type: string, format: date-time }
    ConfirmacionVerificacionCorreo:
      type: object
      additionalProperties: false
      required: [correo, codigo]
      properties:
        correo: { type: string, format: email, maxLength: 150 }
        codigo: { type: string, pattern: '^\d{6}$' }
    VerificacionCorreoConfirmada:
      type: object
      additionalProperties: false
      required: [verificada]
      properties:
        verificada: { type: boolean }
        onboardingIncompleto: { type: boolean }
        borrador: { $ref: '#/components/schemas/BorradorOnboarding' }
    BorradorOnboarding:
      type: object
      additionalProperties: false
      properties:
        correo: { type: string, format: email, maxLength: 150 }
        telefonoE164: { type: string, pattern: '^\+591[67]\d{7}$' }
        nombres: { type: string, maxLength: 80 }
        apellidos: { type: string, maxLength: 80 }
        fechaNacimiento: { type: string, format: date }
        tipoDocumento: { type: string, enum: [CI, PASAPORTE, CARNET_EXTRANJERO] }
        numeroDocumento: { type: string, maxLength: 30 }
        lugarExpedicion: { type: string, maxLength: 5 }
        fechaExpiracion: { type: string, format: date }
        actividadEconomica: { type: string, maxLength: 10 }
        detalleActividad: { type: string, maxLength: 100 }
        origenDeFondos: { type: string, maxLength: 20 }
        detalleOrigen: { type: string, maxLength: 100 }
        montoMensualEstimado: { type: string }
        pasoPendiente: { type: string, enum: [cuenta, correo, documento, datos, actividad, contrato] }
    ContactoEnGrupo:
      type: object
      additionalProperties: false
      required: [telefonoE164]
      properties:
        telefonoE164: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
    MiPerfil:
      type: object
      additionalProperties: false
      required: [usuarioId, correoVerificado, estadoDeCuenta]
      properties:
        usuarioId:        { type: string, format: uuid }
        correo:           { type: [string, 'null'], maxLength: 150 }
        correoVerificado: { type: boolean }
        nombreVisible:
          type: [string, 'null']
          maxLength: 60
          description: >-
            Primer nombre e inicial del apellido («Rosa Q.»): lo que ve el organizador de
            un grupo cuando la persona pide unirse. Null si la cuenta todavia no tiene nombre.
        nombreCompleto:
          type: [string, 'null']
          maxLength: 120
          description: >-
            Nombres y apellidos de la propia cuenta. Lo ve el organizador de un grupo en la
            solicitud de quien pide unirse por el enlace. Null si la cuenta no tiene nombre.
        telefono:
          type: [string, 'null']
          maxLength: 20
          description: Telefono E.164 de la propia cuenta. Null si todavia no lo cargo.
        tieneFotoDePerfil:
          type: boolean
          description: >-
            Si la cuenta tiene foto de perfil. Los bytes se piden aparte con
            `verMiFotoDePerfil`. Opcional para no romper a quien ya consume `MiPerfil`.
        estadoDeCuenta:
          type: string
          description: >-
            INCOMPLETO_KYC: todavia no envio su documento. PENDIENTE_VERIFICACION: lo
            envio y esta en revision. ACTIVO: verificada. La app decide con esto que le
            ofrece a la persona antes de una operacion con dinero.
          enum: [ACTIVO, BAJA_LABORAL, BAJA_VOLUNTARIA, BLOQUEADO_SEGURIDAD, ELIMINADO, INCOMPLETO_KYC, PENDIENTE_VERIFICACION, PRE_REGISTRO, SUSPENDIDO]
    NivelKyc:
      type: object
      additionalProperties: false
      required: [usuarioId, nivel]
      properties:
        usuarioId: { type: string, format: uuid }
        nivel:     { type: string, enum: [NINGUNO, BASICO, INTERMEDIO, COMPLETO] }
    EntradaBusquedaPorTelefono:
      type: object
      additionalProperties: false
      required: [telefono]
      properties:
        telefono: { type: string, pattern: '^\+591\d{8}$' }
    UsuarioEncontrado:
      type: object
      additionalProperties: false
      required: [existe]
      properties:
        existe:    { type: boolean }
        usuarioId: { type: [string, 'null'], format: uuid }
    EntradaTokenDeInvitacion:
      type: object
      additionalProperties: false
      required: [canal, grupoId, telefonoDestino]
      properties:
        canal: { type: string, enum: [ENLACE, SMS, WHATSAPP, CORREO] }
        grupoId: { type: string, format: uuid }
        telefonoDestino: { type: string, pattern: '^\+591\d{8}$', writeOnly: true }
    CanjeInvitacion:
      type: object
      additionalProperties: false
      required: [grupoId, token]
      properties:
        grupoId: { type: string, format: uuid }
        token: { type: string, pattern: '^[0-9a-f]{64}$', writeOnly: true }
    ConsumoInvitacion:
      type: object
      required: [tokenId, grupoId, usuarioId, clave, consumidoEn]
      properties:
        tokenId: { type: string, format: uuid }
        grupoId: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        clave: { type: string, format: uuid }
        consumidoEn: { type: string, format: date-time }
    SalidaTokenDeInvitacion:
      type: object
      additionalProperties: false
      required: [tokenId, token, expiraEn]
      properties:
        tokenId:  { type: string, format: uuid }
        token:    { type: string }
        expiraEn: { type: string, format: date-time }
    EntradaValidacionInvitacion:
      type: object
      additionalProperties: false
      required: [tokenId, token, telefonoE164, kycMinimo]
      properties:
        tokenId: { type: string, format: uuid }
        token: { type: string, pattern: '^[0-9a-f]{64}$' }
        telefonoE164: { type: string, pattern: '^\+591\d{8}$' }
        kycMinimo: { type: string, enum: [NINGUNO, BASICO, INTERMEDIO, COMPLETO] }
    SalidaValidacionInvitacion:
      type: object
      additionalProperties: false
      required: [valido]
      properties:
        valido: { type: boolean }
    EntradaTitularidad:
      type: object
      additionalProperties: false
      required: [nombreCompleto, documento]
      properties:
        nombreCompleto: { type: string, minLength: 3, maxLength: 120 }
        documento:      { type: string, minLength: 5, maxLength: 30 }
    SalidaTitularidad:
      type: object
      additionalProperties: false
      required: [coincide]
      properties:
        coincide: { type: boolean }
    Dinero:
      type: object
      additionalProperties: false
      required: [monto, moneda]
      properties:
        monto:
          type: string
          pattern: '^-?\d+\.\d{2}$'     # CADENA: un number JSON es un doble
        moneda:
          type: string
          enum: [BOB, USD]
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje, trazaId]
      properties:
        codigo:   { type: string, pattern: '^AP-CU\d+-\d{2}$' }
        mensaje:  { type: string }
        detalle:  { type: object }
        trazaId:  { type: string }
    EntradaDesafioDeStepUp:
      type: object
      additionalProperties: false
      required: [proposito]
      properties:
        proposito: { type: string, enum: [RETIRO, CAMBIO_CUENTA, ADMIN] }
    SalidaInicioEnrolamientoTotp:
      type: object
      additionalProperties: false
      required: [factorId, semilla, uriOtpauth]
      properties:
        factorId:   { type: string, format: uuid }
        semilla:    { type: string, description: 'Base32 sin relleno. Se muestra una sola vez.', maxLength: 64 }
        uriOtpauth: { type: string, description: 'otpauth://totp/... para el codigo QR de la app.', maxLength: 512 }
    EntradaConfirmacionTotp:
      type: object
      additionalProperties: false
      required: [codigo]
      properties:
        codigo: { type: string, pattern: '^[0-9]{6}$' }
    SalidaConfirmacionTotp:
      type: object
      additionalProperties: false
      required: [factorId, confirmadoEn]
      properties:
        factorId:     { type: string, format: uuid }
        confirmadoEn: { type: string, format: date-time }
    SalidaDesafioDeStepUp:
      type: object
      additionalProperties: false
      required: [desafioId, expiraEn]
      properties:
        desafioId: { type: string, format: uuid }
        expiraEn:  { type: string, format: date-time }
    EntradaVerificacionDeStepUp:
      type: object
      additionalProperties: false
      required: [factor]
      properties:
        factor: { $ref: '#/components/schemas/FactorPresentado' }
    SalidaEvidenciaDeStepUp:
      type: object
      additionalProperties: false
      required: [evidencia, expiraEn, jti]
      properties:
        evidencia: { type: string, maxLength: 4096 }
        expiraEn:  { type: string, format: date-time }
        jti:       { type: string, format: uuid }
    FactorPresentado:
      type: object
      additionalProperties: false
      required: [tipo, valor]
      properties:
        tipo:  { type: string, enum: [OTP, BIOMETRIA, TOTP] }
        valor: { type: string, maxLength: 12 }
    EntradaAutenticacion:
      type: object
      additionalProperties: false
      description: >-
        Exactamente uno de `telefonoE164` o `correo` identifica la cuenta. Ninguno o los dos
        responde 400 AP-VAL-02. Un correo que no existe responde igual que una credencial
        mala (AP-CU04-01): el ingreso no dice qué cuentas existen.
      required: [huellaDispositivo]
      example:
        telefonoE164: '+59178123456'
        credencial: credencial-de-prueba
        huellaDispositivo: huellaDispositivo-de-prueba
        plataforma: ANDROID
      properties:
        telefonoE164:      { type: string, pattern: '^\+591\d{8}$' }
        correo:            { type: string, format: email, maxLength: 150 }
        credencial:        { type: string, minLength: 8, maxLength: 128 }
        huellaDispositivo: { type: string, maxLength: 128 }
        plataforma:        { type: string, enum: [ANDROID, IOS, WEB] }
        factor:            { $ref: '#/components/schemas/FactorPresentado' }
    SalidaAutenticacion:
      type: object
      additionalProperties: false
      required: [requiereFactorAdicional, dispositivoConfiable]
      properties:
        sesionId:                { type: string, format: uuid }
        expiraEn:                { type: string, format: date-time }
        requiereFactorAdicional: { type: boolean }
        dispositivoConfiable:    { type: boolean }
        tokenAcceso:
          type: string
          description: >-
            El JWT firmado con RS256 que los otros trece servicios validan contra el
            JWKS de identidad (ADR-024). Ausente cuando la respuesta pide un segundo
            factor: recien se emite con la sesion abierta.
        tokenRefresco:
          type: string
          description: >-
            Solo para ANDROID/IOS: token rotatorio que el teléfono guarda en almacenamiento
            seguro y manda en el cuerpo a /sesion/refrescar. WEB recibe el valor solo en
            la cookie HttpOnly.
    EntradaRenovacion:
      type: object
      additionalProperties: false
      required: [refresco]
      properties:
        refresco: { type: string, minLength: 32, maxLength: 256 }
    SalidaRenovacion:
      type: object
      additionalProperties: false
      required: [acceso, rol, permisos]
      properties:
        acceso:
          type: string
          description: El JWT de acceso nuevo, igual al que emite `autenticar`.
        rol:      { type: string }
        permisos:
          type: array
          items: { type: string }
        refresco:
          type: string
          description: Solo si la solicitud envió el refresh en el cuerpo (Android/iOS).
    CaraDelExpediente:
      type: string
      description: >-
        Que parte del expediente es esta foto. Es un schema propio -- y no un enum
        repetido en cada lugar que lista fotos -- porque dos arreglos con el mismo
        enum inline generaban una colision de nombres en el cliente Dart (el tipo
        del campo no coincidia con la clase que el generador emitia).
      enum: [ANVERSO, REVERSO, SELFIE, PERFIL_IZQUIERDO, PERFIL_DERECHO]
    ExpedienteEnRevision:
      type: object
      additionalProperties: false
      required: [verificacionId, usuarioId, nombreCompleto, telefono, estado, iniciadaEn, fotos, documentoVigente]
      properties:
        verificacionId: { type: string, format: uuid }
        usuarioId:      { type: string, format: uuid }
        nombreCompleto: { type: string }
        telefono:      { type: string, description: 'Telefono E.164 de la persona para localizar el expediente en el backoffice.' }
        correo:        { type: string, description: 'Correo declarado por la persona para contacto del operador de verificacion. Ausente en cuentas antiguas sin correo.' }
        documento:      { type: string, description: 'Tipo y lugar de expedicion; el numero NUNCA viaja.' }
        estado:         { type: string, enum: [PENDIENTE, EN_REVISION, APROBADA, RECHAZADA] }
        iniciadaEn:     { type: string, format: date-time }
        resueltaEn:     { type: string, format: date-time }
        motivoRechazo:  { type: string }
        fechaExpiracionDocumento:
          type: string
          format: date
          description: Hasta cuando vale el documento. Ausente si el alta no la trajo.
        documentoVigente:
          type: boolean
          description: >-
            Lo calcula el servidor con la fecha de hoy en La Paz. Falso si el documento
            esta vencido o no tiene fecha: en los dos casos el expediente no se aprueba.
        fotos:
          type: array
          description: Que caras tiene cargadas. Un expediente sin las cinco no se puede aprobar.
          items: { $ref: '#/components/schemas/CaraDelExpediente' }
    EnlaceDeFoto:
      type: object
      additionalProperties: false
      required: [url, vigenteHasta]
      properties:
        url:          { type: string }
        vigenteHasta: { type: string, format: date-time }
    DecisionDeVerificacion:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: { type: string, enum: [APROBAR, RECHAZAR] }
        motivo:   { type: string, maxLength: 160, description: 'Obligatorio al rechazar.' }
    EstadoDeVerificacion:
      type: object
      additionalProperties: false
      required: [verificacionId, estado, fotos]
      description: >-
        El estado minimo que el propio participante puede consultar con el token de su
        alta o con su sesion. A proposito no trae nombre, documento ni nada que identifique
        a otra persona; `motivoRechazo` solo viaja cuando el estado es RECHAZADA.
      properties:
        verificacionId: { type: string, format: uuid }
        estado:         { type: string, enum: [PENDIENTE, EN_REVISION, APROBADA, RECHAZADA] }
        motivoRechazo:  { type: string, maxLength: 160 }
        fechaExpiracionDocumento:
          type: string
          format: date
          description: Fecha declarada por el titular; solo se muestra en su expediente para completar datos faltantes.
        fotos:
          type: array
          description: Que caras tiene cargadas hasta ahora.
          items: { $ref: '#/components/schemas/CaraDelExpediente' }
    FechaExpiracionDocumento:
      type: object
      additionalProperties: false
      required: [fechaExpiracionDocumento]
      properties:
        fechaExpiracionDocumento:
          type: string
          format: date
          description: Fecha que figura en el documento; una persona la verificará antes de aprobar.
    ArchivoDelExpediente:
      type: object
      additionalProperties: false
      required: [cara, claveObjeto, hashArchivo]
      description: >-
        Lo que queda del archivo: donde esta y como comprobar que es el mismo. Nunca
        una URL publica — el binario lo entrega el servicio, con sesion y permisos.
      properties:
        cara:        { type: string, enum: [ANVERSO, REVERSO, SELFIE, PERFIL_IZQUIERDO, PERFIL_DERECHO] }
        claveObjeto: { type: string, example: 's3://identidad/2026/09/9f2c1e4a.jpg' }
        hashArchivo: { type: string, minLength: 64, maxLength: 64 }
        tipoMime:    { type: string }
        bytes:       { type: integer, format: int64 }
    Documento:
      type: object
      additionalProperties: false
      required: [tipo, numero]
      description: >-
        El numero de la cedula boliviana NO es unico por si solo: se repite entre
        departamentos, y lo que lo desambigua es el lugar de expedicion. Sin el, la
        segunda persona con el mismo numero —de otro departamento— chocaba contra la
        unicidad del documento y no podia abrir cuenta.
      properties:
        tipo:   { type: string, enum: [CI, CEX, PASAPORTE] }
        numero: { type: string, minLength: 5, maxLength: 20 }
        lugarExpedicion:
          type: string
          enum: [LP, SC, CB, OR, PT, TJ, CH, BE, PD]
          description: >-
            La extension del carnet: el departamento que lo emitio. Obligatoria para
            `CI` —el servicio la exige— y sin sentido para un pasaporte, que ya es
            unico por numero. No se declara `required` aca porque depende del tipo.
        fechaExpiracion:
          type: string
          format: date
          description: >-
            Hasta cuando vale el documento, tal como figura en el carnet (la escribe la
            persona en el alta). Un documento ya vencido no abre cuenta (AP-CU01-07), y
            sin esta fecha el expediente no se puede aprobar (AP-CU01-10): no hay forma de
            comprobar que el documento este vigente. Opcional en el contrato solo por
            compatibilidad con clientes anteriores; la app la exige.
    EntradaRegistro:
      type: object
      additionalProperties: false      # strict(): lista blanca, no lista negra
      # `documento` es opcional desde 2026-10-17: sin el, la cuenta se abre para conocer la
      # app y la verificacion se pide cuando la persona quiere operar con dinero.
      required: [telefonoE164, nombres, apellidos, fechaNacimiento, correo, aceptaContratos, contrasena, verificacionCorreoId]
      properties:
        telefonoE164:    { type: string, pattern: '^\+591\d{8}$' }
        nombres:         { type: string, minLength: 2, maxLength: 60 }
        apellidos:       { type: string, minLength: 2, maxLength: 60 }
        fechaNacimiento: { type: string, format: date }
        contrasena:
          type: string
          format: password
          writeOnly: true
          minLength: 8
          maxLength: 128
          description: >-
            La clave con la que se va a ingresar. Es obligatoria: el alta no creaba
            credencial y despues no habia con que entrar — se completaban los ocho
            pasos y el formulario de ingreso pedia una contrasena que nunca se eligio.
            El minimo de ocho es el de `PoliticaDeClave`; el resto de la politica
            —no derivada del telefono ni del documento— la aplica el servicio, que es
            el unico que puede.
        correo:
          type: string
          format: email
          maxLength: 150
          description: >-
            Correo que se confirma antes del alta y que luego recibe extractos y
            comprobantes de la billetera.
        verificacionCorreoId:
          type: string
          format: uuid
          description: >-
            Verificacion de correo ya confirmada. Debe corresponder al mismo correo y
            se vincula al usuario dentro de la transaccion del alta.
        canalVerificacion:
          type: string
          enum: [CORREO]
          # Sin `default`: el generador de Dart lo traduce a instanciar un enum, que
          # no es Dart valido y rompe el cliente. La ausencia la resuelve el servicio,
          # que trata `null` como CORREO — y asi hay un solo lugar que decide.
          description: >-
            El alta confirma el correo mediante un codigo de uso unico.
        documento:       { $ref: '#/components/schemas/Documento' }
        aceptaContratos:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
    LimiteAplicable:
      type: object
      additionalProperties: false
      required: [concepto, ventana, monto]
      properties:
        concepto: { type: string }
        ventana:  { type: string }
        monto:    { $ref: '#/components/schemas/Dinero' }
    SalidaRegistro:
      type: object
      additionalProperties: false
      # Solo `usuarioId` y `estado` son obligatorios: son lo unico que existe al
      # responder. La cuenta y sus topes llegan cuando `nucleo-financiero` termina.
      required: [usuarioId, estado]
      properties:
        usuarioId: { type: string, format: uuid }
        estado:
          type: string
          enum: [INCOMPLETO_KYC, PENDIENTE_VERIFICACION, ACTIVO]
        cuentaBilleteraId: { type: string, format: uuid }
        nivelDiligencia:
          type: string
          enum: [SIMPLIFICADA, ESTANDAR, AMPLIADA, REFORZADA]
        limites:
          type: array
          items: { $ref: '#/components/schemas/LimiteAplicable' }
        tokenDeAlta:
          type: string
          description: >-
            Permiso de UN solo proposito —subir las fotos del expediente de ESTE usuario— y vencimiento
            corto. Se manda en la cabecera `Token-De-Alta` de `POST /usuarios/{usuarioId}/documentos`.
            No es una sesion: no sirve para nada mas.
        tokenDeAltaVenceEn: { type: string, format: date-time }

    EntradaNombresDeUsuariosInternos:
      type: object
      additionalProperties: false
      required: [usuarioIds]
      properties:
        usuarioIds:
          type: array
          minItems: 1
          maxItems: 50
          items: { type: string, format: uuid }
    NombreDeUsuarioInterno:
      type: object
      additionalProperties: false
      required: [usuarioId, nombre]
      properties:
        usuarioId: { type: string, format: uuid }
        nombre:
          type: string
          maxLength: 161
          description: Nombres y apellidos del operador, con los espacios normalizados.
    UsuarioInternoResumen:
      type: object
      additionalProperties: false
      required: [id, usuarioId, nombres, apellidos, correo, departamento, cargo, estado, debeCambiarContrasena, tieneSegundoFactor, roles]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        codigoPublico: { type: string }
        nombres: { type: string }
        apellidos: { type: string }
        correo: { type: string, format: email }
        telefono: { type: string }
        departamento: { type: string }
        cargo: { type: string }
        estado: { type: string }
        debeCambiarContrasena: { type: boolean }
        tieneSegundoFactor:
          type: boolean
          description: Tiene un factor activo y confirmado. Uno a medio enrolar no cuenta (GU-17).
        bloqueadoHasta:
          type: string
          format: date-time
          nullable: true
          description: >-
            Fin del bloqueo de acceso vigente (`bloqueo_cuenta`, el que lee el ingreso). Nulo sin bloqueo o
            con un bloqueo indefinido: en ese caso `motivoBloqueo` viene informado (GU-10).
        motivoBloqueo:
          type: string
          nullable: true
          description: Motivo del bloqueo vigente (INTENTOS_FALLIDOS, FRAUDE, ORDEN_ADMIN, SOLICITUD_USUARIO); nulo si no hay.
        roles:
          type: array
          items: { type: string }
        creadoEn:
          type: string
          format: date-time
          description: Alta del usuario; primera mitad del cursor del listado.

    UsuarioInternoDetalle:
      type: object
      additionalProperties: false
      required: [id, usuarioId, nombres, apellidos, correo, departamento, cargo, estado, debeCambiarContrasena, tieneSegundoFactor, roles, permisosEfectivos]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        codigoPublico: { type: string }
        nombres: { type: string }
        apellidos: { type: string }
        correo: { type: string, format: email }
        telefono: { type: string }
        departamento: { type: string }
        cargo: { type: string }
        estado: { type: string }
        debeCambiarContrasena: { type: boolean }
        tieneSegundoFactor:
          type: boolean
          description: Tiene un factor activo y confirmado. Uno a medio enrolar no cuenta (GU-17).
        bloqueadoHasta:
          type: string
          format: date-time
          nullable: true
          description: >-
            Fin del bloqueo de acceso vigente (`bloqueo_cuenta`, el que lee el ingreso). Nulo sin bloqueo o
            con un bloqueo indefinido: en ese caso `motivoBloqueo` viene informado (GU-10).
        motivoBloqueo:
          type: string
          nullable: true
          description: Motivo del bloqueo vigente (INTENTOS_FALLIDOS, FRAUDE, ORDEN_ADMIN, SOLICITUD_USUARIO); nulo si no hay.
        roles:
          type: array
          items: { type: string }
        permisosEfectivos:
          type: array
          items: { type: string }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }

    EntradaAltaUsuarioInterno:
      type: object
      additionalProperties: false
      required: [nombres, apellidos, correo, telefono, departamento, cargo, rolCodigo]
      properties:
        nombres: { type: string, minLength: 2, maxLength: 80 }
        apellidos: { type: string, minLength: 2, maxLength: 80 }
        correo: { type: string, format: email, maxLength: 150 }
        telefono: { type: string, minLength: 8, maxLength: 20 }
        departamento: { type: string, minLength: 2, maxLength: 60 }
        cargo: { type: string, minLength: 2, maxLength: 80 }
        rolCodigo: { type: string, minLength: 2, maxLength: 30 }
        motivo:
          type: string
          minLength: 10
          maxLength: 200
          description: >-
            Por que se da de alta (GU-11, decision P-7). Opcional en el contrato por compatibilidad; el
            servidor lo exige (AP-CU08-11) junto con evidenciaMfa.
        evidenciaMfa:
          type: string
          minLength: 20
          maxLength: 4096
          description: >-
            JWT de evidencia step-up (proposito ADMIN) de quien actua. Obligatoria cuando el acto es de
            gobierno (GU-11): alta, cambio de estado (suspender/reactivar) y desbloqueo. Opcional en el
            contrato para no romper a los clientes que solo editan departamento o cargo.

    EntradaActualizarUsuarioInterno:
      type: object
      additionalProperties: false
      required: [motivo]
      properties:
        departamento: { type: string, maxLength: 60, nullable: true }
        cargo: { type: string, maxLength: 80, nullable: true }
        estado: { type: string, enum: [ACTIVO, SUSPENDIDO], nullable: true }
        motivo: { type: string, minLength: 5, maxLength: 200 }
        evidenciaMfa:
          type: string
          minLength: 20
          maxLength: 4096
          description: >-
            JWT de evidencia step-up (proposito ADMIN) de quien actua. Obligatoria cuando el acto es de
            gobierno (GU-11): alta, cambio de estado (suspender/reactivar) y desbloqueo. Opcional en el
            contrato para no romper a los clientes que solo editan departamento o cargo.

    EntradaAsignarRolesUsuarioInterno:
      type: object
      additionalProperties: false
      required: [roles, motivo]
      properties:
        roles:
          type: array
          minItems: 1
          items: { type: string }
        motivo: { type: string, minLength: 5, maxLength: 200 }

    EntradaDesbloqueoUsuarioInterno:
      type: object
      additionalProperties: false
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 5, maxLength: 200 }
        evidenciaMfa:
          type: string
          minLength: 20
          maxLength: 4096
          description: >-
            JWT de evidencia step-up (proposito ADMIN) de quien actua. Obligatoria cuando el acto es de
            gobierno (GU-11): alta, cambio de estado (suspender/reactivar) y desbloqueo. Opcional en el
            contrato para no romper a los clientes que solo editan departamento o cargo.

    EntradaAsignacionDeRol:
      type: object
      additionalProperties: false
      required: [rolId, ambito, justificacion, evidenciaMfa]
      properties:
        rolId: { type: string, format: uuid }
        ambito: { type: string, enum: [GLOBAL, GRUPO, ORGANIZACION] }
        ambitoId:
          type: string
          format: uuid
          nullable: true
          description: Obligatorio si ambito=GRUPO (el grupoId); prohibido en los demas (AP-CU08-02)
        vigenteHasta:
          type: string
          format: date-time
          nullable: true
          description: Fin del acceso temporal; sin valor el acceso no vence (es una decision, no un descuido)
        justificacion: { type: string, minLength: 10, maxLength: 200 }
        evidenciaMfa:
          type: string
          minLength: 20
          maxLength: 4096
          description: JWT de evidencia step-up (proposito ADMIN) de quien actua; se consume una sola vez

    SalidaAsignacionDeRol:
      type: object
      additionalProperties: false
      required: [asignacionId, usuarioId, rolCodigo, ambito, permisosEfectivos, requiereMfa, yaExistia]
      properties:
        asignacionId: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        rolCodigo: { type: string }
        ambito: { type: string, enum: [GLOBAL, GRUPO, ORGANIZACION] }
        ambitoId: { type: string, format: uuid, nullable: true }
        vigenteHasta: { type: string, format: date-time, nullable: true }
        permisosEfectivos:
          type: array
          items: { type: string }
        requiereMfa:
          type: boolean
          description: true = rol GLOBAL y el destinatario sin TOTP confirmado (SIN_MFA_CONFIGURADO, AP-CU08-05)
        yaExistia: { type: boolean }

    EntradaRevocacionDeRol:
      type: object
      additionalProperties: false
      required: [motivoRevocacion, evidenciaMfa]
      properties:
        motivoRevocacion: { type: string, minLength: 10, maxLength: 120 }
        cerrarSesiones: { type: boolean, default: true }
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096 }

    SalidaRevocacionDeRol:
      type: object
      additionalProperties: false
      required: [asignacionId, usuarioId, revocadaEn, sesionesCerradas, yaEstabaRevocada]
      properties:
        asignacionId: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        revocadaEn: { type: string, format: date-time }
        sesionesCerradas: { type: integer, minimum: 0 }
        yaEstabaRevocada: { type: boolean }

    EntradaBajaUsuarioInterno:
