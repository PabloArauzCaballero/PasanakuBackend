        credencialRotadaEn: { type: string, format: date-time }
        revocadaEn: { type: string, format: date-time, nullable: true }

    EntradaDeAltaDeCuentaDeServicio:
      type: object
      additionalProperties: false
      required: [usuarioId, nombre, venceEn, motivo, evidenciaMfa]
      properties:
        usuarioId: { type: string, format: uuid }
        nombre: { type: string, minLength: 1, maxLength: 80 }
        venceEn: { type: string, format: date-time }
        motivo: { type: string, minLength: 1, maxLength: 160 }
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096 }

    SalidaDeAltaDeCuentaDeServicio:
      type: object
      additionalProperties: false
      required: [cuentaId, usuarioId, rolCodigo, venceEn]
      properties:
        cuentaId: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        rolCodigo: { type: string }
        venceEn: { type: string, format: date-time }

    EntradaDeRotacionDeCuentaDeServicio:
      type: object
      additionalProperties: false
      required: [motivo, evidenciaMfa]
      properties:
        venceEn: { type: string, format: date-time, nullable: true }
        motivo: { type: string, minLength: 1, maxLength: 160 }
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096 }

    SalidaDeRotacionDeCuentaDeServicio:
      type: object
      additionalProperties: false
      required: [cuentaId, credencial, venceEn, sesionesCerradas]
      properties:
        cuentaId: { type: string, format: uuid }
        credencial:
          type: string
          description: El valor de la credencial. Existe SOLO en esta respuesta y no se vuelve a poder pedir.
        venceEn: { type: string, format: date-time }
        sesionesCerradas: { type: integer, minimum: 0 }

    EntradaDeRevocacionDeCuentaDeServicio:
      type: object
      additionalProperties: false
      required: [motivo, evidenciaMfa]
      properties:
        motivo: { type: string, minLength: 1, maxLength: 160 }
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096 }

    SalidaDeRevocacionDeCuentaDeServicio:
      type: object
      additionalProperties: false
      required: [cuentaId, asignacionesRevocadas, sesionesCerradas]
      properties:
        cuentaId: { type: string, format: uuid }
        asignacionesRevocadas: { type: integer, minimum: 0 }
        sesionesCerradas: { type: integer, minimum: 0 }

    PermisoCatalogo:
      type: object
      additionalProperties: false
      required: [id, codigo, descripcion, recurso, accion, nivelRiesgo, exigeMotivo, requiereMfa]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        descripcion: { type: string }
        recurso: { type: string }
        accion: { type: string }
        nivelRiesgo: { type: string, enum: [BAJO, MEDIO, ALTO, CRITICO] }
        exigeMotivo: { type: boolean }
        requiereMfa: { type: boolean }

    # --- CU-134 ---------------------------------------------------------------------
    EntradaBusquedaParticipantes:
      type: object
      additionalProperties: false
      required: [justificacion]
      properties:
        codigoPublico:   { type: string, maxLength: 12 }
        telefonoE164:    { type: string, maxLength: 20, pattern: '^\+\d{8,15}$' }
        estado:          { type: string, enum: [ACTIVO, BAJA_VOLUNTARIA, BLOQUEADO_SEGURIDAD, ELIMINADO, INCOMPLETO_KYC, PENDIENTE_VERIFICACION, PRE_REGISTRO, SUSPENDIDO] }
        justificacion:   { type: string, minLength: 10, maxLength: 300 }
        ticketSoporteId: { type: string, maxLength: 30 }
        antesDe:         { type: string, format: date-time }
        antesDeId:       { type: string, format: uuid }
        limite:          { type: integer, minimum: 1, maximum: 50, default: 20 }
    ParticipanteResumen:
      type: object
      additionalProperties: false
      required: [usuarioId, codigoPublico, nombreAbreviado, estado, nivelKyc, fechaRegistro, tieneRestriccion, tieneBloqueo, tieneMedidaEnCurso]
      properties:
        usuarioId:          { type: string, format: uuid }
        codigoPublico:      { type: string, maxLength: 12 }
        nombreAbreviado:    { type: string, maxLength: 90 }
        estado:             { type: string, maxLength: 25 }
        nivelKyc:           { type: string, maxLength: 15 }
        fechaRegistro:      { type: string, format: date-time }
        tieneRestriccion:   { type: boolean }
        tieneBloqueo:       { type: boolean }
        tieneMedidaEnCurso: { type: boolean }
    PaginaDeParticipantes:
      type: object
      additionalProperties: false
      required: [filas]
      properties:
        filas: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ParticipanteResumen' } }
    EntradaJustificacionDeLectura:
      type: object
      additionalProperties: false
      required: [justificacion]
      properties:
        justificacion:   { type: string, minLength: 10, maxLength: 300 }
        ticketSoporteId: { type: string, maxLength: 30 }
    FichaDeParticipante:
      type: object
      additionalProperties: false
      description: >-
        gruposActivos y bloqueoDeAutoridadVigente viven en grupos y nucleo-financiero; identidad no lee esas bases
        (regla 98.1). Quedan vacios hasta que se lean por la API de su dueno.
      required: [usuarioId, codigoPublico, nombreCompleto, estado, nivelKyc, fechaRegistro, telefonoEnmascarado, medidas]
      properties:
        usuarioId:           { type: string, format: uuid }
        codigoPublico:       { type: string, maxLength: 12 }
        nombreCompleto:      { type: string, maxLength: 161 }
        estado:              { type: string, maxLength: 25 }
        nivelKyc:            { type: string, maxLength: 15 }
        fechaRegistro:       { type: string, format: date-time }
        ultimoAcceso:        { type: string, format: date-time }
        telefonoEnmascarado: { type: string, maxLength: 20 }
        correoEnmascarado:   { type: string, maxLength: 150 }
        gruposActivos:       { type: integer, minimum: 0 }
        medidas:             { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ExpedienteDeMedida' } }
        bloqueoDeAutoridadVigente: { type: boolean }
    EntradaRevelacion:
      type: object
      additionalProperties: false
      required: [campo, justificacion, evidenciaMfa]
      properties:
        campo:         { type: string, enum: [TELEFONO, CORREO] }
        justificacion: { type: string, minLength: 10, maxLength: 300 }
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096, description: 'Evidencia de step-up de quien actua, un solo uso (R-SEG-12)' }
    DatoRevelado:
      type: object
      additionalProperties: false
      required: [campo, valor]
      properties:
        campo: { type: string, enum: [TELEFONO, CORREO] }
        valor: { type: string, maxLength: 150 }
    EvidenciaDeMedida:
      type: object
      additionalProperties: false
      required: [descripcion]
      properties:
        descripcion:  { type: string, minLength: 1, maxLength: 300 }
        referenciaId: { type: string, format: uuid }
    EntradaMedidaDeCuenta:
      type: object
      additionalProperties: false
      required: [causal, medida, cautelar, motivo, evidencias]
      properties:
        causal:       { type: string, enum: [CUENTA_COMPROMETIDA, FRAUDE_CON_EVIDENCIA, ABUSO_CONTRA_PARTICIPANTES, CUENTA_DUPLICADA_O_DE_TERCERO] }
        medida:       { type: string, enum: [BLOQUEO_CAUTELAR, SUSPENSION_TEMPORAL] }
        cautelar:     { type: boolean }
        motivo:       { type: string, minLength: 30, maxLength: 500 }
        evidencias:   { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/EvidenciaDeMedida' } }
        vigenteHasta: { type: string, format: date-time }
    EntradaNotificacionDeMedida:
      type: object
      additionalProperties: false
      required: [entregadaEn]
      properties:
        entregadaEn: { type: string, format: date-time }
        mensajeId:   { type: string, format: uuid }
    EntradaDescargoDeMedida:
      type: object
      additionalProperties: false
      required: [argumento]
      properties:
        argumento:  { type: string, minLength: 20, maxLength: 4000 }
        evidencias: { type: array, maxItems: 10, items: { $ref: '#/components/schemas/EvidenciaDeMedida' } }
    EntradaDecisionDeMedida:
      type: object
      additionalProperties: false
      required: [resultado, fundamento, evidenciaMfa]
      properties:
        resultado:  { type: string, enum: [CONFIRMADA, DESESTIMADA] }
        fundamento: { type: string, minLength: 50, maxLength: 4000 }
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096, description: 'Evidencia de step-up de quien actua, un solo uso (R-SEG-12)' }
    EntradaResolucionDeApelacion:
      type: object
      additionalProperties: false
      required: [resultado, resolucion, evidenciaMfa]
      properties:
        resultado:  { type: string, enum: [ACEPTADA, RECHAZADA] }
        resolucion: { type: string, minLength: 50, maxLength: 4000 }
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096, description: 'Evidencia de step-up de quien actua, un solo uso (R-SEG-12)' }
    HitoDeMedida:
      type: object
      additionalProperties: false
      required: [estado, ocurridoEn]
      properties:
        estadoAnterior: { type: string, maxLength: 25 }
        estado:         { type: string, maxLength: 25 }
        motivo:         { type: string, maxLength: 500 }
        ocurridoEn:     { type: string, format: date-time }
    ExpedienteDeMedida:
      type: object
      additionalProperties: false
      required: [expedienteId, usuarioId, causal, medida, cautelar, estado, estadoCuenta, propuestaEn, prescribeEn, lineaDeTiempo]
      properties:
        expedienteId:         { type: string, format: uuid }
        usuarioId:            { type: string, format: uuid }
        causal:               { type: string, maxLength: 40 }
        medida:               { type: string, maxLength: 25 }
        cautelar:             { type: boolean }
        motivo:               { type: string, maxLength: 500 }
        estado:               { type: string, enum: [PROPUESTA, CAUTELAR, NOTIFICACION_PENDIENTE, EN_DESCARGO, DECIDIDA, EN_APELACION, FIRME, DESESTIMADA, REVOCADA, CUMPLIDA, PRESCRITO] }
        estadoCuenta:         { type: string, maxLength: 25 }
        propuestaEn:          { type: string, format: date-time }
        notificadaEn:         { type: string, format: date-time }
        fechaLimiteDescargo:  { type: string, format: date-time }
        resultadoDecision:    { type: string, enum: [CONFIRMADA, DESESTIMADA] }
        fundamentoDecision:   { type: string, maxLength: 4000 }
        fechaLimiteApelacion: { type: string, format: date-time }
        vigenteHasta:         { type: string, format: date-time }
        prescribeEn:          { type: string, format: date-time }
        apelacionEstado:      { type: string, enum: [PRESENTADA, ACEPTADA, RECHAZADA, ACEPTADA_POR_VENCIMIENTO] }
        fechaLimiteResolucionApelacion: { type: string, format: date-time, description: 'Plazo de la segunda instancia, fijado cuando se recibe la apelación (CU-134)' }
        lineaDeTiempo:        { type: array, maxItems: 100, items: { $ref: '#/components/schemas/HitoDeMedida' } }
    MedidaVigente:
      type: object
      additionalProperties: false
      required: [usuarioId, retenerEntrega]
      properties:
        usuarioId:      { type: string, format: uuid }
        retenerEntrega: { type: boolean }
        expedienteId:   { type: string, format: uuid }

  responses:
    ReglaDeNegocio:
      description: Regla de negocio de la aplicacion (422, no 400)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: Sin sesion valida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
