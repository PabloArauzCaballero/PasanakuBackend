        permisos: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { type: string, maxLength: 60 } }
        motivo: { type: string, minLength: 1, maxLength: 160 }
        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096 }

    EntradaDeRetiroDeRol:
