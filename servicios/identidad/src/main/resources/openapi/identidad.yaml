        evidenciaMfa: { type: string, minLength: 20, maxLength: 4096 }

    SalidaDeRol:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { type: string, enum: [APLICADO, PENDIENTE_DE_APROBACION, RECHAZADA] }
